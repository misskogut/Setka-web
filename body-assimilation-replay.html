margin-right:4px}.a{background:#68e1ff}.p{background:#ffd36b}.s{background:#ffffff}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · UPDATE ASSIMILATION REPLAY</b><small>тот же frozen snapshot · реальные metabolism events</small></div><button class="btn active" id="play">PAUSE</button><button class="btn" id="graph">GRAPH</button><button class="btn" id="reset">RESET</button></div><div id="hud"><div id="row"><div id="name">загрузка…</div><div id="time">0.000 ms</div></div><div class="meta" id="meta">ожидание данных</div><div class="track"><div class="fill" id="fill"></div></div><input id="scrub" type="range" min="0" max="1000" value="0"><div class="legend"><span><i class="dot a"></i>89 сущностей организма</span><span><i class="dot p"></i>22 provenance/source</span><span><i class="dot s"></i>4 structural anchors</span></div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA загружает замороженное тело и фактическое усвоение 115 обновлений…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',RP='UPDATE-ASSIM-REPLAY-F2CF9CA801B043FC';const app=document.getElementById('app'),loader=document.getElementById('loader'),nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),metaEl=document.getElementById('meta'),fill=document.getElementById('fill'),scrub=document.getElementById('scrub');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.autoRotate=true;controls.autoRotateSpeed=.20;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.1));let nodes=new Map(),points,edges,markers=[],replay,duration=1,current=0,playing=true,last=performance.now(),visualDuration=15000,lastEvent=-1;async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(`${fn} ${r.status}`);return r.json()}function roleColor(role){if(role==='ORGANISM_ENTITY')return 0x68e1ff;if(role==='PROVENANCE_SOURCE_NOT_ORGAN')return 0xffd36b;if(role==='STRUCTURAL_ANCHOR')return 0xffffff;return 0xf0a6ff}async function load(){const [d,p]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_body_update_assimilation_replay_v1',{p_replay_ref:RP})]);replay=p;duration=+p.durationMs||1;const a=d.nodes||d.payload?.nodes||[],e=d.edges||d.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i],o={id:v[0],type:v[2],gen:+v[3],deg:+v[5],name:v[6],x:+v[9],y:+v[10],z:+v[11]};nodes.set(o.id,o);pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;const c=new THREE.Color();c.setHSL((.76+o.gen*.035)%1,.48,.42);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.52,depthWrite:false}));scene.add(points);const ep=[];for(const z of e){const A=nodes.get(z[0]),B=nodes.get(z[1]);if(A&&B)ep.push(A.x,A.y,A.z,B.x,B.y,B.z)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));edges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8e6bb4,transparent:true,opacity:.032,depthWrite:false}));edges.visible=false;scene.add(edges);const geo=new THREE.SphereGeometry(.10,12,8);for(const ev of p.events){const o=nodes.get(ev[2]);if(!o)continue;const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:roleColor(ev[5]),transparent:true,opacity:.05,depthWrite:false,blending:THREE.AdditiveBlending}));m.position.set(o.x,o.y,o.z);m.userData={eventNo:+ev[0],ms:+ev[1],id:ev[2],type:ev[3],name:ev[4],role:ev[5],audit:ev[6]};scene.add(m);markers.push(m)}fit();loader.style.display='none';update(0)}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}function update(ms){current=Math.max(0,Math.min(duration,ms));scrub.value=Math.round(current/duration*1000);fill.style.width=`${current/duration*100}%`;let latest=-1,assimilated=0,active=0;for(let i=0;i<markers.length;i++){const m=markers[i],dt=current-m.userData.ms;if(dt>=0){assimilated++;latest=i}const hot=dt>=0&&dt<55;const warm=dt>=55&&dt<180;if(hot){m.material.opacity=.98;m.scale.setScalar(2.8);active++}else if(warm){m.material.opacity=.42;m.scale.setScalar(1.65)}else if(dt>=0){m.material.opacity=.17;m.scale.setScalar(1.05)}else{m.material.opacity=.025;m.scale.setScalar(.8)}}if(latest>=0){const e=markers[latest].userData;nameEl.textContent=`#${e.eventNo} · ${e.name}`;metaEl.textContent=`ASSIMILATED · ${assimilated}/115 · active pulse ${active} · ${e.role} · actual event time`;lastEvent=latest}else{nameEl.textContent='обновление вошло в контур усвоения';metaEl.textContent='0/115 · replay начинается с первого зафиксированного DB-события; момент операторской отправки в этом историческом проходе отдельно не timestamped'}timeEl.textContent=`${current.toFixed(3)} ms`;}function animate(t){requestAnimationFrame(animate);const dt=t-last;last=t;if(playing){current+=dt*(duration/visualDuration);if(current>duration){current=0;lastEvent=-1}update(current)}controls.update();renderer.render(scene,camera)}document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'PAUSE':'PLAY';e.currentTarget.classList.toggle('active',playing)};document.getElementById('graph').onclick=e=>{edges.visible=!edges.visible;e.currentTarget.classList.toggle('active',edges.visible)};document.getElementById('reset').onclick=()=>{current=0;update(0);fit()};scrub.addEventListener('input',()=>{playing=false;document.getElementById('play').textContent='PLAY';document.getElementById('play').classList.remove('active');update(+scrub.value/1000*duration)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load().then(()=>animate(performance.now())).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
