rap;overflow-wrap:anywhere;font-size:8px;line-height:1.4;color:#c8d6e7;margin:8px 0 0}.close{position:absolute;right:9px;top:8px;border:0;background:transparent;color:#aac0d6;font-size:20px}.canvas{position:absolute;inset:0;touch-action:none}.edge{fill:none;stroke:#27415d;stroke-width:1.2;opacity:.58}.edge.PROCESS{stroke:var(--cyan);stroke-width:3;opacity:.95;filter:url(#glow)}.edge.ROUTING{stroke:#4cb8ff}.edge.BINDING{stroke:var(--violet);stroke-dasharray:5 4}.edge.EXECUTION{stroke:var(--gold);stroke-width:1.8}.edge.DATA{stroke:var(--pink);stroke-width:2}.edge.NEED{stroke:#ff9b6b;stroke-width:2}.edge.EVIDENCE{stroke:#67819c;stroke-dasharray:2 5}.node circle{stroke-width:2;filter:url(#soft)}.node text{font-size:10px;fill:#eaf6ff;pointer-events:none}.node .subt{font-size:7px;fill:#8fa7c0}.kind-GOAL circle{fill:#0a3451;stroke:var(--cyan)}.kind-STEP circle{fill:#0d1d31;stroke:var(--cyan)}.kind-POSITION circle{fill:#251c43;stroke:var(--violet)}.kind-DUTY circle{fill:#30233b;stroke:#cf85ff}.kind-CAPABILITY circle{fill:#3a2c0d;stroke:var(--gold)}.kind-TRACE circle{fill:#0c2b3c;stroke:#4bdcff}.kind-SNAPSHOT circle{fill:#321936;stroke:var(--pink)}.kind-NEED circle{fill:#3b2116;stroke:#ff9b6b}.kind-EVIDENCE circle{fill:#15202c;stroke:#6f849b;stroke-dasharray:3 3}.kind-OUTCOME circle{fill:#0b3b26;stroke:var(--green)}.pulse{fill:var(--green);filter:url(#glow)}.gridline{stroke:#0d2138;stroke-width:1;opacity:.55}@media(min-width:900px){.hud{left:20px;right:20px;top:18px}.title b{font-size:14px}.info{left:auto;right:18px;bottom:18px;width:390px;max-height:46%}.legend{left:18px;bottom:18px;max-width:55%}}</style></head><body><div id="app"><div class="hud"><div class="title"><b>SETKA · AUTONOMOUS GOAL CLOSURE GRAPH</b><span id="run">загрузка системного graph packet…</span></div><div class="status" id="status">…</div></div><svg id="svg" class="canvas" viewBox="0 0 1200 1800"><defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#67e8ff"/></marker></defs><g id="world"></g></svg><div class="legend" id="legend"><button class="chip active" data-mode="ALL">ВСЁ</button><button class="chip" data-mode="PROCESS">ЦЕПЬ</button><button class="chip" data-mode="ROUTING">РОУТИНГ</button><button class="chip" data-mode="EXECUTION">CAPABILITY</button><button class="chip" data-mode="DATA">ДАННЫЕ</button><button class="chip" data-mode="EVIDENCE">EVIDENCE</button></div><div class="info" id="info"><button class="close" id="close">×</button><div class="k" id="ik"></div><h3 id="ih"></h3><div class="sub" id="is"></div><pre id="ip"></pre></div></div><script>const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';const q=new URLSearchParams(location.search),G=q.get('graph')||'GOAL-GRAPH-ABC801375AED4AE4';const svg=document.getElementById('svg'),world=document.getElementById('world'),info=document.getElementById('info');let data,nodeMap=new Map(),edgeEls=[],mode='ALL',scale=1,tx=0,ty=0,start=null;const ns='http://www.w3.org/2000/svg';function E(n,a={}){const e=document.createElementNS(ns,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}async function load(){const r=await fetch(S+'/rest/v1/rpc/setka_autonomous_goal_closure_graph_v1',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_graph_ref:G,p_run_ref:null})});if(!r.ok)throw Error(r.status);data=await r.json();document.getElementById('run').textContent=`${data.runRef} · ${data.graphRef} · ${data.nodes.length} nodes / ${data.edges.length} edges`;document.getElementById('status').textContent=data.state;layout();render()}function pos(n){const step=n.id.startsWith('STEP:')?+n.id.split(':')[1]:0;if(n.kind==='GOAL')return[600,130];if(n.kind==='OUTCOME')return[600,1650];if(n.kind==='STEP'){const ys=[0,360,640,930,1220,1480],xs=[0,520,680,500,700,540];return[xs[step],ys[step]]}if(n.kind==='POSITION')return n.id.includes('NEURAL')?[900,420]:[900,1120];if(n.kind==='DUTY')return n.id.includes('CAUSAL_RUNTIME')?[1030,550]:[1030,1260];if(n.kind==='CAPABILITY'){if(n.id.includes('latency_profile'))return[880,700];if(n.id.includes('mapping_need'))return[900,1390];return[230,980]}if(n.kind==='TRACE')return n.id.includes('116E0F')?[250,520]:[250,1280];if(n.kind==='SNAPSHOT')return n.id.includes('B292')?[220,1100]:[190,730];if(n.kind==='NEED')return[330,820];if(n.kind==='EVIDENCE')return[950,1520];return[600,900]}function layout(){for(const n of data.nodes){const[x,y]=pos(n);n.x=x;n.y=y;nodeMap.set(n.id,n)}}function curve(a,b){const mx=(a.x+b.x)/2;return`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`}function render(){world.innerHTML='';for(let y=100;y<1800;y+=180)world.appendChild(E('line',{x1:40,y1:y,x2:1160,y2:y,class:'gridline'}));edgeEls=[];for(const ed of data.edges){const a=nodeMap.get(ed.source),b=nodeMap.get(ed.target);if(!a||!b)continue;const p=E('path',{d:curve(a,b),class:`edge ${ed.edgeClass}`,'data-class':ed.edgeClass,'data-rel':ed.relation});if(ed.edgeClass==='PROCESS')p.setAttribute('marker-end','url(#arrow)');world.appendChild(p);edgeEls.push(p)}for(const n of data.nodes){const g=E('g',{class:`node kind-${n.kind}`,transform:`translate(${n.x} ${n.y})`});const r=n.kind==='GOAL'||n.kind==='OUTCOME'?34:n.kind==='STEP'?28:18;g.appendChild(E('circle',{r}));const t=E('text',{x:r+9,y:-2});t.textContent=short(n.label,34);g.appendChild(t);const s=E('text',{x:r+9,y:12,class:'subt'});s.textContent=short(n.sublabel||n.kind,42);g.appendChild(s);g.addEventListener('click',e=>{e.stopPropagation();show(n)});world.appendChild(g)}animatePulse();applyTransform()}function short(s,m){s=String(s||'');return s.length>m?s.slice(0,m-1)+'…':s}function show(n){document.getElementById('ik').textContent=n.kind;document.getElementById('ih').textContent=n.label;document.getElementById('is').textContent=n.sublabel||n.id;document.getElementById('ip').textContent=JSON.stringify(n.metadata,null,2);info.classList.add('show')}document.getElementById('close').onclick=()=>info.classList.remove('show');function filter(){for(const p of edgeEls){const c=p.dataset.class;p.style.opacity=(mode==='ALL'||c===mode||(mode==='EXECUTION'&&['EXECUTION','BINDING'].includes(c)))?'':'0.08'}}document.getElementById('legend').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===e.target));filter()};function animatePulse(){const process=[...edgeEls].filter(x=>x.dataset.class==='PROCESS');if(!process.length)return;let i=0;const dot=E('circle',{r:7,class:'pulse'});world.appendChild(dot);function go(){const p=process[i%process.length],L=p.getTotalLength(),st=performance.now();function f(now){const u=Math.min(1,(now-st)/700),pt=p.getPointAtLength(L*u);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);if(u<1)requestAnimationFrame(f);else setTimeout(()=>{i++;go()},100)}requestAnimationFrame(f)}go()}function applyTransform(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(2.5,scale*(e.deltaY<0?1.08:.92)));applyTransform()},{passive:false});svg.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!start)return;tx=start.tx+(e.clientX-start.x)*1.4;ty=start.ty+(e.clientY-start.y)*1.4;applyTransform()});svg.addEventListener('pointerup',()=>start=null);svg.addEventListener('dblclick',()=>{scale=1;tx=0;ty=0;applyTransform()});load().catch(e=>{document.getElementById('run').textContent='Ошибка загрузки graph packet: '+e.message;document.getElementById('status').textContent='ERROR'});</script></body></html>
