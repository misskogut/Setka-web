<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020105">
<title>SETKA — исходный календарь ALMA</title>
<link rel="stylesheet" href="./dist/alma.css?v=20261120-no-header-2">
<link rel="stylesheet" href="./dist/cycle-history.css?v=c9d418-inset">
<style>
/* Only host layout. Everything inside CycleHero/Sheet is original ALMA CSS. */
html,body{margin:0;min-height:100%;background:#020105}
/* Remove outer device/card framing; retain the untouched ALMA cycle-hero border. */
.app-stage{min-height:100dvh;background:#020105}
.ambient-background{opacity:.35}
.phone-scene{
  min-height:100dvh!important;
  margin:0 auto!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  background:#020105!important;
}
.cycle-hero{margin-top:12px!important}
/* This file now runs INSIDE the clipped card-sized iframe.
   Its viewport is the full card, not the phone screen. The hero takes
   the first viewport; the same phone-scene scrolls to history beneath it. */
html,body{
  width:100%;
  height:100%;
  height:100dvh;
  min-width:0!important;
  min-height:0!important;
  overflow:hidden!important;
  overscroll-behavior:none;
}
#alma-cycle-root,
#alma-cycle-root .app-stage,
#alma-cycle-root .phone-scene{
  height:100dvh!important;
  min-height:0!important;
  max-height:100dvh!important;
  overflow:hidden!important;
}
#alma-cycle-root .cycle-hero{
  overflow:hidden!important;
}
/* ALMA's original entry sheet is inset INSIDE the single SETKA card,
   not edge-to-edge with its outline. Preserve touch, internal scrolling,
   button behavior, and the original bottom-sheet entrance animation. */
.sheet-layer{
  box-sizing:border-box!important;
  position:fixed!important;
  /* Ten-pixel breathing room from the card edge on ALL four sides. */
  top:10px!important;
  bottom:10px!important;
  left:50%!important;
  right:auto!important;
  width:calc(100% - 20px)!important;
  max-width:408px!important;
  height:auto!important;
  max-height:calc(100dvh - 20px)!important;
  transform:translateX(-50%)!important;
  border-radius:22px!important;
  overflow:hidden!important;
  align-items:flex-end!important;
}
.sheet-layer > .bottom-sheet{
  box-sizing:border-box!important;
  flex:0 1 auto!important;
  width:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  min-width:0!important;
  min-height:0!important;
  overflow-x:hidden!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  border-radius:23px!important;
}

/* Hide any incidental iOS scrollbar track on the self-contained calendar.
   Form sheets, when opened, retain their own internal scrolling. */
html::-webkit-scrollbar,body::-webkit-scrollbar,
#alma-cycle-root .app-stage::-webkit-scrollbar,
#alma-cycle-root .phone-scene::-webkit-scrollbar{display:none!important;width:0!important}

/* Defensive hide for an outdated, browser-cached bundle: remove only host chrome, not ALMA. */
#alma-cycle-root .app-header,#alma-cycle-root .setka-demo-note{display:none!important}
#alma-cycle-root .phone-scene{border:none!important;border-radius:0!important;box-shadow:none!important}
/*
 * SETKA two-sided card geometry — experimental host only.
 * The ORIGINAL ALMA component and its dynamic --cycle-color border are intact.
 * Match the native SETKA front outline: top 12px, side 14px, bottom 84px
 * (64px dock + 8px dock offset + 12px visual gap).
 */
:root{
  /* The enclosing iframe is already inset to match the SETKA card. */
  --setka-card-top:0px;
  --setka-card-bottom:0px;
}
#alma-cycle-root .phone-scene{
  box-sizing:border-box!important;
  width:100%!important;
  max-width:none!important;
  height:100dvh!important;
  max-height:100dvh!important;
  min-width:0!important;
  margin:0!important;
  padding:0 0 20px!important;
  border-radius:24px!important;
  overflow-x:hidden!important;
  overflow-y:auto!important;
  overscroll-behavior:contain!important;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scrollbar-width:none;
}
#alma-cycle-root .cycle-hero{
  box-sizing:border-box!important;
  width:100%!important;
  max-width:none!important;
  margin:0!important;
  height:100dvh!important;
  min-height:0!important;
  border-radius:24px 24px 0 0!important;
  /* Lotus layout, color and animation remain native to ALMA. */
}



</style>
<script defer src="./dist/cycle.js?v=20261120-no-header-2"></script>
<script defer src="./dist/cycle-history.js?v=c9d418-inset"></script>
</head>
<body><div id="alma-cycle-root" aria-label="Оригинальный календарь-лотос ALMA"></div></body>
</html>
