<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030207"><title>SETKA • Летящие звёзды — прототип фона</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05030a;color:#efe8f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
.lab{width:100%;max-width:560px;margin:auto;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.lab-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 5px 11px}
.eyebrow{font-size:10px;letter-spacing:.18em;color:#bb9ed4}
.header-note{color:#786681;font-size:10px}
.scene{position:relative;margin:auto;width:min(100%,410px);height:min(73dvh,710px);min-height:340px;border-radius:22px;overflow:hidden;background:#030207;border:1px solid #51375e}
#stars{display:block;width:100%;height:100%;touch-action:pan-y}
.vignette{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse 72% 65% at 50% 50%,transparent 29%,rgba(0,0,0,.43) 100%);box-shadow:inset 0 0 55px #0009}
.card{pointer-events:none;position:absolute;inset:8% 12%;border-radius:24px;border:1.5px solid rgba(217,142,255,.95);background:linear-gradient(108deg,#170a26 0%,#06030c 60%,#1d0b2f 100%);box-shadow:0 0 24px #b65bff70,inset 0 0 20px #b65bff40;transform:perspective(930px) rotateY(-76deg);opacity:0;transition:opacity .3s,transform .3s;transform-origin:center;backface-visibility:hidden}
.card:before{content:"";position:absolute;inset:4px;border:1px solid #bb6cf844;border-radius:19px}
.card.on{opacity:1}
.card-line{position:absolute;left:13%;right:13%;top:16%;height:1px;background:linear-gradient(90deg,transparent,#d19afa88,transparent)}
.mist{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 28% 55% at 51% 54%,#8b45ce17,transparent 90%)}
.note{position:absolute;left:16px;bottom:14px;color:#a68db4;font-size:9px;letter-spacing:.13em;pointer-events:none}
.controls{max-width:410px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:9px}
.control{flex:1 1 120px;border:1px solid #594268;background:#130c1b;border-radius:13px;min-height:44px;color:#ede0f5;padding:8px 10px;text-align:left}
.control small{font-size:10px;display:block;color:#aa94b6;margin-bottom:3px}
.control input{accent-color:#c482ed;width:100%;height:18px;margin:0}
.toggle{flex:1 1 92px;border:1px solid #594268;background:#130c1b;border-radius:13px;color:#ead9f5;padding:9px 10px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:#c28be4;background:#302039}
.foot{max-width:410px;margin:11px auto 0;color:#756680;font-size:11px;line-height:1.55}
@media(max-height:690px){.scene{height:min(64dvh,560px)}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body>
<main class="lab" id="starfield-lab">
<div class="lab-header"><div class="eyebrow">SETKA / STARFIELD</div><div class="header-note">Отдельный прототип</div></div>
<div class="scene" id="scene"><canvas id="stars" aria-label="Анимированный фон из летящих крошечных звёзд"></canvas>
<div class="mist"></div><div class="card" id="card"><span class="card-line"></span></div><div class="vignette"></div>
<div class="note">ЗВЁЗДНАЯ ПЫЛЬ · ЖИВОЙ ФОН</div></div>
<div class="controls">
<label class="control"><small>Скорость <span id="speedLabel">1×</span></small><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1" aria-label="Скорость полёта звёзд"></label>
<label class="control"><small>Количество <span id="amountLabel">180</span></small><input id="amount" type="range" min="60" max="320" step="10" value="180" aria-label="Число звёзд"></label>
<button class="toggle" id="cardToggle" aria-pressed="false">Показать карту</button>
</div>
<p class="foot">Живые частицы Canvas: звёзды летят непрерывно на разных глубинах. Фон не зависит от лотоса и не меняет работающую SETKA.</p>
</main>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const root=$("starfield-lab"),canvas=$("stars"),scene=$("scene"),ctx=canvas.getContext("2d",{alpha:false});
if(!ctx)return;
let w=0,h=0,dpr=1,stars=[],speed=1,amount=180,last=0,loopId=0;
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const random=(a,b)=>a+Math.random()*(b-a);
function star(initial){
 const z=Math.pow(Math.random(),.85);
 return{x:initial?Math.random()*w:random(-Math.max(12,w*.12),-2),y:initial?Math.random()*h:random(-h*.18,h*.94),z,tw:random(0,6.28),hue:Math.random(),twinkle:random(.2,1.4)};
}
function fit(){
 const bounds=scene.getBoundingClientRect(),newW=Math.max(200,Math.round(bounds.width)),newH=Math.max(260,Math.round(bounds.height));
 if(w===newW&&h===newH)return;
 w=newW;h=newH;dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:amount},()=>star(true));
}
function syncAmount(){while(stars.length<amount)stars.push(star(true));if(stars.length>amount)stars.length=amount}
function paint(t,delta){
 ctx.fillStyle="#030207";ctx.fillRect(0,0,w,h);
 const halo=ctx.createRadialGradient(w*.48,h*.52,1,w*.48,h*.52,w*.8);
 halo.addColorStop(0,"#1d0c2d");halo.addColorStop(.38,"#0c0616");halo.addColorStop(1,"#030207");
 ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
 const mini=ctx.createRadialGradient(w*.55,h*.5,0,w*.55,h*.5,w*.43);
 mini.addColorStop(0,"rgba(138,63,195,.07)");mini.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=mini;ctx.fillRect(0,0,w,h);
 const dt=delta*speed;
 for(let i=0;i<stars.length;i++){
  const p=stars[i];
  const vx=5+p.z*p.z*61,vy=2+p.z*p.z*30;
  p.x+=vx*dt;p.y+=vy*dt;
  if(p.x>w+12||p.y>h+12){stars[i]=star(false);continue}
  const radius=.25+p.z*.9,alpha=(.23+p.z*.62)*(.87+.13*Math.sin(t*.001*p.twinkle+p.tw));
  const rgb=p.hue<.53?"202,151,255":p.hue<.82?"238,227,255":"125,187,255";
  const streak=Math.max(0,(p.z-.40)*20)*Math.min(speed,1.7);
  ctx.strokeStyle="rgba("+rgb+","+(alpha*.52)+")";
  ctx.lineWidth=Math.max(.45,radius*.7);
  if(streak>.6){ctx.beginPath();ctx.moveTo(p.x-vx/(vx+vy)*streak,p.y-vy/(vx+vy)*streak);ctx.lineTo(p.x,p.y);ctx.stroke()}
  ctx.fillStyle="rgba("+rgb+","+alpha+")";
  ctx.beginPath();ctx.arc(p.x,p.y,radius,0,6.283185307179586);ctx.fill();
  if(p.z>.91&&i%8===0){ctx.globalAlpha=.17;ctx.beginPath();ctx.arc(p.x,p.y,radius*3,0,6.283185307179586);ctx.fill();ctx.globalAlpha=1}
 }
}
function tick(now){
 loopId=requestAnimationFrame(tick);
 if(!root.isConnected||document.hidden)return;
 fit();
 const dt=last?Math.min((now-last)/1000,.035):0;last=now;
 paint(now,reduce?0:dt);
}
const speedControl=$("speed"),amountControl=$("amount"),toggle=$("cardToggle"),card=$("card");
speedControl.addEventListener("input",()=>{speed=Number(speedControl.value);$("speedLabel").textContent=speed.toFixed(1)+"×"});
amountControl.addEventListener("input",()=>{amount=Number(amountControl.value);$("amountLabel").textContent=amount;syncAmount()});
toggle.addEventListener("click",()=>{const on=toggle.getAttribute("aria-pressed")!=="true";toggle.setAttribute("aria-pressed",String(on));toggle.textContent=on?"Скрыть карту":"Показать карту";card.classList.toggle("on",on)});
window.addEventListener("resize",fit);
document.addEventListener("visibilitychange",()=>{last=0});
fit();loopId=requestAnimationFrame(tick);
})();
</script></body></html>
