 drawCube(hinge,[0,.004,0],[.17,.255,1.98],GOLD,.95);drawCube(hinge,[0,.004,0],[1.98,.255,.17],GOLD,.95);
 gl.bindVertexArray(null)
}
function drawHanger(parent){gl.useProgram(programs.box);gl.bindVertexArray(cubeVao);drawCube(parent,[0,1.35,0],[.17,.125,.2],GOLD,.95);gl.bindVertexArray(null);
 // Metal loop is generated from periodic 3D geometry, separate from the living pattern.
 gl.useProgram(programs.box);gl.bindVertexArray(null);gl.bindBuffer(gl.ARRAY_BUFFER,ringBuf);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);
 gl.disableVertexAttribArray(1);gl.vertexAttrib3f(1,0,0,1);
 const loop=combo(parent,move(0,1.53,0),rotateX(PI/2));gl.uniformMatrix4fv(bU.uModel,false,loop);gl.uniformMatrix4fv(bU.uMVP,false,matMul(VP,loop));gl.uniform3fv(bU.uColor,GOLD);gl.uniform1f(bU.uMetal,1);
 gl.drawArrays(gl.TRIANGLES,0,ringVertices.length/3);
}
function artModel(t){return combo(move(0,-.03,0),rotateY(artAngleY),rotateX(artAngleX),rotateZ(artAngleZ),size(zoom,zoom,zoom))}
function drawForm(t,alpha){gl.useProgram(programs.form);gl.bindVertexArray(surfVao);
 const model=artModel(t),s=settings;gl.uniformMatrix4fv(fU.uVP,false,VP);gl.uniformMatrix4fv(fU.uModel,false,model);
 gl.uniform1f(fU.uTime,t);gl.uniform1f(fU.uSeed,s.seed);gl.uniform1f(fU.uTempo,s.tempo);gl.uniform1f(fU.uAmp,s.amp);gl.uniform1f(fU.uTwist,s.twist);
 gl.uniform1f(fU.uMode,chosen);gl.uniform1f(fU.uHybrid,(chosen+1)%6);gl.uniform1f(fU.uMix,s.mix);gl.uniform1f(fU.uLayers,s.layers);
 gl.uniform1f(fU.uHue,s.hue);gl.uniform1f(fU.uPress,press);gl.uniform1f(fU.uCharge,charge);gl.uniform1f(fU.uWave,waveTime);gl.uniform3fv(fU.uTouch,touch);
 gl.disable(gl.CULL_FACE);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
 for(let layer=0;layer<s.layers;layer++){gl.uniform1f(fU.uLayer,layer);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0)}
 gl.depthMask(true);gl.disable(gl.BLEND);gl.bindVertexArray(null);
 drawHanger(model);
}
function drawStars(t){gl.useProgram(programs.star);gl.bindVertexArray(starsVao);gl.uniformMatrix4fv(sU.uVP,false,VP);gl.uniform1f(sU.uTime,t);gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.drawArrays(gl.POINTS,0,130);gl.disable(gl.BLEND);gl.depthMask(true);gl.bindVertexArray(null)}
function startOpen(){if(phase!=='box')return;phase='opening';openAt=now;el('open').hidden=true;el('hint').textContent='Форма рождается из живой математики…';settingsFor()}
function finishOpen(){phase='art';app.classList.add('revealed');el('meta').classList.add('active');el('back').hidden=false;el('next').hidden=!!qr;el('variation').hidden=!!qr;el('mix').hidden=!!qr;el('hint').textContent='Петля — вращай · структура — касайся · удерживай — волна'}
function resetBox(){phase='box';app.classList.remove('revealed');el('meta').classList.remove('active');el('open').hidden=false;for(let id of ['back','next','variation','mix'])el(id).hidden=true;el('hint').textContent='Поверни 3D-коробочку и открой сюрприз';el('serial').textContent='';pointing.clear();targetPress=0;press=0}
function switchMode(variant){if(qr)return;if(!variant){chosen=(chosen+1)%families.length;variation=0;mixMode=false}else variation++;
 settingsFor();waveTime=0;charge=.24;press=0;targetPress=0;el('mix').textContent='◇ Гибрид';}
el('open').addEventListener('click',startOpen);el('back').addEventListener('click',resetBox);
el('next').addEventListener('click',()=>switchMode(false));el('variation').addEventListener('click',()=>switchMode(true));
el('mix').addEventListener('click',()=>{if(qr)return;mixMode=!mixMode;settingsFor();el('mix').textContent=mixMode?'◇ Снять микс':'◇ Гибрид'});
function pointerLoc(e){let rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top}}
canvas.addEventListener('pointerdown',e=>{let loc=pointerLoc(e),mode='rotate';
 if(phase==='art'){
  let loopPoint=project([0,1.53,0],matMul(VP,artModel(now)));
  if(Math.hypot(loc.x-loopPoint[0],loc.y-loopPoint[1])<56)mode='grip';
  else if(Math.hypot(loc.x-width*.5,loc.y-height*.53)<Math.min(width,height)*.38){mode='touch';targetPress=.6;charge=.22;waveTime=0;touch=[(loc.x-width*.5)/(width*.25),-(loc.y-height*.52)/(height*.23),.25]}
 }
 pointing.set(e.pointerId,{x:loc.x,y:loc.y,ox:loc.x,oy:loc.y,mode,time:performance.now(),moved:false});
 try{canvas.setPointerCapture(e.pointerId)}catch(_e){}e.preventDefault()
},{passive:false});
canvas.addEventListener('pointermove',e=>{let p=pointing.get(e.pointerId);if(!p)return;let loc=pointerLoc(e),dx=loc.x-p.x,dy=loc.y-p.y;p.x=loc.x;p.y=loc.y;if(Math.abs(p.ox-p.x)+Math.abs(p.oy-p.y)>7)p.moved=true;
 if(phase==='box'){boxAngleY+=dx*.009;boxAngleX=clamp(boxAngleX+dy*.007,-.6,.6)}
 else if(phase==='art'){
  if(p.mode==='touch'){
   touch=[clamp((loc.x-width*.5)/(width*.27),-1.5,1.5),clamp(-(loc.y-height*.52)/(height*.27),-1.5,1.5),.26];targetPress=.72;charge=Math.min(.85,charge+.04)
  }else{
   artAngleY+=dx*(p.mode==='grip'?.017:.009);artAngleX=clamp(artAngleX+dy*.007,-1.3,1.3);velocityY=dx*.0009;velocityX=dy*.0007;
   if(p.mode==='grip')artAngleZ=clamp(artAngleZ-dx*.003,-.5,.5)
  }
 }
 e.preventDefault()
},{passive:false});
canvas.addEventListener('pointerup',e=>{let p=pointing.get(e.pointerId);if(!p)return;
 if(phase==='box'&&!p.moved)startOpen();if(phase==='art'&&p.mode==='touch'){targetPress=0;charge=.6;waveTime=0}
 pointing.delete(e.pointerId);e.preventDefault()
},{passive:false});
canvas.addEventListener('pointercancel',e=>{pointing.delete(e.pointerId);targetPress=0},{passive:false});
function frame(timestamp){requestAnimationFrame(frame);let t=timestamp*.001,dt=clamp((timestamp-lastFrame)*.001,.001,.045);lastFrame=timestamp;now=t;
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.026,.029,.053,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
 drawStars(t);
 if(phase==='box')drawBox(t,0);
 if(phase==='opening'){
  let x=clamp((t-openAt)/1.55,0,1),f=x*x*(3-2*x);drawBox(t,f);
  if(x>.28){drawForm(t,f)}if(x>=1)finishOpen()
 }
 if(phase==='art'){
  artAngleY+=dt*.085+velocityY;artAngleX=clamp(artAngleX+velocityX,-1.3,1.3);velocityX*=.93;velocityY*=.93;artAngleZ*=.997;
  press+=(targetPress-press)*Math.min(1,dt*6.5);charge*=Math.pow(.96,dt*60);waveTime+=dt*1.45;
  drawForm(t,1)
 }
}
settingsFor();
el('loading').classList.add('hidden');requestAnimationFrame(frame);
})();
</script></body></html>
