  const [x,y,z]=eulers[i],q=new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));
  line(onRing(a=>v(1.06*Math.cos(a),.65*Math.sin(a),0).applyQuaternion(q),114),m[i%3],i===0?.024:.017)
 }
 // An ordered hex lattice at the core.
 for(let ring=1;ring<=3;ring++){
  let radius=ring*.115;
  line(onRing((a,u)=>{let index=Math.floor(u*6),fraction=(u*6-index);
   let aa=index*TAU/6,ab=(index+1)*TAU/6;
   return v(radius*((1-fraction)*Math.cos(aa)+fraction*Math.cos(ab)),radius*((1-fraction)*Math.sin(aa)+fraction*Math.sin(ab)),.01*ring)},72),
   m[ring%3],.015)
 }
 for(let j=0;j<6;j++){
  let a=j*TAU/6;
  line([v(0,0,.01),v(.17*Math.cos(a),.17*Math.sin(a),.01),v(.35*Math.cos(a),.35*Math.sin(a),.01)],m[2],.008)
 }

}
function makeBridgeBloom(){
 const m=colorPalette(0xe9fdff,0x82daff,0xc4adfb),rings=10,arms=spec.arms;
 function radius(z){let t=(z+1.15)/2.3;return .20+.87*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.75)}
 for(let i=0;i<rings;i++){
  let z=-1.15+i/(rings-1)*2.3,r=radius(z);
  line(onRing(a=>v(r*Math.cos(a),r*Math.sin(a),z),84),m[i%3],i%3===0?.023:.014)
 }
 for(let j=0;j<arms;j++){
  let theta=j*TAU/arms,pts=[];
  for(let k=0;k<=120;k++){let z=-1.15+k/120*2.3,r=radius(z),ang=theta+.10*Math.sin(z*2+spec.mutation);
   pts.push(v(r*Math.cos(ang),r*Math.sin(ang),z))}
  line(pts,m[j%3],j%4===0?.022:.012)
 }
 // A single radiating bloom at the near portal; no chaotic knots.
 for(let j=0;j<arms;j++){
  let a=j*TAU/arms,pts=[];
  for(let k=0;k<=60;k++){let t=k/60,r=.12+.75*t,angle=a+.17*Math.sin(t*Math.PI)*spec.twist;
   pts.push(v(r*Math.cos(angle),r*Math.sin(angle),.55+.32*Math.sin(t*Math.PI)))}
  line(pts,m[j%3===0?2:1],.012)
 }
}
function regenerate(){
 const sampleSeed=hash(key+"|"+variation),seeded=rng(sampleSeed);
 const chosen=selectedKind===null?Math.floor(seeded()*kinds.length):selectedKind;
 rnd=seeded;
 spec={...kinds[chosen],mutation:rnd()*TAU,layers:3+Math.floor(rnd()*2),arms:8+Math.floor(rnd()*5),twist:.85+rnd()*.5,hueShift:(rnd()-.5)*.07};
 flowPaths=[];flowAnim=[];flowCloud=null;
 for(let i=body.children.length-1;i>=0;i--){
  let mesh=body.children[i];if(mesh===picker)continue;body.remove(mesh);mesh.geometry?.dispose();if(mesh.type==="Points")mesh.material?.dispose()
 }
 for(let mat of materialMap)mat.dispose();materialMap=[];
 baseUniforms.family.value=chosen;
 if(spec.kind==="hexatunnel")makeHexaTunnel();
 else if(spec.kind==="medusawheel")makeMedusaWheel();
 else if(spec.kind==="neurodna")makeNeuroDNA();
 else if(spec.kind==="fractalhalo")makeFractalHalo();
 else if(spec.kind==="atomgrid")makeAtomGrid();
 else makeBridgeBloom();
 buildFlow();
 el("name").textContent=spec.name;
 el("type").textContent=spec.category;
 el("id").textContent="ВАРИАЦИЯ "+String(variation+1).padStart(2,"0")+" · № "+sampleSeed.toString(16).toUpperCase().padStart(8,"0");
 baseUniforms.press.value=0;baseUniforms.power.value=0;baseUniforms.wave.value=5;baseUniforms.drag.value.set(0,0,0);baseUniforms.touch.value.set(0,0,1);
 artifact.rotation.set(-.16,.35,.02);artifact.scale.setScalar(.0001);hanger.position.y=-.62
}
regenerate();
let dustR=rng(172399),dGeo=new THREE.BufferGeometry(),coords=new Float32Array(360*3),rgb=new Float32Array(360*3);
for(let i=0;i<360;i++){let a=dustR()*TAU,r=1.8+dustR()*6;coords[i*3]=r*Math.cos(a);coords[i*3+1]=r*Math.sin(a);coords[i*3+2]=(dustR()-.5)*13;let co=new THREE.Color(0xffd1a3);co.offsetHSL(dustR()*.06-.03,0,(dustR()-.5)*.3);rgb.set([co.r,co.g,co.b],i*3)}
dGeo.setAttribute("position",new THREE.BufferAttribute(coords,3));dGeo.setAttribute("color",new THREE.BufferAttribute(rgb,3));
let stars=new THREE.Points(dGeo,new THREE.PointsMaterial({size:.018,vertexColors:true,transparent:true,opacity:.65,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(stars);
let orbital=new THREE.Mesh(new THREE.TorusGeometry(2.15,.006,6,120),new THREE.MeshBasicMaterial({color:0xb94f36,transparent:true,opacity:.07}));orbital.rotation.x=1.24;scene.add(orbital);
const coronaGeo=new THREE.BufferGeometry(),coronaPos=new Float32Array(250*3),coronaRgb=new Float32Array(250*3),coronaRnd=rng(83828);
for(let i=0;i<250;i++){let a=coronaRnd()*TAU,b=coronaRnd()*TAU,r=.35+coronaRnd()*1.3;coronaPos.set([r*Math.cos(a),r*Math.sin(a)*Math.cos(b),r*Math.sin(a)*Math.sin(b)],i*3);let cc=new THREE.Color().setHSL(.03+coronaRnd()*.12,1,.66+coronaRnd()*.32);coronaRgb.set([cc.r,cc.g,cc.b],i*3)}
coronaGeo.setAttribute("position",new THREE.BufferAttribute(coronaPos,3));coronaGeo.setAttribute("color",new THREE.BufferAttribute(coronaRgb,3));
const corona=new THREE.Points(coronaGeo,new THREE.PointsMaterial({size:.02,vertexColors:true,transparent:true,opacity:.13,depthWrite:false,blending:THREE.AdditiveBlending}));artifact.add(corona);
let state="box",openStart=0,clock=new THREE.Clock(),lastTime=0,held=null,pressTarget=0,pressValue=0,pressVel=0,dragTarget=v(0,0,0),dragPos=v(0,0,0),dragVel=v(0,0,0),wave=6,spinX=0,spinY=0;
let heat=0,charge=0,spinZ=0,lastTap=0,charged=false;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function hit(e,target){let b=canvas.getBoundingClientRect();mouse.set(2*(e.clientX-b.left)/b.width-1,1-2*(e.clientY-b.top)/b.height);artifact.updateMatrixWorld(true);ray.setFromCamera(mouse,camera);return ray.intersectObject(target)[0]}
function shock(power=1){wave=0;baseUniforms.wave.value=0;baseUniforms.power.value=Math.max(baseUniforms.power.value,power)}
canvas.addEventListener("pointerdown",e=>{
 if(held)return;
 held={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,start:performance.now(),mode:"rotate",moved:false};
 try{canvas.setPointerCapture(e.pointerId)}catch(err){}
 if(state==="artifact"){
  if(hit(e,gripZone)){held.mode="grip";tip.textContent="За петлю — вращай и раскачивай."}
  else{let rayHit=hit(e,picker);if(rayHit){held.mode="body";pressTarget=.48;charged=false;baseUniforms.touch.value.copy(body.worldToLocal(rayHit.point.clone()));shock(1);tip.textContent="Мягкая волна · удержание · пульс по структуре"}}
 }
 e.preventDefault()
},{passive:false});
canvas.addEventListener("pointermove",e=>{
 if(!held||held.id!==e.pointerId)return;
 let x=e.clientX-held.x,y=e.clientY-held.y;held.x=e.clientX;held.y=e.clientY;
 if(Math.abs(held.x0-e.clientX)+Math.abs(held.y0-e.clientY)>9)held.moved=true;
 if(state==="box"){pack.rotation.y+=x*.008;pack.rotation.x=clamp(pack.rotation.x+y*.006,-.45,.45)}
 if(state==="artifact"){
  if(held.mode==="body"){dragTarget.x=clamp((e.clientX-held.x0)/135,-.8,.8);dragTarget.y=clamp((held.y0-e.clientY)/135,-.8,.8);pressTarget=.78;heat=Math.min(2.2,heat+.023);if(Math.abs(x)+Math.abs(y)>12)shock(1.3)}
  else{artifact.rotation.y+=x*(held.mode==="grip"?.014:.009);artifact.rotation.x=clamp(artifact.rotation.x+y*.007,-1.2,1.2);if(held.mode==="grip"){artifact.rotation.z=clamp(artifact.rotation.z-x*.004,-.5,.5);spinZ=-x*.0014}spinY=x*.0008;spinX=y*.0005}
 }e.preventDefault()
},{passive:false});
function release(e){
 if(!held||held.id!==e.pointerId)return;
 if(state==="box"&&!held.moved)openBox();
 if(state==="artifact"&&held.mode==="body"){
  pressTarget=0;dragTarget.set(0,0,0);shock(1.7);
  if(!held.moved&&performance.now()-held.start<340){
   if(performance.now()-lastTap<350){heat=3;charge=1.6;shock(3.2);tip.textContent="✳ ВОЛНА ПО ГЕОМЕТРИИ"}
   else{heat=Math.min(2,heat+.4)}
   lastTap=performance.now()
  }
 }
 held=null;charged=false
}
canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);canvas.addEventListener("lostpointercapture",release);
function openBox(){if(state!=="box")return;state="opening";openStart=clock.elapsedTime;btn.hidden=true;tip.textContent="Раскрываем пространство…"}
function closeBox(){
 state="box";btn.hidden=false;back.hidden=true;next.hidden=true;mutate.hidden=true;info.classList.remove("show");el("app").classList.remove("artifact-open");tip.textContent="Вращай 3D-коробку и открой сюрприз.";
 pack.visible=true;lidJoint.rotation.x=0;pack.position.y=0;pack.scale.setScalar(1);

}
btn.addEventListener("click",openBox);back.addEventListener("click",closeBox);
function refreshArtifact(){
 regenerate();state="artifact";artifact.visible=true;artifact.scale.setScalar(1);info.classList.add("show");el("app").classList.add("artifact-open");

}
next.addEventListener("click",()=>{if(fixed)return;selectedKind=selectedKind===null?(kinds.indexOf(kinds.find(k=>k.kind===spec.kind))+1)%kinds.length:(selectedKind+1)%kinds.length;variation=0;refreshArtifact()});
mutate.addEventListener("click",()=>{if(fixed)return;selectedKind=kinds.findIndex(k=>k.kind===spec.kind);variation++;refreshArtifact()});
function tick(){
 requestAnimationFrame(tick);
 let dt=Math.min(clock.getDelta(),.035),t=clock.elapsedTime,s=clamp(dt*60,.1,1.8);
 baseUniforms.time.value=t;if(state==="artifact"||state==="opening")animateFlow(dt);
 if(state==="box"){pack.rotation.y+=dt*.15;pack.position.y=Math.sin(t*1.1)*.05;pack.visible=true}
 if(state==="opening"){
  let n=clamp((t-openStart)/1.7,0,1),a=n*n*(3-2*n);
  lidJoint.rotation.x=-2.5*a;pack.position.y=-2.35*a;pack.scale.setScalar(1-.75*a);pack.visible=n<.995;
  artifact.visible=n>.22;let f=clamp((n-.22)/.78,0,1);artifact.scale.setScalar(Math.max(.001,f*f*(3-2*f)));artifact.rotation.y+=dt*.6;
  if(n>=1){state="artifact";artifact.scale.setScalar(1);pack.visible=false;info.classList.add("show");el("app").classList.add("artifact-open");back.hidden=false;next.hidden=!!fixed;mutate.hidden=!!fixed;tip.textContent="За петлю — вращай · по структуре — мягкая волна"}
 }
 if(state==="artifact"){
  if(!held||held.mode!=="body"){artifact.rotation.y+=dt*.13+spinY;artifact.rotation.x=clamp(artifact.rotation.x+spinX,-1.15,1.15);artifact.rotation.z=clamp(artifact.rotation.z+spinZ,-.55,.55)}
  spinX*=.92;spinY*=.92;spinZ*=.92;artifact.rotation.z*=.999;artifact.scale.setScalar(1+.024*Math.sin(t*(1.3+heat)))
 }
 if(held&&held.mode==="body"&&!charged&&performance.now()-held.start>560){charged=true;charge=1.65;heat=2.3;shock(2.7);tip.textContent="✳ ПАТТЕРН В РЕЗОНАНСЕ"}
 if(held&&held.mode==="body"&&charged){charge=Math.min(2.5,charge+dt*.3);heat=Math.min(3.2,heat+dt*.24)}
 heat*=Math.pow(.99,s);charge*=Math.pow(.988,s);
 for(let m of materialMap)m.emissiveIntensity=m.userData.baseGlow*(1+Math.min(.19,heat*.035+charge*.05));
 pressVel=(pressVel+(pressTarget-pressValue)*.16*s)*Math.pow(.76,s);pressValue+=pressVel*s;baseUniforms.press.value=Math.max(0,pressValue);
 dragVel.add(dragTarget.clone().sub(dragPos).multiplyScalar(.13*s)).multiplyScalar(Math.pow(.75,s));dragPos.addScaledVector(dragVel,s);baseUniforms.drag.value.copy(dragPos);
 wave+=dt*1.6;baseUniforms.wave.value=wave;baseUniforms.power.value*=Math.pow(.975,s);
 stars.rotation.y=t*.002;orbital.rotation.z=t*.04;corona.rotation.y=t*(.14+heat*.3);corona.rotation.x=Math.sin(t*.3)*.18;corona.material.opacity=.065+Math.min(.09,heat*.019);
 if(composer)composer.render();else render.render(scene,camera)
}
