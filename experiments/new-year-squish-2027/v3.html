<style>

#pack.burst .lid,#pack.burst .lidlogo,#pack.burst .ribbon{transform:translate(25px,-150px) rotate(19deg);opacity:0}
#pack.burst .bow,#pack.burst .knot{transform:translate(25px,-165px) rotate(30deg) scale(.4);opacity:0}

.pack-label .open{display:inline-block;padding:12px 29px;border:1px solid #ebaf7d88;border-radius:100px;font-size:11px;font-weight:740;letter-spacing:.13em;color:#fff1e8;box-shadow:0 0 24px #ee64321f;animation:breath 2.6s ease-in-out infinite}

canvas{width:100%;height:100%;position:absolute;inset:0;display:block;touch-action:none;cursor:grab}

@media(max-height:590px){header{top:14px}h1{font-size:23px;margin-top:7px}.line{margin-top:8px}#subtitle{display:none}.info{top:91px}.info strong{font-size:19px}.info small{margin-top:6px}.pack-label{bottom:12px}.pack-label p{margin:5px}.package{transform:translateY(35px) scale(.77)}.buttons{bottom:10px;gap:4px}#number{bottom:73px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

<body>
<div id="app">
<header>
  <div class="logo">585 <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 59 37 87 13 66 44 100 50 66 56 87 87 59 63 50 100 41 63 13 87 34 56 0 50 34 44 13 13 41 37Z"/></svg><span>ЗОЛОТОЙ</span></div>

</header>
<section id="pack" class="screen" tabindex="0" role="button" aria-label="Открыть новогодний подарок">
 <div class="glow"></div>
 <div class="package"><div class="shadow"></div><div class="bottom"></div><div class="lid"></div><div class="lidlogo"><b>585</b> <i>✳</i> ЗОЛОТОЙ</div><div class="ribbon"></div><div class="bow a"></div><div class="bow b"></div><div class="knot"></div></div>
 <div class="pack-label"><strong>Внутри спрятано чудо</strong><p>Открой подарок и узнай,<br>какой живой артефакт достался тебе</p><div class="open">✧ РАСПАКОВАТЬ ✧</div></div>
</section>
<section id="experience" class="screen" aria-label="Живой интерактивный сквиш">
 <canvas id="art" aria-label="Нажимайте на артефакт и тяните его пальцем"></canvas>
 <div class="info"><strong id="creatureName">Золотой вихрь</strong><small id="creatureType"></small></div>

 <div class="buttons"><div class="help">Нажимай · Сжимай · Тяни · Отпускай</div><div class="actions"><button id="repack" type="button">↶ Коробочка</button><button id="reroll" type="button">✳ Новый паттерн</button></div></div>
</section>

<script>
(()=>{"use strict";
const canvas=document.getElementById("art"),c=canvas.getContext("2d"),pack=document.getElementById("pack"),exp=document.getElementById("experience"),next=document.getElementById("reroll"),back=document.getElementById("repack");
const qs=new URLSearchParams(location.search),giftId=(qs.get("gift")||"").trim().slice(0,120);
let key=giftId;
function fresh(){try{let b=new Uint32Array(2);crypto.getRandomValues(b);return "NY-"+b[0].toString(36)+"-"+b[1].toString(36)}catch(e){return "NY-"+Date.now().toString(36)+Math.random().toString(36).slice(2)}}
if(!key){try{key=localStorage.getItem("585-new-year-v3")}catch(e){}}
if(!key){key=fresh();try{localStorage.setItem("585-new-year-v3",key)}catch(e){}}
next.hidden=!!giftId;
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function prng(seed){return()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),col=(h,l,a)=>"hsla("+h+",96%,"+l+"%,"+a+")";
const families=[
 {name:"Золотой фрактал",sub:"ЖИВОЕ КИНЕТИЧЕСКОЕ КРУЖЕВО",kind:"flower",hue:34},
 {name:"Рубиновый гекс",sub:"НЕОНОВАЯ СЕТЬ УЗЛОВ",kind:"hex",hue:355},
 {name:"Северная медуза",sub:"СВЕТОВЫЕ ПСИХОДЕЛИЧЕСКИЕ ВОЛОКНА",kind:"jelly",hue:184},
 {name:"Хрустальная звезда",sub:"САМОПОДОБНЫЙ СНЕЖНЫЙ ФРАКТАЛ",kind:"snow",hue:208}
];
let spec,particles=[],live=false,opening=false,W=1,H=1,X=0,Y=0,R=100,dpr=1,when=0,fx=0,fy=0,dx=0,dy=0,vx=0,vy=0,press=0,vp=0,touch=null,impulses=[],glimmer=0,tilt=0;
function generate(){
 const seed=hash(key),r=prng(seed),base=families[Math.floor(r()*families.length)];
 spec={...base,seed,serial:seed.toString(16).toUpperCase().padStart(8,"0"),hue:base.hue+(r()-.5)*18,
 petals:6+Math.floor(r()*4),speed:.65+r()*.65,mutation:r()*8.5,detail:5+Math.floor(r()*4),soft:.7+r()*.5,rarity:r()>.94?"ЛЕГЕНДАРНЫЙ":r()>.73?"РЕДКИЙ":"УНИКАЛЬНЫЙ"};
 document.getElementById("creatureName").textContent=spec.name;
 document.getElementById("creatureType").textContent=spec.sub;
 document.getElementById("number").textContent=spec.rarity+" · ПАТТЕРН № "+spec.serial;
 particles=[];
 for(let i=0;i<100;i++){let a=r()*TAU,s=Math.sqrt(r());particles.push({x:s*Math.cos(a),y:s*Math.sin(a),phase:r()*TAU,size:.45+r()*1.4,velocity:.3+r()})}
 touch=null;impulses=[];dx=dy=vx=vy=press=vp=tilt=0;glimmer=1;
}
function resize(){const b=canvas.getBoundingClientRect();W=b.width;H=b.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));c.setTransform(dpr,0,0,dpr,0,0);X=W/2;Y=H*.505;R=clamp(Math.min(W*.39,H*.24,202),58,202);if(H<590){Y=H*.51;R=clamp(Math.min(W*.34,H*.22,150),53,150)}}
function openGift(){if(live||opening)return;opening=true;pack.classList.add("burst");generate();setTimeout(()=>{pack.classList.add("out");exp.classList.add("ready");live=true;opening=false;glimmer=1.6;resize()},820)}
function closeGift(){live=false;opening=false;exp.classList.remove("ready");pack.classList.remove("out","burst");touch=null}
pack.addEventListener("click",openGift);pack.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openGift()}});
back.addEventListener("click",closeGift);next.addEventListener("click",()=>{if(giftId)return;key=fresh();try{localStorage.setItem("585-new-year-v3",key)}catch(e){}closeGift();setTimeout(openGift,140)});
function eventPoint(e){const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left-X,y:e.clientY-b.top-Y}}
canvas.addEventListener("pointerdown",e=>{
 if(!live)return;let p=eventPoint(e);if(Math.hypot(p.x,p.y)>R*1.35)return;
 touch={id:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y};glimmer=.9;impulses.push({x:p.x,y:p.y,time:0});
 try{canvas.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()
},{passive:false});
canvas.addEventListener("pointermove",e=>{if(!touch||touch.id!==e.pointerId)return;let p=eventPoint(e);touch.x=p.x;touch.y=p.y;glimmer=Math.min(1.2,glimmer+.02);e.preventDefault()},{passive:false});
function release(e){if(touch&&touch.id===e.pointerId){impulses.push({x:touch.x,y:touch.y,time:0});touch=null;glimmer=1}}
canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);canvas.addEventListener("lostpointercapture",release);
function physics(delta){
 const dt=clamp(delta/16.67,.2,1.8),tx=touch?clamp(touch.x-touch.sx,-R*.75,R*.75):0,ty=touch?clamp(touch.y-touch.sy,-R*.75,R*.75):0,compression=touch?R*.27*spec.soft:0;
 vx=(vx+(tx-dx)*.11*dt)*Math.pow(.78,dt);vy=(vy+(ty-dy)*.11*dt)*Math.pow(.78,dt);
 vp=(vp+(compression-press)*.09*dt)*Math.pow(.78,dt);
 dx+=vx*dt;dy+=vy*dt;press+=vp*dt;tilt+=(dx*.00007-tilt)*.08;glimmer*=Math.pow(.985,dt);
 for(let i=impulses.length-1;i>=0;i--){impulses[i].time+=delta;if(impulses[i].time>780)impulses.splice(i,1)}
}
function warp(x,y){
 if(!touch&&Math.abs(dx)+Math.abs(dy)+Math.abs(press)<.03&&impulses.length===0)return[x,y];
 const anchor=touch||{sx:0,sy:0},u=x-anchor.sx,v=y-anchor.sy,fall=Math.exp(-(u*u+v*v)/(R*R*.28));
 let xx=x+dx*fall*.88-u*press/R*fall*.67,yy=y+dy*fall*.88-v*press/R*fall*.67;
 for(let i=0;i<impulses.length;i++){
  let p=impulses[i],r=Math.hypot(x-p.x,y-p.y),front=p.time*.24,band=(r-front)/28,mag=Math.exp(-(band*band))*Math.max(0,1-p.time/780)*5;
  if(r>1){xx+=(x-p.x)*mag/r;yy+=(y-p.y)*mag/r}
 }
 return[xx,yy]
}
function m(x,y){let p=warp(x,y);c.moveTo(p[0],p[1])}
function l(x,y){let p=warp(x,y);c.lineTo(p[0],p[1])}
function dot(x,y,r,h,a){let p=warp(x,y);c.beginPath();c.arc(p[0],p[1],r,0,TAU);c.fillStyle=col(h,85,a);c.fill()}
function line(h,a,w,glow=false){c.lineWidth=w;c.lineCap="round";c.lineJoin="round";c.strokeStyle=col(h,glow?70:82,a);if(glow){c.shadowColor=col(h,55,.8);c.shadowBlur=11}c.stroke();c.shadowBlur=0}
function star(x,y,s,a){let p=warp(x,y);c.beginPath();c.moveTo(p[0]-s,p[1]);c.lineTo(p[0]+s,p[1]);c.moveTo(p[0],p[1]-s);c.lineTo(p[0],p[1]+s);c.lineWidth=.85;c.strokeStyle="rgba(255,237,198,"+a+")";c.stroke()}
function flower(t){
 let phase=t*.00019*spec.speed,p=spec.petals;
 for(let layer=0;layer<23;layer++){
  let shift=layer*.047+spec.mutation,scale=.72+layer*.011;c.beginPath();
  for(let k=0;k<=250;k++){
   let a=k*TAU/250,rad=R*scale*(.61+.29*Math.cos(p*a+phase+shift)+.09*Math.sin(p*2*a-phase*1.3+shift*.8));
   let x=rad*Math.cos(a),y=rad*Math.sin(a);
   if(!k)m(x,y);else l(x,y)
  }
  line(spec.hue+layer%6*5,layer%4===0?.37:.14,layer%5===0?1.55:.67,layer%6===0)
 }
 for(let j=0;j<p*11;j++){
  let a=j*TAU/(p*11)+phase*.1,rr=R*(.55+.27*Math.cos(p*a+phase+spec.mutation));
  dot(rr*Math.cos(a),rr*Math.sin(a),j%11===0?2.15:.9,spec.hue+32,j%11===0?.84:.42)
 }
 for(let j=0;j<p*4;j++){let a=j*TAU/(p*4),b=a+TAU/p*.4;c.beginPath();m(R*.3*Math.cos(a),R*.3*Math.sin(a));l(R*.78*Math.cos(b),R*.78*Math.sin(b));line(spec.hue+40,.16,.75)}
}
function hex(t){
 const phase=t*.00022*spec.speed,spokes=6,outer=11;
 // Each vertex is part of a self-supporting hexagonal graph; no filled shape or perimeter mask.
 const vertices=[],at=(ring,index)=>vertices[ring][(index+spokes*ring)%(spokes*ring)];
 vertices[0]=[[0,0]];
 for(let ring=1;ring<=outer;ring++){
  let row=[],count=spokes*ring;
  for(let j=0;j<count;j++){
   let theta=j*TAU/count+phase*.13,corner=Math.cos(theta*3);
   let rad=R*ring/outer*(.87+.105*Math.cos(theta*6+phase+spec.mutation));
   let x=rad*Math.cos(theta)+R*.025*Math.sin(phase*2+ring*.55+j*.17);
   let y=rad*Math.sin(theta)+R*.025*Math.cos(phase*2+ring*.43+j*.13);
   row.push([x,y])
  }
  vertices[ring]=row;
 }
 for(let ring=1;ring<=outer;ring++){
  let count=spokes*ring;
  for(let j=0;j<count;j++){
   let a=at(ring,j),b=at(ring,j+1),last=ring===1?vertices[0][0]:at(ring-1,Math.floor(j*(ring-1)/ring));
   c.beginPath();m(a[0],a[1]);l(b[0],b[1]);line(spec.hue+ring*5,.11+ring*.008,ring%3===0?1.25:.72);
   c.beginPath();m(a[0],a[1]);l(last[0],last[1]);line(spec.hue+40,.14,.65);
   if((j+ring)%4===0)dot(a[0],a[1],ring%4===0?2.1:1.2,spec.hue+55,.52+ring*.015);
  }
 }
 // Dense interference waves flow across the mesh itself, creating kinetic SETKA texture.
 for(let row=-12;row<=12;row++){
  c.beginPath();
  for(let j=0;j<=80;j++){
   let x=(j/80*2-1)*R,y=row*R*.077+Math.sin(x/R*7+phase*3+row*.3)*R*.06;
   if(!j)m(x,y);else l(x,y)
  }
  line(spec.hue+60,.085,.7)
 }
}
function jelly(t){
 const p=t*.00045*spec.speed,filaments=54;
 // All visible parts ARE moving strands; no enclosing body/circle.
 for(let j=0;j<filaments;j++){
  const u=(j/(filaments-1)-.5)*2,x0=u*R*.60;
  c.beginPath();
  for(let i=0;i<=115;i++){
   let q=i/115,x=x0*(1-q*.4)+R*(.085+.1*Math.abs(u))*Math.sin(q*12+p+u*4)*Math.pow(q,.85)+R*.075*Math.sin(q*24-p*1.3+j*.18)*q;
   let y=R*(-.76+1.66*q)+R*.045*Math.cos(q*11-p*.6+j*.12);
   if(!i)m(x,y);else l(x,y)
  }
  line(spec.hue+(j%11)*8,j%7===0?.39:.12,j%7===0?1.5:.7,j%11===0)
 }
 for(let row=0;row<19;row++){
  let q=row/19;c.beginPath();
  for(let j=0;j<=85;j++){
   let u=(j/85-.5)*2,x=u*R*(.63-q*.16)+R*.065*Math.sin(q*15+p+u*5),y=R*(-.72+1.6*q)+R*.05*Math.sin(u*14+p+q*7);
   if(!j)m(x,y);else l(x,y)
  }

function snow(t){
 const phase=t*.00017*spec.speed,arms=spec.petals;
 function branch(x,y,a,length,depth){

 }

 }
 for(let j=0;j<arms*7;j++){let a=j*TAU/(arms*7)-phase*.3,rr=R*(.25+.5*Math.abs(Math.sin(j*1.5+phase)));dot(rr*Math.cos(a),rr*Math.sin(a),j%7===0?2:.7,spec.hue+55,.6)}

function ambient(t){
 let g=c.createRadialGradient(0,0,0,0,0,R*1.73);

function lights(t){
 for(let i=0;i<particles.length;i++){

 }
}
function hanger(t){
 // A small gold suspension fitting identifies the Christmas collection.
 // It never outlines, clips or encloses a pattern.
 let y=-(spec.kind==="jelly"?.88:1.04)*R,bob=Math.sin(t*.001)*1.7;
 c.save();c.lineWidth=2.8;c.strokeStyle="#f7da9c";c.shadowBlur=8;c.shadowColor="#efb65e";c.beginPath();c.ellipse(0,y-18+bob,R*.071,R*.087,0,0,TAU);c.stroke();c.shadowBlur=0;

 c.fillStyle=mg;c.beginPath();c.roundRect(-R*.12,y-13+bob,R*.24,R*.14,3);c.fill();
 c.strokeStyle="#6b431c66";c.lineWidth=.7;for(let j=-2;j<=2;j++){c.beginPath();c.moveTo(j*R*.039,y-11+bob);c.lineTo(j*R*.039,y+3+bob);c.stroke()}c.restore()
}
function render(t){
 c.clearRect(0,0,W,H);if(!live)return;c.save();c.translate(X,Y);
 ambient(t);c.globalCompositeOperation="screen";
 if(spec.kind==="flower")flower(t);else if(spec.kind==="hex")hex(t);else if(spec.kind==="jelly")jelly(t);else snow(t);

}
