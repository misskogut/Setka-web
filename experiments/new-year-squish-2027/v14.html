   grad.addColorStop(0,'#7e5d36');grad.addColorStop(.5,'#f7d7a0');grad.addColorStop(1,'#99713b');ctx2.fillStyle=grad;
   ctx2.fillRect(W*.5-F*.09,top+F*.073,F*.18,F*.047);ctx2.restore();
 }
}
function render(){if(!gpu){if(time-lastCpu>.08){cpuDraw();lastCpu=time}return}gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);
 if(!open){uniforms(yaw+time*.09,pitch,0,0);bindBuffer(boxBuffer);gl.drawArrays(gl.TRIANGLES,0,boxData.length/12)}
 else {uniforms(yaw,pitch,press,pulse);bindBuffer(buffer);gl.drawArrays(gl.TRIANGLES,0,vertexCount)}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;time+=dt;
 if(open){press+=(pressTo-press)*Math.min(1,dt*8);pulse*=Math.pow(.94,dt*60);heat*=Math.pow(.981,dt*60);if(!drag){yaw+=spin;pitch=clamp(pitch+spinPitch,-.7,.7);spin*=Math.pow(.94,dt*60);spinPitch*=Math.pow(.93,dt*60);yaw+=dt*.016}}
 render();requestAnimationFrame(frame)}requestAnimationFrame(frame);load.classList.add('out');tip.textContent='V-грани двигаются сами · нажми на них · вращай за петлю';
function coordinates(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
 let p=coordinates(e),cx=canvas.clientWidth/2,cy=canvas.clientHeight/2,size=Math.min(canvas.clientWidth*.4,canvas.clientHeight*.32);
 let loop=open&&Math.hypot(p.x-cx,p.y-(cy-size*.96))<size*.23;
 let inside=open&&Math.hypot(p.x-cx,p.y-cy)<size*1.03;
 let kind=!open?'rotate':loop?'loop':inside?'squish':'rotate';
 drag={id:e.pointerId,x:p.x,y:p.y,startX:p.x,startY:p.y,kind,a:yaw,lat:clamp((p.y-cy+size)/(2*size),0,1)};
 if(kind==='squish'){pressTo=.66;pulse=1;heat=.08;tip.textContent='Сжатие · согласованная волна по вложенным рядам'};
 try{canvas.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()
},{passive:false});
canvas.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;const p=coordinates(e),dx=p.x-drag.x,dy=p.y-drag.y;drag.x=p.x;drag.y=p.y;
 if(drag.kind==='squish'){pressTo=clamp(.50+Math.hypot(p.x-drag.startX,p.y-drag.startY)/500,.52,.82);drag.lat=clamp((p.y-canvas.clientHeight*.5)/canvas.clientHeight+.5,0,1)}
 else{yaw+=dx*.009;pitch=clamp(pitch+dy*.006,-.68,.68);spin=dx*.0012;spinPitch=dy*.0007}e.preventDefault()
},{passive:false});
function release(e){if(!drag||drag.id!==e.pointerId)return;if(drag.kind==='squish'){pressTo=0;pulse=.7;heat=.08}drag=null}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
$('open').addEventListener('click',()=>{open=true;app.classList.add('shown');$('open').hidden=true;$('box').hidden=false;$('variant').hidden=bound;$('mode').hidden=false;tip.textContent='За петлю — вращай · по V-граням — нажимай';yaw=.03;pitch=-.035;heat=.1;pulse=1});
$('box').addEventListener('click',()=>{open=false;app.classList.remove('shown');$('open').hidden=false;$('box').hidden=true;$('variant').hidden=true;$('mode').hidden=true;tip.textContent='Поверни коробочку — открой сюрприз'});
$('variant').addEventListener('click',()=>{if(bound)return;variant++;rebuild();heat=.4;pulse=1});
$('mode').addEventListener('click',()=>{mode=1-mode;$('mode').textContent=mode?'◎ Режим: волны':'◎ Режим: дыхание';pulse=1});
})();
