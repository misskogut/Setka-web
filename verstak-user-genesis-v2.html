<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f4f2ed"/><title>VERSTAK · Genesis</title>
<style>
:root{--bg:#f4f2ed;--paper:#fbfaf7;--ink:#20201d;--muted:#77756e;--line:#dcd8cf;--soft:#ebe7df;--r:18px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}button,textarea,input{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding:18px 16px 150px}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 14px;background:linear-gradient(var(--bg) 78%,transparent)}.brand{font-size:13px;font-weight:760;letter-spacing:.16em}.scope,.note,.who,.meta{color:var(--muted)}.scope{font-size:11px;margin-top:3px}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.tool,.organ,.period,.qa,.ghost{border:1px solid var(--line);background:rgba(251,250,247,.8);border-radius:999px}.tool{font-size:17px;line-height:1;padding:7px 11px}.organ{font-size:12px;padding:7px 11px}.time{padding:10px 2px 24px}.axis{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:9px;color:var(--muted);font-size:10px;letter-spacing:.08em}.rail{height:1px;background:var(--line)}.now{width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--bg)}.periods{display:flex;justify-content:center;gap:6px;margin-top:14px}.period{background:transparent;color:var(--muted);padding:5px 10px;font-size:12px}.period.on{background:var(--ink);border-color:var(--ink);color:white}.board{margin-bottom:22px;padding:16px 17px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}.who{font-size:11px;letter-spacing:.05em;margin-bottom:6px}.boardtext{font-size:16px}.reply{margin-top:11px;padding-top:11px;border-top:1px solid var(--soft)}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.title{font-size:13px;font-weight:680}.note{font-size:11px}.feed{display:flex;flex-direction:column;gap:9px}.event{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px 15px}.event.system{background:transparent}.meta{font-size:10px;display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}.summary{font-size:14px}.details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--soft);white-space:pre-wrap;word-break:break-word;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#66635d;max-height:320px;overflow:auto}.details.on{display:block}.ghost{padding:4px 8px;background:transparent;color:var(--muted);font-size:11px;margin-top:9px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}.dock{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:28px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(transparent,rgba(244,242,237,.98) 30%)}.dockin{max-width:880px;margin:auto}.qas{display:flex;gap:7px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}.qas::-webkit-scrollbar{display:none}.qa{white-space:nowrap;background:var(--paper);font-size:12px;padding:7px 11px}.compose{display:flex;align-items:flex-end;gap:8px;border:1px solid #cbc6bb;background:var(--paper);border-radius:22px;padding:8px 9px 8px 13px;box-shadow:0 8px 28px rgba(30,28,24,.08)}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;min-height:31px;max-height:120px;padding:5px 0}.send{width:34px;height:34px;border:0;border-radius:50%;background:var(--ink);color:#fff}.send:disabled{opacity:.35}.drawer{display:none;position:fixed;inset:0;z-index:40;background:rgba(24,23,20,.17);backdrop-filter:blur(3px)}.drawer.on{display:block}.panel{position:absolute;right:0;top:0;width:min(420px,92vw);height:100%;overflow:auto;background:var(--paper);border-left:1px solid var(--line);padding:21px}.paneltop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:24px}.item{padding:11px 0;border-bottom:1px solid var(--soft)}.item b{display:block}.item small{color:var(--muted)}.gate{max-width:540px;margin:20vh auto;text-align:center;padding:20px}.gate h1{font-size:17px;letter-spacing:.16em}.gate p{color:var(--muted)}.gate input{width:100%;border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:12px;margin:10px 0}.gate button,.done{border:0;border-radius:999px;padding:9px 15px;background:var(--ink);color:#fff}.pencilLayer{display:none;position:fixed;inset:0;z-index:60;background:rgba(244,242,237,.2);touch-action:none}.pencilLayer.on{display:block}.draw{position:absolute;inset:0;width:100%;height:100%}.pbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(680px,calc(100% - 22px));background:var(--paper);border:1px solid #c9c4b9;border-radius:20px;padding:9px;box-shadow:0 10px 40px rgba(20,19,16,.16)}.phelp{font-size:11px;color:var(--muted);padding:0 4px 7px}.prow{display:flex;gap:7px;align-items:center}.prow input{flex:1;border:0;outline:0;background:var(--soft);border-radius:12px;padding:10px}.clear{border:0;background:transparent;color:var(--muted)}.toast{position:fixed;z-index:80;left:50%;bottom:95px;transform:translateX(-50%) translateY(12px);opacity:0;transition:.18s;background:#222;color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:620px){.app{padding:10px 10px 150px}.scope{max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.organ{padding:6px 9px}.board{padding:14px}.event{padding:12px}.axis{font-size:9px}}
</style></head><body>
<div id="gate" class="gate" hidden><h1>VERSTAK</h1><p id="gateMessage">Войди со своим SETKA ID и PIN.</p><a href="verstak-login.html">Войти на корабль</a><button id="retry" hidden>Повторить загрузку</button></div>
<main id="app" class="app" hidden><header class="top"><div><div class="brand">VERSTAK</div><div id="scope" class="scope">подключение…</div></div><div id="tools" class="tools"></div></header><section class="time"><div class="axis"><span>ПРОШЛОЕ</span><div class="rail"></div><span class="now"></span><div class="rail"></div><span>БУДУЩЕЕ</span></div><div class="periods"><button class="period on" data-days="7">7 дней</button><button class="period" data-days="30">30 дней</button><button class="period" data-days="90">90 дней</button></div></section><section class="board"><div class="who">БОРТОВОЙ КОМПЬЮТЕР</div><div id="boardText" class="boardtext">Я смотрю на состояние корабля…</div><div id="reply"></div></section><section><div class="sectionhead"><div class="title">Стенограмма</div><div id="periodNote" class="note">7 дней</div></div><div id="feed" class="feed"></div></section></main>
<div id="dock" class="dock" hidden><div class="dockin"><div id="qas" class="qas"></div><div class="compose"><textarea id="input" rows="1" placeholder="Сказать Бортовому…"></textarea><button id="send" class="send">↑</button></div></div></div>
<div id="drawer" class="drawer"><div class="panel"><div class="paneltop"><div><div id="panelTitle" class="brand"></div><div id="panelNote" class="scope"></div></div><button id="close" class="close">×</button></div><div id="panelBody"></div></div></div>
<div id="pencilLayer" class="pencilLayer"><canvas id="draw" class="draw"></canvas><div class="pbar"><div class="phelp">Покажи прямо на интерфейсе, что не так или как хочешь переставить элементы. Бэк от перестановки не меняется.</div><div class="prow"><button id="clear" class="clear">Очистить</button><input id="pnote" placeholder="Коротко пояснить, что изменить"><button id="done" class="done">Готово</button></div></div></div><div id="toast" class="toast"></div>
<script>
const API='https://gfchgaphzhxufwdhrcis.supabase.co/rest/v1/rpc/',KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';let token='',days=7,state=null,boot=null,busy=false,pSession=null,pEvents=[],pStart=0,drawing=false,seq=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tok(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search);let t=h.get('session')||q.get('session')||sessionStorage.getItem('verstak_session')||'';if(t){sessionStorage.setItem('verstak_session',t);if(location.hash||q.get('session'))history.replaceState(null,'',location.pathname)}return t}async function rpc(name,body){const r=await fetch(API+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}function when(s){return s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}function scopeName(){return state?.scopeMode==='MOTHER_FLEET'?'Материнский корабль · флот':(boot?.ship?.display_name_ru||'Личный корабль')}function onboard(){if(state?.scopeMode==='MOTHER_FLEET')return'Я наблюдаю доступный флот. Сам вынесу сюда то, что действительно требует внимания.';const m=(state?.visibleOrgans||[]).some(x=>x.id==='MISSION');if(!boot?.projects?.length)return'Я пока почти ничего не знаю о твоём мире. Расскажи, что для тебя сейчас важно — дальше я сам буду подсказывать следующий шаг.';if(!m)return'Я уже вижу жизнь корабля, но его миссия ещё не оформилась. Просто расскажи, чего хочешь добиться.';return'Корабль живёт. Я слежу за ним и сам предложу новый орган, данные или действие, когда они понадобятся.'}function shipLabel(code){return(state?.ships||[]).find(x=>(x.shipCode||x.ship_code)===code)?.displayNameRu||((code||'').includes('SASHA')?'Корабль Саши':'VERSTAK')}
function visible(e){const t=(e.event_type||'').toUpperCase(),k=(e.object_kind||e.entity_type||'').toUpperCase();if(k==='PIN'||t.includes('PIN_')||t.startsWith('PIN'))return false;if(k==='TRACE'||t.includes('TRACE_')||t.startsWith('TRACE'))return false;if(t==='PENCIL_STARTED')return false;return true}function userText(e){const t=(e.event_type||'').toUpperCase(),p=e.payload||{};if(t.startsWith('BOARD_')&&p.answer)return p.answer;if(t==='PENCIL_FINISHED')return'Карандаш сохранил изменение или замечание по интерфейсу.';if(t==='SOLAI_RESPONSE'&&p.response)return p.response;return e.summary_ru||e.summary||e.event_type||'Событие'}function safePayload(e){const p={...(e.payload||{})};for(const k of ['guardCaseId','queueId','ingressCaseId','egressCaseId','backend'])delete p[k];return p}function card(e){const p=safePayload(e),meta=[when(e.occurred_at),e.ship_code?shipLabel(e.ship_code):'',e.event_type||e.entity_type||''].filter(Boolean).map(esc).join(' · '),details=Object.keys(p).length?`<button class="ghost more">Данные</button><div class="details">${esc(JSON.stringify(p,null,2))}</div>`:'';return`<article class="event ${e._system?'system':''}"><div class="meta">${meta}</div><div class="summary">${esc(userText(e))}</div>${details}</article>`}function renderFeed(){let a=[...(state?.timeline||[])];if(state?.scopeMode==='MOTHER_FLEET')a=a.concat((state?.systemTranscript||[]).map(x=>({...x,_system:true})));a=a.filter(visible).sort((x,y)=>new Date(y.occurred_at)-new Date(x.occurred_at)).slice(0,80);$('#feed').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Пока здесь тихо. Бортовой продолжает наблюдать.</div>';$$('.more').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('on'))}
function renderTools(){const r=$('#tools');r.innerHTML='';for(const o of(state?.visibleOrgans||[])){const b=document.createElement('button');b.className='organ';b.textContent=o.label;b.onclick=()=>openOrgan(o);r.appendChild(b)}const p=document.createElement('button');p.className='tool';p.title='Карандаш';p.textContent='✎';p.onclick=startPencil;r.appendChild(p)}function renderQA(){const q=state?.quickActions||[];$('#qas').innerHTML=q.map((a,i)=>`<button class="qa" data-i="${i}" title="${esc(a.reason||'')}">${esc(a.label)}</button>`).join('');$$('.qa').forEach(b=>b.onclick=()=>runQA(q[+b.dataset.i]))}function render(){$('#scope').textContent=scopeName();$('#periodNote').textContent=`последние ${days} дней`;if(!$('#reply').children.length)$('#boardText').textContent=onboard();renderTools();renderQA();renderFeed()}async function load(){state=await rpc('api_verstak_front_state_session_v1',{p_session_token:token,p_days:days,p_limit:80});if(!state?.ok)throw new Error(state?.error||'state');try{boot=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'bootstrap',p_payload:{}})}catch{boot={}}render()}
async function ask(text){text=(text||'').trim();if(text.length<2||busy)return;busy=true;$('#send').disabled=true;$('#reply').innerHTML=`<div class="reply"><div class="who">ТЫ</div>${esc(text)}<div class="who" style="margin-top:10px">БОРТОВОЙ</div>считаю…</div>`;$('#input').value='';try{const r=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'board_query',p_payload:{questionRu:text,projectId:boot?.projects?.[0]?.id||null}});$('#reply').innerHTML=`<div class="reply"><div class="who">ТЫ</div>${esc(text)}<div class="who" style="margin-top:10px">БОРТОВОЙ</div>${esc(r.messageRu||r.error||'Принято.')}</div>`;await load()}catch{toast('Не удалось передать Бортовому')}finally{busy=false;$('#send').disabled=false}}async function report(n){try{const r=await rpc('api_verstak_period_report_session_v1',{p_session_token:token,p_days:n}),s=r.summary||{};$('#reply').innerHTML=`<div class="reply"><div class="who">СВОДКА · ${n} ДНЕЙ</div>Событий: <b>${s.shipEventCount??0}</b> · границ понимания: <b>${s.guardCaseCount??0}</b> · обращений к ИИ: <b>${s.aiCaseCount??0}</b> · открытых потребностей в данных: <b>${s.openInformationNeeds??0}</b></div>`}catch{toast('Сводка пока недоступна')}}function runQA(a){if(a.kind==='REPORT')return report(a.days||days);if(a.kind==='COMPOSE'){const i=$('#input');i.value=a.prompt||'';i.focus();i.setSelectionRange(i.value.length,i.value.length);return}if(a.kind==='QUERY')return ask(a.prompt||a.label)}
function openOrgan(o){$('#panelTitle').textContent=o.label;$('#panelNote').textContent=o.reason||'';let h='';if(o.id==='FLEET')h=(state?.ships||[]).map(s=>`<div class="item"><b>${esc(s.displayNameRu||s.shipCode)}</b><small>${esc(s.shipCode||'')}</small></div>`).join('');else if(o.id==='CREW'){const c=boot?.projectIdentities||[],p=boot?.positions||[];h=c.length?c.map(x=>`<div class="item"><b>${esc(x.display_name_ru||x.setka_id)}</b><small>${esc(x.purpose_ru||x.runtime_state||'')}</small></div>`).join(''):p.map(x=>`<div class="item"><b>${esc(x.title_ru)}</b><small>${esc(x.purpose_ru||'')}</small></div>`).join('')}else if(o.id==='MISSION'){const m=(state?.timeline||[]).filter(e=>(e.object_kind||'').toUpperCase()==='MISSION'||(e.event_type||'').toUpperCase().includes('MISSION'));h=m.map(e=>`<div class="item"><b>${esc(userText(e))}</b><small>${esc(when(e.occurred_at))}</small></div>`).join('')}$('#panelBody').innerHTML=h||'<div class="empty" style="margin-top:20px">Этот орган уже существует, но пока почти пуст.</div>';$('#drawer').classList.add('on')}
function resizeCanvas(){const c=$('#draw'),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';const x=c.getContext('2d');x.scale(d,d);x.lineWidth=3;x.lineCap='round';x.strokeStyle='#20201d'}async function startPencil(){try{const r=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'pencil_start',p_payload:{projectId:boot?.projects?.[0]?.id||null,screenKey:'GENESIS',route:location.pathname}});if(!r.ok)throw 0;pSession=r.session.id;pEvents=[];seq=0;pStart=performance.now();$('#pnote').value='';$('#pencilLayer').classList.add('on');resizeCanvas()}catch{toast('Карандаш пока не открылся')}}function point(e){const r=$('#draw').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,px:e.clientX-r.left,py:e.clientY-r.top}}function addEv(type,p){if(pEvents.length>180)return;pEvents.push({seq:++seq,eventType:type,tMs:Math.round(performance.now()-pStart),xNorm:p.x,yNorm:p.y,targetKey:'GENESIS_FRONT',targetLabel:'Пользовательский фронт',data:{}})}$('#draw').addEventListener('pointerdown',e=>{drawing=true;const p=point(e),x=$('#draw').getContext('2d');x.beginPath();x.moveTo(p.px,p.py);addEv('DRAW_START',p)});$('#draw').addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e),x=$('#draw').getContext('2d');x.lineTo(p.px,p.py);x.stroke();addEv('DRAW_MOVE',p)});addEventListener('pointerup',e=>{if(drawing){drawing=false;addEv('DRAW_END',point(e))}});$('#clear').onclick=()=>{resizeCanvas();pEvents=[];seq=0;pStart=performance.now()};$('#done').onclick=async()=>{if(!pSession)return;$('#done').disabled=true;try{if(pEvents.length)await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'pencil_events',p_payload:{sessionId:pSession,events:pEvents}});const r=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'pencil_finish',p_payload:{sessionId:pSession,intentionRu:$('#pnote').value.trim()}});$('#pencilLayer').classList.remove('on');pSession=null;toast(r.ok?'Карандаш сохранён':'Не удалось сохранить');await load()}catch{toast('Не удалось сохранить Карандаш')}finally{$('#done').disabled=false}};
$('#send').onclick=()=>ask($('#input').value);$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.currentTarget.value)}});$$('.period').forEach(b=>b.onclick=async()=>{days=+b.dataset.days;$$('.period').forEach(x=>x.classList.toggle('on',x===b));await load()});$('#close').onclick=()=>$('#drawer').classList.remove('on');$('#drawer').onclick=e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('on')};$('#retry').onclick=()=>start();async function start(){try{await load();$('#gate').hidden=true;$('#app').hidden=false;$('#dock').hidden=false}catch{$('#app').hidden=true;$('#dock').hidden=true;$('#gate').hidden=false;$('#gateMessage').textContent='Не удалось открыть корабль. Повтори загрузку или войди заново.';$('#retry').hidden=false}}token=tok();if(token)start();else $('#gate').hidden=false;
</script></body></html>
