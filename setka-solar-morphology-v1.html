<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SETKA · Solar Morphology</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030812;color:#eef6ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}svg{width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:20;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill,.btn,.card,.legend{background:rgba(4,12,23,.92);border:1px solid #31465f;border-radius:11px;backdrop-filter:blur(8px)}.pill{padding:8px 10px;flex:1 1 420px;min-width:0}.pill b{font-size:12px}.pill small{display:block;font-size:9px;color:#93a9c0;margin-top:2px}.btn{padding:9px 10px;color:#eaf4ff;font:10px inherit}.btn.active[data-k="structure"]{border-color:#f0c65a;background:rgba(91,68,18,.9)}.btn.active[data-k="state"]{border-color:#64d9f3;background:rgba(15,66,78,.9)}.btn.active[data-k="disturb"]{border-color:#ff8650;background:rgba(92,39,20,.9)}.btn.active{border-color:#8aa0b7;background:rgba(30,44,60,.9)}.card{position:fixed;z-index:30;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(480px,calc(100vw - 16px));max-height:46vh;overflow:auto;padding:12px;display:none}.card h3{font-size:12px;margin:0 0 7px}.row{font-size:9px;line-height:1.45;padding:5px 0;border-bottom:1px solid rgba(110,140,170,.15);word-break:break-word}.muted{color:#91a8bf}.legend{position:fixed;z-index:12;left:8px;bottom:max(8px,env(safe-area-inset-bottom));padding:8px 10px;font-size:8px;color:#a9bfd3;line-height:1.45;pointer-events:none}.nodeLabel{font-size:8px;fill:#f5f8fb;paint-order:stroke;stroke:#030812;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.shellLabel{font-size:8px;fill:#f6d879;paint-order:stroke;stroke:#030812;stroke-width:3px;pointer-events:none}.edge{stroke-width:1.2;opacity:.48}.edgeHit{stroke:transparent;stroke-width:14;cursor:pointer}.node{cursor:pointer}.selected{stroke:#fff!important;stroke-width:2.4!important}.dim{stroke:#f0c65a;stroke-dasharray:4 3;opacity:.55}.surface{fill:rgba(238,181,52,.035);stroke:#f0c65a;stroke-width:1.3}.shell{fill:none;stroke:#d3a83a;stroke-width:1;opacity:.34}.shell.outer{opacity:.18;stroke-dasharray:4 4}.centerGlow{fill:rgba(255,205,72,.15);stroke:#ffd55f;stroke-width:2}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#92a8be;font-size:11px;pointer-events:none}@media(max-width:760px){.pill small{display:none}.card{max-height:43vh}.legend{max-width:58vw}.nodeLabel,.shellLabel{font-size:7px}}
</style></head><body><svg id="g"></svg><div class="top"><div class="pill"><b>SETKA · SOLAR BODY MORPHOLOGY</b><small id="subtitle">loading…</small></div><button class="btn active" data-k="structure" id="structure">STRUCTURE</button><button class="btn active" data-k="state" id="state">STATE</button><button class="btn active" data-k="disturb" id="disturb">DISTURB</button><button class="btn" id="coords">COORDS</button><button class="btn" id="evidence">EVIDENCE</button><button class="btn active" id="labels">LABELS</button><button class="btn" id="rotate">ROTATE</button><button class="btn" id="reset">RESET</button></div><div class="legend" id="legend">метрическая морфология · renderer не переставляет узлы</div><div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div></div><div class="loading" id="loading">SETKA morphology packet…</div><script>
const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co';
const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';
const qs=new URLSearchParams(location.search);const PACKET=qs.get('packet')||'VIS-LOCAL-MORPH-72A1933758554E06';
const svg=d3.select('#g'), root=svg.append('g');let W=innerWidth,H=innerHeight,zoom,yaw=0;let graph,nodes,links,nodeByRef,showStructure=true,showState=true,showDisturb=true,showCoords=false,showEvidence=false,showLabels=true;
const card=document.getElementById('card'),cardTitle=document.getElementById('cardTitle'),cardBody=document.getElementById('cardBody');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const row=(k,v)=>`<div class="row"><span class="muted">${esc(k)}</span><br>${typeof v==='object'?`<pre style="white-space:pre-wrap;margin:4px 0 0">${esc(JSON.stringify(v,null,2))}</pre>`:esc(v)}</div>`;
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
function category(n){const r=n.semanticRole||'';if(r.startsWith('STRUCTURE'))return'structure';if(r.startsWith('STATE'))return'state';if(r==='DISTURBANCE'||r==='DISTURBANCE_SET')return'disturb';if(r.includes('COORDINATE'))return'coords';if(r==='CENTRAL_OBJECT')return'center';return'evidence'}
function color(n){const c=category(n);return c==='center'?'#ffd45e':c==='structure'?'#e7bd50':c==='state'?'#59cee9':c==='disturb'?'#ff7d48':c==='coords'?'#a884ef':'#627b92'}
function visible(n){const c=category(n);if(c==='center')return true;if(c==='structure')return showStructure;if(c==='state')return showState;if(c==='disturb')return showDisturb;if(c==='coords')return showCoords;return showEvidence}
function rawPos(n){const m=n.morphology||{};if(Number.isFinite(+m.x)&&Number.isFinite(+m.y))return{x:+m.x,y:+m.y,z:+m.z||0};if(m.placementKind==='COORDINATE_SATELLITE'&&m.ownerRef&&nodeByRef.has(m.ownerRef)){const b=rawPos(nodeByRef.get(m.ownerRef));const a=(hash(n.ref)%360)*Math.PI/180;return{x:b.x+.09*Math.cos(a),y:b.y+.09*Math.sin(a),z:b.z};}const a=(hash(n.ref)%360)*Math.PI/180,r=1.62+(hash(n.ref+'r')%28)/100;return{x:r*Math.cos(a),y:r*Math.sin(a),z:0};}
function project(p){const c=Math.cos(yaw),s=Math.sin(yaw),xr=p.x*c+p.z*s,zr=-p.x*s+p.z*c;const maxR=1.82,scale=Math.min(W,H)*.34/maxR;return{x:W/2+xr*scale,y:H/2-p.y*scale,z:zr,scale};}
function nodeRadius(n){const c=category(n);if(c==='center')return 13;if(c==='disturb'){const a=+(n.morphology?.area||0);return Math.min(10,4+Math.sqrt(Math.max(0,a))/4)}if(c==='structure')return 6;if(c==='state')return 5;if(c==='coords')return 3.5;return 4}
function showNode(n){card.style.display='block';cardTitle.innerHTML=(category(n)==='center'?'<span style="color:#ffd45e">★ </span>':'')+esc(n.label||n.ref);cardBody.innerHTML=row('semanticRole',n.semanticRole)+row('ref',n.ref)+row('morphology',n.morphology)+row('payload',n.payload)+row('WHY HERE',n.morphology?.basis||'graph relation / evidence context')}
function showEdge(e){card.style.display='block';cardTitle.textContent=e.relation||'EDGE';cardBody.innerHTML=row('edgeClass',e.edgeClass)+row('source',typeof e.source==='object'?e.source.ref:e.source)+row('target',typeof e.target==='object'?e.target.ref:e.target)+row('epistemicStatus',e.epistemicStatus)+row('WHY HERE',e.edgeClass==='MORPHOLOGY'?'Derived morphology relation; presentation binding only, not ontology promotion.':e.edgeClass==='STRUCTURE'?'Ordered structure relation from recorded radial facts.':'Source/semantic relation from the frozen local-world graph.')}
function edgeVisible(e){const s=nodeByRef.get(typeof e.source==='object'?e.source.ref:e.source),t=nodeByRef.get(typeof e.target==='object'?e.target.ref:e.target);if(!s||!t||!visible(s)||!visible(t))return false;if(e.edgeClass==='SOURCE'&&!showEvidence)return false;if(e.edgeClass==='SEMANTIC'&&!showEvidence&&category(s)==='evidence'&&category(t)==='evidence')return false;return e.edgeClass==='MORPHOLOGY'||e.edgeClass==='STRUCTURE'||e.relation==='RADIAL_NEXT'||showEvidence||showCoords;}
function draw(){root.selectAll('*').remove();W=innerWidth;H=innerHeight;const center=project({x:0,y:0,z:0}),scale=center.scale;
const shells=(graph.morphology?.shells||[]).slice().sort((a,b)=>a.radialOrder-b.radialOrder);const shellG=root.append('g');shells.forEach(sh=>{const r=+sh.rNorm*scale;const vis=sh.radialOrder<=4?showStructure:showStructure;const circ=shellG.append('circle').attr('cx',center.x).attr('cy',center.y).attr('r',r).attr('class','shell '+(sh.radialOrder>4?'outer':'')).style('display',vis?null:'none');const hit=shellG.append('circle').attr('cx',center.x).attr('cy',center.y).attr('r',r).attr('fill','none').attr('stroke','transparent').attr('stroke-width',14).style('cursor','pointer').style('display',vis?null:'none').on('click',e=>{e.stopPropagation();const n=nodeByRef.get(sh.ref);if(n)showNode(n)});if(showLabels&&showStructure){const ang=-38*Math.PI/180;shellG.append('text').attr('class','shellLabel').attr('x',center.x+Math.cos(ang)*r+7).attr('y',center.y-Math.sin(ang)*r).text(sh.label)}});
const surf=1*scale;root.append('circle').attr('cx',center.x).attr('cy',center.y).attr('r',surf).attr('class','surface').style('display',showStructure||showDisturb?null:'none');
const rkm=graph.morphology?.objectRadiusKm,dkm=graph.morphology?.objectDiameterKm;if(showStructure){root.append('line').attr('x1',center.x).attr('y1',center.y).attr('x2',center.x+surf).attr('y2',center.y).attr('class','dim');if(showLabels)root.append('text').attr('class','shellLabel').attr('x',center.x+surf*.45).attr('y',center.y-6).text(`R ${Number(rkm).toLocaleString('ru-RU')} км`)}
const pos=new Map(nodes.map(n=>[n.ref,project(rawPos(n))]));const eG=root.append('g');links.forEach((e,i)=>{if(!edgeVisible(e))return;const sr=typeof e.source==='object'?e.source.ref:e.source,tr=typeof e.target==='object'?e.target.ref:e.target;const a=pos.get(sr),b=pos.get(tr);if(!a||!b)return;const col=e.edgeClass==='MORPHOLOGY'?'#b99b55':e.edgeClass==='STRUCTURE'?'#d9b84f':e.edgeClass==='SOURCE'?'#497b92':'#55697f';const l=eG.append('line').attr('x1',a.x).attr('y1',a.y).attr('x2',b.x).attr('y2',b.y).attr('stroke',col).attr('class','edge');eG.append('line').attr('x1',a.x).attr('y1',a.y).attr('x2',b.x).attr('y2',b.y).attr('class','edgeHit').on('click',ev=>{ev.stopPropagation();showEdge(e);l.classed('selected',true)})});
const nG=root.append('g');nodes.forEach(n=>{if(!visible(n))return;const p=pos.get(n.ref);if(!p)return;const g=nG.append('g').attr('class','node').on('click',e=>{e.stopPropagation();nG.selectAll('circle').classed('selected',false);g.select('circle').classed('selected',true);showNode(n)});const opacity=category(n)==='disturb'?Math.max(.48,Math.min(1,(p.z+1)/1.6)):.96;g.append('circle').attr('cx',p.x).attr('cy',p.y).attr('r',nodeRadius(n)).attr('fill',color(n)).attr('opacity',opacity).attr('stroke',category(n)==='center'?'#fff2b4':'rgba(255,255,255,.18)').attr('stroke-width',category(n)==='center'?2:1);if(showLabels&&(category(n)==='center'||category(n)==='disturb'||category(n)==='state'||category(n)==='structure'))g.append('text').attr('class','nodeLabel').attr('x',p.x+nodeRadius(n)+4).attr('y',p.y+3).text(n.label||n.ref)});
root.append('circle').attr('cx',center.x).attr('cy',center.y).attr('r',22).attr('class','centerGlow').style('pointer-events','none');if(showLabels)root.append('text').attr('class','nodeLabel').attr('x',center.x+25).attr('y',center.y+4).text('STAR:SUN');
document.getElementById('legend').innerHTML=`центр STAR:SUN · R ${Number(rkm).toLocaleString('ru-RU')} км · D ${Number(dkm).toLocaleString('ru-RU')} км · ${shells.length} слоёв · ${graph.morphology?.surfaceDisturbanceCount||0} возмущений<br>наружная атмосфера: presentation scale only`;
}
async function load(){const r=await fetch(`${SUPA}/rest/v1/rpc/setka_visualization_packet_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_packet_ref:PACKET})});if(!r.ok)throw Error('packet '+r.status);let p=await r.json();if(Array.isArray(p))p=p[0];if(p?.payload)p=p.payload;graph=p.graph||p?.payload?.graph;if(!graph)throw Error('graph absent');nodes=graph.nodes.map(x=>({...x,ref:x.ref}));links=graph.edges.map(x=>({...x}));nodeByRef=new Map(nodes.map(n=>[n.ref,n]));document.getElementById('subtitle').textContent=`${PACKET} · ${nodes.length} nodes · ${links.length} edges · metric-driven frozen body`;document.getElementById('loading').style.display='none';zoom=d3.zoom().scaleExtent([.35,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);draw()}
function toggle(id,key){const b=document.getElementById(id);b.onclick=()=>{window[key]=!window[key];b.classList.toggle('active',window[key]);draw()}}
document.getElementById('structure').onclick=e=>{showStructure=!showStructure;e.currentTarget.classList.toggle('active',showStructure);draw()};document.getElementById('state').onclick=e=>{showState=!showState;e.currentTarget.classList.toggle('active',showState);draw()};document.getElementById('disturb').onclick=e=>{showDisturb=!showDisturb;e.currentTarget.classList.toggle('active',showDisturb);draw()};document.getElementById('coords').onclick=e=>{showCoords=!showCoords;e.currentTarget.classList.toggle('active',showCoords);draw()};document.getElementById('evidence').onclick=e=>{showEvidence=!showEvidence;e.currentTarget.classList.toggle('active',showEvidence);draw()};document.getElementById('labels').onclick=e=>{showLabels=!showLabels;e.currentTarget.classList.toggle('active',showLabels);draw()};document.getElementById('rotate').onclick=()=>{yaw=(yaw+Math.PI/12)%(Math.PI*2);draw()};document.getElementById('reset').onclick=()=>{yaw=0;svg.transition().duration(250).call(zoom.transform,d3.zoomIdentity);draw()};svg.on('click',()=>{card.style.display='none';root.selectAll('.selected').classed('selected',false)});addEventListener('resize',()=>draw());load().catch(e=>{document.getElementById('loading').textContent='load failed · '+e.message;console.error(e)});
</script></body></html>
