2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.28;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.1));let DATA,points,graphEdges,growthEdges,nodeMap=new Map(),indexToNode=[],hubs=new THREE.Group();scene.add(hubs);const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.16;const pointer=new THREE.Vector2();function col(g){const c=new THREE.Color();c.setHSL((.58+g*.11)%1,.72,.58);return c}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return`<div class="row"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}async function load(){const t0=performance.now();const res=await fetch(`${SUPA}/rest/v1/rpc/setka_body_as_grown_frozen_snapshot_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_snapshot_ref:snapshot})});if(!res.ok)throw new Error(`RPC ${res.status}`);DATA=await res.json();if(!DATA.ok)throw new Error(DATA.state||'snapshot failed');build(DATA);sub.textContent=`${DATA.snapshotRef} · ${DATA.grownNodes.toLocaleString()} nodes · frozen scene`;status.textContent=`snapshot ready · ${Math.round(performance.now()-t0)} ms · layout recompute OFF`;loader.style.display='none'}function build(d){const pos=new Float32Array(d.nodes.length*3),cols=new Float32Array(d.nodes.length*3);let maxD=1;for(const v of d.nodes)maxD=Math.max(maxD,+v[5]||0);for(let i=0;i<d.nodes.length;i++){const v=d.nodes[i],o={id:v[0],parent:v[1],type:v[2],generation:+v[3],x:+v[4],degree:+v[5],name:v[6],family:v[7],canonical:!!v[8],pos:new THREE.Vector3(+v[9],+v[10],+v[11])};nodeMap.set(o.id,o);indexToNode[i]=o;const c=col(o.generation),boost=.72+.28*Math.min(1,Math.log1p(o.degree)/Math.log1p(maxD));pos[i*3]=o.pos.x;pos[i*3+1]=o.pos.y;pos[i*3+2]=o.pos.z;cols[i*3]=c.r*boost;cols[i*3+1]=c.g*boost;cols[i*3+2]=c.b*boost}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cols,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.92,sizeAttenuation:true,depthWrite:false}));scene.add(points);const full=[],grow=[];for(const e of d.edges){const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(a&&b)full.push(a.pos.x,a.pos.y,a.pos.z,b.pos.x,b.pos.y,b.pos.z)}graphEdges=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(full,3)),new THREE.LineBasicMaterial({color:0xa978c0,transparent:true,opacity:.065,depthWrite:false}));graphEdges.visible=false;scene.add(graphEdges);for(const o of nodeMap.values()){if(!o.parent)continue;const p=nodeMap.get(o.parent);if(p)grow.push(p.pos.x,p.pos.y,p.pos.z,o.pos.x,o.pos.y,o.pos.z)}growthEdges=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(grow,3)),new THREE.LineBasicMaterial({color:0xb276d2,transparent:true,opacity:.28,depthWrite:false}));scene.add(growthEdges);const top=[...nodeMap.values()].sort((a,b)=>b.degree-a.degree).slice(0,90),geo=new THREE.SphereGeometry(.09,8,6);for(const o of top){const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col(o.generation),transparent:true,opacity:.9,depthWrite:false}));m.position.copy(o.pos);m.userData.nodeId=o.id;hubs.add(m)}fit()}function fit(){const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.15;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}function show(o){title.textContent=o.name;body.innerHTML=row('тип',o.type)+row('семейство',o.family||'—')+row('поколение',o.generation)+row('degree',o.degree)+row('bifurcatio
