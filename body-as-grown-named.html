bsolute;right:8px;top:5px;background:none;border:0;color:var(--muted);font-size:21px}.drawer h3{margin:0 24px 9px 0;font-size:13px}.row{padding:4px 0;border-bottom:1px solid rgba(90,120,160,.14);font-size:10px;line-height:1.4}.k{color:var(--muted)}#status{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;background:rgba(3,10,20,.74);border:1px solid rgba(46,70,100,.65);border-radius:9px;padding:6px 9px;color:#a8bed5;font-size:9px;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.label{position:fixed;z-index:18;pointer-events:none;transform:translate(-50%,-50%);background:rgba(2,8,18,.75);border:1px solid rgba(130,160,200,.35);border-radius:7px;padding:3px 5px;font-size:8px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}.selLabel{border-color:#b7dfff;background:rgba(12,34,58,.92);font-size:9px}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}</style></head><body><div id="app"></div><div class="toolbar"><div class="pill"><b>SETKA · BODY AS GROWN · NAMES</b><small id="subtitle">каждая точка получила имя из паспорта SETKA</small></div><button class="btn active" id="autoBtn">AUTO</button><button class="btn active" id="growthBtn">GROWTH</button><button class="btn" id="graphBtn">GRAPH</button><button class="btn active" id="namesBtn">NAMES</button><button class="btn" id="searchBtn">FIND</button><button class="btn" id="resetBtn">RESET</button></div><div id="searchPanel"><input id="search" placeholder="Название сущности..."></div><div id="results"></div><div id="nodeDrawer" class="drawer closed"><button class="close" id="closeNode">×</button><h3 id="nodeTitle">Сущность</h3><div id="nodeBody"></div></div><div id="status">загрузка именованного тела…</div><div id="loader"><div class="spin"></div><div id="loadText">SETKA сопоставляет точки со своими паспортами…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const SUPABASE='https://gfchgaphzhxufwdhrcis.supabase.co',KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',runRef=new URLSearchParams(location.search).get('run')||null;const app=document.getElementById('app'),status=document.getElementById('status'),subtitle=document.getElementById('subtitle'),loader=document.getElementById('loader'),nodeDrawer=document.getElementById('nodeDrawer'),nodeTitle=document.getElementById('nodeTitle'),nodeBody=document.getElementById('nodeBody'),searchPanel=document.getElementById('searchPanel'),searchInput=document.getElementById('search'),results=document.getElementById('results');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.autoRotate=true;controls.autoRotateSpeed=.28;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.1));let DATA,points,graphEdges,growthEdges,nodeMap=new Map(),indexToNode=[],hubGroup=new THREE.Group(),labels=[],selected=null,namesVisible=true;scene.add(hubGroup);const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.16;const pointer=new THREE.Vector2();function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function h01(s){return(h32(s)%1000000)/1000000}function unit(s){const u=h01(s+'u'),v=h01(s+'v'),z=2*u-1,a=2*Math.PI*v,r=Math.sqrt(Math.max(0,1-z*z));return new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),z)}function col(g){const c=new THREE.Color();c.setHSL((.58+g*.11)%1,.72,.58);return c}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return`<div class="row"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}async function load(){const t0=performance.now(),res=await fetch(`${SUPABASE}/rest/v1/rpc/setka_body_as_grown_scene_v2`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_run_ref:runRef})});if(!res.ok)throw new Error(`RPC ${res.status}: ${await res.text()}`);DATA=await res.json();if(!DATA.ok)throw new Error(DATA.state||'scene failed');build(DATA);subtitle.textContent=`${DATA.namedNodes.toLocaleString()} canonical names · ${DATA.unnamedNodes.toLocaleString()} typed fallbacks`;status.textContent=`ready · ${Math.round(performance.now()-t0)} ms · tap any point to identify`;loader.style.display='none'}function build(d){const byGen=new Map();for(const v of d.nodes){const o={id:v[0],parent:v[1],type:v[2],generation:+v[3],x:+v[4],degree:+v[5],name:v[6],family:v[7],canonical:!!v[8]};nodeMap.set(o.id,o);if(!byGen.has(o.generation))byGen.set(o.generation,[]);byGen.get(o.generation).push(o)}const root=[...nodeMap.values()].find(o=>o.generation===0);if(root)root.pos=new THREE.Vector3(0,0,0);for(const g of [...byGen.keys()].sort((a,b)=>a-b)){if(g===0)continue;for(const o of byGen.get(g)){const p=o.parent?nodeMap.get(o.parent):null;let dir;if(!p||!p.pos||p.pos.lengthSq()<1e-9)dir=unit(o.id);else{const base=p.pos.clone().normalize(),j=unit(o.id),spread=Math.max(.18,.56/(g+.15));dir=base.multiplyScalar(1-spread).add(j.multiplyScalar(spread)).normalize()}o.pos=dir.multiplyScalar(g*3.1+o.x*1.25)}}const pos=new Float32Array(d.nodes.length*3),cols=new Float32Array(d.nodes.length*3);let maxD=1;for(const o of nodeMap.values())maxD=Math.max(maxD,o.degree);for(let i=0;i<d.nodes.length;i++){const o=nodeMap.get(d.nodes[i][0]);indexToNode[i]=o;const c=col(o.generation),boost=.72+.28*Math.min(1,Math.log1p(o.degree)/Math.log1p(maxD));pos[i*3]=o.pos.x;pos[i*3+1]=o.pos.y;pos[i*3+2]=o.pos.z;cols[i*3]=c.r*boost;cols[i*3+1]=c.g*boost;cols[i*3+2]=c.b*boost}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cols,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.92,sizeAttenuation:true,depthWrite:false}));scene.add(points);const full=[],fullC=[];for(const e of d.edges){const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(!a||!b)continue;full.push(a.pos.x,a.pos.y,a.pos.z,b.pos.x,b.pos.y,b.pos.z);const c=new THREE.Color().setHSL(h01(e[2]||e[3]),.45,.43);fullC.push(c.r,c.g,c.b,c.r,c.g,c.b)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(full,3));eg.setAttribute('color',new THREE.Float32BufferAttribute(fullC,3));graphEdges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.055,depthWrite:false}));graphEdges.visible=false;scene.add(graphEdges);const grow=[],growC=[];for(const o of nodeMap.values()){if(!o.parent)continue;const p=nodeMap.get(o.parent);if(!p)continue;grow.push(p.pos.x,p.pos.y,p.pos.z,o.pos.x,o.pos.y,o.pos.z);const c=col(o.generation);growC.push(c.r,c.g,c.b,c.r,c.g,c.b)}const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(grow,3));gg.setAttribute('color',new THREE.Float32BufferAttribute(growC,3));growthEdges=new THREE.LineSegments(gg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.28,depthWrite:false}));scene.add(growthEdges);const sorted=[...nodeMap.values()].sort((a,b)=>b.degree-a.degree),top=sorted.slice(0,30),geo=new THREE.SphereGeometry(.09,8,6);for(const o of sorted.slice(0,Math.max(80,Math.floor(sorted.length*.006)))){const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col(o.generation),transparent:true,opacity:.9,depthWrite:false}));m.position.copy(o.pos);m.userData.nodeId=o.id;hubGroup.add(m)}buildLabels(top);fit()}function buildLabels(top){for(const l of labels)l.el.remove();labels=[];for(const o of top){const el=document.createElement('div');el.className='label';el.textContent=o.name;document.body.appendChild(el);labels.push({el,o})}}function updateLabels(){for(const l of labels){if(!namesVisible){l.el.style.display='none';continue}const p=l.o.pos.clone().project(camera),vis=p.z>-1&&p.z<1;l.el.style.display=vis?'block':'none';if(vis){l.el.style.left=`${(p.x*.5+.5)*innerWidth}px`;l.el.style.top=`${(-p.y*.5+.5)*innerHeight}px`}}}if(selected){let el=document.getElementById('selectedLabel');if(!el){el=document.createElement('div');el.id='selectedLabel';el.className='label selLabel';document.body.appendChild(el)}const p=selected.pos.clone().project(camera),vis=p.z>-1&&p.z<1;el.style.display=vis?'block':'none';if(vis){el.textContent=selected.name;el.style.left=`${(p.x*.5+.5)*innerWidth}px`;el.style.top=`${(-p.y*.5+.5)*innerHeight}px`}}}function fit(){const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.15;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}function focus(o){selected=o;controls.autoRotate=false;document.getElementById('autoBtn').classList.remove('active');controls.target.copy(o.pos);const dir=camera.position.clone().sub(o.pos).normalize();camera.position.copy(o.pos.clone().add(dir.multiplyScalar(2.2)));controls.update();show(o)}function show(o){nodeTitle.textContent=o.name;nodeBody.innerHTML=row('тип',o.type)+row('семейство',o.family||'—')+row('каноническое имя',o.canonical?'да':'нет · fallback')+row('поколение',o.generation)+row('degree',o.degree)+row('bifurcation x',o.x.toFixed(12))+row('masked id',o.id)+row('parent witness',o.parent||'ROOT')+row('позиция','presentation only');nodeDrawer.classList.remove('closed')}function pick(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);let h=raycaster.intersectObjects(hubGroup.children,false);if(h.length){focus(nodeMap.get(h[0].object.userData.nodeId));return}h=raycaster.intersectObject(points,false);if(h.length)focus(indexToNode[h[0].index])}let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(m<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);down=null});function renderSearch(){const q=searchInput.value.trim().toLowerCase();if(!q){results.classList.remove('open');results.innerHTML='';return}const found=[...nodeMap.values()].filter(o=>(o.name+' '+o.type+' '+(o.family||'')).toLowerCase().includes(q)).sort((a,b)=>b.degree-a.degree).slice(0,50);results.innerHTML=found.map(o=>`<div class="result" data-id="${o.id}">${esc(o.name)}<small>${esc(o.type)} · degree ${o.degree} · g${o.generation}</small></div>`).join('');results.classList.toggle('open',found.length>0);for(const el of results.querySelectorAll('.result'))el.onclick=()=>{const o=nodeMap.get(el.dataset.id);results.classList.remove('open');searchPanel.classList.remove('open');focus(o)}}searchInput.oninput=renderSearch;document.getElementById('searchBtn').onclick=()=>{searchPanel.classList.toggle('open');if(searchPanel.classList.contains('open'))setTimeout(()=>searchInput.focus(),50);else results.classList.remove('open')};document.getElementById('autoBtn').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('growthBtn').onclick=e=>{growthEdges.visible=!growthEdges.visible;e.currentTarget.classList.toggle('active',growthEdges.visible)};document.getElementById('graphBtn').onclick=e=>{graphEdges.visible=!graphEdges.visible;e.currentTarget.classList.toggle('active',graphEdges.visible)};document.getElementById('namesBtn').onclick=e=>{namesVisible=!namesVisible;e.currentTarget.classList.toggle('active',namesVisible)};document.getElementById('resetBtn').onclick=()=>{selected=null;const el=document.getElementById('selectedLabel');if(el)el.remove();fit()};document.getElementById('closeNode').onclick=()=>nodeDrawer.classList.add('closed');window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();updateLabels();renderer.render(scene,camera)}animate();load().catch(e=>{console.error(e);document.getElementById('loadText').textContent='Ошибка: '+e.message;status.textContent='load failed'});</script></body></html>
