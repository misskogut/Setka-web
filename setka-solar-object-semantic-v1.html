<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SETKA · Solar Object</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040912;color:#eef6ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}svg{width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill,.btn,.card{background:rgba(5,13,25,.93);border:1px solid #31455d;border-radius:11px;backdrop-filter:blur(8px)}.pill{padding:8px 10px;flex:1 1 430px;min-width:0}.pill b{font-size:12px}.pill small{display:block;font-size:9px;color:#93a9c0;margin-top:2px}.btn{padding:9px 10px;color:#eaf4ff;font:9px inherit}.btn.active{border-color:#d9ac48;background:rgba(88,61,17,.92)}.btn.structure.active{border-color:#ffd45e;background:rgba(80,59,14,.92)}.btn.state.active{border-color:#45d5ef;background:rgba(10,57,72,.92)}.btn.disturb.active{border-color:#ff7a3d;background:rgba(82,31,13,.92)}.btn.source.active{border-color:#66d9d2;background:rgba(12,61,60,.92)}.card{position:fixed;z-index:12;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(480px,calc(100vw - 16px));max-height:50vh;overflow:auto;padding:12px;display:none}.card h3{font-size:12px;margin:0 0 7px}.row{font-size:9px;line-height:1.45;padding:5px 0;border-bottom:1px solid rgba(110,140,170,.15);word-break:break-word}.muted{color:#91a8bf}.centerBadge{color:#ffd45e}.legend{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:9;background:rgba(5,13,25,.86);border:1px solid #31455d;border-radius:9px;padding:8px;font-size:8px;color:#a9bfd3;pointer-events:none;line-height:1.55}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.nodeLabel{font-size:8px;fill:#f5f8fb;paint-order:stroke;stroke:#050b14;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.linkHit{stroke:transparent;stroke-width:16;cursor:pointer}.link{stroke-width:1.35;opacity:.62}.selected circle{stroke:#fff;stroke-width:2.3}.selectedEdge{stroke-width:3.5!important;opacity:1!important}@media(max-width:760px){.pill small{display:none}.card{max-height:44vh}.legend{font-size:7px;max-width:55vw}.nodeLabel{font-size:7px}.btn{padding:8px 8px;font-size:8px}}
</style></head><body><svg id="g"></svg><div class="top"><div class="pill"><b>SETKA · SOLAR OBJECT · LOCAL WORLD</b><small id="subtitle">loading…</small></div><button class="btn structure active" id="structure">STRUCTURE</button><button class="btn state active" id="state">STATE</button><button class="btn disturb active" id="disturb">DISTURB</button><button class="btn source" id="source">SOURCE</button><button class="btn active" id="labels">LABELS</button><button class="btn" id="reset">RESET</button></div><div class="legend"><span class="dot" style="background:#ffd45e"></span>структура / слои &nbsp; <span class="dot" style="background:#45d5ef"></span>состояние &nbsp; <span class="dot" style="background:#ff7a3d"></span>возмущения<br>центр задаёт semantic contract; геометрию узлов renderer не получает</div><div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div></div><script>
const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co';
const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';
const qs=new URLSearchParams(location.search);const PACKET=qs.get('packet')||'VIS-LOCAL-WORLD-09547904B475422F';
const svg=d3.select('#g'),W=innerWidth,H=innerHeight;let root=svg.append('g'),sim,labelsOn=true,structureOn=true,stateOn=true,disturbOn=true,sourceOn=false;const card=document.getElementById('card'),cardTitle=document.getElementById('cardTitle'),cardBody=document.getElementById('cardBody');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function row(k,v){return `<div class="row"><span class="muted">${esc(k)}</span><br>${typeof v==='object'?`<pre style="white-space:pre-wrap;margin:4px 0 0">${esc(JSON.stringify(v,null,2))}</pre>`:esc(v)}</div>`}
function roleColor(d){const r=d.semanticRole||'';if(r==='CENTRAL_OBJECT')return '#ffd45e';if(r.includes('STRUCTURE'))return '#e7b94e';if(r.includes('STATE'))return '#45d5ef';if(r.includes('DISTURBANCE'))return '#ff7a3d';if(r.includes('ACTIVITY_COORDINATE'))return '#b891ff';if(d.class==='SOURCE')return '#66d9d2';if(d.class==='WORLD_EVENT')return '#ff9b5a';return '#60758c'}
function edgeColor(d){if(d.edgeClass==='SOURCE')return '#3e7483';if(d.edgeClass==='STRUCTURE'||d.relation==='RADIAL_NEXT'||String(d.relation).includes('STRUCTURE'))return '#d8ab43';if(String(d.relation).includes('STATE'))return '#3fc4de';if(String(d.relation).includes('DISTURBANCE'))return '#ed6e35';if(d.relation==='COORDINATE_OF')return '#8f72cf';return '#9c8b64'}
function whyNode(d,center){const r=d.semanticRole||'';if(d.ref===center)return 'Центральный объект задан смысловым контрактом: STAR:SUN. Это семантический центр локального мира, не вручную заданная пространственная координата.';if(r==='STRUCTURE_GROUP')return 'Сектор создан из фактов, помеченных контрактом как форма/структура объекта.';if(r==='STATE_GROUP')return 'Сектор создан из скалярных метрик, интерпретируемых как состояние центрального объекта.';if(r==='DISTURBANCE_GROUP')return 'Сектор собирает текущие наблюдаемые возмущения объекта из NOAA-пакета.';if(r==='STRUCTURE_ELEMENT')return 'Фактический структурный элемент из NASA reference packet; порядок слоя приходит из radialOrder.';if(r==='STRUCTURE_METRIC')return 'Фактический параметр формы/размера, отнесённый контрактом к структуре.';if(r==='STATE_METRIC')return 'Фактическая метрика объекта, отнесённая контрактом к состоянию.';if(r==='DISTURBANCE')return 'Фактическое текущее наблюдение NOAA, отнесённое к возмущениям центрального объекта.';if(r.includes('COORDINATE'))return 'Координатное представление извлечено из фактического поля владельца узла; координата не выдумана renderer-ом.';if(d.class==='SOURCE')return 'Источник provenance. Не является частью физической анатомии Солнца.';return 'Узел сохранён из immutable WORLD EVENT packet; смысловая роль не назначена контрактом.'}
function showNode(d,center){card.style.display='block';cardTitle.innerHTML=(d.ref===center?'<span class="centerBadge">★ STAR:SUN</span> · ':'')+esc(d.label||d.ref);cardBody.innerHTML=row('class',d.class)+row('semanticRole',d.semanticRole||'UNCLASSIFIED')+row('ref',d.ref)+row('payload',d.payload)+row('WHY HERE',whyNode(d,center))}
function showEdge(d){card.style.display='block';cardTitle.textContent=d.relation||'EDGE';cardBody.innerHTML=row('edgeClass',d.edgeClass)+row('source',d.source.id||d.source)+row('target',d.target.id||d.target)+row('epistemicStatus',d.epistemicStatus)+row('WHY HERE',d.relation==='RADIAL_NEXT'?'Связь получена из порядкового radialOrder фактических слоёв; это топологический порядок, не нарисованная физическая геометрия.':d.edgeClass==='SOURCE'?'Provenance-связь с исходным источником.':'Семантическая связь получена из локального контракта или структуры WORLD EVENT; глобальная онтология не менялась.')}
function visibleNode(d){const r=d.semanticRole||'';if(d.class==='SOURCE'||d.edgeClass==='SOURCE')return sourceOn;if(r.includes('STRUCTURE'))return structureOn;if(r.includes('STATE'))return stateOn;if(r.includes('DISTURBANCE')||r.includes('ACTIVITY_COORDINATE'))return disturbOn;if(d.class==='SOURCE'||d.class==='FACT'&&r==='UNCLASSIFIED'||d.class==='STRUCTURED_FACT'&&r==='UNCLASSIFIED'||d.class==='VALUE_ITEM'&&r==='UNCLASSIFIED'||d.class==='COLLECTION'&&r==='UNCLASSIFIED')return sourceOn;return true}
function visibleEdge(d){if(d.edgeClass==='SOURCE')return sourceOn;const s=d.source.semanticRole||'',t=d.target.semanticRole||'';if((s.includes('STRUCTURE')||t.includes('STRUCTURE')||d.edgeClass==='STRUCTURE')&&!structureOn)return false;if((s.includes('STATE')||t.includes('STATE'))&&!stateOn)return false;if((s.includes('DISTURBANCE')||t.includes('DISTURBANCE')||s.includes('ACTIVITY_COORDINATE')||t.includes('ACTIVITY_COORDINATE'))&&!disturbOn)return false;return true}
async function load(){const r=await fetch(`${SUPA}/rest/v1/rpc/setka_visualization_packet_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_packet_ref:PACKET})});if(!r.ok)throw Error('packet '+r.status);let p=await r.json();if(Array.isArray(p))p=p[0];if(p?.payload)p=p.payload;const graph=p.graph||p?.payload?.graph;if(!graph)throw Error('graph absent');const center=graph.center?.ref;const summary=graph.semanticSummary||{};document.getElementById('subtitle').textContent=`${PACKET} · ${graph.nodes.length} nodes · ${graph.edges.length} edges · center ${center||'none'} · S ${summary.structureMembers||0} / M ${summary.stateMembers||0} / D ${summary.disturbanceMembers||0}`;
const nodes=graph.nodes.map(x=>({...x,id:x.ref})),links=graph.edges.map((x,i)=>({...x,id:'e'+i}));const byId=new Map(nodes.map(n=>[n.id,n]));links.forEach(l=>{l.source=byId.get(l.source)||l.source;l.target=byId.get(l.target)||l.target});
const centerNode=byId.get(center);if(centerNode){centerNode.fx=W/2;centerNode.fy=H/2}
const zoom=d3.zoom().scaleExtent([.18,9]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);
const linkG=root.append('g'),nodeG=root.append('g'),labelG=root.append('g');const linksVis=linkG.selectAll('.link').data(links).enter().append('line').attr('class','link').attr('stroke',edgeColor);const linksHit=linkG.selectAll('.linkHit').data(links).enter().append('line').attr('class','linkHit').on('click',(e,d)=>{e.stopPropagation();linksVis.classed('selectedEdge',x=>x===d);nodeSel.classed('selected',false);showEdge(d)});
const nodeSel=nodeG.selectAll('.node').data(nodes).enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(d.id===center)return;if(!e.active)sim.alphaTarget(.24).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{if(d.id===center)return;d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(d.id===center)return;if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null})).on('click',(e,d)=>{e.stopPropagation();nodeSel.classed('selected',x=>x===d);linksVis.classed('selectedEdge',false);showNode(d,center)});
nodeSel.append('circle').attr('r',d=>d.id===center?18:d.class==='SEMANTIC_GROUP'?13:d.semanticRole==='STRUCTURE_ELEMENT'?9:d.semanticRole==='DISTURBANCE'?8:d.class==='COORDINATE'?5:7).attr('fill',roleColor).attr('opacity',.96);nodeSel.append('circle').attr('r',d=>d.id===center?31:d.class==='SEMANTIC_GROUP'?21:13).attr('fill','transparent').attr('stroke',d=>d.id===center?'#ffd45e':d.class==='SEMANTIC_GROUP'?roleColor(d):'transparent').attr('stroke-width',1.1).attr('opacity',.5);
const labels=labelG.selectAll('.nodeLabel').data(nodes).enter().append('text').attr('class','nodeLabel').text(d=>d.label||d.ref);
sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.relation==='RADIAL_NEXT'?55:d.relation==='COORDINATE_OF'?38:d.edgeClass==='SOURCE'?125:d.source.class==='SEMANTIC_GROUP'||d.target.class==='SEMANTIC_GROUP'?88:74).strength(d=>d.relation==='RADIAL_NEXT'?.92:d.edgeClass==='SOURCE'?.18:.62)).force('charge',d3.forceManyBody().strength(d=>d.id===center?-720:d.class==='SEMANTIC_GROUP'?-430:d.class==='COORDINATE'?-90:-220)).force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide().radius(d=>d.id===center?55:d.class==='SEMANTIC_GROUP'?38:d.class==='COORDINATE'?13:25)).on('tick',()=>{if(centerNode){centerNode.fx=W/2;centerNode.fy=H/2}linksVis.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);linksHit.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);labels.attr('x',d=>d.x+(d.id===center?22:10)).attr('y',d=>d.y+3)});
function applyFilters(){nodeSel.style('display',d=>visibleNode(d)?null:'none');labels.style('display',d=>labelsOn&&visibleNode(d)?null:'none');linksVis.style('display',d=>visibleEdge(d)?null:'none');linksHit.style('display',d=>visibleEdge(d)?null:'none')}
function bind(id,key){document.getElementById(id).onclick=e=>{window[key]=!window[key]}}
document.getElementById('structure').onclick=e=>{structureOn=!structureOn;e.currentTarget.classList.toggle('active',structureOn);applyFilters()};document.getElementById('state').onclick=e=>{stateOn=!stateOn;e.currentTarget.classList.toggle('active',stateOn);applyFilters()};document.getElementById('disturb').onclick=e=>{disturbOn=!disturbOn;e.currentTarget.classList.toggle('active',disturbOn);applyFilters()};document.getElementById('source').onclick=e=>{sourceOn=!sourceOn;e.currentTarget.classList.toggle('active',sourceOn);applyFilters()};document.getElementById('labels').onclick=e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('active',labelsOn);applyFilters()};document.getElementById('reset').onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);svg.on('click',()=>{card.style.display='none';nodeSel.classed('selected',false);linksVis.classed('selectedEdge',false)});applyFilters()}
load().catch(e=>{document.getElementById('subtitle').textContent='load failed · '+e.message;console.error(e)});
</script></body></html>
