<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SETKA · Local World</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040912;color:#eef6ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}svg{width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill,.btn,.card{background:rgba(5,13,25,.92);border:1px solid #31455d;border-radius:11px;backdrop-filter:blur(8px)}.pill{padding:8px 10px;flex:1 1 380px;min-width:0}.pill b{font-size:12px}.pill small{display:block;font-size:9px;color:#93a9c0;margin-top:2px}.btn{padding:9px 11px;color:#eaf4ff;font:10px inherit}.btn.active{border-color:#d9ac48;background:rgba(88,61,17,.92)}.card{position:fixed;z-index:12;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(460px,calc(100vw - 16px));max-height:48vh;overflow:auto;padding:12px;display:none}.card h3{font-size:12px;margin:0 0 7px}.row{font-size:9px;line-height:1.45;padding:5px 0;border-bottom:1px solid rgba(110,140,170,.15);word-break:break-word}.muted{color:#91a8bf}.centerBadge{color:#ffd45e}.legend{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:9;background:rgba(5,13,25,.83);border:1px solid #31455d;border-radius:9px;padding:8px;font-size:8px;color:#a9bfd3;pointer-events:none}.nodeLabel{font-size:9px;fill:#f5f8fb;paint-order:stroke;stroke:#050b14;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.edgeLabel{font-size:7px;fill:#8fa7be;pointer-events:none}.node circle{cursor:pointer}.linkHit{stroke:transparent;stroke-width:16;cursor:pointer}.link{stroke-width:1.4;opacity:.64}.selected circle{stroke:#fff;stroke-width:2.2}.selectedEdge{stroke-width:3.4!important;opacity:1!important}@media(max-width:760px){.pill small{display:none}.card{max-height:42vh}.legend{display:none}.nodeLabel{font-size:8px}}
</style></head><body><svg id="g"></svg><div class="top"><div class="pill"><b>SETKA · GENERIC LOCAL WORLD</b><small id="subtitle">loading…</small></div><button class="btn active" id="labels">LABELS</button><button class="btn active" id="semantic">SEMANTIC</button><button class="btn active" id="source">SOURCE</button><button class="btn" id="reset">RESET</button></div><div class="legend">центр выбирает SETKA по топологии · тап по узлу/ребру = карточка</div><div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div></div><script>
const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co';
const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';
const qs=new URLSearchParams(location.search);const PACKET=qs.get('packet')||'VIS-LOCAL-WORLD-0C48658ADC0F48A5';
const svg=d3.select('#g'), W=innerWidth,H=innerHeight;let root=svg.append('g');let sim,labelsOn=true,semanticOn=true,sourceOn=true;const card=document.getElementById('card'),cardTitle=document.getElementById('cardTitle'),cardBody=document.getElementById('cardBody');
const color={SUBJECT:'#ffd45e',WORLD_EVENT:'#ff934d',SOURCE:'#66d9d2',COLLECTION:'#9f8cff',OBSERVATION_ITEM:'#f5cf79',VALUE_ITEM:'#d9c58b',FACT:'#6c8096',STRUCTURED_FACT:'#89a2ba'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function row(k,v){return `<div class="row"><span class="muted">${esc(k)}</span><br>${typeof v==='object'?`<pre style="white-space:pre-wrap;margin:4px 0 0">${esc(JSON.stringify(v,null,2))}</pre>`:esc(v)}</div>`}
function showNode(d,center){card.style.display='block';cardTitle.innerHTML=(d.ref===center?'<span class="centerBadge">★ CENTER</span> · ':'')+esc(d.label||d.ref);cardBody.innerHTML=row('class',d.class)+row('ref',d.ref)+row('payload',d.payload)+row('WHY HERE',d.ref===center?'Выбран SETKA как узел с максимальной ненормированной степенью графа среди не-evidence узлов.':'Существует потому, что этот узел извлечён из immutable WORLD EVENT packet универсальным packet-structure decomposer.')}
function showEdge(d){card.style.display='block';cardTitle.textContent=d.relation||'EDGE';cardBody.innerHTML=row('edgeClass',d.edgeClass)+row('source',d.source.id||d.source)+row('target',d.target.id||d.target)+row('epistemicStatus',d.epistemicStatus)+row('WHY HERE',d.edgeClass==='SOURCE'?'Связь provenance/source из исходного packet.':'Связь получена из структуры WORLD EVENT и локального фактического графа; глобальный канон не менялся.')}
function edgeColor(d){return d.edgeClass==='SOURCE'?'#4e8294':'#c39a4b'}
async function load(){const r=await fetch(`${SUPA}/rest/v1/rpc/setka_visualization_packet_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_packet_ref:PACKET})});if(!r.ok)throw Error('packet '+r.status);let p=await r.json();if(Array.isArray(p))p=p[0];if(p?.payload)p=p.payload;const graph=p.graph||p?.payload?.graph;if(!graph)throw Error('graph absent');const center=graph.center?.ref;document.getElementById('subtitle').textContent=`${PACKET} · ${graph.nodes.length} nodes · ${graph.edges.length} edges · center: ${center||'none'}`;
const nodes=graph.nodes.map(x=>({...x,id:x.ref})),links=graph.edges.map((x,i)=>({...x,id:'e'+i}));
const zoom=d3.zoom().scaleExtent([.2,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);
const linkG=root.append('g'),nodeG=root.append('g'),labelG=root.append('g');
const linksVis=linkG.selectAll('.link').data(links).enter().append('line').attr('class','link').attr('stroke',edgeColor);
const linksHit=linkG.selectAll('.linkHit').data(links).enter().append('line').attr('class','linkHit').on('click',(e,d)=>{e.stopPropagation();linksVis.classed('selectedEdge',x=>x===d);nodeSel.classed('selected',false);showEdge(d)});
const nodeSel=nodeG.selectAll('.node').data(nodes).enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null})).on('click',(e,d)=>{e.stopPropagation();nodeSel.classed('selected',x=>x===d);linksVis.classed('selectedEdge',false);showNode(d,center)});
nodeSel.append('circle').attr('r',d=>d.ref===center?12:d.class==='OBSERVATION_ITEM'?8:9).attr('fill',d=>color[d.class]||'#b7c6d6').attr('opacity',.96);
nodeSel.append('circle').attr('r',d=>d.ref===center?22:15).attr('fill','transparent').attr('stroke',d=>d.ref===center?'#ffd45e':'transparent').attr('stroke-width',1.2).attr('opacity',.5);
const labels=labelG.selectAll('.nodeLabel').data(nodes).enter().append('text').attr('class','nodeLabel').text(d=>d.label||d.ref);
sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.edgeClass==='SOURCE'?105:85).strength(.65)).force('charge',d3.forceManyBody().strength(-280)).force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide().radius(d=>d.ref===center?44:28)).on('tick',()=>{linksVis.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);linksHit.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);labels.attr('x',d=>d.x+12).attr('y',d=>d.y+3)});
function applyFilters(){linksVis.style('display',d=>(d.edgeClass==='SOURCE'?!sourceOn:!semanticOn)?'none':null);linksHit.style('display',d=>(d.edgeClass==='SOURCE'?!sourceOn:!semanticOn)?'none':null);labels.style('display',labelsOn?null:'none')}
document.getElementById('labels').onclick=e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('active',labelsOn);applyFilters()};document.getElementById('semantic').onclick=e=>{semanticOn=!semanticOn;e.currentTarget.classList.toggle('active',semanticOn);applyFilters()};document.getElementById('source').onclick=e=>{sourceOn=!sourceOn;e.currentTarget.classList.toggle('active',sourceOn);applyFilters()};document.getElementById('reset').onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);svg.on('click',()=>{card.style.display='none';nodeSel.classed('selected',false);linksVis.classed('selectedEdge',false)});
}
load().catch(e=>{document.getElementById('subtitle').textContent='load failed · '+e.message;console.error(e)});
</script></body></html>
