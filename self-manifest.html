<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>SETKA · Atemporal Self Manifest</title>
<style>
:root{color-scheme:dark;--bg:#030814;--panel:rgba(5,12,24,.9);--line:#304965;--text:#eef6ff;--muted:#9bb0c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.toolbar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px;align-items:center;pointer-events:none}.toolbar>*{pointer-events:auto}.pill,.btn{background:rgba(4,12,24,.82);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:9px 9px;font:10px inherit;cursor:pointer}.btn.active{border-color:#7ba7d8;background:rgba(24,48,75,.92)}
.drawer{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(10px);box-shadow:0 16px 46px rgba(0,0,0,.34);overflow:auto;transition:transform .2s ease,opacity .2s ease}.drawer.closed{opacity:0;pointer-events:none}#infoDrawer{left:8px;top:66px;width:min(470px,calc(100vw - 16px));max-height:58vh;padding:14px}#infoDrawer.closed{transform:translateY(-120%)}#nodeDrawer{right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(430px,calc(100vw - 16px));max-height:44vh;padding:14px}#nodeDrawer.closed{transform:translateY(120%)}.close{position:absolute;right:8px;top:5px;background:none;border:0;color:var(--muted);font-size:21px}.drawer h3{margin:0 24px 9px 0;font-size:13px}.row{padding:4px 0;border-bottom:1px solid rgba(90,120,160,.14);font-size:10px;line-height:1.4}.k{color:var(--muted)}
#status{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;background:rgba(3,10,20,.72);border:1px solid rgba(46,70,100,.65);border-radius:9px;padding:6px 9px;color:#a8bed5;font-size:9px;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.nodeLabel{position:fixed;z-index:18;pointer-events:none;transform:translate(-50%,-50%);background:rgba(2,8,18,.68);border:1px solid rgba(130,160,200,.35);border-radius:7px;padding:3px 5px;font-size:8px;white-space:nowrap;backdrop-filter:blur(5px);text-shadow:0 1px 3px #000}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toolbar"><div class="pill"><b>SETKA · SELF MANIFEST</b><small id="subtitle">single-state self organization</small></div><button class="btn" id="infoBtn">INFO</button><button class="btn active" id="autoBtn">AUTO</button><button class="btn active" id="edgeBtn">EDGES</button><button class="btn active" id="labelBtn">LABELS</button><button class="btn" id="resetBtn">RESET</button></div>
<div id="infoDrawer" class="drawer closed"><button class="close">×</button><h3>Эксперимент</h3><div id="infoBody"></div></div>
<div id="nodeDrawer" class="drawer closed"><button class="close">×</button><h3 id="nodeTitle">Узел</h3><div id="nodeBody"></div></div>
<div id="status">загрузка единого слепка…</div><div id="loader"><div class="spin"></div><div id="loadText">SETKA проявляет текущую форму…</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const SUPABASE='https://gfchgaphzhxufwdhrcis.supabase.co';const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';const sceneRef=new URLSearchParams(location.search).get('scene')||null;
const app=document.getElementById('app'),status=document.getElementById('status'),subtitle=document.getElementById('subtitle'),loader=document.getElementById('loader'),loadText=document.getElementById('loadText'),infoDrawer=document.getElementById('infoDrawer'),nodeDrawer=document.getElementById('nodeDrawer'),infoBody=document.getElementById('infoBody'),nodeBody=document.getElementById('nodeBody'),nodeTitle=document.getElementById('nodeTitle');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.025);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,200);camera.position.set(3,2,8);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.enablePan=true;controls.autoRotate=true;controls.autoRotateSpeed=.38;controls.minDistance=.5;controls.maxDistance=80;scene.add(new THREE.AmbientLight(0xffffff,1.1));
let DATA,points,links,nodeMap=new Map(),hubGroup=new THREE.Group(),labels=[],labelsVisible=true;scene.add(hubGroup);const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.12;const pointer=new THREE.Vector2();
function hash01(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ((h>>>0)%100000)/100000}function colorFor(s,l=.55){const c=new THREE.Color();c.setHSL(hash01(s),.72,l);return c}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return `<div class="row"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}
async function load(){const t0=performance.now();const res=await fetch(`${SUPABASE}/rest/v1/rpc/setka_atemporal_self_manifest_scene_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_scene_ref:sceneRef})});if(!res.ok)throw new Error(`RPC ${res.status}: ${await res.text()}`);DATA=await res.json();if(!DATA.ok)throw new Error(DATA.state||'scene failed');build(DATA);const ms=Math.round(performance.now()-t0);subtitle.textContent=`${DATA.sceneRef} · ${DATA.nodes.length.toLocaleString()} nodes · ${DATA.links.length.toLocaleString()} edges`;status.textContent=`self manifest ready · browser ${ms} ms · server ${DATA.serverBuildMs} ms`;loader.style.display='none'}
function build(d){const n=d.nodes.length,pos=new Float32Array(n*3),cols=new Float32Array(n*3);let maxDegree=1;for(const v of d.nodes)maxDegree=Math.max(maxDegree,+v[4]||0);for(let i=0;i<n;i++){const v=d.nodes[i],o={id:v[0],label:v[1],domain:v[2],prefix:v[3],degree:+v[4],x:+v[5],y:+v[6],z:+v[7],nd:v[8]};nodeMap.set(o.id,o);const c=colorFor(o.domain,.38+.28*Math.min(1,Math.log1p(o.degree)/Math.log1p(maxDegree)));pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(cols,3));points=new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.92,sizeAttenuation:true,depthWrite:false}));scene.add(points);
const ep=new Float32Array(d.links.length*6),ec=new Float32Array(d.links.length*6);let p=0;for(const e of d.links){const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(!a||!b)continue;const c=colorFor(e[2],.46);ep[p]=a.x;ec[p++]=c.r;ep[p]=a.y;ec[p++]=c.g;ep[p]=a.z;ec[p++]=c.b;ep[p]=b.x;ec[p++]=c.r;ep[p]=b.y;ec[p++]=c.g;ep[p]=b.z;ec[p++]=c.b}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.BufferAttribute(ep,3));eg.setAttribute('color',new THREE.BufferAttribute(ec,3));links=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.09,depthWrite:false}));scene.add(links);
const sorted=[...nodeMap.values()].sort((a,b)=>b.degree-a.degree),threshold=sorted[Math.min(sorted.length-1,Math.floor(sorted.length*.01))]?.degree||16,sphereGeo=new THREE.SphereGeometry(.065,8,6);for(const o of sorted){if(o.degree<threshold)break;const c=colorFor(o.domain,.62),m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.86,depthWrite:false}));m.position.set(o.x,o.y,o.z);m.userData.nodeId=o.id;hubGroup.add(m)}buildLabels(sorted.slice(0,14));fillInfo(d);fitCamera()}
function buildLabels(top){for(const x of labels)x.el.remove();labels=[];for(const o of top){const el=document.createElement('div');el.className='nodeLabel';el.textContent=`${o.label} · ${o.degree}`;document.body.appendChild(el);labels.push({el,pos:new THREE.Vector3(o.x,o.y,o.z)})}}
function updateLabels(){for(const x of labels){if(!labelsVisible){x.el.style.display='none';continue}const p=x.pos.clone().project(camera),vis=p.z>-1&&p.z<1;x.el.style.display=vis?'block':'none';if(vis){x.el.style.left=`${(p.x*.5+.5)*innerWidth}px`;x.el.style.top=`${(-p.y*.5+.5)*innerHeight}px`}}}
function fillInfo(d){const m=d.meta||{},c=m.coverage||{},s=m.selfOrganization||{},dim=m.dimensionAssessment||{};infoBody.innerHTML=row('scene',d.sceneRef)+row('режим',m.timeMode)+row('snapshot',m.snapshotAt)+row('узлы',c.nodes)+row('связи',c.edges)+row('unclassified',c.unclassified)+row('метод',s.method)+row('итерации',s.iterations)+row('restart',s.restart)+row('видимые оси',(s.visibleProjectionAxes||[]).join(', '))+row('axis stress',(s.axisStress||[]).map(x=>Number(x).toFixed(4)).join(' · '))+row('intrinsic dimension',dim.intrinsicDimension)+row('важно','Положение не использует доменную круговую раскладку, историю роста или сферические органы. Цвет — только известная классификация; геометрия получена из текущей топологии графа.')}
function fitCamera(){const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.25;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.28,c.z+d);controls.update()}
function showNode(o){if(!o)return;nodeTitle.textContent=o.label;nodeBody.innerHTML=row('domain',o.domain)+row('type',o.prefix)+row('degree',o.degree)+row('projection x/y/z',`${o.x.toFixed(4)} / ${o.y.toFixed(4)} / ${o.z.toFixed(4)}`)+row('6D manifest channels',JSON.stringify(o.nd));nodeDrawer.classList.remove('closed')}
function pick(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects(hubGroup.children,false);if(hits.length){showNode(nodeMap.get(hits[0].object.userData.nodeId));return}hits=raycaster.intersectObject(points,false);if(hits.length)showNode(nodeMap.get(DATA.nodes[hits[0].index][0]))}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(moved<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);down=null});function animate(){requestAnimationFrame(animate);controls.update();updateLabels();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('infoBtn').onclick=()=>infoDrawer.classList.toggle('closed');document.querySelector('#infoDrawer .close').onclick=()=>infoDrawer.classList.add('closed');document.querySelector('#nodeDrawer .close').onclick=()=>nodeDrawer.classList.add('closed');document.getElementById('autoBtn').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('edgeBtn').onclick=e=>{links.visible=!links.visible;e.currentTarget.classList.toggle('active',links.visible)};document.getElementById('labelBtn').onclick=e=>{labelsVisible=!labelsVisible;e.currentTarget.classList.toggle('active',labelsVisible)};document.getElementById('resetBtn').onclick=fitCamera;
load().catch(err=>{console.error(err);loadText.textContent='Ошибка: '+err.message;status.textContent='scene load failed'});
</script></body></html>
