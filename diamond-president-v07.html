function versions(){return D?.timeMachine?.checkpoints||[]}function renderBlueprint(){let tm=D.timeMachine;$('#checkpointChip').textContent='CHECKPOINT · '+(tm.activeCheckpoint||'—');$('#bpVersion').innerHTML=versions().map(v=>`<option value="${esc(v.checkpoint)}" ${v.checkpoint===tm.activeCheckpoint?'selected':''}>${esc(v.checkpoint)}</option>`).join('');$('#simCheckpoint').innerHTML=$('#bpVersion').innerHTML;let floors=D.access.floors||[];$('#floorPlans').innerHTML=floors.map((f,i)=>{let cs=D.access.cabinets.filter(c=>c.floor_key===f.floor_key),roles=D.access.roles.filter(r=>r.floorKey===f.floor_key);return `<article class="floorPlan ${f.floor_key==='president'?'root':''}" data-floor="${esc(f.floor_key)}"><div class="floorPlanHead"><div class="floorNo">${i===0?'ROOT':'L'+i}</div><div><div class="floorName">${esc(dyn(f.title_key))}</div><div class="address">HQ / ${esc(f.floor_key)}</div><div class="mini">${esc(dyn(f.description_key))}</div></div><span class="tag">${esc(t('door.'+f.door_state))}</span></div><div class="roomsPlan">${cs.map(c=>`<div class="cabinetPlan" data-cabinet="${esc(c.cabinet_key)}"><b>${esc(dyn(c.title_key))}</b><div class="address">HQ / ${esc(f.floor_key)} / ${esc(c.cabinet_key)}</div><div class="mini">${esc(dyn(c.description_key))}</div><div class="mini">${roles.filter(r=>r.cabinetKey===c.cabinet_key).map(r=>dyn(r.titleKey)).join(' · ')||'—'}</div><div class="row" style="margin-top:7px"><button class="secondary" data-open-cabinet="${esc(c.cabinet_key)}">OPEN</button><button data-test-type="cabinet" data-test-key="${esc(c.cabinet_key)}">TEST</button></div></div>`).join('')}</div><div class="row" style="margin-top:7px"><button class="secondary" data-test-type="floor" data-test-key="${esc(f.floor_key)}">TEST FLOOR</button></div></article>`}).join('');let drafts=D.blueprint?.draftItems||[];$('#draftItems').innerHTML=drafts.length?drafts.map(x=>`<div class="draftItem"><div><b>${esc(x.title)}</b><div class="address">DRAFT / ${esc(x.item_type)} / ${esc(x.parent_key||'root')}</div></div><button class="ghost" data-remove-draft="${esc(x.draft_key)}">×</button></div>`).join(''):'<div class="mini">—</div>';let parents=['<option value="">ROOT</option>',...floors.map(f=>`<option value="${esc(f.floor_key)}">FLOOR · ${esc(dyn(f.title_key))}</option>`),...D.access.cabinets.map(c=>`<option value="${esc(c.cabinet_key)}">CABINET · ${esc(dyn(c.title_key))}</option>`),...drafts.map(x=>`<option value="${esc(x.draft_key)}">DRAFT · ${esc(x.title)}</option>`)];$('#draftParent').innerHTML=parents.join('');$$('[data-test-type]').forEach(b=>b.onclick=()=>selectTest(b.dataset.testType,b.dataset.testKey));$$('[data-open-cabinet]').forEach(b=>b.onclick=()=>{tab('hq');setTimeout(()=>document.querySelector(`[data-hq-cabinet="${CSS.escape(b.dataset.openCabinet)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),40)});$$('[data-remove-draft]').forEach(b=>b.onclick=async()=>{await call('blueprint_remove_draft',{draftKey:b.dataset.removeDraft});await load()})}
function targetOptions(type){if(type==='headquarters')return [{k:'',n:'SETKA HQ'}];if(type==='floor')return D.access.floors.map(x=>({k:x.floor_key,n:dyn(x.title_key)}));if(type==='cabinet')return D.access.cabinets.map(x=>({k:x.cabinet_key,n:dyn(x.title_key)}));if(type==='block')return D.architecture.nodes.map(x=>({k:x.node_key,n:dyn(x.title_key)}));return D.architecture.edges.map(x=>({k:x.edge_key,n:`${x.from_node} → ${x.to_node}`}))}function renderTarget(){let o=targetOptions($('#simTargetType').value);$('#simTargetKey').innerHTML=o.map(x=>`<option value="${esc(x.k)}">${esc(x.n)}</option>`).join('')}$('#simTargetType').onchange=renderTarget;function selectTest(type,key){tab('simulation');$('#simTargetType').value=type;renderTarget();$('#simTargetKey').value=key;window.scrollTo({top:0,behavior:'smooth'})}
function renderSimulation(){let s=D.simulation||{personas:[],recentRuns:[],roleOptions:[]};$('#simStats').innerHTML=card('Synthetic actors',s.personas.length)+card('Browser runs',s.recentRuns.filter(x=>x.source==='browser').length)+card('Simulation only',s.canonicalMetrics?'NO':'YES');$('#personas').innerHTML=s.personas.map((p,i)=>`<label class="persona ${i<5?'selected':''}"><div class="personaHead"><input type="checkbox" data-persona="${esc(p.personaKey)}" ${i<5?'checked':''}><div><b>${esc(p.displayName)}</b><div class="mini">${esc(p.archetype)} · ${esc(p.roleKey||'—')}</div><div class="address">${esc(p.floorKey||'—')} / ${esc(p.cabinetKey||'—')} · ${esc(p.setkaId)}</div></div><span class="tag">${p.enabled?'ON':'OFF'}</span></div></label>`).join('');$('#personaRole').innerHTML=s.roleOptions.map(r=>`<option value="${esc(r.roleKey)}">${esc(r.floorKey)} / ${esc(r.cabinetKey||'—')} · ${esc(dyn(r.titleKey))}</option>`).join('');$('#recentRuns').innerHTML=(s.recentRuns||[]).slice(0,25).map(r=>`<div class="run ${r.status==='passed'?'pass':''}"><div class="itemTop"><b>${esc(r.persona_key)}</b><span class="tag">${esc(r.status)}</span></div><div class="mini">${esc(r.source)} · ${esc(r.checkpoint||'—')} · ${esc(r.target_type)}:${esc(r.target_key||'')}</div><div class="mini">${esc(r.isolation_mode)} · ${esc(r.scenario_key)} · ${esc(new Date(r.started_at).toLocaleString(locale==='ru'?'ru-RU':'en-US'))}</div></div>`).join('')||'<div class="mini">—</div>';renderTarget()}
function renderMachine(){let a=D.architecture,c=a.counts||{};$('#archStats').innerHTML=card('Blocks',c.nodes||a.nodes.length)+card('Connected',c.connected??a.edges.filter(x=>x.active).length)+card('Never-break',c.neverBreak??a.edges.filter(x=>x.break_policy==='never').length);$('#nodes').innerHTML=a.nodes.map(n=>`<div class="node"><div class="itemTop"><b>${esc(dyn(n.title_key))}</b><span class="tag">${esc(n.status)}</span></div><div class="address">${esc(n.node_key)}</div><div class="mini">${esc(dyn(n.description_key))}</div><div class="row" style="margin-top:6px"><button class="secondary" data-test-type="block" data-test-key="${esc(n.node_key)}">TEST</button></div></div>`).join('');$('#edges').innerHTML=a.edges.map(e=>`<div class="edge"><div class="itemTop"><span><span class="statusDot ${e.active?'on':''}"></span><span class="mono">${esc(e.from_node)} → ${esc(e.to_node)}</span></span><span class="tag">${esc(e.binding_mode||'design')}</span></div><div class="mini">${esc(e.edge_type)} · ${esc(e.criticality)} · ${esc(e.break_policy)}</div><div class="row" style="margin-top:5px"><button class="secondary" data-test-type="edge" data-test-key="${esc(e.edge_key)}">TEST</button></div></div>`).join('');let opts=a.nodes.map(n=>`<option value="${esc(n.node_key)}">${esc(dyn(n.title_key))}</option>`).join('');$('#edgeFrom').innerHTML=opts;$('#edgeTo').innerHTML=opts;$$('[data-test-type]').forEach(b=>b.onclick=()=>selectTest(b.dataset.testType,b.dataset.testKey))}
function doorButtons(type,key,state,lock){return ['open','guarded','president_only','frozen'].map(x=>`<button class="secondary" data-door-type="${type}" data-door-key="${esc(key)}" data-door-state="${x}" ${lock?'disabled':''}>${esc(t('door.'+x))}${x===state?' ✓':''}</button>`).join('')}function renderHQ(){let roles=D.access.roles;$('#hq').innerHTML=D.access.floors.map(f=>`<div class="card full" style="margin-bottom:8px"><div class="itemTop"><div><div class="title">${esc(dyn(f.title_key))}</div><div class="address">HQ / ${esc(f.floor_key)}</div></div><span class="tag">${esc(t('door.'+f.door_state))}</span></div><div class="row" style="margin-top:7px">${doorButtons('floor',f.floor_key,f.door_state,f.floor_key==='president')}</div>${D.access.cabinets.filter(c=>c.floor_key===f.floor_key).map(c=>`<div class="item" data-hq-cabinet="${esc(c.cabinet_key)}"><div class="itemTop"><div><b>${esc(dyn(c.title_key))}</b><div class="address">${esc(c.cabinet_key)}</div><div class="mini">${roles.filter(r=>r.cabinetKey===c.cabinet_key).map(r=>dyn(r.titleKey)).join(' · ')}</div></div><span class="tag">${esc(t('door.'+c.door_state))}</span></div><div class="row" style="margin-top:6px">${doorButtons('cabinet',c.cabinet_key,c.door_state,f.floor_key==='president')}<button data-test-type="cabinet" data-test-key="${esc(c.cabinet_key)}">TEST</button></div></div>`).join('')}</div>`).join('');let issuable=roles.filter(r=>r.roleKey!=='president_root'&&r.releasable);$('#issueRole').innerHTML='<option value="">NO ROLE</option>'+issuable.map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');$$('[data-door-type]').forEach(b=>b.onclick=async()=>{if(!confirm('Change door?'))return;await call(b.dataset.doorType==='floor'?'set_floor_door':'set_cabinet_door',b.dataset.doorType==='floor'?{floorKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President v0.7'}:{cabinetKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President v0.7'});await load()});$$('[data-test-type]').forEach(b=>b.onclick=()=>selectTest(b.dataset.testType,b.dataset.testKey))}
function renderFlow(){let f=D.flow||{},c=f.counts||{open:f.openCount||0,decisions:0,urgent:0};$('#flowStats').innerHTML=card('Open',c.open||0)+card('Decisions',c.decisions||0)+card('Urgent',c.urgent||0);$('#queues').innerHTML=(f.queues||[]).map(q=>`<div class="item"><div class="itemTop"><b>${esc(dyn(q.titleKey))}</b><span class="tag">${esc(q.openCount||0)}</span></div></div>`).join('')||'<div class="mini">—</div>';$('#threads').innerHTML=(f.threads||[]).map(x=>`<div class="item"><div class="itemTop"><b>${esc(x.subject)}</b><span class="tag">${esc(x.status)}</span></div><div class="mini">${esc(x.senderRoleKey||'—')} → ${esc(x.recipientType)}:${esc(x.recipientRef)}</div></div>`).join('')||'<div class="mini">—</div>'}
function renderVersions(){let tm=D.timeMachine;$('#versions').innerHTML=versions().map(v=>{let active=v.checkpoint===tm.activeCheckpoint,m=v.change_manifest?.[locale]||v.change_manifest?.en||{};return `<div class="version ${active?'active':''}"><div class="itemTop"><div><b>${esc(m.title||v.checkpoint)}</b><div class="mini mono">${esc(v.checkpoint)}</div><div class="mini">${esc((m.added||[]).join(' · ')||v.notes||'')}</div></div><span class="tag">${active?'WORKING':esc(v.status)}</span></div><div class="row" style="margin-top:8px"><button class="secondary" data-view-version="${esc(v.viewUrl||'')}" ${!v.viewable?'disabled':''}>VIEW</button><button data-work-version="${esc(v.checkpoint)}" ${active?'disabled':''}>MAKE WORKING</button></div></div>`}).join('');$$('[data-view-version]').forEach(b=>b.onclick=()=>{if(b.dataset.viewVersion)window.open(b.dataset.viewVersion,'_blank','noopener,noreferrer')});$$('[data-work-version]').forEach(b=>b.onclick=async()=>{if(!confirm('Switch Diamond working checkpoint?'))return;await call('activate_checkpoint',{checkpoint:b.dataset.workVersion,reason:'President v0.7 Time Machine'});await load()})}
function renderSystem(){let x=D.live;$('#metrics').innerHTML=card('Participants',x.participants)+card('Pattern exposures',x.exposures)+card('Sessions',x.sessions)+card('Synthetic actors',D.simulation?.personas?.length||0);$('#layers').innerHTML=D.core.layers.map(l=>`<div class="item"><div class="itemTop"><b>${esc(l.layer_key)}</b><span class="tag">${esc(l.status)}</span></div><div class="mini">${esc(l.description)}</div></div>`).join('');$('#releases').innerHTML=D.core.releases.map(r=>`<div class="item"><b>${esc(r.channel)}</b><div class="mini mono">${esc(r.front_version||'—')}</div></div>`).join('')}
function render(){if(!D)return;$('#apiState').textContent=`API v${D.apiVersion} · ${D.core.identity.setkaId}`;renderBlueprint();renderSimulation();renderMachine();renderHQ();renderFlow();renderVersions();renderSystem()}
async function load(){try{D=await call('dashboard');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('diamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginErr').textContent=e.message}}
$('#enter').onclick=async()=>{try{let d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('diamondSession',token);$('#key').value='';await load()}catch(e){$('#loginErr').textContent=e.message}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('diamondSession');location.reload()};
$('#bpOpenVersion').onclick=()=>{let v=versions().find(x=>x.checkpoint===$('#bpVersion').value);if(v?.viewUrl)window.open(v.viewUrl,'_blank','noopener,noreferrer');else alert('No separate visual shell')};$('#bpTestAll').onclick=()=>selectTest('headquarters','');
$('#draftAdd').onclick=async()=>{try{let d=await call('blueprint_add_draft',{itemType:$('#draftType').value,parentKey:$('#draftParent').value,title:$('#draftTitle').value,metadata:{createdFrom:'diamond-v0.7'}});$('#draftOut').textContent='DRAFT · '+d.draftKey;$('#draftTitle').value='';await load()}catch(e){$('#draftOut').textContent=e.message}};
$('#personaCreate').onclick=async()=>{try{let p=clamp01($('#personaPatience').value),c=clamp01($('#personaCuriosity').value),tr=clamp01($('#personaTrust').value),sv=clamp01($('#personaSave').value),ab=clamp01($('#personaAbandon').value);let d=await call('simulation_create_persona',{displayName:$('#personaName').value,archetype:$('#personaArchetype').value,roleKey:$('#personaRole').value,characteristics:{patience:p,curiosity:c,trust:tr,synthetic:true},behaviorPolicy:{dwellSeconds:[Math.max(5,Math.round(10+p*30)),Math.round(35+p*120)],gestures:[1,Math.round(2+c*10)],patternSwitches:[1,Math.round(1+c*5)],saveProbability:sv,abandonProbability:ab,returnProbability:clamp01(.85-ab*.7),readInstructions:clamp01(p*.55+c*.25)}});$('#personaOut').textContent=`${d.setkaId} · ${d.roleKey} · ${d.floorKey}/${d.cabinetKey}`;$('#personaName').value='';await load()}catch(e){$('#personaOut').textContent=e.message}};
$('#simRun').onclick=async()=>{try{let personaKeys=$$('[data-persona]:checked').map(x=>x.dataset.persona);if(!personaKeys.length)throw new Error('Select at least one synthetic actor');let d=await call('simulation_run',{personaKeys,checkpoint:$('#simCheckpoint').value,targetType:$('#simTargetType').value,targetKey:$('#simTargetKey').value,isolationMode:$('#simIsolation').value,scenarioKey:$('#simScenario').value});$('#simOut').textContent=(d.results||[]).map(x=>`${x.actor}: ${x.expectedBoundary}`).join(' · ');await load();tab('simulation')}catch(e){$('#simOut').textContent=e.message}};
$('#nodeCreate').onclick=async()=>{try{let d=await call('architecture_create_node',{nodeKey:$('#nodeKey').value,titleEn:$('#nodeTitleEn').value,titleRu:$('#nodeTitleRu').value,descriptionEn:$('#nodeDescEn').value,descriptionRu:$('#nodeDescRu').value,nodeType:$('#nodeType').value,criticality:$('#nodeCritical').value,disconnectPolicy:$('#nodePolicy').value});$('#nodeOut').textContent='OK · '+d.nodeKey;await load()}catch(e){$('#nodeOut').textContent=e.message}};
$('#edgeCreate').onclick=async()=>{try{let d=await call('architecture_connect',{edgeKey:$('#edgeKey').value,fromNode:$('#edgeFrom').value,toNode:$('#edgeTo').value,edgeType:$('#edgeType').value,criticality:'important',breakPolicy:'review',bindingMode:$('#edgeBinding').value,note:'President v0.7'});$('#edgeOut').textContent='OK · '+d.edgeKey;await load()}catch(e){$('#edgeOut').textContent=e.message}};
$('#issueBtn').onclick=async()=>{try{let d=await call('issue_identity',{roleKey:$('#issueRole').value||null,note:$('#issueNote').value});$('#issueOut').textContent=`${d.setkaId} · ${d.roleKey||'NO ROLE'}`;await load()}catch(e){$('#issueOut').textContent=e.message}};
applyLocale();tab('blueprint');if(token)load();
</script></body></html>
