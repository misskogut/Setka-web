<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SETKA · NATIVE HIGHLIGHT</title>
<style>
:root{color-scheme:dark;--bg:#030814;--line:#304965;--text:#eef6ff;--muted:#9bb0c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pill,.btn{background:rgba(4,12,24,.86);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1 1 280px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:9px;font:10px inherit}.btn.active{border-color:#f5c84c;background:rgba(83,65,17,.92)}#status{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:rgba(3,10,20,.84);border:1px solid rgba(46,70,100,.75);border-radius:9px;padding:7px 10px;color:#b8cde3;font-size:9px;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud{position:fixed;left:8px;bottom:max(42px,calc(env(safe-area-inset-bottom) + 34px));z-index:22;width:min(520px,calc(100vw - 16px));padding:10px 12px;background:rgba(5,12,24,.9);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}.hud b{font-size:11px}.hud div{font-size:9px;color:#c3d3e4;margin-top:4px;line-height:1.35}.hud .truth{color:#8098b1}.drawer{position:fixed;right:8px;bottom:max(42px,calc(env(safe-area-inset-bottom) + 34px));z-index:30;width:min(440px,calc(100vw - 16px));max-height:45vh;overflow:auto;padding:14px;background:rgba(5,12,24,.96);border:1px solid var(--line);border-radius:13px;display:none}.drawer.open{display:block}.drawer h3{margin:0 24px 8px 0;font-size:13px}.row{padding:4px 0;border-bottom:1px solid rgba(90,120,160,.14);font-size:10px}.k{color:var(--muted)}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#f5c84c;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.pill small{display:none}.btn{padding:8px;font-size:9px}.hud{bottom:max(42px,calc(env(safe-area-inset-bottom) + 34px))}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar">
  <div class="pill"><b>SETKA · NATIVE BODY HIGHLIGHT</b><small id="sub">real frozen body · system-computed subtree</small></div>
  <button class="btn" id="pointsOnly">POINTS</button>
  <button class="btn active" id="hair">HAIR</button>
  <button class="btn" id="graph">GRAPH</button>
  <button class="btn active" id="hilite">HILITE</button>
  <button class="btn" id="focus">FOCUS</button>
  <button class="btn active" id="auto">AUTO</button>
  <button class="btn" id="reset">RESET</button>
</div>
<div id="hud" class="hud"><b id="hudTitle">Загрузка…</b><div id="hudBody">—</div><div class="truth">Подсветка вычислена SETKA из parent_ref frozen body. Renderer не меняет координаты, topology или состав subtree.</div></div>
<div id="drawer" class="drawer"><h3 id="title">Сущность</h3><div id="body"></div></div>
<div id="status">SETKA готовит визуализацию…</div>
<div id="loader"><div class="spin"></div><div>получаем packet и frozen body…</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co',KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';
const packetRef=new URLSearchParams(location.search).get('packet');
const app=document.getElementById('app'),status=document.getElementById('status'),loader=document.getElementById('loader'),sub=document.getElementById('sub'),hudTitle=document.getElementById('hudTitle'),hudBody=document.getElementById('hudBody'),drawer=document.getElementById('drawer'),title=document.getElementById('title'),body=document.getElementById('body');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.014);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.22;controls.minDistance=.35;controls.maxDistance=150;scene.add(new THREE.AmbientLight(0xffffff,1));
let PACK,SNAP,points,growthEdges,graphEdges,highlightPoints,highlightEdges,focusMesh;
let nodeMap=new Map(),indexToNode=[],highlightIndex=[],highlightSet=new Set(),pointsMode=false,highlightActive=true,lastHair=true,lastGraph=false;
const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.16;const pointer=new THREE.Vector2();
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function row(k,v){return`<div class="row"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}
function col(g){const c=new THREE.Color();c.setHSL((.58+g*.11)%1,.72,.58);return c}
async function rpc(name,args){const r=await fetch(`${SUPA}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error(`${name} ${r.status}`);return r.json()}
async function load(){if(!packetRef)throw Error('packet parameter required');const t0=performance.now();PACK=await rpc('setka_visualization_packet_v1',{p_packet_ref:packetRef});if(!PACK?.ok)throw Error(PACK?.state||'packet failed');SNAP=await rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:PACK.snapshotRef});if(!SNAP?.ok)throw Error(SNAP?.state||'snapshot failed');buildBody();buildHighlight();fitBody();const hc=PACK.highlight?.nodeCount||0;sub.textContent=`${SNAP.grownNodes.toLocaleString()} body nodes · ${hc} highlighted`;status.textContent=`ready · ${Math.round(performance.now()-t0)} ms · ${PACK.packetRef}`;hudTitle.textContent=hc?`NATIVE HIGHLIGHT · ${hc} NODES`:'VISUALIZATION READY';hudBody.textContent=hc?`Фокус: ${PACK.highlight.focusRef}. SETKA сама вычислила subtree по frozen parent relation.`:`В packet нет native highlight.`;loader.style.display='none'}
function buildBody(){const pos=new Float32Array(SNAP.nodes.length*3),cols=new Float32Array(SNAP.nodes.length*3);let maxD=1;for(const v of SNAP.nodes)maxD=Math.max(maxD,+v[5]||0);for(let i=0;i<SNAP.nodes.length;i++){const v=SNAP.nodes[i],o={id:v[0],parent:v[1],type:v[2],generation:+v[3],x:+v[4],degree:+v[5],name:v[6],family:v[7],canonical:!!v[8],pos:new THREE.Vector3(+v[9],+v[10],+v[11])};nodeMap.set(o.id,o);indexToNode[i]=o;const c=col(o.generation),boost=.62+.38*Math.min(1,Math.log1p(o.degree)/Math.log1p(maxD));pos[i*3]=o.pos.x;pos[i*3+1]=o.pos.y;pos[i*3+2]=o.pos.z;cols[i*3]=c.r*boost;cols[i*3+1]=c.g*boost;cols[i*3+2]=c.b*boost}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cols,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.84,sizeAttenuation:true,depthWrite:false}));scene.add(points);const grow=[],full=[];for(const o of nodeMap.values()){if(!o.parent)continue;const p=nodeMap.get(o.parent);if(p)grow.push(p.pos.x,p.pos.y,p.pos.z,o.pos.x,o.pos.y,o.pos.z)}for(const e of SNAP.edges){const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(a&&b)full.push(a.pos.x,a.pos.y,a.pos.z,b.pos.x,b.pos.y,b.pos.z)}growthEdges=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(grow,3)),new THREE.LineBasicMaterial({color:0xb77bd0,transparent:true,opacity:.16,depthWrite:false}));graphEdges=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(full,3)),new THREE.LineBasicMaterial({color:0x9b73ba,transparent:true,opacity:.05,depthWrite:false}));graphEdges.visible=false;scene.add(growthEdges,graphEdges)}
function buildHighlight(){const h=PACK.highlight;if(!h?.nodeIds?.length){document.getElementById('hilite').disabled=true;document.getElementById('focus').disabled=true;return}highlightSet=new Set(h.nodeIds);const hp=[];highlightIndex=[];for(const id of h.nodeIds){const o=nodeMap.get(id);if(!o)continue;hp.push(o.pos.x,o.pos.y,o.pos.z);highlightIndex.push(o)}const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.Float32BufferAttribute(hp,3));highlightPoints=new THREE.Points(hg,new THREE.PointsMaterial({size:.105,color:0xffd45e,transparent:true,opacity:1,sizeAttenuation:true,depthWrite:false}));scene.add(highlightPoints);const he=[];for(const e of SNAP.edges){if(!highlightSet.has(e[0])||!highlightSet.has(e[1]))continue;const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(a&&b)he.push(a.pos.x,a.pos.y,a.pos.z,b.pos.x,b.pos.y,b.pos.z)}highlightEdges=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(he,3)),new THREE.LineBasicMaterial({color:0xffd45e,transparent:true,opacity:.72,depthWrite:false}));scene.add(highlightEdges);const f=nodeMap.get(h.focusNodeId);if(f){focusMesh=new THREE.Mesh(new THREE.SphereGeometry(.15,14,10),new THREE.MeshBasicMaterial({color:0xfff3b0,transparent:true,opacity:1,depthWrite:false}));focusMesh.position.copy(f.pos);scene.add(focusMesh)}applyHighlight(true)}
function applyHighlight(on){highlightActive=on;document.getElementById('hilite').classList.toggle('active',on);if(highlightPoints)highlightPoints.visible=on;if(highlightEdges)highlightEdges.visible=on;if(focusMesh)focusMesh.visible=on;if(points)points.material.opacity=on&&highlightPoints?.visible?.valueOf()?0.27:.84;if(growthEdges)growthEdges.material.opacity=on&&highlightPoints?.visible?.valueOf()?0.055:.16}
function fitBody(){if(!points)return;const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.08;controls.target.copy(c);camera.position.set(c.x+d*.56,c.y+d*.28,c.z+d);controls.update()}
function fitHighlight(){if(!highlightPoints)return;const box=new THREE.Box3().setFromObject(highlightPoints),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(.85,Math.max(s.x,s.y,s.z)*1.9);controls.target.copy(c);camera.position.set(c.x+d*.75,c.y+d*.42,c.z+d);controls.update();hudTitle.textContent='FOCUS · NATIVE SUBTREE';hudBody.textContent=`${PACK.highlight.nodeCount} узлов · ${PACK.highlight.focusRef}`}
function showNode(o){title.textContent=o.name;body.innerHTML=row('тип',o.type)+row('семейство',o.family||'—')+row('поколение',o.generation)+row('degree',o.degree)+row('masked id',o.id)+row('highlight',highlightSet.has(o.id)?'YES':'NO');drawer.classList.add('open')}
function pick(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);if(highlightPoints?.visible){const h=raycaster.intersectObject(highlightPoints,false);if(h.length){showNode(highlightIndex[h[0].index]);return}}const h=raycaster.intersectObject(points,false);if(h.length)showNode(indexToNode[h[0].index])}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(m<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);down=null});
function setPointsMode(on){pointsMode=on;document.getElementById('pointsOnly').classList.toggle('active',on);if(on){lastHair=growthEdges.visible;lastGraph=graphEdges.visible;growthEdges.visible=false;graphEdges.visible=false;document.getElementById('hair').classList.remove('active');document.getElementById('graph').classList.remove('active')}else{growthEdges.visible=lastHair;graphEdges.visible=lastGraph;document.getElementById('hair').classList.toggle('active',growthEdges.visible);document.getElementById('graph').classList.toggle('active',graphEdges.visible)}}
document.getElementById('pointsOnly').onclick=()=>setPointsMode(!pointsMode);document.getElementById('hair').onclick=e=>{if(pointsMode)setPointsMode(false);growthEdges.visible=!growthEdges.visible;e.currentTarget.classList.toggle('active',growthEdges.visible)};document.getElementById('graph').onclick=e=>{if(pointsMode)setPointsMode(false);graphEdges.visible=!graphEdges.visible;e.currentTarget.classList.toggle('active',graphEdges.visible)};document.getElementById('hilite').onclick=()=>applyHighlight(!highlightActive);document.getElementById('focus').onclick=fitHighlight;document.getElementById('auto').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('reset').onclick=fitBody;
function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}anim();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load().catch(err=>{console.error(err);status.textContent='load failed · '+err.message;loader.querySelector('div:last-child').textContent='Ошибка: '+err.message});
</script>
</body>
</html>
