<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>SETKA · Юля Sandbox Admin</title>
<link rel="stylesheet" href="admin-v3.css?v=34-yulia" />
<style>
.yulia-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(255,255,255,.2);border-radius:15px;font-size:10px}.dot-live{width:7px;height:7px;border-radius:50%;background:#fff}.source-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:rgba(255,255,255,.4)}.session-click{cursor:pointer}.session-click:hover{border-color:rgba(255,255,255,.35)}.lab-chart{width:100%;height:260px;display:block;background:#050505;border:1px solid rgba(255,255,255,.12);border-radius:18px}.event-mark{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;margin-right:7px;color:#fff;font-size:9px}.note-text{white-space:pre-wrap;line-height:1.45}.stack{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pattern-preview{width:100%;aspect-ratio:1;background:#000;border:1px solid rgba(255,255,255,.12);border-radius:16px;display:block}.helped{font-size:10px}.sync-note{font-size:10px;color:rgba(255,255,255,.44)}@media(max-width:780px){.two,.three{grid-template-columns:1fr}.top .spacer{display:none}.top{align-items:flex-start}.top .btn{min-height:38px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">SETKA · ЮЛЯ LAB</div><div class="muted small" style="margin-top:8px">Изолированная админка автономного прототипа v34</div><input id="keyInput" type="password" placeholder="Admin key" autocomplete="current-password"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:10px">Войти</button><div id="loginError" class="muted small" style="margin-top:12px"></div></div></div>
<div id="dashboard" class="shell hidden">
  <div class="top"><div><div class="brand">SETKA · ЮЛЯ</div><div class="sub">ИЗОЛИРОВАННЫЙ SANDBOX · НЕ ВХОДИТ В БУДУЩИЙ ПОТОК УЧАСТНИКОВ</div></div><div class="yulia-badge"><span class="dot-live"></span><span>Юля · единый профиль</span></div><div class="spacer"></div><button id="refreshBtn" class="btn">Обновить</button><button id="logoutBtn" class="btn">Выйти</button></div>
  <div id="syncStatus" class="sync-note" style="margin:-8px 0 16px"></div>
  <div class="tabs">
    <button class="tab active" data-tab="overview">Обзор</button>
    <button class="tab" data-tab="sessions">Сессии</button>
    <button class="tab" data-tab="journey">Путь / Replay</button>
    <button class="tab" data-tab="symptoms">Симптомы</button>
    <button class="tab" data-tab="notes">Заметки</button>
    <button class="tab" data-tab="pulse">Пульс / RR</button>
    <button class="tab" data-tab="community">Сообщество</button>
    <button class="tab" data-tab="invites">Инвайты</button>
    <button class="tab" data-tab="sources">Браузеры</button>
  </div>
  <section id="tab-overview" class="tab-page"></section>
  <section id="tab-sessions" class="tab-page hidden"></section>
  <section id="tab-journey" class="tab-page hidden"></section>
  <section id="tab-symptoms" class="tab-page hidden"></section>
  <section id="tab-notes" class="tab-page hidden"></section>
  <section id="tab-pulse" class="tab-page hidden"></section>
  <section id="tab-community" class="tab-page hidden"></section>
  <section id="tab-invites" class="tab-page hidden"></section>
  <section id="tab-sources" class="tab-page hidden"></section>
  <section id="detail" class="hidden" style="margin-top:16px"></section>
</div>
<script src="standalone-admin-v34.js?v=34-yulia-lab-1"></script>
</body>
</html>
