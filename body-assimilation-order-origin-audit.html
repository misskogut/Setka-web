<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · ASSIMILATION ORDER ORIGIN AUDIT</title><style>:root{color-scheme:dark;--bg:#030814;--panel:rgba(4,12,24,.92);--line:#304965;--text:#eef6ff;--muted:#9bb0c8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px}.pill,.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1;min-width:0}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:8px;font:9px inherit}.btn.active{border-color:#91c4ff;background:rgba(24,48,75,.95)}#hud{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:35;background:rgba(4,12,24,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.m{border:1px solid #22384f;border-radius:9px;padding:7px;background:rgba(8,19,33,.65)}.m b{font-size:11px;display:block}.m small{font-size:8px;color:var(--muted)}#rank{width:100%;height:90px;margin-top:8px;border:1px solid #22384f;border-radius:9px;background:#06101d}.note{font-size:8px;color:var(--muted);margin-top:6px;line-height:1.35}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.pill small{display:none}.btn{padding:7px 6px;font-size:8px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · ASSIMILATION ORDER ORIGIN AUDIT</b><small>falsification: event order vs lexical node_ref order</small></div><button class="btn active" id="actual">ACTUAL</button><button class="btn" id="lex">LEXICAL</button><button class="btn" id="graph">GRAPH</button></div><div id="hud"><div class="grid"><div class="m"><small>exact positions</small><b id="exact">—</b></div><div class="m"><small>rank corr</small><b id="corr">—</b></div><div class="m"><small>direct admission</small><b id="direct">—</b></div><div class="m"><small>verdict</small><b id="verdict">—</b></div></div><canvas id="rank"></canvas><div class="note" id="note">Загрузка…</div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA проверяет происхождение порядка 115 событий…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',AR='ASSIM-ORDER-AUDIT-1FBC3C8A6B89468C';const app=document.getElementById('app'),loader=document.getElementById('loader');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.16;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.05));let nodes=new Map(),points,graphLines,actualLine,lexLine;async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(fn+' '+r.status);return r.json()}function mkLine(order,color,opacity){const p=[];for(const id of order){const n=nodes.get(id);if(n)p.push(n.x,n.y,n.z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));return new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}))}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.3,c.z+d);controls.update()}function drawRank(seq){const c=document.getElementById('rank'),dpr=Math.min(devicePixelRatio,2),w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);const pad=16;x.strokeStyle='rgba(120,160,205,.25)';x.beginPath();x.moveTo(pad,h-pad);x.lineTo(w-pad,pad);x.stroke();x.fillStyle='#ffd36b';for(const q of seq){const ex=pad+(q[0]-1)/114*(w-2*pad),ey=h-pad-(q[1]-1)/114*(h-2*pad);x.fillRect(ex-1,ey-1,2,2)}x.fillStyle='#9bb0c8';x.font='8px monospace';x.fillText('event order',w-68,h-4);x.save();x.translate(7,58);x.rotate(-Math.PI/2);x.fillText('lexical rank',0,0);x.restore();}async function load(){const [body,audit]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_assimilation_order_origin_audit_v1',{p_run_ref:AR})]);const a=body.nodes||body.payload?.nodes||[],e=body.edges||body.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i],o={id:v[0],name:v[6],x:+v[9],y:+v[10],z:+v[11],gen:+v[3]};nodes.set(o.id,o);pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;const cc=new THREE.Color();cc.setHSL((.75+o.gen*.035)%1,.46,.4);col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.46,depthWrite:false}));scene.add(points);const ep=[];for(const z of e){const A=nodes.get(z[0]),B=nodes.get(z[1]);if(A&&B)ep.push(A.x,A.y,A.z,B.x,B.y,B.z)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));graphLines=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8469a5,transparent:true,opacity:.025,depthWrite:false}));graphLines.visible=false;scene.add(graphLines);const seq=audit.sequence||[],actual=seq.slice().sort((u,v)=>u[0]-v[0]).map(q=>q[3]),lex=seq.slice().sort((u,v)=>u[1]-v[1]).map(q=>q[3]);actualLine=mkLine(actual,0xffd36b,.92);scene.add(actualLine);lexLine=mkLine(lex,0x68e1ff,.7);lexLine.visible=false;scene.add(lexLine);const o=audit.observed||{};document.getElementById('exact').textContent=`${o.exactLexicalPositions}/${audit.eventCount}`;document.getElementById('corr').textContent=(+o.rankCorrelationEventVsLexical).toFixed(3);document.getElementById('direct').textContent=`${o.directAdmissionShadowEvents}/${audit.eventCount}`;document.getElementById('verdict').textContent='CONFOUNDED';document.getElementById('note').textContent='Золотой = записанный порядок. Голубой = node_ref по алфавиту. Они совпадают 115/115. Это доказывает, что прошлый packet-pattern отражал bulk passport insert / DIRECT_ADMISSION_SHADOW, а не эндогенную маршрутизацию SETKA. Сам replay остаётся фактическим воспроизведением DB-событий.';drawRank(seq);fit();loader.style.display='none'}function toggle(id,obj){document.getElementById(id).onclick=e=>{obj.visible=!obj.visible;e.currentTarget.classList.toggle('active',obj.visible)}}toggle('actual',actualLine);toggle('lex',lexLine);toggle('graph',graphLines);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}load().then(anim).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
