.nodeId)?.generation??99]));for(const sh of f.spatialModel?.shells||[]){const r=Math.max(.02,scale*(+sh.rNorm||0));const m=new THREE.Mesh(new THREE.SphereGeometry(r,22,14),new THREE.MeshBasicMaterial({color:0xc894ff,wireframe:true,transparent:true,opacity:sh.basis?.includes('FACT')?.32:.18,depthWrite:false}));m.position.copy(a);m.userData.localShell={...sh,shipCode:f.shipCode,geometryKind:geom,scaleBasis:f.scaleBasis,generation:genByRef.get(sh.ref)??99};localShellGroup.add(m)}for(const p of f.points||[]){const role=p.semanticRole||'LOCAL_OBJECT',sp=p.spatialPresentation||{},w=p.world||{};let size=role==='CENTRAL_OBJECT'?.16:role==='DISTURBANCE'?.11:.085;if(role==='DISTURBANCE'&&Number.isFinite(+sp.area))size=Math.min(.22,.08+Math.sqrt(Math.max(0,+sp.area))/90);const m=new THREE.Mesh(new THREE.SphereGeometry(size,12,8),new THREE.MeshBasicMaterial({color:roleColor(role),transparent:true,opacity:.97,depthWrite:false}));m.position.set(+w.x,+w.y,+w.z);m.userData.localPoint={...p,shipCode:f.shipCode,geometryKind:geom,scaleBasis:f.scaleBasis,generation:nodeMap.get(p.nodeId)?.generation??99};localPointGroup.add(m)}}}function fit(){if(!points)return;const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.08;controls.target.copy(c);camera.position.set(c.x+d*.56,c.y+d*.28,c.z+d);controls.update()}function showNode(o){title.textContent=o.name;body.innerHTML=row('тип',o.type)+row('семейство',o.family||'—')+row('поколение',o.generation)+row('degree',o.degree)+row('masked id',o.id);drawer.classList.add('open')}function showLocal(p){title.textContent=p.label||p.ref||'LOCAL';body.innerHTML=row('ship',p.shipCode)+row('ref',p.ref||'—')+row('role',p.semanticRole||'SHELL')+row('geometry',p.geometryKind||'—')+row('basis',p.spatialPresentation?.basis||p.basis||'—')+row('generation',p.generation??'—')+row('scaleBasis',p.scaleBasis||'—');drawer.classList.add('open')}function pick(x,y){const r=renderer ocalShell?.generation??99)<=g}function endGrowthPulse(){pulseGroup.clear();pulseCurrentGroup.clear();pulseGroup.visible=false;pulseCurrentGroup.visible=false;points.material.opacity=.88;growthEdges.material.opacity=.18;hubs.visible=true;for(const m of localPointGroup.children)m.visible=true;for(const m of localShellGroup.children)m.visible=localFrameGroup.visible&&!pointsMode;pulseChart.classList.remove('on');$('pulse').classList.remove('active')}async function playGrowthPulse(){const P=PACK.pulse;if(playing||!P?.available)return;playing=true;$('pulse').classList.add('active');points.material.opacity=.08;growthEdges.material.opacity=.035;hubs.visible=false;const focus=P.focusFrames||[];for(let i=0;i<P.frames.length;i++){const f=P.frames[i],ff=focus.find(x=>+x.generation===+f.generation);pulseGeometry(+f.generation);chart(P.frames,i);hudTitle.textContent=`PULSE · поколение ${f.generation} / ${P.frames.length-1}`;hudBody.textContent=`рост +${Number(f.bornNodes).toLocaleString()} узлов · всего ${Number(f.cumulativeNodes).toLocaleString()} · активность ${f.bornSharePct}% тела · x=${Number(f.x).toFixed(6)}${ff?` · дочка +${ff.bornNodes}, всего ${ff.cumulativeNodes}`:''}`;await new Promise(r=>setTimeout(r,520))}hudTitle.textContent='PULSE COMPLETE';hudBody.textContent=`${P.metrics.growthGenerations} поколений · ${Number(P.metrics.finalGrownNodes).toLocaleString()} выросших узлов · пик роста: поколение ${P.metrics.peakGeneration}, +${Number(P.metrics.peakBornNodes).toLocaleString()} узлов. Ось: внутреннее время SETKA, не wall-clock.`;await new Promise(r=>setTimeout(r,650));endGrowthPulse();playing=false}async function playStagePulse(){if(playing||!stageVisual.length)return;playing=true;pulseMesh.visible=true;for(let i=0;i<stageVisual.length;i++){const q=stageVisual[i],prev=i?stageVisual[i-1].p:q.p;for(let f=0;f<=20;f++){pulseMesh.position.lerpVectors(prev,q.p,f/20);await new Promise(r=>setTimeout(r,14))}hudTitle.textContent=`#${q.s.ord||i+1} · ${q.s.stageCode||q.s.kind||'S
