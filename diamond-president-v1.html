<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://gfchgaphzhxufwdhrcis.supabase.co; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>SETKA Diamond · President</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#050505;--card2:#0a0a0a;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.08);--text:#fff;--muted:rgba(255,255,255,.48);--muted2:rgba(255,255,255,.28)}
*{box-sizing:border-box}
html,body{background:#000}
body{margin:0;color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{font-weight:760;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);color:#fff;padding:7px 10px;border-radius:999px;font-size:11px;letter-spacing:.06em}
.hero{padding:25px;border:1px solid var(--line);border-radius:22px;background:#030303;box-shadow:none}
h1{font-size:clamp(31px,6vw,58px);line-height:.96;margin:0 0 14px;letter-spacing:-.055em;font-weight:760}
.sub{color:var(--muted);max-width:720px}
.login{max-width:520px;margin:9vh auto}
.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}.field span{font-size:11px;color:var(--muted);letter-spacing:.04em}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:14px;padding:14px 15px;color:#fff;font-size:16px;outline:none}
input:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
button{appearance:none;border:1px solid #fff;border-radius:14px;padding:13px 15px;font-weight:700;background:#fff;color:#000;cursor:pointer}
button.secondary{background:#000;color:#fff;border:1px solid var(--line)}
button.secondary:active{background:#fff;color:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.error{color:#fff;margin-top:12px;min-height:20px;font-size:12px}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px;margin-top:11px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}
.k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.v{font-size:30px;font-weight:740;letter-spacing:-.04em;margin-top:5px}.mini{font-size:11px;color:var(--muted)}
.layer{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--line2);align-items:start}.layer:first-child{border-top:0}
.n{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.65);font-size:11px}
.status{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:rgba(255,255,255,.64)}.status.foundation,.status.stable{color:#fff;border-color:rgba(255,255,255,.34)}.status.building{color:rgba(255,255,255,.72);border-style:dashed}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line2)}th{color:var(--muted);font-weight:600}
.release{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line2)}.release:first-child{border-top:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:7px}
.lang{display:flex;gap:3px;border:1px solid var(--line);border-radius:13px;padding:3px;background:#000}.lang button{padding:7px 9px;background:transparent;color:var(--muted);border:0;border-radius:9px;font-size:11px}.lang button.active{background:#fff;color:#000}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.card,.card.wide{grid-column:1/-1}.hero{padding:20px}.top{align-items:flex-start;flex-direction:column}.release{flex-direction:column}.grid{gap:9px}.tools{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="login hero">
  <div class="top" style="margin:0 0 8px"><div class="brand">SETKA · DIAMOND</div><div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div>
  <h1 data-i18n="login.title"></h1><div class="sub" data-i18n="login.subtitle"></div>
  <label class="field"><span>SETKA ID</span><input id="sid" autocomplete="username" placeholder="SETKA-XXXX-XXXX"></label>
  <label class="field"><span>President Key</span><input id="key" type="password" autocomplete="off" placeholder="••••••••••••••••"></label>
  <div class="row"><button id="enter" data-i18n="action.enter"></button></div><div id="err" class="error"></div>
</section>
<section id="app" class="hidden">
  <div class="top"><div><div class="brand">SETKA · DIAMOND / PRESIDENT</div><div class="mini" id="who"></div></div><div class="tools"><div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div><button class="secondary" id="refresh" data-i18n="action.refresh"></button><button class="secondary" id="logout" data-i18n="action.logout"></button></div></div>
  <div class="hero"><div class="badge"><span class="liveDot"></span>LIVE CORE</div><h1 style="margin-top:18px" data-i18n="hero.title"></h1><div class="sub" data-i18n="hero.subtitle"></div></div>
  <div id="metrics" class="grid"></div>
  <div class="grid"><div class="card wide"><div class="k" data-i18n="section.layers"></div><div id="layers"></div></div><div class="card"><div class="k" data-i18n="section.versions"></div><div id="releases"></div></div><div class="card full"><div class="k" data-i18n="section.patterns"></div><div style="overflow:auto"><table><thead><tr><th data-i18n="table.pattern"></th><th data-i18n="table.time"></th><th data-i18n="table.exposures"></th><th data-i18n="table.saves"></th><th data-i18n="table.sessions"></th><th data-i18n="table.association"></th></tr></thead><tbody id="patterns"></tbody></table></div></div><div class="card full"><div class="k" data-i18n="section.people"></div><div style="overflow:auto"><table><thead><tr><th data-i18n="table.participant"></th><th data-i18n="table.lastSeen"></th><th data-i18n="table.days"></th><th data-i18n="table.sessions"></th><th data-i18n="table.patternTime"></th><th data-i18n="table.exposures"></th><th data-i18n="table.saves"></th></tr></thead><tbody id="people"></tbody></table></div></div></div>
</section>
</div>
<script>
const API='https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-diamond-president-v1';
const PRIMARY_LOCALE='en';
const DEFAULT_DISPLAY_LOCALE='ru';
const I18N={
  en:{
    'login.title':'President access.','login.subtitle':'Private control panel for SETKA Diamond.','action.enter':'Enter','action.refresh':'Refresh','action.logout':'Log out','hero.title':'President console.','hero.subtitle':'Data is loaded only after server-side President verification.','section.layers':'System layers','section.versions':'Versions','section.patterns':'Mother patterns · live data','section.people':'Latest active participants','table.pattern':'Pattern','table.time':'Time','table.exposures':'Exposures','table.saves':'Saves','table.sessions':'Sessions','table.association':'Association','table.participant':'Participant','table.lastSeen':'Last seen','table.days':'Days','table.patternTime':'Pattern time','metric.participants':'Participants','metric.exposures':'Pattern exposures','metric.saved':'Saved configs','metric.visits':'Visits','metric.configs':'Configs','metric.time':'Pattern time','metric.sessions':'Sessions','metric.returnRate':'Return rate','metric.notes':'Notes','error.session':'Session expired. Sign in again.','error.credentials':'Invalid SETKA ID or President Key.','empty':'No data yet'
  },
  ru:{
    'login.title':'Доступ президента.','login.subtitle':'Закрытая панель управления SETKA Diamond.','action.enter':'Войти','action.refresh':'Обновить','action.logout':'Выйти','hero.title':'Панель президента.','hero.subtitle':'Данные загружаются только после серверной проверки President-доступа.','section.layers':'Слои системы','section.versions':'Версии','section.patterns':'Материнские паттерны · live data','section.people':'Последние активные участники','table.pattern':'Паттерн','table.time':'Время','table.exposures':'Экспозиции','table.saves':'Сохранения','table.sessions':'Сессии','table.association':'Ассоциация','table.participant':'Участник','table.lastSeen':'Последняя активность','table.days':'Дни','table.patternTime':'Время с паттернами','metric.participants':'Участники','metric.exposures':'Экспозиции паттернов','metric.saved':'Сохранённые конфигурации','metric.visits':'Визиты','metric.configs':'Конфигурации','metric.time':'Время с паттернами','metric.sessions':'Сессии','metric.returnRate':'Возврат','metric.notes':'Заметки','error.session':'Сессия закончилась. Войди снова.','error.credentials':'Неверный SETKA ID или President Key.','empty':'Пока нет данных'
  }
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let locale=localStorage.getItem('setkaDiamondLocale')||DEFAULT_DISPLAY_LOCALE;
if(!I18N[locale]) locale=DEFAULT_DISPLAY_LOCALE;
let token=sessionStorage.getItem('setkaDiamondSession')||'', lastData=null;
const t=k=>I18N[locale]?.[k]??I18N[PRIMARY_LOCALE]?.[k]??k;
const fmtMs=ms=>{ms=Number(ms)||0;const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h?(locale==='ru'?`${h}ч ${m}м`:`${h}h ${m}m`):(locale==='ru'?`${m}м`:`${m}m`)};
function applyLocale(){document.documentElement.lang=locale;$$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$$('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===locale));if(lastData)render(lastData)}
function setLocale(v){if(!I18N[v])return;locale=v;localStorage.setItem('setkaDiamondLocale',v);applyLocale()}
$$('[data-lang]').forEach(b=>b.onclick=()=>setLocale(b.dataset.lang));
async function call(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-setka-session':token},body:JSON.stringify(Object.assign({action},body))});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request_failed');return d}
function card(k,v){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'}
function render(d){lastData=d;$('#who').textContent=d.core.identity.setkaId+' · President';const x=d.live;$('#metrics').innerHTML=card(t('metric.participants'),x.participants)+card(t('metric.exposures'),x.exposures)+card(t('metric.saved'),x.favorites)+card(t('metric.visits'),x.visits)+card(t('metric.configs'),x.configs)+card(t('metric.time'),fmtMs(x.totalPatternMs))+card(t('metric.sessions'),x.sessions)+card(t('metric.returnRate'),Math.round(x.returnRate*100)+'%')+card(t('metric.notes'),x.notes);$('#layers').innerHTML=d.core.layers.map(l=>'<div class="layer"><div class="n">'+esc(l.layer_order)+'</div><div><b>'+esc(l.layer_key)+'</b><div class="mini">'+esc(l.description)+'</div></div><span class="status '+esc(l.status)+'">'+esc(l.status)+'</span></div>').join('');$('#releases').innerHTML=d.core.releases.map(r=>'<div class="release"><div><b>'+esc(r.channel)+'</b><div class="mini mono">'+esc(r.front_version||'—')+'</div></div></div>').join('');$('#patterns').innerHTML=x.patterns.map(p=>'<tr><td><b>'+esc(p.patternId)+'</b></td><td>'+esc(fmtMs(p.totalMs))+'</td><td>'+esc(p.exposures)+'</td><td>'+esc(p.saves)+'</td><td>'+esc(p.sessions)+'</td><td>'+(p.associationDelta==null?'—':esc(p.associationDelta.toFixed(3)))+'</td></tr>').join('')||'<tr><td colspan="6">'+esc(t('empty'))+'</td></tr>';$('#people').innerHTML=d.people.map(p=>'<tr><td>'+esc(p.participant)+'</td><td>'+esc(p.lastSeenAt?new Date(p.lastSeenAt).toLocaleString(locale==='ru'?'ru-RU':'en-US'):'—')+'</td><td>'+esc(p.activeDays)+'</td><td>'+esc(p.sessions)+'</td><td>'+esc(fmtMs(p.totalPatternMs))+'</td><td>'+esc(p.exposures)+'</td><td>'+esc(p.saves)+'</td></tr>').join('')}
async function load(){try{const d=await call('dashboard');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render(d)}catch(e){sessionStorage.removeItem('setkaDiamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#err').textContent=e.message==='invalid_session'?t('error.session'):e.message}}
$('#enter').onclick=async()=>{try{$('#err').textContent='';const d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('setkaDiamondSession',token);$('#key').value='';await load()}catch(e){$('#err').textContent=e.message==='invalid_credentials'?t('error.credentials'):e.message}};
$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('setkaDiamondSession');token='';location.reload()};
applyLocale();if(token)load();
</script>
</body></html>
