<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · PHYSICALIZED OBJECT</title><style>:root{color-scheme:dark;--bg:#030814;--line:#304965;--text:#eef6ff;--muted:#9bb0c8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;z-index:20;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill,.btn,.hud,.card{background:rgba(5,13,25,.9);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1 1 360px}.pill b{font-size:12px}.pill small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.btn{padding:9px 11px;color:var(--text);font:10px inherit}.btn.active{border-color:#f5c84c;background:rgba(83,65,17,.92)}.hud{position:fixed;z-index:20;left:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(620px,calc(100vw - 16px));padding:10px 12px}.hud b{font-size:11px}.hud div{font-size:9px;color:#c3d3e4;margin-top:4px;line-height:1.35}.truth{color:#8098b1}.card{position:fixed;z-index:30;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(440px,calc(100vw - 16px));max-height:46vh;overflow:auto;padding:12px;display:none}.card.open{display:block}.card h3{font-size:12px;margin:0 0 7px}.row{font-size:9px;line-height:1.45;padding:5px 0;border-bottom:1px solid rgba(110,140,170,.15);word-break:break-word}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#f5c84c;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.pill small{display:none}.btn{padding:8px;font-size:9px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · FACT-CONSTRAINED 3D</b><small id="sub">loading…</small></div><button class="btn active" id="bodyBtn">BODY</button><button class="btn active" id="metricsBtn">METRICS</button><button class="btn" id="evidenceBtn">EVIDENCE</button><button class="btn" id="labelsBtn">LABELS</button><button class="btn active" id="autoBtn">AUTO</button><button class="btn" id="resetBtn">RESET</button></div><div class="hud"><b id="hudTitle">Загрузка…</b><div id="hudBody">—</div><div class="truth">Форма и координаты берутся только из packet SETKA. Renderer не меняет physicalized coordinates. Неизвестные физические данные не дорисовываются; служебные/evidence узлы используют только отдельный presentation halo.</div></div><div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div></div><div id="loader"><div class="spin"></div><div>получаем fact-constrained packet…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co',KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';const packetRef=new URLSearchParams(location.search).get('packet');const app=document.getElementById('app'),sub=document.getElementById('sub'),loader=document.getElementById('loader'),hudTitle=document.getElementById('hudTitle'),hudBody=document.getElementById('hudBody'),card=document.getElementById('card'),cardTitle=document.getElementById('cardTitle'),cardBody=document.getElementById('cardBody');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.035);const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.02,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.22;controls.minDistance=.6;controls.maxDistance=30;scene.add(new THREE.AmbientLight(0xffffff,1));let PACK,G,model,nodeByRef=new Map(),meshMap=new Map(),bodyGroup=new THREE.Group(),metricGroup=new THREE.Group(),evidenceGroup=new THREE.Group(),edgeGroup=new THREE.Group(),labelGroup=new THREE.Group(),bodyVisible=true,metricsVisible=true,evidenceVisible=false,labelsVisible=false;scene.add(bodyGroup,metricGroup,evidenceGroup,edgeGroup,labelGroup);const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),pickables=[];function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return`<div class="row"><span style="color:#9bb0c8">${esc(k)}</span><br>${typeof v==='object'?`<pre style="white-space:pre-wrap;margin:4px 0 0">${esc(JSON.stringify(v,null,2))}</pre>`:esc(v)}</div>`}async function rpc(name,args){const r=await fetch(`${SUPA}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error(`${name} ${r.status}`);return r.json()}function hash01(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}function supportPos(ref){const a=hash01(ref+'a')*Math.PI*2,z=hash01(ref+'z')*2-1,r=2.0+hash01(ref+'r')*.8,q=Math.sqrt(Math.max(0,1-z*z));return new THREE.Vector3(r*q*Math.cos(a),r*z,r*q*Math.sin(a))}function makeSprite(text){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='26px ui-monospace,monospace';const w=Math.max(110,Math.ceil(x.measureText(text).width+20));c.width=w;c.height=44;x.font='26px ui-monospace,monospace';x.fillStyle='rgba(3,8,20,.78)';x.fillRect(0,0,w,44);x.fillStyle='#eef6ff';x.fillText(text,10,30);const t=new THREE.CanvasTexture(c),s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(.32*(w/100),.14,1);return s}function addPick(m,n){m.userData.node=n;pickables.push(m);meshMap.set(n.ref,m)}function build(){model=G.spatialModel||{};for(const n of G.nodes||[])nodeByRef.set(n.ref,n);const geometryKind=model.geometryKind||'ABSTRACT_GRAPH';const shells=model.shells||[];const palette=[0xffe17a,0xffd05f,0xffbd50,0xffa548,0xff8c49,0xff724e,0xff5f57];if(geometryKind!=='ABSTRACT_GRAPH'){shells.forEach((s,i)=>{const g=new THREE.SphereGeometry(+s.rNorm,28,20),m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:palette[i%palette.length],wireframe:true,transparent:true,opacity:s.rNorm===1?.30:.16,depthWrite:false}));m.userData.shell=s;bodyGroup.add(m);pickables.push(m)})}const center=(G.nodes||[]).find(n=>n.spatialPresentation?.placementKind==='LOCAL_PHYSICAL_CENTER');if(center){const m=new THREE.Mesh(new THREE.SphereGeometry(.08,14,10),new THREE.MeshBasicMaterial({color:0xffe06b,depthWrite:false}));m.position.set(0,0,0);bodyGroup.add(m);addPick(m,center)}for(const n of G.nodes||[]){const sp=n.spatialPresentation||{},k=sp.placementKind;if(k==='LOCAL_PHYSICAL_CENTER'||k==='RADIAL_SHELL')continue;let p=null,group=evidenceGroup,size=.035,color=0x7b8fa7;if(Number.isFinite(+sp.x)&&Number.isFinite(+sp.y)&&Number.isFinite(+sp.z)){p=new THREE.Vector3(+sp.x,+sp.y,+sp.z);if(k==='SURFACE_FEATURE'){group=bodyGroup;size=.045+Math.min(.08,Math.sqrt(Math.max(0,+sp.area||0))/180);color=0xff7146}else if(k==='READABLE_METRIC_SATELLITE'){group=metricGroup;size=.042;color=0x55cee5}else{group=evidenceGroup}}else{p=supportPos(n.ref);group=evidenceGroup}const m=new THREE.Mesh(new THREE.SphereGeometry(size,10,7),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,depthWrite:false}));m.position.copy(p);group.add(m);addPick(m,n)}for(const e of G.edges||[]){const a=meshMap.get(e.source),b=meshMap.get(e.target);if(!a||!b)continue;const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.position,b.position]),new THREE.LineBasicMaterial({color:0x7387a0,transparent:true,opacity:.11,depthWrite:false}));edgeGroup.add(line)}applyVisibility();fit()}function ensureLabels(){if(labelGroup.children.length)return;for(const [ref,m] of meshMap){const n=nodeByRef.get(ref);if(!n)continue;const s=makeSprite(n.label||ref);s.position.copy(m.position).add(new THREE.Vector3(.06,.05,.02));labelGroup.add(s)}}function applyVisibility(){bodyGroup.visible=bodyVisible;metricGroup.visible=metricsVisible;evidenceGroup.visible=evidenceVisible;edgeGroup.visible=true;labelGroup.visible=labelsVisible}function fit(){const box=new THREE.Box3().setFromObject(bodyGroup);if(box.isEmpty())box.setFromObject(scene);const s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(3.2,Math.max(s.x,s.y,s.z)*2.2);controls.target.copy(c);camera.position.set(c.x+d*.72,c.y+d*.42,c.z+d);controls.update()}function showNode(n){card.classList.add('open');cardTitle.textContent=n.label||n.ref;cardBody.innerHTML=row('ref',n.ref)+row('class',n.class)+row('semanticRole',n.semanticRole)+row('spatialPresentation',n.spatialPresentation)+row('payload',n.payload)}function showShell(s){card.classList.add('open');cardTitle.textContent=s.label||'shell';cardBody.innerHTML=row('radialOrder',s.radialOrder)+row('rNorm',s.rNorm)+row('basis',s.basis)+row('truth',s.basis?.includes('APPROXIMATION')?'presentation approximation':'fact-constrained radial placement')}function pick(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const h=raycaster.intersectObjects(pickables,false);if(!h.length)return;const o=h[0].object;if(o.userData.node)showNode(o.userData.node);else if(o.userData.shell)showShell(o.userData.shell)}let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(d<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);down=null});document.getElementById('bodyBtn').onclick=e=>{bodyVisible=!bodyVisible;e.currentTarget.classList.toggle('active',bodyVisible);applyVisibility()};document.getElementById('metricsBtn').onclick=e=>{metricsVisible=!metricsVisible;e.currentTarget.classList.toggle('active',metricsVisible);applyVisibility()};document.getElementById('evidenceBtn').onclick=e=>{evidenceVisible=!evidenceVisible;e.currentTarget.classList.toggle('active',evidenceVisible);applyVisibility()};document.getElementById('labelsBtn').onclick=e=>{labelsVisible=!labelsVisible;if(labelsVisible)ensureLabels();e.currentTarget.classList.toggle('active',labelsVisible);applyVisibility()};document.getElementById('autoBtn').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('resetBtn').onclick=fit;async function load(){if(!packetRef)throw Error('packet parameter required');PACK=await rpc('setka_visualization_packet_v1',{p_packet_ref:packetRef});if(!PACK?.ok)throw Error(PACK?.state||'packet failed');G=PACK.graph;if(!G)throw Error('graph missing');build();sub.textContent=`${model.geometryKind||'UNKNOWN'} · confidence ${model.geometryConfidence??'—'} · ${model.mappedSurfaceFeatureCount||0}/${model.surfaceFeatureCount||0} surface mapped`;hudTitle.textContent='FACT-CONSTRAINED 3D READY';hudBody.textContent=`${model.centerRef||'CENTER'} · ${model.geometryKind||'UNKNOWN'} · basis ${model.geometryBasis||'—'} · grammar ${model.grammarRef||'—'}`;loader.style.display='none'}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}anim();load().catch(e=>{loader.innerHTML=`<div style="color:#ff8e8e">load failed · ${esc(e.message)}</div>`;console.error(e)});</script></body></html>
