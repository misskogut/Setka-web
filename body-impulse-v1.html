eg,new THREE.LineBasicMaterial({color:0x7f6aa8,transparent:true,opacity:.025,depthWrite:false}));edges.visible=false;sc.add(edges);const geo=new THREE.SphereGeometry(.18,20,14);for(const t of trace){const o=nodes.get(t.id);if(!o)continue;const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xbfe7ff,transparent:true,opacity:.15,depthWrite:false}));m.position.set(o.x,o.y,o.z);m.userData=t;sc.add(m);markers.push(m)}fit();loader.style.display='none'}function fit(){const b=new THREE.Box3().setFromObject(pts),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;ctl.target.copy(c);cam.position.set(c.x+d*.55,c.y+d*.32,c.z+d);ctl.update()}function show(i){stage=i;for(let j=0;j<markers.length;j++){const active=markers[j].userData.id===trace[i].id;markers[j].material.opacity=active?.95:.12;markers[j].scale.setScalar(active?2.1:1)}const t=trace[i];st.textContent=`${t.evt} · ${t.name} · ${t.dt}`;sd.textContent=t.desc+'  Важно: подсвечены только фактически подтвержденные стадии этого запуска; между ними не дорисовывается мнимая проводимость по всему телу.';const o=nodes.get(t.id);if(o){const p=new THREE.Vector3(o.x,o.y,o.z).project(cam);tag.textContent=t.name;tag.style.display='block';tag.style.left=((p.x*.5+.5)*innerWidth)+'px';tag.style.top=((-p.y*.5+.5)*innerHeight)+'px'}}function anim(){requestAnimationFrame(anim);ctl.update();if(playing&&markers.length){const i=Math.floor(((performance.now()-start)/1700)%trace.length);if(i!==stage)show(i)}if(stage>=0){const o=nodes.get(trace[stage].id);if(o){const p=new THREE.Vector3(o.x,o.y,o.z).project(cam);tag.style.left=((p.x*.5+.5)*innerWidth)+'px';tag.style.top=((-p.y*.5+.5)*innerHeight)+'px'}}r.render(sc,cam)}document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'PAUSE':'PLAY';if(playing)start=performance.now()-Math.max(0,stage)*1700};document.getElementById('graph').onclick=e=>{edges.visible=!edges.visible;e.currentTarget.classList.toggle(
