<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000" />
<title>SETKA Admin V6 · Research & Business</title>
<link rel="stylesheet" href="admin-v3.css?v=2" /><link rel="stylesheet" href="admin-v6-shell.css?v=1" />
</head>
<body>
<div id="login" class="login"><h2>SETKA · защищённый вход</h2><p>Введите действующий ключ администратора или используйте персональную ссылку.</p><input id="keyInput" type="password" placeholder="Ключ администратора" autocomplete="off"><button id="loginBtn" type="button" class="btn primary">Открыть админку</button><div id="loginError" role="alert"></div></div>
<div id="dashboard" class="shell hidden">
  <div class="top"><div><div class="brand">SETKA RESEARCH</div><div class="sub">ПОЛНЫЙ ПУТЬ · ДО ID · СЕССИИ · ПУЛЬС · ТАЙМЕР · REPLAY · СИМПТОМЫ · ЗАМЕТКИ · ИНВАЙТЫ · СООБЩЕСТВО</div></div><div class="spacer"></div><button id="createCodeBtn" class="btn primary">+ ID</button><button id="refreshBtn" class="btn">Обновить</button><button id="logoutBtn" class="btn">Выйти</button></div>
  <div class="tabs">
    <button class="tab active" data-tab="overview">Обзор</button>
    <button class="tab" data-tab="journey">Путь по приложению</button>
    <button class="tab" data-tab="participants">Участники</button>
    <button class="tab" data-tab="timing">Таймер / удержание</button>
    <button class="tab" data-tab="symptoms">Симптомы</button>
    <button class="tab" data-tab="notes">Заметки</button>
    <button class="tab" data-tab="invites">Инвайты</button>
    <button class="tab" data-tab="insights">Запросы / эффект</button>
    <button class="tab" data-tab="community">Сообщество</button>
  </div>
  <section id="tab-overview" class="tab-page"></section>
  <section id="tab-journey" class="tab-page hidden"></section>
  <section id="tab-participants" class="tab-page hidden"></section>
  <section id="tab-timing" class="tab-page hidden"></section>
  <section id="tab-symptoms" class="tab-page hidden"></section>
  <section id="tab-notes" class="tab-page hidden"></section>
  <section id="tab-invites" class="tab-page hidden"></section>
  <section id="tab-insights" class="tab-page hidden"></section>
  <section id="tab-community" class="tab-page hidden"></section>
  <section id="detail" class="hidden" style="margin-top:16px"></section>
</div>
<script src="admin-v3.js?v=2"></script>
<script src="admin-v4-extra.js?v=2"></script>
<script src="admin-v5-extra.js?v=1"></script>
<script src="admin-guest-v12.js?v=1"></script>
<script src="admin-sensors-v13.js?v=2"></script>

<script src="admin-v6-shell.js?v=1"></script>
<script src="admin-v6-data-health.js?v=2"></script>
<script src="admin-v6-pattern-metrics.js?v=4"></script>
</body>
</html>
