<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · ASSIMILATION PACKETS</title><style>:root{color-scheme:dark;--bg:#030814;--panel:rgba(4,12,24,.9);--line:#304965;--text:#eef6ff;--muted:#9bb0c8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px;align-items:center}.pill,.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:8px;font:9px inherit}.btn.active{border-color:#91c4ff;background:rgba(24,48,75,.95)}#hud{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:35;background:rgba(4,12,24,.93);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.m{border:1px solid #22384f;border-radius:9px;padding:7px;background:rgba(8,19,33,.65)}.m b{font-size:11px;display:block}.m small{font-size:8px;color:var(--muted)}#row{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:9px}#name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65vw}.track{height:5px;background:#0c1a2a;border-radius:99px;margin-top:8px;position:relative;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#5ad7ff,#f2a5ff,#ffd36b)}input[type=range]{width:100%;margin:6px 0 0;accent-color:#9bdfff}.note{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.35}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.grid{grid-template-columns:repeat(2,1fr)}.btn{padding:7px 5px;font-size:8px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · ASSIMILATION PACKETS</b><small>same body · learned deterministic packet-analysis capability</small></div><button class="btn active" id="family">FAMILY</button><button class="btn" id="domain">DOMAIN</button><button class="btn active" id="hubs">HUBS</button><button class="btn" id="graph">GRAPH</button><button class="btn active" id="play">PAUSE</button></div><div id="hud"><div class="grid"><div class="m"><small>same family</small><b id="sf">—</b></div><div class="m"><small>null family</small><b id="nf">—</b></div><div class="m"><small>family z</small><b id="zf">—</b></div><div class="m"><small>family packets</small><b id="pf">—</b></div><div class="m"><small>same domain</small><b id="sd">—</b></div><div class="m"><small>null domain</small><b id="nd">—</b></div><div class="m"><small>domain z</small><b id="zd">—</b></div><div class="m"><small>domain packets</small><b id="pd">—</b></div></div><div id="row"><div id="name">загрузка…</div><div id="time">0 / 115</div></div><div class="track"><div class="fill" id="fill"></div></div><input id="scrub" type="range" min="1" max="115" value="1"><div class="note" id="note">Загрузка данных SETKA…</div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA показывает пакетную интеграцию на том же frozen body…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',RUN='ASSIM-PACKET-F6C2E032FA1E45CD';const app=document.getElementById('app'),loader=document.getElementById('loader'),nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),fill=document.getElementById('fill'),scrub=document.getElementById('scrub');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.16;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.05));let nodes=new Map(),points,graphLines,rayFamily,rayDomain,hubGroup=new THREE.Group(),pulse,seq=[],mode='family',playing=true,current=1,last=performance.now(),visualMs=15000;scene.add(hubGroup);async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(fn+' '+r.status);return r.json()}function hslFor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;const c=new THREE.Color();c.setHSL((h%360)/360,.72,.62);return c}function makeSegLine(kind){const p=[],c=[];for(let i=0;i<seq.length-1;i++){const a=seq[i],b=seq[i+1],same=kind==='family'?a[9]===b[9]:a[11]===b[11],key=kind==='family'?a[9]:a[11];const col=same?hslFor(key||'UNKNOWN'):new THREE.Color(0xffffff);p.push(a[4],a[5],a[6],b[4],b[5],b[6]);for(let j=0;j<2;j++)c.push(col.r,col.g,col.b)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));return new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.86,depthWrite:false,blending:THREE.AdditiveBlending}))}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.3,c.z+d);controls.update()}async function load(){const [body,res]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_assimilation_domain_packet_experiment_v1',{p_run_ref:RUN})]);seq=res.sequence||[];const a=body.nodes||body.payload?.nodes||[],e=body.edges||body.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i],o={id:v[0],name:v[6],x:+v[9],y:+v[10],z:+v[11],gen:+v[3]};nodes.set(o.id,o);pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;const cc=new THREE.Color();cc.setHSL((.75+o.gen*.035)%1,.46,.4);col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.42,depthWrite:false}));scene.add(points);const ep=[];for(const z of e){const A=nodes.get(z[0]),B=nodes.get(z[1]);if(A&&B)ep.push(A.x,A.y,A.z,B.x,B.y,B.z)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));graphLines=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8f6aaa,transparent:true,opacity:.025,depthWrite:false}));graphLines.visible=false;scene.add(graphLines);rayFamily=makeSegLine('family');rayDomain=makeSegLine('domain');rayDomain.visible=false;scene.add(rayFamily,rayDomain);const hg=new THREE.SphereGeometry(.12,14,10);for(const h of (res.boundaryTransitHubs||[])){const n=nodes.get(h[0]);if(!n)continue;const m=new THREE.Mesh(hg,new THREE.MeshBasicMaterial({color:0xf0a6ff,transparent:true,opacity:.72,depthWrite:false,blending:THREE.AdditiveBlending}));m.position.set(n.x,n.y,n.z);m.scale.setScalar(1+Math.sqrt(+h[1])*.28);m.userData={name:h[4],total:+h[1]};hubGroup.add(m)}pulse=new THREE.Mesh(new THREE.SphereGeometry(.14,16,10),new THREE.MeshBasicMaterial({color:0xffffcc,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(pulse);const A=res.actual,N=res.null,C=res.comparison;sf.textContent=A.sameFamilyTransitions+' / '+A.transitions;nf.textContent=(+N.family.mean).toFixed(1)+' ± '+(+N.family.sd).toFixed(1);zf.textContent=(+C.familyZ).toFixed(2);pf.textContent=A.familyPackets;sd.textContent=A.sameDomainTransitions+' / '+A.transitions;nd.textContent=(+N.domain.mean).toFixed(1)+' ± '+(+N.domain.sd).toFixed(1);zd.textContent=(+C.domainZ).toFixed(2);pd.textContent=A.domainPackets;document.getElementById('note').textContent='Белые сегменты = граница пакета. Цветные = продолжение того же пакета. FAMILY использует канонический family_key. DOMAIN — производная ближайшая DOMAIN-зона по числу реальных рёбер; это не каноническая доменная разметка. HUBS = повторяющиеся промежуточные узлы на переходах через границы.';fit();loader.style.display='none';update(1)}function update(n){current=Math.max(1,Math.min(seq.length,Math.round(n)));scrub.value=current;fill.style.width=(current/seq.length*100)+'%';const q=seq[current-1];pulse.position.set(q[4],q[5],q[6]);pulse.scale.setScalar(1.8+Math.sin(performance.now()/100)*.5);nameEl.textContent='#'+q[1]+' · '+q[7]+' · '+(mode==='family'?q[9]:q[11]);timeEl.textContent=current+' / '+seq.length}document.getElementById('family').onclick=e=>{mode='family';rayFamily.visible=true;rayDomain.visible=false;e.currentTarget.classList.add('active');document.getElementById('domain').classList.remove('active');update(current)};document.getElementById('domain').onclick=e=>{mode='domain';rayFamily.visible=false;rayDomain.visible=true;e.currentTarget.classList.add('active');document.getElementById('family').classList.remove('active');update(current)};document.getElementById('hubs').onclick=e=>{hubGroup.visible=!hubGroup.visible;e.currentTarget.classList.toggle('active',hubGroup.visible)};document.getElementById('graph').onclick=e=>{graphLines.visible=!graphLines.visible;e.currentTarget.classList.toggle('active',graphLines.visible)};document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'PAUSE':'PLAY';e.currentTarget.classList.toggle('active',playing)};scrub.addEventListener('input',()=>{playing=false;document.getElementById('play').textContent='PLAY';document.getElementById('play').classList.remove('active');update(+scrub.value)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function anim(t){requestAnimationFrame(anim);const dt=t-last;last=t;if(playing&&seq.length){current+=dt/(visualMs/seq.length);if(current>seq.length)current=1;update(current)}if(pulse)pulse.scale.setScalar(1.7+Math.sin(t/90)*.35);controls.update();renderer.render(scene,camera)}load().then(()=>anim(performance.now())).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
