<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#050505"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SETKA · Президент · Живая система</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}body{min-height:100vh}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid #202020;background:#090909;padding:18px 14px;overflow:auto}.logo{font-weight:900;font-size:22px;letter-spacing:.04em}.pres{font-size:10px;letter-spacing:.18em;color:#818181;margin-top:5px}.live{display:inline-flex;align-items:center;gap:7px;margin:18px 0 16px;padding:7px 9px;border:1px solid #27352a;border-radius:999px;color:#a7e5b0;font-size:11px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#75d586;box-shadow:0 0 12px #75d586}.nav{display:grid;gap:5px}.nav button{appearance:none;text-align:left;width:100%;border:0;background:transparent;color:#aaa;padding:11px 12px;border-radius:11px;font-weight:700;font-size:13px}.nav button.active{background:#f4f4f4;color:#080808}.nav button:hover{background:#151515;color:#fff}.nav button.active:hover{background:#f4f4f4;color:#080808}.sidefoot{margin-top:20px;padding-top:14px;border-top:1px solid #1c1c1c;color:#696969;font-size:10px;line-height:1.45}.main{min-width:0}.top{position:sticky;top:0;z-index:20;background:#050505e8;backdrop-filter:blur(20px);border-bottom:1px solid #1c1c1c;padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:20px;font-weight:900}.subtitle{font-size:11px;color:#808080;margin-top:3px}.topright{display:flex;gap:8px}.btn{appearance:none;border:1px solid #303030;background:#111;color:#fff;border-radius:11px;padding:9px 12px;font-weight:800}.content{padding:20px 22px 60px;max-width:1500px;margin:0 auto}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.5fr);gap:12px;margin-bottom:14px}.card{background:#0b0b0b;border:1px solid #222;border-radius:17px;padding:15px}.heroMain{padding:20px}.eyebrow{font-size:10px;color:#777;letter-spacing:.16em;text-transform:uppercase}.heroTitle{font-size:31px;line-height:1.05;font-weight:950;margin:8px 0}.heroText{color:#a3a3a3;font-size:14px;line-height:1.45;max-width:780px}.health{display:flex;align-items:center;gap:10px;margin-top:16px;color:#a8dda9;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:16px}.stat{background:#0b0b0b;border:1px solid #222;border-radius:15px;padding:14px}.statN{font-size:28px;font-weight:950}.statK{font-size:10px;color:#777;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 9px}.sectionHead h2{margin:0;font-size:17px}.muted{color:#777;font-size:11px}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{width:100%;background:#0d0d0d;border:1px solid #2b2b2b;color:#fff;border-radius:12px;padding:11px 12px;outline:none}.search:focus{border-color:#666}.list{display:grid;gap:8px}.row{background:#0b0b0b;border:1px solid #202020;border-radius:14px;padding:13px}.rowTitle{font-weight:800;font-size:14px}.rowMeta{font-size:11px;color:#777;margin-top:5px;line-height:1.45}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:9px;border:1px solid #323232;border-radius:999px;padding:4px 7px;color:#aaa}.chip.green{border-color:#28452d;color:#9bddaa}.chip.amber{border-color:#514022;color:#d8b873}.chip.red{border-color:#552a2a;color:#e09898}.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:#333}.event{position:relative;margin-bottom:10px}.event:before{content:"";position:absolute;left:-21px;top:15px;width:8px;height:8px;border-radius:50%;background:#eee;border:3px solid #050505}.eventNo{font-size:10px;color:#6f6f6f}.film{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 12px;scroll-snap-type:x mandatory}.frame{min-width:250px;max-width:250px;scroll-snap-align:start;background:#0b0b0b;border:1px solid #242424;border-radius:16px;padding:14px}.frame .v{font-size:20px;font-weight:950}.frame .state{font-size:10px;color:#8d8d8d;margin-top:4px}.frame .desc{font-size:12px;color:#aaa;margin-top:10px;line-height:1.4}.ship{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.sector{background:#0b0b0b;border:1px solid #232323;border-radius:15px;padding:14px}.sectorName{font-weight:900}.position{margin-top:8px;padding-top:8px;border-top:1px solid #1c1c1c;font-size:11px;color:#a0a0a0}.report{border-left:2px solid #363636;padding-left:12px}.pin{display:grid;grid-template-columns:auto 1fr;gap:10px}.pinIcon{font-size:20px}.json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;white-space:pre-wrap;word-break:break-word;color:#999}.empty{text-align:center;color:#696969;padding:35px 12px}.error{background:#2a0d0d;border:1px solid #592a2a;color:#f0b1b1;padding:12px;border-radius:12px;margin-bottom:12px}.login{max-width:520px;margin:12vh auto}.hidden{display:none!important}.tabbar{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.graphCard{min-height:130px}.bar{height:7px;background:#171717;border-radius:999px;overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%;background:#eee;border-radius:999px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.break{word-break:break-word}@media(max-width:900px){.app{display:block}.side{display:none}.top{padding:13px 14px}.content{padding:13px 12px 90px}.hero{grid-template-columns:1fr}.heroTitle{font-size:25px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.tabbar{position:fixed;display:flex;z-index:50;bottom:0;left:0;right:0;background:#0a0a0af2;backdrop-filter:blur(20px);border-top:1px solid #292929;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:3px}.tabbar button{border:0;background:transparent;color:#888;padding:9px 10px;border-radius:10px;font-size:10px;font-weight:800;white-space:nowrap}.tabbar button.active{background:#fff;color:#000}.topright .btn:first-child{display:none}.frame{min-width:220px;max-width:220px}.statN{font-size:24px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">SETKA</div><div class="pres">ПРЕЗИДЕНТ · ЖИВАЯ СИСТЕМА</div><div class="live"><span class="dot"></span>ТЕКУЩЕЕ СОСТОЯНИЕ</div><nav class="nav" id="nav"><button data-tab="home" class="active">◉ Центр управления</button><button data-tab="time">◷ Время и Стенограмма</button><button data-tab="entities">◈ Сущности</button><button data-tab="ship">🚀 Корабль и экипаж</button><button data-tab="work">✓ Миссии и задачи</button><button data-tab="pins">📌 Пины</button><button data-tab="graphs">⌁ Графы и измерения</button><button data-tab="versions">▣ История версий</button><button data-tab="traces">✎ Карандаш</button><button data-tab="structure">⌘ Архитектура</button></nav><div class="sidefoot">Это не просмотр старой админки. Экран собирается из текущих сущностей, Стенограммы, корабля, задач, PIN, графов, рапортов и истории SETKA.</div></aside><main class="main"><header class="top"><div><div class="title" id="pageTitle">Центр управления</div><div class="subtitle" id="pageSub">Сегодняшняя SETKA · единая Президентская поверхность</div></div><div class="topright"><button class="btn" id="refresh">↻ Обновить</button><button class="btn" id="logout">Вход</button></div></header><div id="err" class="content" style="padding-bottom:0"></div><div id="content" class="content"></div></main></div><div class="tabbar" id="tabbar"><button data-tab="home" class="active">Центр</button><button data-tab="time">Время</button><button data-tab="entities">Сущности</button><button data-tab="ship">Корабль</button><button data-tab="work">Работа</button><button data-tab="pins">Пины</button><button data-tab="versions">Версии</button><button data-tab="traces">Карандаш</button></div><script>
const API='https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-president-current';
const KEYS=['setka:foundation:president:session','setka:foundation:president:control-session','setka:foundation:president:recovery-session'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let cache={},current='home';
function token(){for(const k of KEYS){try{const v=localStorage.getItem(k);if(v)return v}catch{}}return''}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function t(v){if(!v)return'—';try{return new Date(v).toLocaleString('ru-RU',{timeZone:'Europe/Saratov',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return String(v)}}
function a(x){if(Array.isArray(x))return x;if(Array.isArray(x?.items))return x.items;if(Array.isArray(x?.events))return x.events;if(Array.isArray(x?.traces))return x.traces;if(Array.isArray(x?.rows))return x.rows;return[]}
function p(o,ks){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return''}
async function call(action,body={}){const tok=token();if(!tok)throw new Error('NO_SESSION');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-setka-session':tok},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.error||'Ошибка SETKA');return d}
function error(e=''){$('#err').innerHTML=e?`<div class="error">${esc(e)}</div>`:''}
function chip(x,cls=''){return `<span class="chip ${cls}">${esc(x)}</span>`}
function kv(o,keys){return keys.map(k=>o?.[k]!=null&&o[k]!==''?chip(`${k.replaceAll('_',' ')}: ${o[k]}`):'').join('')}
function names(c){const n={subjects:'Канонические сущности',facets:'Карточки сущностей',transcript:'События времени',domains:'Области',concerns:'Контуры',technicalObjects:'Технические объекты',positions:'Должности',sectors:'Секторы',reports:'Рапорты',pins:'Пины',tasks:'Задачи',missions:'Миссии',graphs:'Графы'};return Object.entries(c||{}).map(([k,v])=>`<div class="stat"><div class="statN">${esc(v)}</div><div class="statK">${esc(n[k]||k)}</div></div>`).join('')}
async function get(k,action,body){return cache[k]||(cache[k]=await call(action,body))}
function searchBlock(id,placeholder){return `<div class="toolbar"><input class="search" id="${id}" placeholder="${placeholder}"></div>`}
function entityRows(rows){return rows.length?rows.map(x=>`<div class="row"><div class="rowTitle">${esc(p(x,['emoji']))} ${esc(p(x,['human_name','humanName','display_name_ru','display_name','displayName','position_name_ru','sector_name_ru','name_ru','entity_ref','entityRef','position_ref','sector_ref']))}</div><div class="rowMeta break">${esc(p(x,['entity_type','entityType','type_code','typeCode','position_ref','sector_ref','canonical_subject_ref']))}</div><div class="chips">${kv(x,['domain_code','concern_code','canonical_state','state','effective_anchor_ref','entity_ref'])}</div></div>`).join(''):'<div class="empty">Ничего не найдено</div>'}
async function home(){const d=await get('overview','overview');const c=d.counts||{};const [tr,work]=await Promise.all([get('transcript','transcript',{limit:30}),get('work','work',{limit:60})]);const ev=a(tr.items).slice(0,6),mis=a(work.missions).slice(0,4);return `<div class="hero"><div class="card heroMain"><div class="eyebrow">SETKA · сейчас</div><div class="heroTitle">Один живой организм,<br>а не набор старых версий.</div><div class="heroText">Здесь собран сегодняшний backend SETKA: сущности и связи, Стенограмма, корабль и экипаж, миссии и задачи, PIN, графы, рапорты, Карандаш и история версий.</div><div class="health"><span class="dot"></span>Данные читаются напрямую из текущей системы · ${t(d.asOf)} · Саратов</div></div><div class="card"><div class="eyebrow">Целостность</div><div class="statN" style="margin-top:8px">${esc(c.subjects||0)}</div><div class="muted">канонических субъектов</div><div class="bar"><i style="width:100%"></i></div><div class="rowMeta">Система показывается как единая модель, а версии вынесены в историю.</div></div></div><div class="stats">${names(c)}</div><div class="two"><div><div class="sectionHead"><h2>Последние события</h2><button class="btn" onclick="go('time')">Вся Стенограмма</button></div><div class="timeline">${ev.map(eventHtml).join('')}</div></div><div><div class="sectionHead"><h2>Активная работа</h2><button class="btn" onclick="go('work')">Все миссии</button></div><div class="list">${mis.length?mis.map(missionHtml).join(''):'<div class="empty">Миссии не найдены</div>'}</div></div></div>`}
function eventHtml(x){return `<div class="event"><div class="row"><div class="eventNo">${p(x,['event_no','eventNo'])?'Событие №'+esc(p(x,['event_no','eventNo'])):''} · ${t(p(x,['occurred_at','occurredAt','created_at','createdAt']))}</div><div class="rowTitle" style="margin-top:4px">${esc(p(x,['summary','humanSummary','event_type','eventType'])||'Событие')}</div><div class="rowMeta">${esc(p(x,['event_type','eventType']))} ${esc(p(x,['entity_type','entityType']))} ${esc(p(x,['entity_ref','entityRef']))}</div></div></div>`}
async function timePage(){const d=await get('transcript','transcript',{limit:500});const rows=a(d.items);setTimeout(()=>{const q=$('#qtime');if(q)q.oninput=e=>$('#timeList').innerHTML=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(e.target.value.toLowerCase())).map(eventHtml).join('')||'<div class="empty">Ничего не найдено</div>'},0);return `<div class="sectionHead"><div><h2>Стенограмма</h2><div class="muted">Позвоночник времени SETKA · append-only</div></div><div class="muted">${rows.length} последних событий</div></div>${searchBlock('qtime','Поиск по времени, смыслу, сущности, ключу…')}<div class="timeline" id="timeList">${rows.map(eventHtml).join('')}</div>`}
async function entities(){const d=await get('entities','entities',{limit:500});const rows=a(d);setTimeout(()=>{const q=$('#qent');if(q)q.oninput=e=>$('#entityList').innerHTML=entityRows(rows.filter(x=>JSON.stringify(x).toLowerCase().includes(e.target.value.toLowerCase())))},0);return `<div class="sectionHead"><div><h2>Сущности</h2><div class="muted">Карточки сегодняшней модели мира SETKA</div></div><div class="muted">показано ${rows.length}</div></div>${searchBlock('qent','Найти сущность, тип, область, контур…')}<div class="list" id="entityList">${entityRows(rows)}</div>`}
async function ship(){const d=await get('crew','crew');const sectors=a(d.sectors),positions=a(d.positions),reports=a(d.reports);const grouped=sectors.map(s=>{const sr=p(s,['sector_ref','sector_code','code']);const pos=positions.filter(x=>p(x,['sector_ref','sector_code'])===sr);return `<div class="sector"><div class="sectorName">🚪 ${esc(p(s,['display_name_ru','sector_name_ru','name_ru','sector_ref','sector_code']))}</div><div class="rowMeta">${esc(sr)}</div>${pos.map(x=>`<div class="position">💼 ${esc(p(x,['position_name_ru','display_name_ru','position_ref','position_code']))}${p(x,['occupant_name_ru','synthetic_name','identity_ref'])?`<br>🤖 ${esc(p(x,['occupant_name_ru','synthetic_name','identity_ref']))}`:''}</div>`).join('')}</div>`}).join('');return `<div class="sectionHead"><div><h2>🚀 Корабль SETKA</h2><div class="muted">Сектор → должность → синтетик</div></div><div class="muted">${sectors.length} секторов · ${positions.length} должностей</div></div><div class="ship">${grouped||entityRows(sectors)}</div><div class="sectionHead"><h2>Последние рапорты экипажа</h2><div class="muted">${reports.length} загружено</div></div><div class="list">${reports.slice(0,50).map(r=>{const summary=p(r?.result||{},['summaryRu','summary'])||p(r,['summary','report_ref']);return `<div class="row report"><div class="rowTitle">🤖 ${esc(p(r,['author_identity_ref','position_ref','report_ref']))}</div><div class="rowMeta">${t(p(r,['created_at','finalized_at']))} · ${esc(p(r,['report_kind','state']))}</div><div class="rowMeta" style="color:#bbb">${esc(summary)}</div></div>`}).join('')}</div>`}
function missionHtml(m){const state=p(m,['state']);return `<div class="row"><div class="rowTitle">🎯 ${esc(p(m,['title_ru','mission_ref']))}</div><div class="rowMeta">${esc(p(m,['objective_ru']))}</div><div class="chips">${chip(state,state==='DONE'?'green':'')}${p(m,['mission_ref'])?chip(p(m,['mission_ref'])):''}</div></div>`}
async function work(){const d=await get('work','work',{limit:300});const missions=a(d.missions),tasks=a(d.tasks);return `<div class="sectionHead"><div><h2>Миссии</h2><div class="muted">Цели системы и их текущее состояние</div></div><div class="muted">${missions.length}</div></div><div class="list">${missions.map(missionHtml).join('')||'<div class="empty">Миссий нет</div>'}</div><div class="sectionHead"><h2>Задачи</h2><div class="muted">${tasks.length}</div></div><div class="list">${tasks.map(x=>`<div class="row"><div class="rowTitle">✓ ${esc(p(x,['title','task_code']))}</div><div class="rowMeta">${esc(p(x,['normalized_intent']))}</div><div class="chips">${chip(p(x,['state']))}${p(x,['subject_kind'])?chip(`${p(x,['subject_kind'])}: ${p(x,['subject_ref'])}`):''}</div></div>`).join('')}</div>`}
async function pins(){const d=await get('pins','pins',{limit:350});const rows=a(d.items).filter(x=>!x.deleted_at);setTimeout(()=>{const q=$('#qpin');if(q)q.oninput=e=>$('#pinList').innerHTML=pinRows(rows.filter(x=>JSON.stringify(x).toLowerCase().includes(e.target.value.toLowerCase())))},0);function pinRows(r){return r.map(x=>`<div class="row pin"><div class="pinIcon">📌</div><div><div class="rowTitle">${esc(p(x,['comment','target_label','pin_code']))}</div><div class="rowMeta">${esc(p(x,['pin_code']))} · ${t(p(x,['created_at']))}</div><div class="chips">${chip(p(x,['status']))}${p(x,['surface'])?chip(p(x,['surface'])):''}${p(x,['version'])?chip('версия '+p(x,['version'])):''}</div></div></div>`).join('')||'<div class="empty">Пинов нет</div>'}return `<div class="sectionHead"><div><h2>📌 Пины</h2><div class="muted">Смысловые точки и решения, сохранённые в системе</div></div><div class="muted">${rows.length}</div></div>${searchBlock('qpin','Найти PIN по смыслу, коду, состоянию…')}<div class="list" id="pinList">${pinRows(rows)}</div>`}
async function graphs(){const d=await get('graphs','graph',{limit:300});const gs=a(d.graphs),req=a(d.liveRequests),pts=a(d.points);return `<div class="sectionHead"><div><h2>Графы и измерения</h2><div class="muted">Канонические наблюдатели, а не нарисованные вручную графики</div></div></div><div class="stats"><div class="stat"><div class="statN">${gs.length}</div><div class="statK">Канонических графов</div></div><div class="stat"><div class="statN">${req.length}</div><div class="statK">Живых запросов</div></div><div class="stat"><div class="statN">${pts.length}</div><div class="statK">Точек измерений</div></div></div><div class="list">${gs.map(g=>`<div class="row graphCard"><div class="rowTitle">⌁ ${esc(p(g,['display_name_ru','graph_ref']))}</div><div class="rowMeta">${esc(p(g,['graph_kind','chronology_source']))}</div><div class="chips">${chip(p(g,['state']))}${chip(p(g,['graph_ref']))}</div></div>`).join('')||'<div class="empty">Графы не зарегистрированы</div>'}</div>`}
async function versions(){const d=await get('versions','versions',{limit:400});const rows=a(d.items);const legacy=d.legacyManifest?.versions||[];return `<div class="sectionHead"><div><h2>История версий</h2><div class="muted">Версии теперь — кадры истории SETKA, а не отдельные системы</div></div></div><div class="film">${legacy.map(v=>`<div class="frame"><div class="eyebrow">Исторический кадр</div><div class="v">${esc(v.version||'—')}</div><div class="state">${esc(v.status||'')} ${v.paused?'· пауза':''}</div><div class="desc">${esc(v.humanChange||'Описание версии не заполнено')}</div></div>`).join('')||'<div class="empty">Исторический манифест не найден</div>'}</div><div class="sectionHead"><h2>Линии происхождения компонентов</h2><div class="muted">${rows.length}</div></div><div class="list">${rows.map(x=>`<div class="row"><div class="rowTitle">▣ ${esc(p(x,['object_ref','family_signature']))}</div><div class="rowMeta">версия ${esc(p(x,['version_no']))} · ${esc(p(x,['lifecycle_state']))}</div><div class="chips">${p(x,['status_basis'])?chip(p(x,['status_basis'])):''}${p(x,['superseded_by_ref'])?chip('→ '+p(x,['superseded_by_ref'])):''}</div></div>`).join('')}</div>`}
async function traces(){const d=await get('traces','traces',{limit:100});const rows=a(d.traces||d);return `<div class="sectionHead"><div><h2>✎ Карандаш</h2><div class="muted">Записанные маршруты Президента по интерфейсу</div></div><div class="muted">${rows.length}</div></div><div class="list">${rows.map(x=>`<div class="row"><div class="rowTitle">✎ ${esc(p(x,['title','traceCode','trace_code']))}</div><div class="rowMeta">${t(p(x,['createdAt','created_at','startedAt','started_at']))} · ${esc(p(x,['status','recording_status']))}</div><div class="rowMeta">${esc(p(x,['comment']))}</div></div>`).join('')||'<div class="empty">Записей пока нет</div>'}</div>`}
async function structure(){const d=await get('structure','structure');const domains=a(d.domains),concerns=a(d.concerns),coverage=a(d.coverage),spine=a(d.spine);return `<div class="sectionHead"><div><h2>Архитектура SETKA</h2><div class="muted">SETKA → область → контур → сущность → связь → время</div></div></div><div class="two"><div><div class="sectionHead"><h2>Области</h2><div class="muted">${domains.length}</div></div><div class="list">${entityRows(domains)}</div></div><div><div class="sectionHead"><h2>Контуры</h2><div class="muted">${concerns.length}</div></div><div class="list">${entityRows(concerns)}</div></div></div><div class="sectionHead"><h2>Канонический позвоночник</h2><div class="muted">${spine.length}</div></div><div class="list">${entityRows(spine)}</div><div class="sectionHead"><h2>Контроль целостности</h2></div><div class="card json">${esc(JSON.stringify(coverage,null,2))}</div>`}
const pages={home,time:timePage,entities,ship,work,pins,graphs,versions,traces,structure};const labels={home:['Центр управления','Сегодняшняя SETKA · единая Президентская поверхность'],time:['Время и Стенограмма','Вся причинная история системы'],entities:['Сущности','Текущая модель мира SETKA'],ship:['Корабль и экипаж','Сектора, должности, синтетики и рапорты'],work:['Миссии и задачи','Что система делает сейчас'],pins:['Пины','Смысловые точки системы'],graphs:['Графы и измерения','Наблюдение и доказуемая динамика'],versions:['История версий','Прошлое как кадры, а не отдельные системы'],traces:['Карандаш','Записанные маршруты Президента'],structure:['Архитектура','Единая структура SETKA']};
async function go(tab){current=tab;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#pageTitle').textContent=labels[tab][0];$('#pageSub').textContent=labels[tab][1];error('');$('#content').innerHTML='<div class="empty">Загружаю живые данные SETKA…</div>';try{$('#content').innerHTML=await pages[tab]()}catch(e){if(e.message==='NO_SESSION'||e.message==='invalid_president_session'){$('#content').innerHTML=`<div class="login card"><div class="rowTitle">Нужен Президентский вход</div><div class="rowMeta" style="margin:8px 0 16px">Открой единый вход, затем вернись сюда.</div><a class="btn" style="display:inline-block;text-decoration:none" href="foundation-president-recovery.html">Войти в SETKA</a></div>`}else error(e.message)}}window.go=go;
$$('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('#refresh').onclick=()=>{cache={};go(current)};$('#logout').onclick=()=>location.href='foundation-president-recovery.html';go('home');
</script></body></html>
