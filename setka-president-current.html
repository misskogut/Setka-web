<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>SETKA · Сегодня · Президент</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#050505e8;backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px}.brand{font-size:12px;color:#9b9b9b;letter-spacing:.12em}.title{font-size:24px;font-weight:800;margin-top:5px}.sub{color:#9b9b9b;font-size:13px;margin-top:4px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid #1d1d1d;position:sticky;top:83px;background:#050505;z-index:4}.tabs button,.btn{background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 13px;font-weight:700;white-space:nowrap}.tabs button.active{background:#fff;color:#000}.wrap{padding:14px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{border:1px solid #242424;border-radius:16px;background:#0b0b0b;padding:14px;margin-bottom:10px}.n{font-size:26px;font-weight:900}.k{font-size:11px;color:#8b8b8b;letter-spacing:.08em;text-transform:uppercase}.item{padding:12px 0;border-bottom:1px solid #1f1f1f}.item:last-child{border-bottom:0}.main{font-size:15px;font-weight:700}.meta{font-size:12px;color:#8d8d8d;margin-top:5px;word-break:break-word}.pill{display:inline-block;border:1px solid #333;border-radius:999px;padding:3px 7px;font-size:10px;color:#bbb;margin:2px 4px 2px 0}.empty{color:#777;padding:24px;text-align:center}.error{background:#2a0808;border:1px solid #6b2424;padding:12px;border-radius:12px;margin-bottom:12px}.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}.toolbar input{flex:1;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:12px;padding:11px}.hidden{display:none!important}pre{white-space:pre-wrap;word-break:break-word;color:#bbb;font-size:11px}.login{max-width:520px;margin:12vh auto;padding:20px}.login a{color:#fff}.ok{color:#90e4a3}</style></head><body><header><div class="brand">SETKA · ПРЕЗИДЕНТ</div><div class="title">Живая SETKA на сегодня</div><div class="sub">Не старая версия интерфейса. Прямое чтение текущего состояния системы.</div></header><div class="tabs"><button data-tab="overview" class="active">Обзор</button><button data-tab="transcript">Стенограмма</button><button data-tab="entities">Сущности</button><button data-tab="crew">Корабль и экипаж</button><button data-tab="structure">Структура</button><button data-tab="traces">Карандаш</button></div><main class="wrap"><div id="err"></div><section id="login" class="login card hidden"><div class="main">Нет активной Президентской сессии</div><div class="meta" style="margin:10px 0 16px">Сначала войди через единый Президентский вход, потом вернись сюда.</div><a class="btn" href="foundation-president-recovery.html">Войти в SETKA</a></section><section id="overview"></section><section id="transcript" class="hidden"></section><section id="entities" class="hidden"></section><section id="crew" class="hidden"></section><section id="structure" class="hidden"></section><section id="traces" class="hidden"></section></main><script>const API='https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-president-current';const TOKEN_KEYS=['setka:foundation:president:session','setka:foundation:president:control-session','setka:foundation:president:recovery-session'];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let cache={};function token(){for(const k of TOKEN_KEYS){const v=localStorage.getItem(k);if(v)return v}return''}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function humanTime(v){if(!v)return'—';try{return new Date(v).toLocaleString('ru-RU',{timeZone:'Europe/Saratov',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return String(v)}}async function call(action,body={}){const t=token();if(!t)throw new Error('NO_SESSION');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-setka-session':t},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.error||'Ошибка SETKA');return d}function showErr(e){$('#err').innerHTML=e?`<div class="error">${esc(e)}</div>`:''}function stats(c){const names={subjects:'Канонические сущности',facets:'Карточки / грани',transcript:'События Стенограммы',domains:'Области системы',concerns:'Контуры',technicalObjects:'Технические объекты',positions:'Должности',sectors:'Секторы корабля',reports:'Рапорты'};return `<div class="grid">${Object.entries(c||{}).map(([k,v])=>`<div class="card"><div class="k">${esc(names[k]||k)}</div><div class="n">${esc(v)}</div></div>`).join('')}</div>`}async function renderOverview(){const d=cache.overview||(cache.overview=await call('overview'));$('#overview').innerHTML=`<div class="card"><div class="k">Состояние на</div><div class="main">${humanTime(d.asOf)} · Саратов</div><div class="meta ok">Данные читаются прямо из текущей SETKA</div></div>${stats(d.counts)}`}function arr(x){if(Array.isArray(x))return x;if(Array.isArray(x?.items))return x.items;if(Array.isArray(x?.events))return x.events;if(Array.isArray(x?.rows))return x.rows;return[]}function pick(o,ks){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return''}async function renderTranscript(){const d=cache.transcript||(cache.transcript=await call('transcript',{limit:300}));const a=arr(d.items);$('#transcript').innerHTML=`<div class="toolbar"><input id="tq" placeholder="Поиск по Стенограмме"><button class="btn" id="tr">Обновить</button></div><div id="tlist">${transcriptHtml(a)}</div>`;$('#tq').oninput=e=>$('#tlist').innerHTML=transcriptHtml(a.filter(x=>JSON.stringify(x).toLowerCase().includes(e.target.value.toLowerCase())));$('#tr').onclick=async()=>{delete cache.transcript;await renderTranscript()}}function transcriptHtml(a){if(!a.length)return'<div class="empty">События не найдены</div>';return a.map(x=>`<div class="card"><div class="main">${esc(pick(x,['summary','humanSummary','event_type','eventType'])||'Событие')}</div><div class="meta">${esc(pick(x,['event_no','eventNo']))?`№${esc(pick(x,['event_no','eventNo']))} · `:''}${humanTime(pick(x,['occurred_at','occurredAt','created_at','createdAt']))}</div><div class="meta">${esc(pick(x,['event_type','eventType']))} ${esc(pick(x,['entity_type','entityType']))} ${esc(pick(x,['entity_ref','entityRef']))}</div></div>`).join('')}async function renderEntities(){const d=cache.entities||(cache.entities=await call('entities',{limit:400}));const a=arr(d);$('#entities').innerHTML=`<div class="toolbar"><input id="eq" placeholder="Поиск по сущностям"></div><div id="elist">${entityHtml(a)}</div>`;$('#eq').oninput=e=>$('#elist').innerHTML=entityHtml(a.filter(x=>JSON.stringify(x).toLowerCase().includes(e.target.value.toLowerCase())))}function entityHtml(a){if(!a.length)return'<div class="empty">Сущности не найдены</div>';return a.map(x=>`<div class="card"><div class="main">${esc(pick(x,['emoji']))} ${esc(pick(x,['human_name','humanName','display_name','displayName','entity_ref','entityRef']))}</div><div class="meta">${esc(pick(x,['entity_type','entityType','type_code','typeCode']))}</div>${['domain_code','concern_code','canonical_state','effective_anchor_ref','entity_ref'].map(k=>x[k]!=null?`<span class="pill">${esc(k.replaceAll('_',' '))}: ${esc(x[k])}</span>`:'').join('')}</div>`).join('')}async function renderCrew(){const d=cache.crew||(cache.crew=await call('crew'));const p=arr(d.positions),s=arr(d.sectors),r=arr(d.reports);$('#crew').innerHTML=`<div class="card"><div class="main">🚀 Корабль SETKA</div><div class="meta">${s.length} секторов · ${p.length} должностей</div></div><h3>Секторы</h3>${entityHtml(s)}<h3>Должности</h3>${entityHtml(p)}<h3>Последние рапорты</h3>${r.slice(0,30).map(x=>`<div class="card"><div class="main">${esc(pick(x,['position_code','positionCode','synthetic_code','syntheticCode','report_code','reportCode']))}</div><div class="meta">${humanTime(pick(x,['created_at','createdAt','occurred_at']))}</div><div class="meta">${esc(pick(x,['summary','result_summary','resultSummary','status']))}</div></div>`).join('')}`}async function renderStructure(){const d=cache.structure||(cache.structure=await call('structure'));$('#structure').innerHTML=`<h3>Области системы</h3>${entityHtml(arr(d.domains))}<h3>Контуры</h3>${entityHtml(arr(d.concerns))}<h3>Покрытие целостности</h3><pre class="card">${esc(JSON.stringify(d.coverage,null,2))}</pre>`}async function renderTraces(){const d=cache.traces||(cache.traces=await call('traces'));const a=arr(d.traces||d);$('#traces').innerHTML=a.length?a.map(x=>`<div class="card"><div class="main">✎ ${esc(pick(x,['traceCode','trace_code','title']))}</div><div class="meta">${esc(pick(x,['status']))} · ${humanTime(pick(x,['createdAt','created_at','startedAt','started_at']))}</div><div class="meta">${esc(pick(x,['title','comment']))}</div></div>`).join(''):'<div class="empty">Записей Карандаша пока не видно</div>'}const renders={overview:renderOverview,transcript:renderTranscript,entities:renderEntities,crew:renderCrew,structure:renderStructure,traces:renderTraces};async function tab(name){$$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));Object.keys(renders).forEach(k=>$('#'+k).classList.toggle('hidden',k!==name));showErr('');try{await renders[name]()}catch(e){if(e.message==='NO_SESSION'||e.message==='invalid_president_session'){$('#login').classList.remove('hidden');Object.keys(renders).forEach(k=>$('#'+k).classList.add('hidden'))}else showErr(e.message)}}$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));tab('overview');</script></body></html>
