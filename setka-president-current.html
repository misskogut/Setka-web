<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SETKA · Президент</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#090909;border-right:1px solid #222;padding:16px 12px;overflow:auto}.logo{font-size:24px;font-weight:950}.pres{font-size:10px;color:#777;letter-spacing:.14em;margin:5px 0 16px}.nav{display:grid;gap:4px}.nav button,.tabs button{border:0;background:transparent;color:#999;padding:10px 11px;border-radius:10px;font-weight:800;text-align:left;white-space:nowrap}.nav button.active,.tabs button.active{background:#fff;color:#000}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#050505ee;border-bottom:1px solid #222;backdrop-filter:blur(18px)}.title{font-size:20px;font-weight:950}.sub{font-size:11px;color:#777;margin-top:3px}.btn{border:1px solid #333;background:#111;color:#fff;border-radius:10px;padding:8px 11px;font-weight:800}.content{max-width:1400px;margin:auto;padding:16px 16px 85px}.hero,.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.row,.frame{background:#0b0b0b;border:1px solid #232323;border-radius:15px;padding:13px}.hero .card:first-child{grid-column:span 1}.hero h1{font-size:29px;line-height:1.05;margin:6px 0 9px}.muted{font-size:12px;color:#888;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat{background:#0b0b0b;border:1px solid #222;border-radius:14px;padding:12px}.statN{font-size:26px;font-weight:950}.statK{font-size:9px;color:#777;text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:center;margin:17px 0 8px}.head h2{font-size:17px;margin:0}.list{display:grid;gap:7px}.row{cursor:pointer}.row:hover,.frame:hover{border-color:#555}.rowTitle{font-size:14px;font-weight:850}.rowMeta{font-size:11px;color:#777;margin-top:5px;line-height:1.4;word-break:break-word}.hint{font-size:10px;color:#555;margin-top:7px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;border:1px solid #333;border-radius:999px;padding:3px 6px;color:#aaa}.search{width:100%;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:11px;padding:10px;margin-bottom:9px}.film{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.frame{min-width:220px;max-width:220px;cursor:pointer}.frame b{font-size:20px}.empty{padding:30px;text-align:center;color:#666}.error{padding:11px;border:1px solid #613030;background:#2a0d0d;color:#f2b5b5;border-radius:11px}.tabs{display:none}.drawerBg{position:fixed;inset:0;background:#000a;z-index:50;opacity:0;pointer-events:none}.drawerBg.open{opacity:1;pointer-events:auto}.drawer{position:fixed;z-index:60;top:0;right:0;width:min(620px,96vw);height:100vh;background:#0a0a0a;border-left:1px solid #333;transform:translateX(105%);transition:.2s;overflow:auto;padding:16px}.drawer.open{transform:none}.drawerHead{position:sticky;top:-16px;background:#0a0a0af4;padding:16px 0 10px;display:flex;justify-content:space-between;z-index:2}.drawerTitle{font-size:21px;font-weight:950}.drawerType{font-size:11px;color:#777;margin-top:4px}.close{width:38px;height:38px;border:1px solid #333;background:#111;color:#fff;border-radius:11px}.block{border-top:1px solid #222;padding:12px 0}.block h3{font-size:12px;color:#999;margin:0 0 8px}.kv{display:grid;grid-template-columns:145px 1fr;gap:7px;font-size:12px;padding:3px 0}.kv b{color:#777}.json{white-space:pre-wrap;word-break:break-word;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa;background:#070707;border:1px solid #202020;border-radius:10px;padding:9px}@media(max-width:850px){.app{display:block}.side{display:none}.top{padding:12px}.content{padding:12px 10px 92px}.hero,.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;overflow:auto;gap:2px;background:#0a0a0af5;border-top:1px solid #292929;padding:5px 5px calc(5px + env(safe-area-inset-bottom))}.tabs button{font-size:10px}.kv{grid-template-columns:105px 1fr}.drawer{width:100vw}}</style></head><body><div class="app"><aside class="side"><div class="logo">SETKA</div><div class="pres">ПРЕЗИДЕНТ · ЖИВАЯ СИСТЕМА</div><nav class="nav" id="nav"><button data-tab="home" class="active">◉ Центр</button><button data-tab="time">◷ Стенограмма</button><button data-tab="entities">◈ Сущности</button><button data-tab="ship">🚀 Корабль</button><button data-tab="work">✓ Работа</button><button data-tab="pins">📌 Пины</button><button data-tab="graphs">⌁ Графы</button><button data-tab="versions">▣ Версии</button><button data-tab="traces">✎ Карандаш</button><button data-tab="structure">⌘ Архитектура</button></nav></aside><main><header class="top"><div><div id="title" class="title">Центр</div><div id="sub" class="sub">Текущее состояние SETKA</div></div><button id="refresh" class="btn">↻ Обновить</button></header><div id="err" class="content" style="padding-bottom:0"></div><div id="content" class="content"></div></main></div><div class="tabs" id="tabs"><button data-tab="home" class="active">Центр</button><button data-tab="time">Время</button><button data-tab="entities">Сущности</button><button data-tab="ship">Корабль</button><button data-tab="work">Работа</button><button data-tab="pins">Пины</button><button data-tab="versions">Версии</button><button data-tab="traces">Карандаш</button></div><div id="bg" class="drawerBg"></div><aside id="drawer" class="drawer"><div class="drawerHead"><div><div id="dtitle" class="drawerTitle"></div><div id="dtype" class="drawerType"></div></div><button id="close" class="close">×</button></div><div id="dbody"></div></aside><script>const API='https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-president-current',KEYS=['setka:foundation:president:session','setka:foundation:president:control-session','setka:foundation:president:recovery-session'];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let cache={},current='home',store=new Map(),seq=0;function token(){for(const k of KEYS){try{const v=localStorage.getItem(k);if(v)return v}catch{}}return''}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function tt(v){if(!v)return'—';try{return new Date(v).toLocaleString('ru-RU',{timeZone:'Europe/Saratov',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return String(v)}}function arr(x){for(const k of ['items','events','rows','traces'])if(Array.isArray(x?.[k]))return x[k];return Array.isArray(x)?x:[]}function pick(o,ks){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return''}async function call(action,body={}){const tok=token();if(!tok)throw Error('NO_SESSION');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-setka-session':tok},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Ошибка SETKA');return d}async function get(k,a,b){return cache[k]||(cache[k]=await call(a,b))}function label(o){return pick(o,['human_display_label','human_name_ru','display_name_ru','title_ru','title','summary','position_name_ru','sector_name_ru','mission_ref','task_code','pin_code','graph_ref','trace_code','traceCode','object_ref','entity_ref','report_ref'])||'Объект SETKA'}function typ(o){return pick(o,['human_type_name_ru','entity_type','report_kind','graph_kind','event_type','subject_kind','state','lifecycle_state'])||'Сущность'}function reg(o,kind){const id='o'+(++seq);store.set(id,{o,kind});return id}function chips(o){return ['domain_name_ru','concern_name_ru','integration_state','state','anchor_ref','lifecycle_state'].map(k=>o?.[k]!=null&&typeof o[k]!=='object'?`<span class="chip">${esc(o[k])}</span>`:'').join('')}function row(o,kind){const id=reg(o,kind);return `<div class="row" data-detail="${id}"><div class="rowTitle">${esc(pick(o,['entity_emoji','emoji']))} ${esc(label(o))}</div><div class="rowMeta">${esc(typ(o))}</div><div class="chips">${chips(o)}</div><div class="hint">Нажми, чтобы открыть карточку</div></div>`}function rows(a,kind){return a.length?`<div class="list">${a.map(x=>row(x,kind)).join('')}</div>`:'<div class="empty">Ничего не найдено</div>'}function block(t,h){return `<div class="block"><h3>${esc(t)}</h3>${h}</div>`}function lines(o){const keys=['entity_ref','entity_type','human_name_ru','system_name','domain_name_ru','concern_name_ru','integration_state','lifecycle','anchor_ref','anchor_relation','effective_placement_ref','mission_ref','task_code','pin_code','report_ref','session_ref','graph_ref','trace_code','version_no','lifecycle_state','object_ref','event_no','event_type','source_key','occurred_at','created_at','updated_at'];return keys.filter(k=>o?.[k]!=null&&o[k]!==''&&typeof o[k]!=='object').map(k=>`<div class="kv"><b>${esc(k.replaceAll('_',' '))}</b><span>${esc(o[k])}</span></div>`).join('')}function openCard(id){const d=store.get(id);if(!d)return;const o=d.o;$('#dtitle').textContent=label(o);$('#dtype').textContent=d.kind+' · '+typ(o);let h=block('Главное',lines(o));for(const [k,n] of [['canonical_state','Каноническое состояние'],['dynamic_state','Текущее состояние'],['source_registry','Источники'],['classified_relations','Связи'],['relation_registry','Связи'],['container_registry','Размещение'],['anchor_evidence','Доказательство якоря'],['placement_evidence','Доказательство размещения'],['provenance','Происхождение'],['progress','Прогресс'],['readiness','Готовность'],['blockers','Блокеры'],['evidence','Доказательства'],['actions','Действия'],['decisions','Решения'],['state_changes','Изменения состояния'],['pending','Ожидает'],['result','Результат'],['received','Получено'],['details','Детали']])if(o?.[k]!=null&&!['{}','[]'].includes(JSON.stringify(o[k])))h+=block(n,`<div class="json">${esc(JSON.stringify(o[k],null,2))}</div>`);h+=block('Полная карточка',`<div class="json">${esc(JSON.stringify(o,null,2))}</div>`);$('#dbody').innerHTML=h;$('#drawer').classList.add('open');$('#bg').classList.add('open')}function closeCard(){$('#drawer').classList.remove('open');$('#bg').classList.remove('open')}document.addEventListener('click',e=>{const x=e.target.closest('[data-detail]');if(x)openCard(x.dataset.detail)});$('#close').onclick=closeCard;$('#bg').onclick=closeCard;function stat(c){const n={subjects:'Канонические сущности',facets:'Карточки',transcript:'События',domains:'Области',concerns:'Контуры',technicalObjects:'Тех. объекты',positions:'Должности',sectors:'Секторы',reports:'Рапорты',pins:'Пины',tasks:'Задачи',missions:'Миссии',graphs:'Графы'};return `<div class="stats">${Object.entries(c||{}).map(([k,v])=>`<div class="stat"><div class="statN">${esc(v)}</div><div class="statK">${esc(n[k]||k)}</div></div>`).join('')}</div>`}function search(ph){return `<input id="search" class="search" placeholder="${ph}"><div id="result"></div>`}async function home(){const d=await get('overview','overview'),tr=await get('tr','transcript',{limit:20});return `<div class="hero"><div class="card"><div class="muted">SETKA · СЕЙЧАС</div><h1>Живая система<br>в одном месте</h1><div class="muted">Карточки теперь открываются. Внутри видны состояние, источники, связи, размещение и доказательства.</div></div><div class="card"><div style="font-size:36px;font-weight:950;color:#9dddab">LIVE</div><div class="muted">${tt(d.asOf)} · Саратов</div></div></div>${stat(d.counts)}<div class="head"><h2>Последние события</h2></div>${rows(arr(tr.items).slice(0,7),'Событие Стенограммы')}`}async function timePage(){const d=await get('time','transcript',{limit:400});return search('Поиск по Стенограмме')+`<template id="all"></template>`}async function entities(){await get('entities','entities',{limit:500});return search('Поиск по сущностям')}async function ship(){const d=await get('ship','crew');return `<div class="head"><h2>Секторы</h2></div>${rows(arr(d.sectors),'Сектор корабля')}<div class="head"><h2>Должности</h2></div>${rows(arr(d.positions),'Должность')}<div class="head"><h2>Последние рапорты</h2></div>${rows(arr(d.reports).slice(0,100),'Рапорт')}`}async function work(){const d=await get('work','work',{limit:300});return `<div class="head"><h2>Миссии</h2></div>${rows(arr(d.missions),'Миссия')}<div class="head"><h2>Задачи</h2></div>${rows(arr(d.tasks),'Задача')}`}async function pins(){await get('pins','pins',{limit:400});return search('Поиск по PIN')}async function graphs(){const d=await get('graphs','graphs',{limit:200});return `<div class="head"><h2>Канонические графы</h2></div>${rows(arr(d.graphs),'Граф')}<div class="head"><h2>Живые запросы</h2></div>${rows(arr(d.requests),'Запрос графа')}<div class="head"><h2>Измерения</h2></div>${rows(arr(d.points).slice(0,100),'Точка измерения')}`}async function versions(){const d=await get('versions','versions',{limit:400}),a=arr(d);return `<div class="head"><h2>Лента истории</h2><span class="muted">каждый кадр открывается</span></div><div class="film">${a.map(x=>`<div class="frame" data-detail="${reg(x,'Кадр истории версии')}"><b>v${esc(pick(x,['version_no']))}</b><div class="rowMeta">${esc(pick(x,['family_signature','object_ref']))}</div><div class="hint">Открыть кадр</div></div>`).join('')}</div>`}async function traces(){const d=await get('traces','traces');return `<div class="head"><h2>Записи Карандаша</h2></div>${rows(arr(d.traces||d),'Запись пути')}`}async function structure(){const d=await get('structure','structure');return `<div class="two"><div><div class="head"><h2>Области</h2></div>${rows(arr(d.domains),'Область системы')}</div><div><div class="head"><h2>Контуры</h2></div>${rows(arr(d.concerns),'Контур системы')}</div></div><div class="head"><h2>Целостность</h2></div>${rows(arr(d.coverage),'Проверка целостности')}`}const pages={home,time:timePage,entities,ship,work,pins,graphs,versions,traces,structure},titles={home:['Центр','Текущее состояние SETKA'],time:['Стенограмма','Позвоночник времени'],entities:['Сущности','Карточки, связи, источники'],ship:['Корабль','Сектора, должности, рапорты'],work:['Работа','Миссии и задачи'],pins:['Пины','Смысловые узлы'],graphs:['Графы','Наблюдение и измерения'],versions:['Версии','История системы'],traces:['Карандаш','Записи пути'],structure:['Архитектура','Области и контуры']};function sourceFor(tab){if(tab==='time')return arr(cache.time?.items);if(tab==='entities')return arr(cache.entities);if(tab==='pins')return arr(cache.pins);return[]}function bindSearch(tab){const q=$('#search'),r=$('#result');if(!q||!r)return;const all=sourceFor(tab);const draw=()=>{store.clear();seq=0;const s=q.value.toLowerCase(),f=s?all.filter(x=>JSON.stringify(x).toLowerCase().includes(s)):all;r.innerHTML=rows(f,tab==='entities'?'Карточка сущности':tab==='pins'?'PIN':'Событие Стенограммы')};q.oninput=draw;draw()}async function go(tab){current=tab;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#title').textContent=titles[tab][0];$('#sub').textContent=titles[tab][1];$('#err').innerHTML='';store.clear();seq=0;try{$('#content').innerHTML=await pages[tab]();bindSearch(tab)}catch(e){if(e.message==='NO_SESSION'||e.message==='invalid_president_session')$('#content').innerHTML='<div class="card"><div class="rowTitle">Нужен вход Президента</div><div class="muted" style="margin:10px 0 14px">Сначала открой единый Президентский вход.</div><a class="btn" href="foundation-president-recovery.html">Войти в SETKA</a></div>';else $('#err').innerHTML=`<div class="error">${esc(e.message)}</div>`}}$$('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('#refresh').onclick=()=>{cache={};go(current)};go('home');</script></body></html>
