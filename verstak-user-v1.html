<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f3ee" />
<title>VERSTAK</title>
<style>
:root{--bg:#f5f3ee;--paper:#fbfaf7;--ink:#20201d;--muted:#7b7a73;--line:#ddd9cf;--soft:#ebe8df;--accent:#262622;--good:#59705f;--warn:#896f45;--radius:18px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:980px;margin:0 auto;min-height:100vh;padding:24px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10;padding:9px 0 14px;background:linear-gradient(var(--bg) 75%,transparent)}.brand{font-weight:730;letter-spacing:.15em;font-size:13px}.scope{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.02em}.top-actions{display:flex;gap:8px}.iconbtn,.pill,.tiny{border:1px solid var(--line);background:rgba(251,250,247,.82);border-radius:999px;padding:8px 12px}.iconbtn{min-width:38px}.timebox{padding:10px 4px 20px}.timeaxis{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;color:var(--muted);font-size:12px;letter-spacing:.08em}.timeaxis .past{text-align:right}.timeaxis .future{text-align:left}.rail{height:1px;background:var(--line);position:relative}.nowdot{width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--bg)}.periods{display:flex;justify-content:center;gap:7px;margin-top:14px}.pill{padding:6px 11px;color:var(--muted);background:transparent}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}.surface{display:none;margin:2px 0 22px}.surface.show{display:block}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.sectiontitle{font-weight:650;font-size:13px}.sectionnote{font-size:12px;color:var(--muted)}.pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.pin{border:1px solid var(--line);background:rgba(251,250,247,.72);border-radius:15px;padding:13px;min-height:82px}.pin .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.pin .v{margin-top:5px;font-weight:590}.feed{display:flex;flex-direction:column;gap:10px}.empty,.statuscard{border:1px dashed var(--line);border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center}.event{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:0 2px 10px rgba(40,38,32,.025)}.event.sys{background:transparent}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--good)}.summary{font-size:15px}.event-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.tiny{padding:5px 9px;background:transparent;color:var(--muted);font-size:12px}.tiny:hover{color:var(--ink);border-color:#bdb8ad}.evidence{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--soft);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5e5d57;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}.evidence.open{display:block}.assistantmsg{border-left:2px solid var(--ink);padding:3px 0 3px 13px;margin:12px 3px}.assistantmsg .who{font-size:11px;color:var(--muted);margin-bottom:4px}.report{background:var(--ink);color:#f8f6f0;border-radius:var(--radius);padding:17px;margin-bottom:13px}.report h3{margin:0 0 8px;font-size:15px}.report .stats{display:flex;gap:18px;flex-wrap:wrap}.stat b{font-size:20px;display:block}.stat span{font-size:11px;opacity:.65}.needs{margin-top:10px}.need{padding:10px 0;border-top:1px solid rgba(255,255,255,.13)}.need:first-child{border-top:0}.need small{opacity:.65}.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(transparent,rgba(245,243,238,.96) 28%)}.composebox{max-width:940px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--paper);border:1px solid #cec9bd;border-radius:22px;padding:8px 9px 8px 11px;box-shadow:0 8px 30px rgba(31,29,24,.09)}.plus{border:0;background:transparent;font-size:22px;line-height:32px;color:var(--muted)}textarea{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:32px;max-height:120px;padding:6px 2px}.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:#fff}.send:disabled{opacity:.35}.drawer{position:fixed;inset:0;z-index:40;display:none;background:rgba(26,25,22,.18);backdrop-filter:blur(3px)}.drawer.open{display:block}.panel{position:absolute;top:0;right:0;width:min(420px,92vw);height:100%;overflow:auto;background:var(--paper);border-left:1px solid var(--line);padding:22px}.paneltop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:24px}.worldgroup{margin-top:22px}.worldgroup h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.worlditem{padding:10px 0;border-bottom:1px solid var(--soft)}.worlditem b{display:block}.worlditem small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;z-index:60;background:#222;color:#fff;border-radius:999px;padding:8px 13px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.gate{max-width:560px;margin:18vh auto;text-align:center}.gate h1{letter-spacing:.16em;font-size:18px}.gate p{color:var(--muted)}.gate input{width:100%;border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:12px;margin:12px 0}.gate button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 16px}@media(max-width:620px){.app{padding:12px 11px 108px}.top{padding-top:5px}.scope{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event{padding:13px}.sectionnote{display:none}.timeaxis{font-size:10px}.report .stats{gap:12px}.stat b{font-size:17px}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden><h1>VERSTAK</h1><p>Для этого тестового входа нужен ключ сессии корабля.</p><input id="manualToken" type="password" placeholder="Ключ сессии" autocomplete="off"><button id="enterBtn">Открыть верстак</button></div>
<div id="main" class="app" hidden>
  <header class="top"><div><div class="brand">VERSTAK</div><div id="scopeLabel" class="scope">подключение…</div></div><div class="top-actions"><button id="worldBtn" class="iconbtn">Мир</button><button id="plusTop" class="iconbtn" title="Добавить">＋</button></div></header>
  <section class="timebox">
    <div class="timeaxis"><div class="past">ПРОШЛОЕ</div><div class="rail"></div><div class="nowdot" title="Сейчас"></div><div class="rail"></div><div class="future">БУДУЩЕЕ</div></div>
    <div class="periods"><button class="pill active" data-days="7">7 дней</button><button class="pill" data-days="30">30 дней</button><button class="pill" data-days="90">90 дней</button></div>
  </section>
  <section id="surface" class="surface"><div class="sectionhead"><div class="sectiontitle">На верстаке</div><div class="sectionnote">закреплённое</div></div><div id="pins" class="pins"></div></section>
  <section><div class="sectionhead"><div><div class="sectiontitle">Стенограмма</div><div id="periodLabel" class="sectionnote">последние 7 дней</div></div><button id="reportBtn" class="tiny">Отчёт</button></div><div id="report"></div><div id="feed" class="feed"><div class="statuscard">VERSTAK смотрит…</div></div></section>
</div>
<div class="composer" id="composer" hidden><div class="composebox"><button id="plusBottom" class="plus" title="Добавить">＋</button><textarea id="input" rows="1" placeholder="Спросить, добавить или изменить…"></textarea><button id="send" class="send">↑</button></div></div>
<div id="drawer" class="drawer"><div class="panel"><div class="paneltop"><div><div class="brand">МИР</div><div id="worldScope" class="scope"></div></div><button id="closeDrawer" class="close">×</button></div><div id="worldContent"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='https://gfchgaphzhxufwdhrcis.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';
let token='',days=7,state=null,boot=null,busy=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getToken(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const q=new URLSearchParams(location.search);let t=h.get('session')||q.get('session')||sessionStorage.getItem('verstak_session')||'';if(t){sessionStorage.setItem('verstak_session',t);if(location.hash||q.get('session'))history.replaceState(null,'',location.pathname)}return t}
async function rpc(name,body){const r=await fetch(API+name,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}
function fmtDate(s){if(!s)return '';const d=new Date(s);return d.toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function shipName(code){const ships=state?.ships||[];return ships.find(x=>(x.shipCode||x.ship_code)===code)?.displayNameRu||((code||'').includes('SASHA')?'Корабль Саши':(state?.scopeMode==='MOTHER_FLEET'?'Материнский VERSTAK':'VERSTAK'))}
function eventCard(e,isSystem=false){const summary=e.summary_ru||e.summary||e.event_type||'Событие';const when=e.occurred_at||e.occurredAt;const code=e.ship_code||state?.shipCode;const ev=esc(JSON.stringify(e.payload||{},null,2));const canPin=!isSystem && boot?.projects?.length>0 && (!e.project_id || boot.projects.some(p=>p.id===e.project_id));return `<article class="event ${isSystem?'sys':''}"><div class="meta"><span class="dot"></span><span>${esc(fmtDate(when))}</span>${code?`<span>· ${esc(shipName(code))}</span>`:''}<span>· ${esc(e.event_type||e.entity_type||'')}</span></div><div class="summary">${esc(summary)}</div><div class="event-actions">${Object.keys(e.payload||{}).length?`<button class="tiny evEvidence">Данные</button>`:''}${canPin?`<button class="tiny evPin" data-event="${esc(e.event_no||'')}">Закрепить</button>`:''}</div>${Object.keys(e.payload||{}).length?`<div class="evidence">${ev}</div>`:''}</article>`}
function renderReport(r){if(!r?.ok){$('#report').innerHTML='';return}const s=r.summary||{};const needs=r.informationNeeds||[];$('#report').innerHTML=`<div class="report"><h3>За ${r.days} дней</h3><div class="stats"><div class="stat"><b>${s.shipEventCount??0}</b><span>событий</span></div><div class="stat"><b>${s.guardCaseCount??0}</b><span>границ понимания</span></div><div class="stat"><b>${s.aiCaseCount??0}</b><span>обращений к ИИ</span></div><div class="stat"><b>${s.openInformationNeeds??0}</b><span>нужно данных</span></div></div>${needs.length?`<div class="needs"><small>Чего сейчас не хватает</small>${needs.slice(0,5).map(n=>`<div class="need"><b>${esc(n.requested_key||n.need_kind||'Новые данные')}</b><br><small>${esc(n.rationale_ru||'')}</small></div>`).join('')}</div>`:''}</div>`}
function render(){const mode=state?.scopeMode;$('#scopeLabel').textContent=mode==='MOTHER_FLEET'?'Материнский · весь доступный флот':(boot?.ship?.display_name_ru||'Личный корабль');$('#worldScope').textContent=$('#scopeLabel').textContent;$('#periodLabel').textContent=`последние ${days} дней`;let arr=[...(state?.timeline||[])];if(mode==='MOTHER_FLEET')arr=[...arr,...(state?.systemTranscript||[]).map(x=>({...x,_system:true}))].sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,100);$('#feed').innerHTML=arr.length?arr.map(e=>eventCard(e,e._system)).join(''):`<div class="empty">За выбранный период нет событий, которые фронт может показать.</div>`;$$('.evEvidence').forEach(b=>b.onclick=()=>b.closest('.event').querySelector('.evidence')?.classList.toggle('open'));$$('.evPin').forEach(b=>b.onclick=()=>pinEvent(b));renderPins();renderWorld()}
function renderPins(){const pins=boot?.pins||[];const surface=$('#surface'),box=$('#pins');if(!pins.length){surface.classList.remove('show');box.innerHTML='';return}surface.classList.add('show');box.innerHTML=pins.slice(0,12).map(p=>`<div class="pin"><div class="k">${esc(p.target_label||p.screen_key||'Закреплено')}</div><div class="v">${esc(p.comment_ru||p.pin_code)}</div></div>`).join('')}
function renderWorld(){const out=[];if(state?.ships?.length)out.push(`<div class="worldgroup"><h4>Корабли</h4>${state.ships.map(s=>`<div class="worlditem"><b>${esc(s.displayNameRu||s.shipCode)}</b><small>${esc(s.shipCode)}</small></div>`).join('')}</div>`);if(boot?.projects?.length)out.push(`<div class="worldgroup"><h4>Проекты</h4>${boot.projects.map(p=>`<div class="worlditem"><b>${esc(p.title_ru)}</b><small>${esc(p.status)}</small></div>`).join('')}</div>`);if(boot?.projectIdentities?.length)out.push(`<div class="worldgroup"><h4>Сущности проекта</h4>${boot.projectIdentities.map(i=>`<div class="worlditem"><b>${esc(i.display_name_ru)}</b><small>${esc(i.nature)} · ${esc(i.runtime_state)}</small></div>`).join('')}</div>`);if(state?.informationNeeds?.length)out.push(`<div class="worldgroup"><h4>Нужны данные</h4>${state.informationNeeds.map(n=>`<div class="worlditem"><b>${esc(n.requested_key||n.need_kind)}</b><small>${esc(n.rationale_ru||'')}</small></div>`).join('')}</div>`);if(!out.length)out.push('<div class="empty" style="margin-top:22px">Мир ещё почти пуст. Добавляйте данные и сущности обычным языком.</div>');$('#worldContent').innerHTML=out.join('')}
async function load(){busy=true;try{const [s,b]=await Promise.all([rpc('api_verstak_front_state_session_v1',{p_session_token:token,p_days:days,p_limit:80}),rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'bootstrap',p_payload:{}}).catch(()=>null)]);if(!s?.ok)throw new Error(s?.error||'Сессия недоступна');state=s;boot=b?.ok?b:null;render()}catch(e){sessionStorage.removeItem('verstak_session');$('#main').hidden=true;$('#composer').hidden=true;$('#gate').hidden=false;toast(e.message)}finally{busy=false}}
async function report(){try{$('#reportBtn').disabled=true;const r=await rpc('api_verstak_period_report_session_v1',{p_session_token:token,p_days:days});renderReport(r)}catch(e){toast(e.message)}finally{$('#reportBtn').disabled=false}}
async function ask(text){text=(text||'').trim();if(text.length<2||busy)return;busy=true;$('#send').disabled=true;$('#input').value='';const temp=document.createElement('div');temp.className='assistantmsg';temp.innerHTML=`<div class="who">Вы</div>${esc(text)}`;$('#feed').prepend(temp);try{const projectId=boot?.projects?.[0]?.id||null;const r=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'board_query',p_payload:{questionRu:text,projectId}});const ans=document.createElement('div');ans.className='assistantmsg';ans.innerHTML=`<div class="who">VERSTAK · ${esc(r.answeredBy||'CORE')}</div>${esc(r.messageRu||r.error||'Ответ принят.')}`;$('#feed').prepend(ans);await load()}catch(e){toast(e.message)}finally{busy=false;$('#send').disabled=false}}
async function pinEvent(btn){const n=btn.dataset.event;const e=(state?.timeline||[]).find(x=>String(x.event_no)===String(n));const p=boot?.projects?.find(x=>x.id===e?.project_id)||boot?.projects?.[0];if(!e||!p){toast('Для этого события пока нет доступной поверхности закрепления');return}btn.disabled=true;try{const r=await rpc('api_verstak_action_session_v1',{p_session_token:token,p_action:'create_pin',p_payload:{projectId:p.id,screenKey:'timeline',targetKey:`event:${e.event_no}`,targetLabel:e.object_kind||'Событие',commentRu:e.summary_ru||'Закреплённое событие'}});if(r.ok){toast('Закреплено на верстаке');await load()}else toast(r.error||'Не удалось закрепить')}catch(err){toast(err.message)}finally{btn.disabled=false}}
function openAdd(){const i=$('#input');i.focus();if(!i.value)i.placeholder='Добавьте сущность, событие, данные или источник обычным языком…'}
$$('.pill').forEach(b=>b.onclick=async()=>{days=+b.dataset.days;$$('.pill').forEach(x=>x.classList.toggle('active',x===b));$('#report').innerHTML='';await load()});$('#reportBtn').onclick=report;$('#worldBtn').onclick=()=>$('#drawer').classList.add('open');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#drawer').onclick=e=>{if(e.target.id==='drawer')$('#drawer').classList.remove('open')};$('#plusTop').onclick=openAdd;$('#plusBottom').onclick=openAdd;$('#send').onclick=()=>ask($('#input').value);$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}};$('#input').oninput=e=>{e.target.style.height='32px';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'};$('#enterBtn').onclick=()=>{const t=$('#manualToken').value.trim();if(t.length>=24){token=t;sessionStorage.setItem('verstak_session',t);$('#gate').hidden=true;$('#main').hidden=false;$('#composer').hidden=false;load()}};
(async function init(){token=getToken();if(!token){$('#gate').hidden=false;return}$('#main').hidden=false;$('#composer').hidden=false;await load()})();
</script>
</body>
</html>
