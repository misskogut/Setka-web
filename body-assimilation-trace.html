<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · TEMPORAL ASSIMILATION TRACE</title><style>:root{color-scheme:dark;--bg:#030814;--panel:rgba(4,12,24,.90);--line:#304965;--text:#eef6ff;--muted:#9bb0c8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px;align-items:center}.pill,.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:9px;font:10px inherit}.btn.active{border-color:#91c4ff;background:rgba(24,48,75,.95)}#hud{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:35;background:rgba(4,12,24,.92);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}#row{display:flex;justify-content:space-between;gap:8px;font-size:10px}#name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:63vw}#time{color:#d8f5ff}.meta{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.35}.track{height:5px;background:#0c1a2a;border-radius:99px;margin-top:9px;position:relative;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#66e4ff,#fff2a6,#ff8bd7)}input[type=range]{width:100%;margin:8px 0 0;accent-color:#8fdcff}.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:8px;color:#b8c9dd}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.a{background:#68e1ff}.p{background:#ffd36b}.s{background:#ffffff}.t{background:#ff79d8}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · TEMPORAL ASSIMILATION TRACE</b><small>тот же frozen snapshot · 115 фактических интеграций · temporal path</small></div><button class="btn active" id="play">PAUSE</button><button class="btn active" id="traceBtn">TRACE</button><button class="btn" id="graph">GRAPH</button><button class="btn" id="reset">RESET</button></div><div id="hud"><div id="row"><div id="name">загрузка…</div><div id="time">0.000 ms</div></div><div class="meta" id="meta">ожидание данных</div><div class="track"><div class="fill" id="fill"></div></div><input id="scrub" type="range" min="0" max="1000" value="0"><div class="legend"><span><i class="dot t"></i>временная линия интеграций</span><span><i class="dot a"></i>организм</span><span><i class="dot p"></i>provenance</span><span><i class="dot s"></i>anchors</span></div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA выдаёт замороженное тело и фактическую временную траекторию…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',TR='ASSIM-TRACE-B814F1FB94A45622';const app=document.getElementById('app'),loader=document.getElementById('loader'),nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),metaEl=document.getElementById('meta'),fill=document.getElementById('fill'),scrub=document.getElementById('scrub');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.autoRotate=true;controls.autoRotateSpeed=.18;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.05));let nodes=new Map(),points,edges,traceLine,traceGlow,head,markers=[],traceData,duration=1,current=0,playing=true,last=performance.now(),visualDuration=17000;async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(`${fn} ${r.status}`);return r.json()}function roleColor(audit){if(audit==='REAL_ENTITY_MISSING_PASSPORT')return 0x68e1ff;if(audit==='PROVENANCE_OR_SOURCE')return 0xffd36b;if(audit==='STRUCTURAL_ANCHOR')return 0xffffff;return 0xf0a6ff}async function load(){const [d,t]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_body_update_assimilation_trace_v1',{p_trace_ref:TR})]);traceData=t;duration=+t.durationMs||1;const a=d.nodes||d.payload?.nodes||[],e=d.edges||d.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i],o={id:v[0],type:v[2],gen:+v[3],deg:+v[5],name:v[6],x:+v[9],y:+v[10],z:+v[11]};nodes.set(o.id,o);pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;const c=new THREE.Color();c.setHSL((.76+o.gen*.035)%1,.48,.42);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.043,vertexColors:true,transparent:true,opacity:.48,depthWrite:false}));scene.add(points);const ep=[];for(const z of e){const A=nodes.get(z[0]),B=nodes.get(z[1]);if(A&&B)ep.push(A.x,A.y,A.z,B.x,B.y,B.z)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));edges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8e6bb4,transparent:true,opacity:.03,depthWrite:false}));edges.visible=false;scene.add(edges);const tracePts=t.trace.map(v=>new THREE.Vector3(+v[3],+v[4],+v[5]));const tg=new THREE.BufferGeometry().setFromPoints(tracePts);traceLine=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xff79d8,transparent:true,opacity:.92,depthWrite:false,blending:THREE.AdditiveBlending}));traceGlow=new THREE.Line(tg.clone(),new THREE.LineBasicMaterial({color:0x7cecff,transparent:true,opacity:.20,depthWrite:false,blending:THREE.AdditiveBlending}));traceLine.geometry.setDrawRange(0,1);traceGlow.geometry.setDrawRange(0,1);scene.add(traceGlow);scene.add(traceLine);head=new THREE.Mesh(new THREE.SphereGeometry(.17,18,12),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.98,depthWrite:false,blending:THREE.AdditiveBlending}));head.visible=false;scene.add(head);const mg=new THREE.SphereGeometry(.085,10,7);for(const v of t.trace){const m=new THREE.Mesh(mg,new THREE.MeshBasicMaterial({color:roleColor(v[8]),transparent:true,opacity:.025,depthWrite:false,blending:THREE.AdditiveBlending}));m.position.set(+v[3],+v[4],+v[5]);m.userData={eventNo:+v[0],ms:+v[1],id:v[2],name:v[6],role:v[7],audit:v[8]};scene.add(m);markers.push(m)}fit();loader.style.display='none';update(0)}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.14;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}function update(ms){current=Math.max(0,Math.min(duration,ms));scrub.value=Math.round(current/duration*1000);fill.style.width=`${current/duration*100}%`;let latest=-1,assimilated=0;for(let i=0;i<markers.length;i++){const m=markers[i],dt=current-m.userData.ms;if(dt>=0){assimilated++;latest=i}const hot=dt>=0&&dt<45,warm=dt>=45&&dt<140;if(hot){m.material.opacity=.98;m.scale.setScalar(2.7)}else if(warm){m.material.opacity=.36;m.scale.setScalar(1.55)}else if(dt>=0){m.material.opacity=.13;m.scale.setScalar(1)}else{m.material.opacity=.018;m.scale.setScalar(.78)}}const draw=Math.max(1,latest+1);traceLine.geometry.setDrawRange(0,draw);traceGlow.geometry.setDrawRange(0,draw);if(latest>=0){const m=markers[latest],e=m.userData;head.visible=true;head.position.copy(m.position);head.scale.setScalar(1+0.25*Math.sin(performance.now()/90));nameEl.textContent=`#${e.eventNo} · ${e.name}`;metaEl.textContent=`ASSIMILATED ${assimilated}/115 · temporal segment ${Math.max(0,assimilated-1)}/114 · ${e.audit}`;}else{head.visible=false;nameEl.textContent='первое зафиксированное усвоение ещё не наступило';metaEl.textContent='линия соединяет только последовательность фактических metabolism events; это временная трасса, не новое ребро графа'}timeEl.textContent=`${current.toFixed(3)} ms`;}function animate(t){requestAnimationFrame(animate);const dt=t-last;last=t;if(playing){current+=dt*(duration/visualDuration);if(current>duration)current=0;update(current)}else if(head.visible){head.scale.setScalar(1+0.25*Math.sin(performance.now()/90))}controls.update();renderer.render(scene,camera)}document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'PAUSE':'PLAY';e.currentTarget.classList.toggle('active',playing)};document.getElementById('traceBtn').onclick=e=>{const v=!traceLine.visible;traceLine.visible=v;traceGlow.visible=v;head.visible=v&&current>=0;e.currentTarget.classList.toggle('active',v)};document.getElementById('graph').onclick=e=>{edges.visible=!edges.visible;e.currentTarget.classList.toggle('active',edges.visible)};document.getElementById('reset').onclick=()=>{current=0;update(0);fit()};scrub.addEventListener('input',()=>{playing=false;document.getElementById('play').textContent='PLAY';document.getElementById('play').classList.remove('active');update(+scrub.value/1000*duration)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load().then(()=>animate(performance.now())).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
