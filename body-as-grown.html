#status{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;background:rgba(3,10,20,.74);border:1px solid rgba(46,70,100,.65);border-radius:9px;padding:6px 9px;color:#a8bed5;font-size:9px;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.label{position:fixed;z-index:18;pointer-events:none;transform:translate(-50%,-50%);background:rgba(2,8,18,.7);border:1px solid rgba(130,160,200,.35);border-radius:7px;padding:3px 5px;font-size:8px;white-space:nowrap;backdrop-filter:blur(5px);text-shadow:0 1px 3px #000}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.frame{display:grid;grid-template-columns:60px 1fr 1fr 1fr;gap:6px;padding:4px 0;border-bottom:1px solid rgba(90,120,160,.12);font-size:9px}.warn{margin-top:8px;padding:8px;border:1px solid rgba(255,190,90,.28);border-radius:9px;color:#e5c997;font-size:9px;line-height:1.45}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const SUPABASE='https://gfchgaphzhxufwdhrcis.supabase.co';const KEY='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv';const runRef=new URLSearchParams(location.search).get('run')||null;
const app=document.getElementById('app'),status=document.getElementById('status'),subtitle=document.getElementById('subtitle'),loader=document.getElementById('loader'),loadText=document.getElementById('loadText'),infoDrawer=document.getElementById('infoDrawer'),nodeDrawer=document.getElementById('nodeDrawer'),infoBody=document.getElementById('infoBody'),nodeBody=document.getElementById('nodeBody'),nodeTitle=document.getElementById('nodeTitle');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300);camera.position.set(8,5,14);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.enablePan=true;controls.autoRotate=true;controls.autoRotateSpeed=.28;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.15));
let DATA,points,graphEdges,growthEdges,nodeMap=new Map(),indexToNode=[],hubGroup=new THREE.Group();scene.add(hubGroup);const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.16;const pointer=new THREE.Vector2();
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function hash01(s){return (hash32(s)%1000000)/1000000}function unitFromHash(s){const u=hash01(s+'u'),v=hash01(s+'v');const z=2*u-1,a=2*Math.PI*v,r=Math.sqrt(Math.max(0,1-z*z));return new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),z)}function colorForGeneration(g){const c=new THREE.Color();c.setHSL((.58+g*.11)%1,.72,.58);return c}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v){return `<div class="row"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}
async function load(){const t0=performance.now();const res=await fetch(`${SUPABASE}/rest/v1/rpc/setka_body_as_grown_scene_v1`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_run_ref:runRef})});if(!res.ok)throw new Error(`RPC ${res.status}: ${await res.text()}`);DATA=await res.json();if(!DATA.ok)throw new Error(DATA.state||'scene failed');build(DATA);const ms=Math.round(performance.now()-t0);subtitle.textContent=`${DATA.runRef} · ${DATA.grownNodes.toLocaleString()} nodes · ${DATA.internalEdges.toLocaleString()} edges`;status.textContent=`BODY_AS_GROWN ready · ${ms} ms browser · ${DATA.growthGenerations} generations · history replay OFF`;loader.style.display='none'}
function build(d){const byGen=new Map();for(const v of d.nodes){const o={id:v[0],parent:v[1],type:v[2],generation:+v[3],x:+v[4],degree:+v[5]};nodeMap.set(o.id,o);if(!byGen.has(o.generation))byGen.set(o.generation,[]);byGen.get(o.generation).push(o)}
const root=[...nodeMap.values()].find(o=>o.generation===0);if(root){root.pos=new THREE.Vector3(0,0,0)}
const gens=[...byGen.keys()].sort((a,b)=>a-b);for(const g of gens){if(g===0)continue;for(const o of byGen.get(g)){const p=o.parent?nodeMap.get(o.parent):null;let dir;if(!p||!p.pos||p.pos.lengthSq()<1e-9){dir=unitFromHash(o.id)}else{const base=p.pos.clone().normalize();const jitter=unitFromHash(o.id);const spread=Math.max(.18,.56/(g+0.15));dir=base.multiplyScalar(1-spread).add(jitter.multiplyScalar(spread)).normalize()}const radius=g*3.1+o.x*1.25;o.pos=dir.multiplyScalar(radius)}}
const n=d.nodes.length,pos=new Float32Array(n*3),cols=new Float32Array(n*3);let maxDegree=1;for(const o of nodeMap.values())maxDegree=Math.max(maxDegree,o.degree);for(let i=0;i<d.nodes.length;i++){const id=d.nodes[i][0],o=nodeMap.get(id);indexToNode[i]=o;const c=colorForGeneration(o.generation);const boost=.72+.28*Math.min(1,Math.log1p(o.degree)/Math.log1p(maxDegree));pos[i*3]=o.pos.x;pos[i*3+1]=o.pos.y;pos[i*3+2]=o.pos.z;cols[i*3]=c.r*boost;cols[i*3+1]=c.g*boost;cols[i*3+2]=c.b*boost}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cols,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.92,sizeAttenuation:true,depthWrite:false}));scene.add(points);
const full=[],fullC=[];for(const e of d.edges){const a=nodeMap.get(e[0]),b=nodeMap.get(e[1]);if(!a||!b)continue;full.push(a.pos.x,a.pos.y,a.pos.z,b.pos.x,b.pos.y,b.pos.z);const c=new THREE.Color().setHSL(hash01(e[2]||e[3]),.45,.43);fullC.push(c.r,c.g,c.b,c.r,c.g,c.b)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(full,3));eg.setAttribute('color',new THREE.Float32BufferAttribute(fullC,3));graphEdges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.055,depthWrite:false}));scene.add(graphEdges);
const grow=[],growC=[];for(const o of nodeMap.values()){if(!o.parent)continue;const p=nodeMap.get(o.parent);if(!p)continue;grow.push(p.pos.x,p.pos.y,p.pos.z,o.pos.x,o.pos.y,o.pos.z);const c=colorForGeneration(o.generation);growC.push(c.r,c.g,c.b,c.r,c.g,c.b)}const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(grow,3));gg.setAttribute('color',new THREE.Float32BufferAttribute(growC,3));growthEdges=new THREE.LineSegments(gg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.28,depthWrite:false}));scene.add(growthEdges);
const sorted=[...nodeMap.values()].sort((a,b)=>b.degree-a.degree),threshold=sorted[Math.min(sorted.length-1,Math.floor(sorted.length*.006))]?.degree||20,sphereGeo=new THREE.SphereGeometry(.09,8,6);for(const o of sorted){if(o.degree<threshold)break;const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:colorForGeneration(o.generation),transparent:true,opacity:.9,depthWrite:false}));m.position.copy(o.pos);m.userData.nodeId=o.id;hubGroup.add(m)}fillInfo(d);fitCamera()}
function fillInfo(d){let html=row('run',d.runRef)+row('режим',d.growthMode)+row('состояние',d.resultState)+row('закон',d.equation)+row('r',d.r)+row('x₀',d.x0)+row('статус закона',d.lawStatus)+row('узлы графа',d.graphNodes)+row('выросло',d.grownNodes)+row('вне связного тела',d.disconnectedNodes)+row('фактические связи',d.internalEdges)+row('поколения',d.growthGenerations);html+='<div class="row"><span class="k">рост:</span></div>';for(const f of d.growthFrames||[])html+=`<div class="frame"><span>g${f.generation}</span><span>+${Number(f.bornNodes).toLocaleString()}</span><span>Σ ${Number(f.cumulativeNodes).toLocaleString()}</span><span>x=${Number(f.x).toFixed(6)}</span></div>`;html+='<div class="warn">Это BODY_AS_GROWN: исторический порядок ручной разработки не воспроизводится. Узлы активируются синхронно по расстоянию от SYSTEM:SETKA; одна и та же экспериментальная рекуррентная координата применяется на каждом масштабе. 3D-положение на экране — только наблюдательная проекция дерева роста и НЕ заявляется как внутренняя евклидова геометрия SETKA. Канон не изменён.</div>';infoBody.innerHTML=html}
function fitCamera(){const box=new THREE.Box3().setFromObject(points),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.15;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}
function showNode(o){if(!o)return;nodeTitle.textContent=o.type+' · '+o.id;nodeBody.innerHTML=row('generation',o.generation)+row('bifurcation x',o.x.toFixed(12))+row('degree',o.degree)+row('parent witness',o.parent||'ROOT')+row('presentation position',`${o.pos.x.toFixed(3)} / ${o.pos.y.toFixed(3)} / ${o.pos.z.toFixed(3)}`)+row('важно','position = presentation only; topology and growth witness are factual/derived from the experiment') ;nodeDrawer.classList.remove('closed')}
function pick(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects(hubGroup.children,false);if(hits.length){showNode(nodeMap.get(hits[0].object.userData.nodeId));return}hits=raycaster.intersectObject(points,false);if(hits.length)showNode(indexToNode[hits[0].index])}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(moved<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);down=null});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('infoBtn').onclick=()=>infoDrawer.classList.toggle('closed');document.querySelector('#infoDrawer .close').onclick=()=>infoDrawer.classList.add('closed');document.querySelector('#nodeDrawer .close').onclick=()=>nodeDrawer.classList.add('closed');document.getElementById('autoBtn').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('witnessBtn').onclick=e=>{growthEdges.visible=!growthEdges.visible;e.currentTarget.classList.toggle('active',growthEdges.visible)};document.getElementById('edgeBtn').onclick=e=>{graphEdges.visible=!graphEdges.visible;e.currentTarget.classList.toggle('active',graphEdges.visible)};document.getElementById('resetBtn').onclick=fitCamera;
load().catch(err=>{console.error(err);loadText.textContent='Ошибка: '+err.message;status.textContent='BODY_AS_GROWN load failed'});
