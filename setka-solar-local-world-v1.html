<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · SOLAR LOCAL WORLD</title><style>:root{color-scheme:dark;--bg:#030814;--line:#304966;--text:#eef6ff;--muted:#91a8c0;--gold:#ffd35a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;z-index:30;display:flex;gap:6px;flex-wrap:wrap}.pill,.btn,.drawer{background:rgba(5,13,25,.92);border:1px solid var(--line);border-radius:11px}.pill{padding:8px 10px;flex:1 1 330px}.pill b{font-size:11px}.pill small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.btn{padding:9px 10px;color:var(--text);font:9px inherit}.btn.active{border-color:#d8aa45;background:rgba(87,62,13,.88)}#status{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:20;padding:7px 9px;background:rgba(3,10,20,.86);border:1px solid var(--line);border-radius:9px;color:#a9bfd6;font-size:8px;max-width:60vw}.drawer{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:40;width:min(440px,calc(100vw - 16px));max-height:48vh;overflow:auto;padding:12px;display:none}.drawer.open{display:block}.drawer h3{font-size:12px;margin:0 24px 8px 0}.close{position:absolute;right:10px;top:8px;border:0;background:none;color:#fff;font-size:18px}.row{padding:5px 0;border-bottom:1px solid rgba(90,120,160,.16);font-size:9px;line-height:1.35;word-break:break-word}.k{color:var(--muted)}.fact{color:var(--gold)}.label{position:fixed;z-index:18;pointer-events:none;transform:translate(-50%,-50%);font-size:8px;padding:2px 4px;border-radius:5px;background:rgba(3,10,20,.82);border:1px solid rgba(255,210,90,.28);white-space:nowrap;display:none}#loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:10px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#ffd35a;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.drawer{max-height:42vh}.pill small{display:none}#status{max-width:calc(100vw - 16px);font-size:7px}}</style></head><body><div id="app"></div><div class="top"><div class="pill"><b>SETKA · SOLAR LOCAL WORLD · INTERACTIVE</b><small>every node + edge active · real ship-local packet</small></div><button class="btn" id="meta">META</button><button class="btn active" id="local">LOCAL</button><button class="btn active" id="labelsBtn">LABELS</button><button class="btn active" id="auto">AUTO</button><button class="btn" id="reset">RESET</button></div><div id="status">Загрузка…</div><div id="drawer" class="drawer"><button class="close" id="close">×</button><h3 id="title">Карточка</h3><div id="body"></div></div><div id="labelsRoot"></div><div id="loader"><div class="spin"></div><div>SETKA открывает солнечный локальный мир…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const SUPA='https://gfchgaphzhxufwdhrcis.supabase.co',PACKET='VIS-SOLAR-LOCAL-WORLD-20260909-01';let KEY='';const app=document.getElementById('app'),status=document.getElementById('status'),drawer=document.getElementById('drawer'),title=document.getElementById('title'),body=document.getElementById('body'),labelsRoot=document.getElementById('labelsRoot'),loader=document.getElementById('loader');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.018);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,200);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.2;controls.minDistance=.7;controls.maxDistance=80;scene.add(new THREE.AmbientLight(0xffffff,1));const ray=new THREE.Raycaster();ray.params.Line.threshold=.2;const pointer=new THREE.Vector2();let PACK,mode='LOCAL',labelsOn=true;const groups={META:new THREE.Group(),LOCAL:new THREE.Group()},objects=[],labelItems=[];scene.add(groups.META,groups.LOCAL);groups.META.visible=false;
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function row(k,v,cls=''){return`<div class="row ${cls}"><span class="k">${esc(k)}:</span> ${esc(v)}</div>`}function pretty(o){return JSON.stringify(o,null,2)}async function getKey(){const t=await fetch('setka-visualization.html',{cache:'no-store'}).then(r=>r.text());const m=t.match(/KEY='([^']+)'/);if(!m)throw Error('viewer credential bridge unavailable');KEY=m[1]}async function rpc(name,args){const r=await fetch(`${SUPA}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error(`${name} ${r.status}`);return r.json()}
function nodeColor(n){if(n.id==='SUN')return 0xffd35a;if(n.kind==='SHIP')return 0x68e0ff;if(n.kind==='WORLD_EVENT')return 0xff984a;if(n.kind==='NOAA_SWPC_SOURCE')return 0x79e6c0;if(n.kind==='LOCAL_WORLD_BRANCH')return 0xd08cff;return 0xffef9b}function labelFor(n){return n.label||n.ref||n.id}function parseHelio(loc){const m=String(loc||'').match(/^([NS])(\d{2})([EW])(\d{2})$/);if(!m)return{lat:0,lon:0};return{lat:+m[2]*(m[1]==='S'?-1:1),lon:+m[4]*(m[3]==='W'?-1:1)}}function localPos(n,i){if(n.id==='SUN')return new THREE.Vector3(0,0,0);if(n.id==='SNAPSHOT')return new THREE.Vector3(0,-.5,-4.4);if(n.id==='SOURCE')return new THREE.Vector3(0,-2.4,-5.7);if(n.id.startsWith('REGION:')){const h=parseHelio(n.facts?.location),lat=THREE.MathUtils.degToRad(h.lat),lon=THREE.MathUtils.degToRad(h.lon),r=3.15;return new THREE.Vector3(r*Math.sin(lon)*Math.cos(lat),r*Math.sin(lat),r*Math.cos(lon)*Math.cos(lat))}return new THREE.Vector3(Math.cos(i)*3,Math.sin(i)*3,0)}function metaPos(n,i){const p={MOTHER:[-4,0,0],SOLAR_SHIP:[-1,0,0],LOCAL_WORLD:[2,.8,0],SUN:[5,0,0]}[n.id]||[i*2,0,0];return new THREE.Vector3(...p)}
function buildGraph(kind,gdata){const g=groups[kind],map=new Map();(gdata.nodes||[]).forEach((n,i)=>{const p=kind==='LOCAL'?localPos(n,i):metaPos(n,i),size=n.id==='SUN'?.38:n.kind==='SHIP'?.27:.19;const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,22,16),new THREE.MeshBasicMaterial({color:nodeColor(n),transparent:true,opacity:.98,depthWrite:false}));mesh.position.copy(p);mesh.userData={pickKind:'NODE',data:n,graphKind:kind};g.add(mesh);map.set(n.id,{n,p});objects.push(mesh);const d=document.createElement('div');d.className='label';d.textContent=labelFor(n);d.dataset.graph=kind;labelsRoot.appendChild(d);labelItems.push({d,mesh,kind})});(gdata.edges||[]).forEach(e=>{const a=map.get(e.source),b=map.get(e.target);if(!a||!b)return;const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.p,b.p]),new THREE.LineBasicMaterial({color:e.edgeClass==='SOURCE_PROVENANCE'?0x79e6c0:e.edgeClass==='SHIP_REGISTRY'?0x68e0ff:e.edgeClass==='WORLD_EVENT_FACT'?0xff984a:0xffc84a,transparent:true,opacity:.86,depthWrite:false}));line.userData={pickKind:'EDGE',data:e,graphKind:kind};g.add(line);objects.push(line)})}
function whyNode(n){if(n.id==='SUN')return'Центр локального мира задан экспериментом; глобальная онтология SETKA не менялась.';if(n.id==='SNAPSHOT')return'Immutable WORLD_EVENT имеет subject_ref = STAR:SUN.';if(n.id==='SOURCE')return'Provenance-источник NOAA/SWPC для этого WORLD_EVENT.';if(n.id.startsWith('REGION:'))return'Регион присутствует в regionsWithSunspots исходного SRS и сохранён только в ship-local packet.';if(n.id==='SOLAR_SHIP')return'Создан штатным ship_register_v1 как child Материнского корабля.';return'Узел присутствует в реальном meta/local packet эксперимента.'}function whyEdge(e){if(e.relation==='PARENT_SHIP')return'Реальный parent_ship_code в ship registry; parent был указан оператором.';if(e.relation==='HOSTS_LOCAL_WORLD')return'Branch metadata привязывает local world к этому shipCode.';if(e.relation==='CENTERED_ON')return'localWorldCenter = STAR:SUN в контракте эксперимента.';if(e.relation==='SUBJECT_OF_WORLD_EVENT')return'Следует из external_world_events_v1.subject_ref.';if(e.relation==='OBSERVED_FROM')return'Следует из external_world_event_sources_v1.';if(e.relation==='REGION_RECORDED_IN_SNAPSHOT')return'Следует из membership строки в metadata.regionsWithSunspots одного SRS snapshot.';return'Связь хранится в текущем ship-local visualization packet.'}
function showNode(n){title.textContent=`● ${labelFor(n)}`;let h=row('kind',n.kind)+row('ref',n.ref||n.id)+row('epistemic status',n.epistemicStatus||'—','fact');if(n.facts)h+=row('facts',pretty(n.facts),'fact');if(n.card)for(const[k,v]of Object.entries(n.card))h+=row(k,typeof v==='object'?pretty(v):v);if(n.provenance)h+=row('provenance',pretty(n.provenance));h+=row('WHY HERE',whyNode(n));body.innerHTML=h;drawer.classList.add('open')}function showEdge(e){title.textContent=`↔ ${e.relation}`;let h=row('source',e.source)+row('target',e.target)+row('relation',e.relation,'fact')+row('edge class',e.edgeClass||'—')+row('epistemic status',e.epistemicStatus||'—');if(e.card)h+=row('card',pretty(e.card));if(e.provenance)h+=row('provenance',pretty(e.provenance));h+=row('WHY HERE',whyEdge(e));body.innerHTML=h;drawer.classList.add('open')}
function fit(kind){const box=new THREE.Box3().setFromObject(groups[kind]),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.3+2;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.35,c.z+d);controls.update()}function setMode(k){mode=k;groups.META.visible=k==='META';groups.LOCAL.visible=k==='LOCAL';document.getElementById('meta').classList.toggle('active',k==='META');document.getElementById('local').classList.toggle('active',k==='LOCAL');drawer.classList.remove('open');fit(k);status.textContent=k==='LOCAL'?`LOCAL · center STAR:SUN · ${PACK.localGraph.regionCount} NOAA regions · ship-local only`:`META · Mother → Solar Ship → Local World → STAR:SUN`}
function updateLabels(){for(const q of labelItems){if(!labelsOn||q.kind!==mode){q.d.style.display='none';continue}const p=q.mesh.position.clone().project(camera);if(p.z>1||p.z<-1){q.d.style.display='none';continue}q.d.style.display='block';q.d.style.left=((p.x*.5+.5)*innerWidth)+'px';q.d.style.top=((-p.y*.5+.5)*innerHeight)+'px'}}function pick(cx,cy){const r=renderer.domElement.getBoundingClientRect();pointer.x=((cx-r.left)/r.width)*2-1;pointer.y=-((cy-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(objects.filter(o=>o.parent?.visible),false);if(!hits.length)return;const u=hits[0].object.userData;u.pickKind==='NODE'?showNode(u.data):showEdge(u.data)}let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;if(m<9&&dt<600)pick(e.clientX,e.clientY);down=null});
async function load(){await getKey();PACK=await rpc('setka_visualization_packet_v1',{p_packet_ref:PACKET});if(!PACK?.ok)throw Error(PACK?.state||'packet failed');buildGraph('META',PACK.metaGraph);buildGraph('LOCAL',PACK.localGraph);setMode('LOCAL');loader.style.display='none';document.getElementById('meta').onclick=()=>setMode('META');document.getElementById('local').onclick=()=>setMode('LOCAL');document.getElementById('labelsBtn').onclick=e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('active',labelsOn)};document.getElementById('auto').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.getElementById('reset').onclick=()=>fit(mode);document.getElementById('close').onclick=()=>drawer.classList.remove('open')}
function anim(){requestAnimationFrame(anim);controls.update();updateLabels();renderer.render(scene,camera)}anim();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load().catch(e=>{console.error(e);status.textContent='load failed · '+e.message;loader.querySelector('div:last-child').textContent='Ошибка: '+e.message})</script></body></html>
