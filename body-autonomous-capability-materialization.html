<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · AUTONOMOUS CAPABILITY MATERIALIZATION</title><style>:root{color-scheme:dark;--bg:#030814;--panel:rgba(4,12,24,.93);--line:#304965;--text:#eef6ff;--muted:#9bb0c8;--gold:#ffd36b;--cyan:#68e1ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}#app{position:fixed;inset:0}.top{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px}.pill,.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1;min-width:0}.pill b{font-size:12px;display:block}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{padding:8px;font:9px inherit}.btn.active{border-color:#91c4ff;background:rgba(24,48,75,.95)}#hud{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:35;background:rgba(4,12,24,.95);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.m{border:1px solid #22384f;border-radius:9px;padding:7px;background:rgba(8,19,33,.65)}.m b{font-size:11px;display:block}.m small{font-size:8px;color:var(--muted)}.bars{display:grid;grid-template-columns:92px 1fr 70px;gap:6px;align-items:center;margin-top:8px;font-size:8px}.track{height:8px;background:#11243a;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px}.bar.gold{background:#ffd36b}.bar.cyan{background:#68e1ff}.note{font-size:8px;color:var(--muted);margin-top:7px;line-height:1.35}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.grid{grid-template-columns:repeat(2,1fr)}.btn{padding:7px 6px;font-size:8px}}</style></head><body><div id="app"></div><div class="top"><div class="pill"><b>SETKA · AUTONOMOUS CAPABILITY MATERIALIZATION</b><small>AUTONOMY-MAT-909BF0C7E5B04451 · bounded recipe → smoke → reuse</small></div><button class="btn active" id="before">BOOTSTRAP</button><button class="btn active" id="reuse">REUSE</button><button class="btn" id="graph">GRAPH</button></div><div id="hud"><div class="grid"><div class="m"><small>materialize derived skill</small><b id="mat">—</b></div><div class="m"><small>smoke execution</small><b id="smoke">—</b></div><div class="m"><small>reuse execution</small><b id="reuseMs">—</b></div><div class="m"><small>reuse pulse total</small><b id="pulseMs">—</b></div></div><div class="bars"><span>old implementation gap</span><div class="track"><div class="bar gold" id="oldbar"></div></div><b id="oldv">—</b><span>new reuse compute</span><div class="track"><div class="bar cyan" id="newbar"></div></div><b id="newv">—</b></div><div class="note" id="note">Загрузка…</div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA загружает эксперимент автономной материализации…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',ER='AUTONOMY-MAT-909BF0C7E5B04451',OLD='CAUSAL-PULSE-6039C455DB1C4B34',NEW='CAUSAL-PULSE-4AB5E6EEC12249BE';const app=document.getElementById('app'),loader=document.getElementById('loader');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.12;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.05));let points,graphLines,oldLine,newLine;async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(fn+' '+r.status);return r.json()}function makePath(stages,color,opacity){const p=[];for(let i=0;i<stages.length-1;i++){const a=stages[i],b=stages[i+1];if(a.mappedToFrozenBody&&b.mappedToFrozenBody)p.push(+a.x,+a.y,+a.z,+b.x,+b.y,+b.z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}))}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.3,c.z+d);controls.update()}async function load(){const [body,exp,oldT,newT]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_autonomous_capability_materialization_experiment_v1',{p_run_ref:ER}),rpc('setka_causal_update_pulse_trace_v1',{p_run_ref:OLD}),rpc('setka_causal_update_pulse_trace_v1',{p_run_ref:NEW})]);const a=body.nodes||body.payload?.nodes||[],e=body.edges||body.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i];pos[i*3]=+v[9];pos[i*3+1]=+v[10];pos[i*3+2]=+v[11];const c=new THREE.Color();c.setHSL((.75+(+v[3])*.035)%1,.46,.4);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.35,depthWrite:false}));scene.add(points);const map=new Map(a.map(v=>[v[0],v])),ep=[];for(const z of e){const A=map.get(z[0]),B=map.get(z[1]);if(A&&B)ep.push(+A[9],+A[10],+A[11],+B[9],+B[10],+B[11])}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));graphLines=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8469a5,transparent:true,opacity:.022,depthWrite:false}));graphLines.visible=false;scene.add(graphLines);oldLine=makePath(oldT.stages||[],0xffd36b,.72);newLine=makePath(newT.stages||[],0x68e1ff,.95);scene.add(oldLine,newLine);const m=exp.materialization||{},r=exp.reuse||{},sp=m.smokeProfile||{},rp=r.profile||{};document.getElementById('mat').textContent=(+m.materializationMs).toFixed(3)+' ms';document.getElementById('smoke').textContent=(+m.smokeComputeMs).toFixed(3)+' ms';document.getElementById('reuseMs').textContent=(+r.computeMs).toFixed(3)+' ms';document.getElementById('pulseMs').textContent=(+rp.totalObservedMs).toFixed(3)+' ms';const oldGap=+sp.postExecutorObservedGapMs||0,newGap=+r.computeMs||0,max=Math.max(oldGap,newGap,1);document.getElementById('oldbar').style.width=(oldGap/max*100)+'%';document.getElementById('newbar').style.width=Math.max(1,newGap/max*100)+'%';document.getElementById('oldv').textContent=(oldGap/1000).toFixed(3)+' s';document.getElementById('newv').textContent=newGap.toFixed(3)+' ms';document.getElementById('note').textContent='Золотой = исходный causal pulse, где после быстрого executor был внешний implementation gap. Голубой = новый reuse pulse. SETKA материализовала производную способность по ограниченному декларативному рецепту за '+(+m.materializationMs).toFixed(3)+' ms, smoke прошёл, затем та же способность повторно исполнилась за '+(+r.computeMs).toFixed(3)+' ms без нового DDL. Граница эксперимента: автоматическое связывание router → новая capability ещё не доказано.';fit();loader.style.display='none'}document.getElementById('before').onclick=e=>{oldLine.visible=!oldLine.visible;e.currentTarget.classList.toggle('active',oldLine.visible)};document.getElementById('reuse').onclick=e=>{newLine.visible=!newLine.visible;e.currentTarget.classList.toggle('active',newLine.visible)};document.getElementById('graph').onclick=e=>{graphLines.visible=!graphLines.visible;e.currentTarget.classList.toggle('active',graphLines.visible)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}load().then(anim).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
