function allEdges(){let e=D.architecture.edges.map(x=>({from:x.from_node,to:x.to_node,type:x.edge_type,criticality:x.criticality,policy:x.break_policy,key:x.edge_key,reason:x.metadata?.reason||''}));for(const [f,targets] of Object.entries(floorLinks))for(const to of targets)e.push({from:'floor:'+f,to,type:to==='setka_flow'?'flow':to==='data_memory'?'data':to==='release_control'?'release':to==='recovery_vault'?'recovery':'authority',criticality:f==='president'?'root':'important',policy:f==='president'?'never':'review',key:'floor_'+f+'_'+to,reason:''});return e}
function drawWires(){let box=$('#blueprint');if(!box||box.offsetParent===null)return;let svg=$('#wires'),br=box.getBoundingClientRect();svg.innerHTML='';for(const e of allEdges()){if(filter!=='all'&&e.type!==filter)continue;let a=box.querySelector(`[data-node="${CSS.escape(e.from)}"]`),b=box.querySelector(`[data-node="${CSS.escape(e.to)}"]`);if(!a||!b)continue;let ar=a.getBoundingClientRect(),rr=b.getBoundingClientRect(),x1=ar.right-br.left,y1=ar.top+ar.height/2-br.top,x2=rr.left-br.left,y2=rr.top+rr.height/2-br.top;if(e.from.indexOf('floor:')<0){x1=ar.left+ar.width/2-br.left;y1=ar.bottom-br.top;x2=rr.left+rr.width/2-br.left;y2=rr.top-br.top}let ns='http://www.w3.org/2000/svg',p=document.createElementNS(ns,'path'),mx=(x1+x2)/2;p.setAttribute('d',`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);p.setAttribute('class','wire '+e.criticality+(selected&&e.from!==selected&&e.to!==selected?' dim':'')+(selected&&(e.from===selected||e.to===selected)?' hot':''));p.dataset.from=e.from;p.dataset.to=e.to;svg.appendChild(p)}}
function selectNode(k){selected=selected===k?null:k;$$('[data-node]').forEach(x=>x.classList.toggle('selected',x.dataset.node===selected));let el=$('#inspect');if(!selected){el.innerHTML=`<div class="inspectTitle">${esc(t('inspect.none'))}</div><div class="mini">${esc(t('inspect.hint'))}</div>`}else{let edges=allEdges().filter(e=>e.from===selected||e.to===selected),node=D.architecture.nodes.find(n=>n.node_key===selected),floor=D.access.floors.find(f=>'floor:'+f.floor_key===selected),name=node?dyn(node.title_key):floor?dyn(floor.title_key):selected;el.innerHTML=`<div class="inspectTitle">${esc(name)}</div>${edges.map(e=>`<div class="item"><div class="itemTop"><span>${esc(e.from)} → ${esc(e.to)}</span><span class="tag">${esc(e.policy)}</span></div><div class="mini">${esc(e.type)} · ${esc(e.criticality)}${e.reason?' · '+esc(e.reason):''}</div></div>`).join('')||'<div class="mini">—</div>'}`}drawWires()}
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));drawWires()});addEventListener('resize',()=>requestAnimationFrame(drawWires));
function doorControls(type,key,state,locked){return ['open','guarded','president_only','frozen'].map(s=>`<button class="secondary" data-door-type="${type}" data-door-key="${esc(key)}" data-door-state="${s}" ${locked?'disabled':''}>${esc(t('door.'+s))}${s===state?' ✓':''}</button>`).join('')}
function renderHQ(){let roles=D.access.roles;$('#hq').innerHTML=D.access.floors.map(f=>{let cs=D.access.cabinets.filter(c=>c.floor_key===f.floor_key);return `<div class="card full" style="margin-bottom:8px"><div class="itemTop"><div><div class="title">${esc(dyn(f.title_key))}</div><div class="mini">${esc(dyn(f.description_key))}</div></div><span class="tag">${esc(t('door.'+f.door_state))}</span></div><div class="row" style="margin-top:8px">${doorControls('floor',f.floor_key,f.door_state,f.floor_key==='president')}</div>${cs.map(c=>`<div class="item"><div class="itemTop"><div><b>${esc(dyn(c.title_key))}</b><div class="mini">${esc(dyn(c.description_key))}</div></div><span class="tag">${esc(t('door.'+c.door_state))}</span></div><div class="row" style="margin-top:6px">${roles.filter(r=>r.cabinetKey===c.cabinet_key).map(r=>`<button class="secondary" data-view-role="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</button>`).join('')}</div><div class="row" style="margin-top:6px">${doorControls('cabinet',c.cabinet_key,c.door_state,f.floor_key==='president')}</div></div>`).join('')}</div>`}).join('');let opts=roles.filter(r=>r.roleKey!=='president_root'&&r.releasable).map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');$('#issueRole').innerHTML=`<option value="">${esc(t('id.none'))}</option>`+opts;$('#assignRole').innerHTML=opts;$$('[data-view-role]').forEach(x=>x.onclick=()=>viewAs(x.dataset.viewRole));$$('[data-door-type]').forEach(x=>x.onclick=async()=>{if(!confirm(t('confirm.door')))return;try{await call(x.dataset.doorType==='floor'?'set_floor_door':'set_cabinet_door',x.dataset.doorType==='floor'?{floorKey:x.dataset.doorKey,state:x.dataset.doorState,reason:'President v0.4'}:{cabinetKey:x.dataset.doorKey,state:x.dataset.doorState,reason:'President v0.4'});await load()}catch(e){alert(e.message)}})}
async function viewAs(role){try{perspective=(await call('role_perspective',{roleKey:role})).perspective;$('#viewChip').innerHTML=`<b>${esc(t('you.view'))}</b> ${esc(dyn(D.access.roles.find(r=>r.roleKey===role)?.titleKey||role))}`}catch(e){alert(e.message)}}
function renderFlow(){let f=D.flow;$('#flowStats').innerHTML=card(t('flow.open'),f.counts.open)+card(t('flow.decisions'),f.counts.decisions)+card(t('flow.urgent'),f.counts.urgent);$('#queues').innerHTML=f.queues.map(q=>`<div class="item"><div class="itemTop"><span>${esc(dyn(q.titleKey))}</span><span class="tag">${esc(q.openCount)}</span></div><div class="mini">${esc(dyn(q.descriptionKey))}</div></div>`).join('')||t('empty');$('#threads').innerHTML=f.threads.map(x=>`<div class="item"><div class="itemTop"><b>${esc(x.subject)}</b><span class="tag">${esc(x.status)}</span></div><div class="mini">${esc(x.senderSetkaId||'SYSTEM')} · ${esc(x.senderRoleKey||'—')} → ${esc(x.recipientType)}:${esc(x.recipientRef)}</div><div class="mini">${esc(x.lastMessage||'')}</div></div>`).join('')||t('empty');$('#flowSender').innerHTML=D.access.roles.filter(r=>r.assignedToPresident).map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');$('#flowKind').innerHTML=['message','request','approval','case','decision'].map(x=>`<option value="${x}">${esc(t('kind.'+x))}</option>`).join('');$('#flowRecipientType').innerHTML=['queue','role','identity','system'].map(x=>`<option value="${x}">${esc(t('recipient.'+x))}</option>`).join('');$('#flowPriority').innerHTML=['low','normal','high','urgent'].map(x=>`<option value="${x}">${esc(t('priority.'+x))}</option>`).join('');recipients()}
function recipients(){let typ=$('#flowRecipientType').value;if(typ==='queue')$('#flowRecipient').innerHTML=D.flow.queues.map(q=>`<option value="${esc(q.queueKey)}">${esc(dyn(q.titleKey))}</option>`).join('');else if(typ==='role')$('#flowRecipient').innerHTML=D.access.roles.map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');else if(typ==='system')$('#flowRecipient').innerHTML='<option value="setka_system">SETKA SYSTEM</option>';else $('#flowRecipient').innerHTML='<option value="SETKA-ID">SETKA ID</option>'}$('#flowRecipientType').onchange=recipients;
function renderVersions(){let tm=D.timeMachine;$('#checkpointChip').textContent='CHECKPOINT · '+(tm.activeCheckpoint||'—');$('#versions').innerHTML=(tm.checkpoints||[]).map(v=>`<div class="version ${v.checkpoint===tm.activeCheckpoint?'active':''}"><div class="itemTop"><div><b class="mono">${esc(v.checkpoint)}</b><div class="mini">${esc(v.notes||'')}</div></div><span class="tag">${esc(v.checkpoint===tm.activeCheckpoint?t('ver.active'):v.status)}</span></div><div class="row" style="margin-top:7px"><button class="secondary" data-checkpoint="${esc(v.checkpoint)}" ${v.checkpoint===tm.activeCheckpoint?'disabled':''}>${esc(t('ver.activate'))}</button></div></div>`).join('');$$('[data-checkpoint]').forEach(b=>b.onclick=async()=>{if(!confirm(t('confirm.version')))return;try{await call('activate_checkpoint',{checkpoint:b.dataset.checkpoint,reason:'President v0.4'});await load()}catch(e){$('#versionOut').textContent=e.message}})}
function renderSystem(){let x=D.live;$('#metrics').innerHTML=card(t('metric.people'),x.participants)+card(t('metric.exposures'),x.exposures)+card(t('metric.sessions'),x.sessions)+card(t('metric.time'),fmtMs(x.totalPatternMs));$('#layers').innerHTML=D.core.layers.map(l=>`<div class="item"><div class="itemTop"><b>${esc(l.layer_key)}</b><span class="tag">${esc(l.status)}</span></div><div class="mini">${esc(l.description)}</div></div>`).join('');$('#releases').innerHTML=D.core.releases.map(r=>`<div class="item"><b>${esc(r.channel)}</b><div class="mini mono">${esc(r.front_version||'—')}</div></div>`).join('');$('#edgeList').innerHTML=D.architecture.edges.map(e=>`<div class="item"><div class="itemTop"><span class="mono">${esc(e.from_node)} → ${esc(e.to_node)}</span><span class="tag">${esc(e.break_policy)}</span></div><div class="mini">${esc(e.edge_type)} · ${esc(e.criticality)}</div></div>`).join('')}
function render(){if(!D)return;$('#apiState').textContent=`API v${D.apiVersion} · ${D.core.identity.setkaId}`;$('#viewChip').innerHTML=`<b>${esc(t('you.view'))}</b> PRESIDENT ROOT`;renderMap();renderHQ();renderFlow();renderVersions();renderSystem()}
async function load(){try{D=await call('dashboard');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('diamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginErr').textContent=e.message}}
$('#enter').onclick=async()=>{try{let d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('diamondSession',token);$('#key').value='';await load()}catch(e){$('#loginErr').textContent=e.message}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('diamondSession');location.reload()};
$('#issueBtn').onclick=async()=>{try{let d=await call('issue_identity',{roleKey:$('#issueRole').value||null,note:$('#issueNote').value});$('#issueOut').textContent=`${d.setkaId} · ${d.roleKey||t('id.none')}`;await load()}catch(e){$('#issueOut').textContent=e.message}};$('#assignBtn').onclick=async()=>{try{let d=await call('assign_role',{setkaId:$('#assignId').value,roleKey:$('#assignRole').value,scope:{},note:'President v0.4'});$('#assignOut').textContent=`${d.setkaId} · ${d.roleKey}`;await load()}catch(e){$('#assignOut').textContent=e.message}};$('#flowSend').onclick=async()=>{try{let typ=$('#flowRecipientType').value,ref=$('#flowRecipient').value;if(typ==='identity'){ref=prompt('SETKA ID')||'';if(!ref)return}await call('flow_create',{senderRoleKey:$('#flowSender').value,kind:$('#flowKind').value,subject:$('#flowSubject').value,recipientType:typ,recipientRef:ref,body:$('#flowBody').value,priority:$('#flowPriority').value});$('#flowSubject').value='';$('#flowBody').value='';await load();tab('flow')}catch(e){$('#flowOut').textContent=e.message}};
applyLocale();tab('map');if(token)load();
</script></body></html>
