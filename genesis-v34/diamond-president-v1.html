function bindDynamic(){$$('.doorFloor').forEach(b=>b.onclick=async()=>{if(!confirm(t('door.confirm')))return;await call('set_floor_door',{floorKey:b.dataset.key,state:b.dataset.state,reason:'President cockpit'});await load()});$$('.doorCab').forEach(b=>b.onclick=async()=>{if(!confirm(t('door.confirm')))return;await call('set_cabinet_door',{cabinetKey:b.dataset.key,state:b.dataset.state,reason:'President cockpit'});await load()});$$('.cpUse').forEach(b=>b.onclick=async()=>{if(!confirm(t('rollback.confirm')))return;await call('activate_checkpoint',{checkpoint:b.dataset.cp,reason:'President Time Machine'});await load()})}
async function load(){try{const d=await call('dashboard');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render(d)}catch(e){sessionStorage.removeItem('setkaDiamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#err').textContent=e.message}}$('#enter').onclick=async()=>{try{$('#err').textContent='';const d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('setkaDiamondSession',token);$('#key').value='';await load()}catch(e){$('#err').textContent=e.message}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('setkaDiamondSession');location.reload()};$('#viewAs').onclick=async()=>{const roleKey=$('#roleSelect').value;try{const d=await call('role_perspective',{roleKey});currentPerspective=roleKey;renderPerspectiveLocal(D.access.roles.find(r=>r.roleKey===roleKey));$('#who').textContent=D.core.identity.setkaId+' · '+t('value.president')+' / '+tr(D.access.roles.find(r=>r.roleKey===roleKey)?.titleKey,roleKey);render(D)}catch(e){alert(e.message)}};$('#viewPresident').onclick=()=>{currentPerspective='president_root';render(D)};$('#issueId').onclick=async()=>{if(!confirm(t('issue.confirm')))return;try{const d=await call('issue_identity',{note:'Created from President cockpit'});$('#issued').textContent=d.setkaId;await load()}catch(e){$('#issued').textContent=e.message}};applyLocale();setView(view);if(token)load();
