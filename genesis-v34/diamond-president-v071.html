ture.edges.find(x=>x.edge_key===o.key);c.innerHTML=`<div class="inspectTitle">${esc(e.from_node)} → ${esc(e.to_node)}</div><div class="address">${esc(e.edge_key)}</div><div class="inspectBlock"><span class="tag">${esc(e.binding_mode||'design')}</span> <span class="tag">${esc(e.break_policy)}</span></div>`;a.innerHTML=`<div class="inspectBlock"><button style="width:100%" data-inspect-test="edge">TEST WIRE</button></div>`}else{let s=D.simulation||{};c.innerHTML=`<div class="inspectTitle">Synthetic User Lab</div><div class="mini">${esc((s.personas||[]).length)} actors · ${(s.recentRuns||[]).length} recent runs</div><div class="inspectBlock"><div class="k">BOUNDARY</div><div class="notice">SIMULATION data is noncanonical and cannot enter Production metrics.</div></div>`}
$$('[data-inspect-test]').forEach(b=>b.onclick=()=>selectTest(b.dataset.inspectTest,o.key||''))}
function renderBlueprint(){let tm=D.timeMachine;$('#checkpointChip').textContent='CHECKPOINT · '+(tm.activeCheckpoint||'—');$('#bpVersion').innerHTML=versions().map(v=>`<option value="${esc(v.checkpoint)}" ${v.checkpoint===tm.activeCheckpoint?'selected':''}>${esc(v.checkpoint)}</option>`).join('');$('#simCheckpoint').innerHTML=$('#bpVersion').innerHTML;$('#floorPlans').innerHTML=D.access.floors.map((f,i)=>{let cs=D.access.cabinets.filter(c=>c.floor_key===f.floor_key);return `<div class="floor" data-floor="${esc(f.floor_key)}"><div class="floorHead"><div class="floorNo">${i===0?'ROOT':'L'+i}</div><div><div class="floorName">${esc(dyn(f.title_key))}</div><div class="address">HQ / ${esc(f.floor_key)}</div></div><span class="tag">${esc(t('door.'+f.door_state))}</span></div><div class="rooms">${cs.map(c=>`<div class="room" data-cabinet="${esc(c.cabinet_key)}"><b>${esc(dyn(c.title_key))}</b><div class="address">${esc(c.cabinet_key)}</div><div class="mini">${esc(D.access.roles.filter(r=>r.cabinetKey===c.cabinet_key).map(r=>dyn(r.titleKey)).join(' · ')||'—')}</div></div>`).join('')}</div></div>`}).join('');let drafts=D.blueprint?.draftItems||[];$('#draftItems').innerHTML=drafts.length?drafts.map(x=>`<span class="draftItem">${esc(x.item_type)} · ${esc(x.title)} <button class="ghost" style="padding:2px 5px" data-remove-draft="${esc(x.draft_key)}">×</button></span>`).join(''):'<span class="mini">—</span>';$('#draftParent').innerHTML=['<option value="">ROOT</option>',...D.access.floors.map(f=>`<option value="${esc(f.floor_key)}">FLOOR · ${esc(dyn(f.title_key))}</option>`),...D.access.cabinets.map(c=>`<option value="${esc(c.cabinet_key)}">CABINET · ${esc(dyn(c.title_key))}</option>`),...drafts.map(x=>`<option value="${esc(x.draft_key)}">DRAFT · ${esc(x.title)}</option>`)].join('');$$('[data-floor]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-cabinet]'))return;showInspector({type:'floor',key:x.dataset.floor})});$$('[data-cabinet]').forEach(x=>x.onclick=e=>{e.stopPropagation();showInspector({type:'cabinet',key:x.dataset.cabinet})});$$('[data-remove-draft]').forEach(b=>b.onclick=async()=>{await call('blueprint_remove_draft',{draftKey:b.dataset.removeDraft});await load()})}
function targetOptions(type){if(type==='headquarters')return [{k:'',n:'SETKA HQ'}];if(type==='floor')return D.access.floors.map(x=>({k:x.floor_key,n:dyn(x.title_key)}));if(type==='cabinet')return D.access.cabinets.map(x=>({k:x.cabinet_key,n:dyn(x.title_key)}));if(type==='block')return D.architecture.nodes.map(x=>({k:x.node_key,n:dyn(x.title_key)}));return D.architecture.edges.map(x=>({k:x.edge_key,n:`${x.from_node} → ${x.to_node}`}))}function renderTarget(){let o=targetOptions($('#simTargetType').value);$('#simTargetKey').innerHTML=o.map(x=>`<option value="${esc(x.k)}">${esc(x.n)}</option>`).join('')}$('#simTargetType').onchange=renderTarget;function selectTest(type,key){tab('simulation');$('#simTargetType').value=type;renderTarget();$('#simTargetKey').value=key;showInspector({type:'simulation'})}
function renderSimulation(){let s=D.simulation||{personas:[],recentRuns:[],roleOptions:[]};$('#simStats').innerHTML=stat('Synthetic actors',s.personas.length)+stat('Browser runs',s.recentRuns.filter(x=>x.source==='browser').length)+stat('Architecture runs',s.recentRuns.filter(x=>x.source==='architecture').length)+stat('Production writes',0);$('#personas').innerHTML=s.personas.map((p,i)=>`<label class="actor"><input type="checkbox" data-persona="${esc(p.personaKey)}" ${i<5?'checked':''}><div><b>${esc(p.displayName)}</b><div class="mini">${esc(p.archetype)} · ${esc(p.roleKey||'—')}</div><div class="address">${esc(p.floorKey||'—')} / ${esc(p.cabinetKey||'—')}</div></div><span class="tag">${p.enabled?'ON':'OFF'}</span></label>`).join('');$('#personaRole').innerHTML=s.roleOptions.map(r=>`<option value="${esc(r.roleKey)}">${esc(r.floorKey)} / ${esc(r.cabinetKey||'—')} · ${esc(dyn(r.titleKey))}</option>`).join('');$('#recentRuns').innerHTML=(s.recentRuns||[]).slice(0,35).map(r=>`<div class="run"><div class="row" style="justify-content:space-between"><b>${esc(r.persona_key)}</b><span class="tag">${esc(r.status)}</span></div><div class="mini">${esc(r.source)} · ${esc(r.target_type)}:${esc(r.target_key||'')} · ${esc(r.scenario_key)}</div></div>`).join('')||'<div class="empty">—</div>';renderTarget()}
function renderMachine(){let a=D.architecture,c=a.counts||{};$('#archStats').innerHTML=stat('Blocks',c.nodes||a.nodes.length)+stat('Connected',c.connected??a.edges.filter(x=>x.active).length)+stat('Disconnected',c.disconnected??a.edges.filter(x=>!x.active).length)+stat('Never-break',c.neverBreak??a.edges.filter(x=>x.break_policy==='never').length);$('#nodes').innerHTML=a.nodes.map(n=>`<div class="node" data-node="${esc(n.node_key)}"><b>${esc(dyn(n.title_key))}</b><div class="address">${esc(n.node_key)}</div><div class="mini">${esc(n.status)} · ${esc(n.disconnect_policy)}</div></div>`).join('');$('#edges').innerHTML=a.edges.map(e=>`<div class="edge" data-edge="${esc(e.edge_key)}"><div class="row" style="justify-content:space-between"><span class="mono">${esc(e.from_node)} → ${esc(e.to_node)}</span><span class="tag">${esc(e.binding_mode||'design')}</span></div><div class="mini">${esc(e.edge_type)} · ${esc(e.criticality)} · ${esc(e.break_policy)}</div></div>`).join('');$$('[data-node]').forEach(x=>x.onclick=()=>showInspector({type:'node',key:x.dataset.node}));$$('[data-edge]').forEach(x=>x.onclick=()=>showInspector({type:'edge',key:x.dataset.edge}))}
function doorButtons(type,key,state,locked){return ['open','guarded','president_only','frozen'].map(s=>`<button class="secondary" data-door-type="${type}" data-door-key="${esc(key)}" data-door-state="${s}" ${locked?'disabled':''}>${esc(t('door.'+s))}${s===state?' ✓':''}</button>`).join('')}function renderHQ(){let roles=D.access.roles;$('#hq').innerHTML=D.access.floors.map(f=>`<div class="hqFloor"><div class="row" style="justify-content:space-between"><div><b>${esc(dyn(f.title_key))}</b><div class="address">HQ / ${esc(f.floor_key)}</div></div><span class="tag">${esc(t('door.'+f.door_state))}</span></div><div class="row" style="margin-top:7px">${doorButtons('floor',f.floor_key,f.door_state,f.floor_key==='president')}</div>${D.access.cabinets.filter(c=>c.floor_key===f.floor_key).map(c=>`<div class="cabRow"><div class="row" style="justify-content:space-between"><div><b>${esc(dyn(c.title_key))}</b><div class="mini">${esc(roles.filter(r=>r.cabinetKey===c.cabinet_key).map(r=>dyn(r.titleKey)).join(' · ')||'—')}</div></div><span class="tag">${esc(t('door.'+c.door_state))}</span></div><div class="row" style="margin-top:5px">${doorButtons('cabinet',c.cabinet_key,c.door_state,f.floor_key==='president')}</div></div>`).join('')}</div>`).join('');let issuable=roles.filter(r=>r.roleKey!=='president_root'&&r.releasable);$('#issueRole').innerHTML='<option value="">NO ROLE</option>'+issuable.map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');$$('[data-door-type]').forEach(b=>b.onclick=async()=>{if(!confirm('Change door?'))return;await call(b.dataset.doorType==='floor'?'set_floor_door':'set_cabinet_door',b.dataset.doorType==='floor'?{floorKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President v0.7.1'}:{cabinetKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President v0.7.1'});await load()})}
function renderFlow(){let f=D.flow||{},c=f.counts||{};$('#flowStats').innerHTML=stat('Open',c.open||0)+stat('Decisions',c.decisions||0)+stat('Urgent',c.urgent||0)+stat('Queues',(f.queues||[]).length);$('#queues').innerHTML=(f.queues||[]).map(q=>`<div class="run"><div class="row" style="justify-content:space-between"><b>${esc(dyn(q.titleKey))}</b><span class="tag">${esc(q.openCount||0)}</span></div></div>`).join('')||'<div class="empty">—</div>';$('#threads').innerHTML=(f.threads||[]).map(x=>`<div class="run"><div class="row" style="justify-content:space-between"><b>${esc(x.subject)}</b><span class="tag">${esc(x.status)}</span></div><div class="mini">${esc(x.senderRoleKey||'—')} → ${esc(x.recipientType)}:${esc(x.recipientRef)}</div></div>`).join('')||'<div class="empty">—</div>'}
function renderVersions(){let tm=D.timeMachine;$('#versions').innerHTML=versions().map(v=>{let active=v.checkpoint===tm.activeCheckpoint,m=v.change_manifest?.[locale]||v.change_manifest?.en||{};return `<div class="version ${active?'active':''}"><div class="row" style="justify-content:space-between"><div><b>${esc(m.title||v.checkpoint)}</b><div class="mini mono">${esc(v.checkpoint)}</div></div><span class="tag">${active?'WORKING':esc(v.status)}</span></div><div class="mini" style="margin-top:5px">${esc((m.added||[]).slice(0,3).join(' · '))}</div><div class="row" style="margin-top:7px"><button class="secondary" data-view-version="${esc(v.viewUrl||'')}" ${!v.viewable?'disabled':''}>VIEW</button><button data-work-version="${esc(v.checkpoint)}" ${active?'disabled':''}>MAKE WORKING</button></div></div>`}).join('');$$('[data-view-version]').forEach(b=>b.onclick=()=>{if(b.dataset.viewVersion)window.open(b.dataset.viewVersion,'_blank','noopener,noreferrer')});$$('[data-work-version]').forEach(b=>b.onclick=async()=>{if(!confirm('Switch Diamond working checkpoint?'))return;await call('activate_checkpoint',{checkpoint:b.dataset.workVersion,reason:'President v0.7.1 Time Machine'});await load()})}
function renderSystem(){let x=D.live;$('#metrics').innerHTML=stat('Participants',x.participants)+stat('Pattern exposures',x.exposures)+stat('Sessions',x.sessions)+stat('Synthetic actors',D.simulation?.personas?.length||0);$('#layers').innerHTML=D.core.layers.map(l=>`<div class="run"><div class="row" style="justify-content:space-between"><b>${esc(l.layer_key)}</b><span class="tag">${esc(l.status)}</span></div><div class="mini">${esc(l.description)}</div></div>`).join('');$('#releases').innerHTML=D.core.releases.map(r=>`<div class="run"><b>${esc(r.channel)}</b><div class="mini mono">${esc(r.front_version||'—')}</div></div>`).join('')}
function render(){if(!D)return;$('#apiState').textContent=`API v${D.apiVersion} · ${D.core.identity.setkaId}`;renderBlueprint();renderSimulation();renderMachine();renderHQ();renderFlow();renderVersions();renderSystem();if(!selected)showInspector(null)}async function load(){try{D=await call('dashboard');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('diamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginErr').textContent=e.message}}
$('#enter').onclick=async()=>{try{let d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('diamondSession',token);$('#key').value='';await load()}catch(e){$('#loginErr').textContent=e.message}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('diamondSession');location.reload()};$('#bpOpenVersion').onclick=()=>{let v=versions().find(x=>x.checkpoint===$('#bpVersion').value);if(v?.viewUrl)window.open(v.viewUrl,'_blank','noopener,noreferrer')};$('#bpTestAll').onclick=()=>selectTest('headquarters','');$('#draftAdd').onclick=async()=>{try{let d=await call('blueprint_add_draft',{itemType:$('#draftType').value,parentKey:$('#draftParent').value,title:$('#draftTitle').value,metadata:{createdFrom:'diamond-v0.7.1'}});$('#draftOut').textContent='DRAFT · '+d.draftKey;$('#draftTitle').value='';await load()}catch(e){$('#draftOut').textContent=e.message}};$('#personaCreate').onclick=async()=>{try{let p=clamp01($('#personaPatience').value),c=clamp01($('#personaCuriosity').value),tr=clamp01($('#personaTrust').value),sv=clamp01($('#personaSave').value),ab=clamp01($('#personaAbandon').value);let d=await call('simulation_create_persona',{displayName:$('#personaName').value,archetype:$('#personaArchetype').value,roleKey:$('#personaRole').value,characteristics:{patience:p,curiosity:c,trust:tr,synthetic:true},behaviorPolicy:{dwellSeconds:[Math.max(5,Math.round(10+p*30)),Math.round(35+p*120)],gestures:[1,Math.round(2+c*10)],patternSwitches:[1,Math.round(1+c*5)],saveProbability:sv,abandonProbability:ab,returnProbability:clamp01(.85-ab*.7),readInstructions:clamp01(p*.55+c*.25)}});$('#personaOut').textContent=`${d.setkaId} · ${d.roleKey}`;await load()}catch(e){$('#personaOut').textContent=e.message}};$('#simRun').onclick=async()=>{try{let personaKeys=$$('[data-persona]:checked').map(x=>x.dataset.persona);if(!personaKeys.length)throw new Error('Select actor');let d=await call('simulation_run',{personaKeys,checkpoint:$('#simCheckpoint').value,targetType:$('#simTargetType').value,targetKey:$('#simTargetKey').value,isolationMode:$('#simIsolation').value,scenarioKey:$('#simScenario').value});$('#simOut').textContent=(d.results||[]).map(x=>`${x.actor}: ${x.expectedBoundary}`).join(' · ');await load();tab('simulation')}catch(e){$('#simOut').textContent=e.message}};$('#issueBtn').onclick=async()=>{try{let d=await call('issue_identity',{roleKey:$('#issueRole').value||null,note:$('#issueNote').value});$('#issueOut').textContent=`${d.setkaId} · ${d.roleKey||'NO ROLE'}`;await load()}catch(e){$('#issueOut').textContent=e.message}};applyLocale();tab('blueprint');if(token)load();
</script></body></html>
