const researchStyle=`<style id="setkaResearchStyle">

.setkaResearchBrand{font-size:9px!important;letter-spacing:.14em!important;font-weight:850!important;line-height:1.18!important;color:#fff!important}.setkaResearchBrand b{display:block!important;font-size:13px!important;letter-spacing:.03em!important;margin-top:3px!important;color:#fff!important}

.setkaResearchTools{display:flex!important;gap:6px!important;justify-content:flex-end!important;align-items:center!important;min-width:0!important}.setkaBadge{height:32px!important;display:inline-flex!important;align-items:center!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:999px!important;padding:0 9px!important;font:750 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace!important;color:rgba(255,255,255,.72)!important;white-space:nowrap!important}

.setkaModalBack{display:none;position:fixed!important;inset:0!important;z-index:2147483600!important;background:rgba(0,0,0,.78)!important;place-items:center!important;padding:20px!important}.setkaModalBack.open{display:grid!important}.setkaModal{width:min(620px,92vw)!important;background:#060606!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:18px!important;padding:16px!important;color:#fff!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important;box-sizing:border-box!important}.setkaModal h2{font:800 24px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important;margin:0 0 6px!important;color:#fff!important}.setkaModal p{font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important;color:rgba(255,255,255,.58)!important;margin:0 0 12px!important}.setkaModal label{display:block!important;font:700 10px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important;color:rgba(255,255,255,.58)!important;margin:9px 0 5px!important}.setkaModal input,.setkaModal textarea{width:100%!important;background:#000!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:10px!important;padding:10px!important;box-sizing:border-box!important;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important}.setkaModal textarea{min-height:120px!important}.setkaModalActions{display:flex!important;justify-content:flex-end!important;gap:6px!important;margin-top:12px!important}.setkaModalActions button{height:38px!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:10px!important;padding:0 12px!important;background:#000!important;color:#fff!important;font:780 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important}.setkaModalActions .primary{background:#fff!important;color:#000!important}.systemEntityRu{font-weight:820!important}

@media(max-width:900px){:root{--setka-research-h:64px}.setkaResearchBar{grid-template-columns:160px minmax(250px,1fr) 190px!important;min-width:720px!important}.setkaResearchTools .setkaBadge{display:none!important}.setkaPencil{min-width:176px!important}.setkaResearchBrand b{font-size:12px!important}}
</style>`;

const researchBar=`<div class="setkaResearchBar" id="setkaResearchBar"><div class="setkaResearchBrand">SETKA · DIAMOND<b>ИССЛЕДОВАНИЕ ВЕРСИЙ</b></div><div class="setkaVersionControl"><button id="setkaPrev" type="button">‹</button><select id="setkaVersionSelect" aria-label="Версия"></select><button id="setkaNext" type="button">›</button></div><div class="setkaResearchTools"><span class="setkaBadge" id="setkaHealth">${current.label} · загружена</span><button class="setkaPencil" id="setkaPencil" type="button">✎&nbsp; Записать путь</button></div></div><canvas class="setkaTraceCanvas" id="setkaTraceCanvas"></canvas><div class="setkaModalBack" id="setkaCommentModal"><div class="setkaModal"><h2>Что ты показала?</h2><p>Добавь короткий смысл записи. Путь уже сохраняется частями.</p><label>Название</label><input id="setkaTraceTitle" maxlength="240" placeholder="Например: не работает переход между версиями"><label>Комментарий</label><textarea id="setkaTraceComment" maxlength="6000" placeholder="Что ожидалось и что произошло"></textarea><div class="setkaModalActions"><button id="setkaContinue" type="button">Продолжить запись</button><button id="setkaSave" class="primary" type="button">Сохранить TRACE</button></div></div></div>`;

const runtime=`<script id="setkaResearchRuntime">(()=>{
const API=${JSON.stringify(API)},versions=${JSON.stringify(versions)},current=${JSON.stringify(current)};
const qs=s=>document.querySelector(s),sel=qs('#setkaVersionSelect'),pencil=qs('#setkaPencil'),canvas=qs('#setkaTraceCanvas'),ctx=canvas?.getContext('2d');
let recording=false,pending=false,buffer=[],segment='SEG-'+crypto.randomUUID().slice(0,10).toUpperCase(),seq=0,flushTimer=0,lastMove=new Map(),liveLast=new Map();
function token(){return sessionStorage.getItem('diamondSession')||''}
async function api(action,body={},keepalive=false){const tk=token();if(!tk)throw new Error('Сначала войди в кабинет Президента');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-setka-session':tk},body:JSON.stringify({action,...body}),keepalive});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.error||'request_failed');return d}
function active(){try{return JSON.parse(localStorage.getItem('setkaActiveResearchTrace')||'null')}catch{return null}}
function setActive(v){v?localStorage.setItem('setkaActiveResearchTrace',JSON.stringify(v)):localStorage.removeItem('setkaActiveResearchTrace')}
function resize(){if(!canvas||!ctx)return;const d=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(Math.max(1,innerHeight-64)*d);canvas.style.width=innerWidth+'px';canvas.style.height=Math.max(1,innerHeight-64)+'px';ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
function renderVersions(){sel.innerHTML=versions.map(v=>'<option value="'+v.checkpoint+'">'+v.label+(v.status==='failed'?' · НЕ РАБОТАЕТ':v.status==='degraded'?' · ЕСТЬ ОШИБКА':'')+'</option>').join('');sel.value=current.checkpoint;const i=versions.findIndex(v=>v.checkpoint===current.checkpoint);qs('#setkaPrev').disabled=i<=0;qs('#setkaNext').disabled=i>=versions.length-1}renderVersions();
async function go(cp){if(cp===current.checkpoint)return;if(recording){push('version_switch',null,{from:current.checkpoint,to:cp});await flush('version_switch',true).catch(()=>{})}location.href='diamond-president-v083.html?v='+encodeURIComponent(cp)}
sel.onchange=()=>go(sel.value);qs('#setkaPrev').onclick=()=>{const i=versions.findIndex(v=>v.checkpoint===current.checkpoint);if(i>0)go(versions[i-1].checkpoint)};qs('#setkaNext').onclick=()=>{const i=versions.findIndex(v=>v.checkpoint===current.checkpoint);if(i<versions.length-1)go(versions[i+1].checkpoint)};
const dict=new Map([['PRESIDENT ROOT','Президент / корневой доступ'],['PRESIDENT','Президент'],['BLACK BOX','Чёрный ящик'],['PREVIEW','Предпросмотр'],['PRODUCTION','Рабочая среда'],['PUBLIC','Публичный контур'],['SIMULATION','Симуляция'],['DRAFT','Черновик'],['RUNTIME','Рабочее подключение'],['DESIGN','Проектная связь'],['GUARDRAIL','Защитное правило'],['WORKSHOP','Мастерская'],['OPERATIONS','Операции'],['EXTERNAL BUSINESS','Внешний бизнес'],['MACHINE','Станок'],['FLOW','Поток'],['VERSIONS','Версии'],['SYSTEM','Система'],['HEADQUARTERS','Штаб-квартира'],['VIEW AS','Посмотреть как роль'],['SETKA ID','Идентификатор SETKA'],['PATTERN EXPOSURE','Экспозиция паттерна']]);
function translate(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);for(const n of a){const p=n.parentElement;if(!p||p.closest('#setkaResearchBar,#setkaCommentModal')||/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION)$/.test(p.tagName))continue;const raw=n.nodeValue||'',t=raw.trim(),u=t.toUpperCase();if(dict.has(u)){n.nodeValue=raw.replace(t,dict.get(u));p.dataset.canonical=t;p.title=p.title||('Системное имя: '+t);p.classList.add('systemEntityRu')}}}setTimeout(translate,160);setTimeout(translate,1000);setInterval(translate,2200);
function elapsed(){const a=active();return a?.startedAt?Math.max(0,Date.now()-Number(a.startedAt)):0}
function semantic(el){const n=el?.closest?.('[data-tab],[data-floor],[data-cabinet],[data-node],[data-edge],button,input,select,textarea,[role="button"]')||el;if(!n)return{};const o={tag:String(n.tagName||'').toLowerCase()};if(n.id)o.id=n.id;if(n.dataset)for(const k of ['tab','floor','cabinet','node','edge','i18n'])if(n.dataset[k])o[k]=String(n.dataset[k]).slice(0,120);if(o.tag==='button'||n.getAttribute?.('role')==='button'){const tx=String(n.textContent||'').trim().replace(/\s+/g,' ');if(tx)o.text=tx.slice(0,90)}return o}
function push(type,e,extra={}){if(!recording||pending)return;const item={t:elapsed(),type,checkpoint:current.checkpoint,...extra};if(e&&'clientX'in e){item.pointerId=e.pointerId||0;item.pointerType=e.pointerType||'unknown';item.x=Math.round(e.clientX);item.y=Math.round(e.clientY);item.nx=+(e.clientX/Math.max(1,innerWidth)).toFixed(5);item.ny=+(e.clientY/Math.max(1,innerHeight)).toFixed(5);item.target=semantic(e.target)}item.scroll={x:Math.round(scrollX||0),y:Math.round(scrollY||0)};buffer.push(item);if(buffer.length>=240)flush('buffer').catch(()=>{})}
function draw(e){if(!ctx)return;const id=e.pointerId||0,p=liveLast.get(id),yy=e.clientY-64;ctx.strokeStyle='rgba(255,255,255,.78)';ctx.fillStyle='#fff';ctx.lineWidth=2;if(e.type==='pointerdown'){liveLast.set(id,{x:e.clientX,y:yy});ctx.beginPath();ctx.arc(e.clientX,yy,4,0,Math.PI*2);ctx.fill()}else if(e.type==='pointermove'&&p){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(e.clientX,yy);ctx.stroke();liveLast.set(id,{x:e.clientX,y:yy})}else if((e.type==='pointerup'||e.type==='pointercancel')&&p){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(e.clientX,yy);ctx.stroke();liveLast.delete(id)}}
function onPointer(e){if(e.target?.closest?.('#setkaResearchBar,#setkaCommentModal'))return;if(e.type==='pointermove'){const l=lastMove.get(e.pointerId)||{t:0,x:-999,y:-999},now=performance.now();if(now-l.t<28&&Math.hypot(e.clientX-l.x,e.clientY-l.y)<3)return;lastMove.set(e.pointerId,{t:now,x:e.clientX,y:e.clientY})}push(e.type,e);draw(e)}
for(const k of ['pointerdown','pointermove','pointerup','pointercancel'])document.addEventListener(k,onPointer,true);
function startSegment(reason){segment='SEG-'+crypto.randomUUID().slice(0,10).toUpperCase();seq=0;push('segment_start',null,{reason,url:location.href})}
async function flush(reason='interval',keepalive=false){if(!recording||pending||!buffer.length)return;const a=active();if(!a?.traceCode)return;const events=buffer.splice(0),chunkSeq=seq++;try{return await api('trace_append',{traceCode:a.traceCode,checkpoint:current.checkpoint,frontVersion:'diamond-president-v0.8.3',segmentKey:segment,chunkSeq,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1,orientation:innerWidth>=innerHeight?'landscape':'portrait'},summary:{reason,sessionElapsedEndMs:elapsed()},events},keepalive)}catch(e){buffer.unshift(...events);seq=Math.max(0,seq-1);throw e}}
async function startResearch(){if(recording)return;if(!token())throw new Error('Сначала войди в кабинет Президента');const d=await api('trace_start',{checkpoint:current.checkpoint,frontVersion:'diamond-president-v0.8.3',viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1,orientation:innerWidth>=innerHeight?'landscape':'portrait'}});setActive({traceCode:d.traceCode,startedAt:Date.now()});recording=true;pending=false;pencil.classList.add('recording');pencil.innerHTML='■&nbsp; Остановить и добавить комментарий';startSegment('recording_started');clearInterval(flushTimer);flushTimer=setInterval(()=>flush('interval').catch(()=>{}),4000)}
async function requestStop(){if(!recording)return;push('recording_pause_for_comment');await flush('stop_for_comment').catch(()=>{});pending=true;recording=false;clearInterval(flushTimer);pencil.classList.remove('recording');pencil.innerHTML='✎&nbsp; Запись на паузе';qs('#setkaCommentModal').classList.add('open')}
pencil.onclick=()=>{if(recording)requestStop();else if(pending)qs('#setkaCommentModal').classList.add('open');else startResearch().catch(e=>alert(e.message))};
qs('#setkaContinue').onclick=()=>{pending=false;recording=true;qs('#setkaCommentModal').classList.remove('open');pencil.classList.add('recording');pencil.innerHTML='■&nbsp; Остановить и добавить комментарий';startSegment('continued_after_comment');clearInterval(flushTimer);flushTimer=setInterval(()=>flush('interval').catch(()=>{}),4000)};
qs('#setkaSave').onclick=async()=>{const a=active();if(!a?.traceCode)return;try{await api('trace_finalize',{traceCode:a.traceCode,title:qs('#setkaTraceTitle').value,comment:qs('#setkaTraceComment').value,summary:{endCheckpoint:current.checkpoint}});setActive(null);pending=false;recording=false;qs('#setkaCommentModal').classList.remove('open');pencil.innerHTML='✎&nbsp; Записать путь';alert('Сохранено · '+a.traceCode)}catch(e){alert(e.message)}};
addEventListener('pagehide',()=>{if(recording){push('pagehide');flush('pagehide',true).catch(()=>{})}});
qs('#setkaHealth').textContent=current.label+' · интерфейс загружен';
})();<\/script>`;

// Keep historical CSS/JS/CSP and structure intact. Add only our overlay.
if(/<\/head>/i.test(html)) html=html.replace(/<\/head>/i,researchStyle+'</head>');
else html=researchStyle+html;
if(/<body[^>]*>/i.test(html)) html=html.replace(/<body([^>]*)>/i,(m)=>m+researchBar);
else html=researchBar+html;
if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,runtime+'</body>');
else html+=runtime;

document.open();
document.write(html);
document.close();
})().catch(e=>{document.getElementById('boot').textContent='SETKA · v0.8.3 · ОШИБКА ЗАГРУЗКИ · '+e.message;console.error(e)});
</script>
