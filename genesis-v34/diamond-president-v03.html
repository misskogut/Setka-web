function applyPerspectiveNav(){const sections=perspective?.uiProfile?.sections||['home','front','access','flow','versions','system'];const map={hq:['home','access','public','external','operations','lab'],flow:['flow'],versions:['versions'],system:['front','system','memory','vault','black_box','patterns']};$$('[data-tab]').forEach(b=>{const visible=perspective?.viewingAs==='president_root'||(map[b.dataset.tab]||[]).some(x=>sections.includes(x));b.classList.toggle('hidden',!visible)});if($(`[data-tab="${activeTab}"]`)?.classList.contains('hidden')){const first=$$('[data-tab]').find(b=>!b.classList.contains('hidden'));if(first)switchTab(first.dataset.tab)}}
function renderPerspective(){const isPreview=perspective&&perspective.viewingAs!=='president_root';$('#viewChip').innerHTML='<strong>'+esc(t('you.view'))+'</strong>&nbsp; '+esc(isPreview?dyn(data.access.roles.find(r=>r.roleKey===perspective.viewingAs)?.titleKey||perspective.viewingAs):'PRESIDENT ROOT');$('#previewBar').classList.toggle('hidden',!isPreview);if(isPreview){$('#previewTitle').textContent=dyn(data.access.roles.find(r=>r.roleKey===perspective.viewingAs)?.titleKey||perspective.viewingAs);$('#previewText').textContent=t('preview.simulation')}applyPerspectiveNav()}
function floorHtml(f){const cabinets=data.access.cabinets.filter(c=>c.floor_key===f.floor_key);const roles=data.access.roles.filter(r=>r.floorKey===f.floor_key);const cabHtml=cabinets.map(c=>{const rs=roles.filter(r=>r.cabinetKey===c.cabinet_key);return `<div class="cabinet"><div class="cabinetTop"><div><div class="cabinetTitle">${esc(dyn(c.title_key))}</div><div class="mini">${esc(dyn(c.description_key))}</div></div><span class="door">${esc(doorLabel(c.door_state))}</span></div><div class="roles">${rs.map(r=>`<button class="roleBtn" data-role-view="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</button>`).join('')||'<span class="mini">—</span>'}</div>${doorControls('cabinet',c.cabinet_key,c.door_state,f.floor_key==='president')}</div>`}).join('');return `<article class="floor"><div class="floorHead"><div class="floorNo">${f.floor_order===0?'ROOT':esc(f.floor_order/10)}</div><div><div class="floorTitle">${esc(dyn(f.title_key))}</div><div class="floorDesc">${esc(dyn(f.description_key))}</div></div><span class="door">${esc(doorLabel(f.door_state))}</span></div><div class="floorBody">${doorControls('floor',f.floor_key,f.door_state,f.floor_key==='president')}${cabHtml}</div></article>`}
function doorControls(type,key,state,locked){const states=['open','guarded','president_only','frozen'];return `<div class="doorControls">${states.map(s=>`<button data-door-type="${type}" data-door-key="${esc(key)}" data-door-state="${s}" class="${s===state?'current':''}" ${locked||!mutationAllowed()?'disabled':''}>${esc(doorLabel(s))}</button>`).join('')}</div>`}
function bindHQ(){$$('[data-role-view]').forEach(b=>b.onclick=()=>viewAs(b.dataset.roleView));$$('[data-door-type]').forEach(b=>b.onclick=async()=>{if(!mutationAllowed())return;if(!confirm(t('door.changeConfirm')))return;try{await call(b.dataset.doorType==='floor'?'set_floor_door':'set_cabinet_door',b.dataset.doorType==='floor'?{floorKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President cabinet v0.3'}:{cabinetKey:b.dataset.doorKey,state:b.dataset.doorState,reason:'President cabinet v0.3'});await load()}catch(e){alert(e.message)}})}
async function viewAs(roleKey){try{const d=await call('role_perspective',{roleKey});perspective=d.perspective;renderPerspective();renderHQ()}catch(e){alert(e.message)}}$('#exitPreview').onclick=()=>viewAs('president_root');
function roleOptions(includeNone=false){return (includeNone?`<option value="">${esc(t('identity.none'))}</option>`:'')+data.access.roles.filter(r=>r.roleKey!=='president_root'&&r.releasable).map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('')}
function renderHQ(){$('#hq').innerHTML=data.access.floors.map(f=>floorHtml(f)).join('');$('#issueRole').innerHTML=roleOptions(true);$('#assignRole').innerHTML=roleOptions(false);bindHQ();$('#issueBtn').disabled=!mutationAllowed();$('#assignBtn').disabled=!mutationAllowed()}
function card(k,v){return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`}
function renderFlow(){const f=data.flow;$('#flowCounts').innerHTML=card(t('flow.open'),f.counts.open)+card(t('flow.decisions'),f.counts.decisions)+card(t('flow.urgent'),f.counts.urgent);$('#queues').innerHTML=f.queues.map(q=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">${esc(dyn(q.titleKey))}</div><div class="itemMeta">${esc(dyn(q.descriptionKey))}</div></div><span class="tag">${esc(q.openCount)}</span></div></div>`).join('')||`<div class="mini">${esc(t('empty'))}</div>`;$('#threads').innerHTML=f.threads.map(x=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">${esc(x.subject)}</div><div class="itemMeta">${esc(x.senderSetkaId||'SYSTEM')} · ${esc(x.senderRoleKey||'—')} → ${esc(x.recipientType)}:${esc(x.recipientRef)}</div><div class="mini" style="margin-top:4px">${esc(x.lastMessage||'')}</div></div><span class="tag">${esc(x.status)}</span></div></div>`).join('')||`<div class="mini">${esc(t('empty'))}</div>`;$('#flowSender').innerHTML=data.access.roles.filter(r=>r.assignedToPresident).map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');$('#flowKind').innerHTML=['message','request','approval','case','decision'].map(x=>`<option value="${x}">${esc(t('kind.'+x))}</option>`).join('');$('#flowRecipientType').innerHTML=['queue','role','identity','system'].map(x=>`<option value="${x}">${esc(t('recipient.'+x))}</option>`).join('');$('#flowPriority').innerHTML=['low','normal','high','urgent'].map(x=>`<option value="${x}">${esc(t('priority.'+x))}</option>`).join('');updateRecipients();$('#flowSend').disabled=!mutationAllowed()}
function updateRecipients(){const typ=$('#flowRecipientType').value;if(typ==='queue')$('#flowRecipient').innerHTML=data.flow.queues.map(q=>`<option value="${esc(q.queueKey)}">${esc(dyn(q.titleKey))}</option>`).join('');else if(typ==='role')$('#flowRecipient').innerHTML=data.access.roles.map(r=>`<option value="${esc(r.roleKey)}">${esc(dyn(r.titleKey))}</option>`).join('');else if(typ==='system')$('#flowRecipient').innerHTML='<option value="setka_system">SETKA SYSTEM</option>';else $('#flowRecipient').innerHTML='<option value="SETKA-ID">SETKA ID</option>'}$('#flowRecipientType').addEventListener('change',updateRecipients);
function renderVersions(){const tm=data.timeMachine;$('#checkpointChip').textContent='CHECKPOINT · '+(tm.activeCheckpoint||'—');$('#versions').innerHTML=(tm.checkpoints||[]).map(v=>`<div class="version ${v.checkpoint===tm.activeCheckpoint?'active':''}"><div class="versionTop"><div><div class="itemTitle mono">${esc(v.checkpoint)}</div><div class="mini">${esc(v.notes||'')}</div></div><span class="tag">${esc(v.checkpoint===tm.activeCheckpoint?t('versions.active'):v.status)}</span></div><div class="mini" style="margin-top:7px">${esc((v.migration_refs||[]).join(' · '))}</div><div class="versionActions"><button class="secondary" data-checkpoint="${esc(v.checkpoint)}" ${v.checkpoint===tm.activeCheckpoint||!mutationAllowed()?'disabled':''}>${esc(t('versions.activate'))}</button></div></div>`).join('');$$('[data-checkpoint]').forEach(b=>b.onclick=async()=>{if(!confirm(t('versions.confirm')))return;try{await call('activate_checkpoint',{checkpoint:b.dataset.checkpoint,reason:'President Time Machine v0.3'});$('#versionState').textContent='OK';await load()}catch(e){$('#versionState').textContent=e.message}})}
function renderSystem(){const x=data.live;$('#metrics').innerHTML=card(t('metric.participants'),x.participants)+card(t('metric.exposures'),x.exposures)+card(t('metric.saved'),x.favorites)+card(t('metric.visits'),x.visits)+card(t('metric.configs'),x.configs)+card(t('metric.time'),fmtMs(x.totalPatternMs))+card(t('metric.sessions'),x.sessions)+card(t('metric.return'),Math.round(x.returnRate*100)+'%')+card(t('metric.notes'),x.notes);$('#layers').innerHTML=data.core.layers.map(l=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">${esc(l.layer_key)}</div><div class="itemMeta">${esc(l.description)}</div></div><span class="tag">${esc(l.status)}</span></div></div>`).join('');$('#releases').innerHTML=data.core.releases.map(r=>`<div class="item"><div class="itemTitle">${esc(r.channel)}</div><div class="itemMeta mono">${esc(r.front_version||'—')}</div></div>`).join('');$('#patterns').innerHTML=x.patterns.map(p=>`<tr><td><b>${esc(p.patternId)}</b></td><td>${esc(fmtMs(p.totalMs))}</td><td>${esc(p.exposures)}</td><td>${esc(p.saves)}</td><td>${esc(p.sessions)}</td></tr>`).join('')||`<tr><td colspan="5">${esc(t('empty'))}</td></tr>`}
function renderAll(){if(!data)return;$('#apiState').textContent=`API v${data.apiVersion||'?'} · ${data.core.identity.setkaId}`;renderPerspective();renderHQ();renderFlow();renderVersions();renderSystem()}
async function load(){try{data=await call('dashboard');if(!perspective)perspective=(await call('role_perspective',{roleKey:'president_root'})).perspective;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderAll()}catch(e){sessionStorage.removeItem('setkaDiamondSession');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginErr').textContent=e.message.includes('invalid_session')?t('error.session'):e.message}}
$('#enter').onclick=async()=>{try{$('#loginErr').textContent='';const d=await call('login',{setkaId:$('#sid').value,presidentKey:$('#key').value});token=d.sessionToken;sessionStorage.setItem('setkaDiamondSession',token);$('#key').value='';perspective=null;await load()}catch(e){$('#loginErr').textContent=e.message.includes('invalid_credentials')?t('error.credentials'):e.message}};$('#refresh').onclick=load;$('#logout').onclick=async()=>{try{await call('logout')}catch{}sessionStorage.removeItem('setkaDiamondSession');token='';location.reload()};
$('#issueBtn').onclick=async()=>{if(!mutationAllowed())return;try{const d=await call('issue_identity',{roleKey:$('#issueRole').value||null,note:$('#issueNote').value});$('#issueResult').classList.remove('hidden');$('#issueResult').innerHTML=`<div class="mini">${esc(t('identity.created'))}</div><div class="resultCode">${esc(d.setkaId)}</div><div class="mini">${esc(d.roleKey||t('identity.none'))}</div>`;await load()}catch(e){$('#issueResult').classList.remove('hidden');$('#issueResult').textContent=e.message}};
$('#assignBtn').onclick=async()=>{if(!mutationAllowed())return;try{const d=await call('assign_role',{setkaId:$('#assignId').value,roleKey:$('#assignRole').value,scope:{},note:'President cabinet v0.3'});$('#assignState').textContent=t('role.assigned')+' · '+d.setkaId+' · '+d.roleKey;await load()}catch(e){$('#assignState').textContent=e.message}};
$('#flowSend').onclick=async()=>{if(!mutationAllowed())return;try{const recipientType=$('#flowRecipientType').value;let recipientRef=$('#flowRecipient').value;if(recipientType==='identity'){recipientRef=prompt('SETKA ID')||'';if(!recipientRef)return}await call('flow_create',{senderRoleKey:$('#flowSender').value,kind:$('#flowKind').value,subject:$('#flowSubject').value,recipientType,recipientRef,body:$('#flowBody').value,priority:$('#flowPriority').value});$('#flowState').textContent=t('flow.sent');$('#flowSubject').value='';$('#flowBody').value='';await load();switchTab('flow')}catch(e){$('#flowState').textContent=e.message}};
applyLocale();switchTab('hq');if(token)load();
</script></body></html>
