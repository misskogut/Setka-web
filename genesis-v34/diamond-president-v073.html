(async()=>{

let traceRecording=false,traceStart=0,traceEvents=[],traceLastMove=new Map(),traceLiveLast=new Map(),traceTimer=0,traceRows=[],tracePlaying=false;const traceCanvas=$('#traceCanvas'),traceCtx=traceCanvas.getContext('2d');
function traceResize(){const d=Math.max(1,Math.min(2,devicePixelRatio||1));traceCanvas.width=Math.round(innerWidth*d);traceCanvas.height=Math.round(innerHeight*d);traceCanvas.style.width=innerWidth+'px';traceCanvas.style.height=innerHeight+'px';traceCtx.setTransform(d,0,0,d,0,0)}
function traceClear(){traceResize();traceCtx.clearRect(0,0,innerWidth,innerHeight)}
function activeTabKey(){return document.querySelector('[data-tab].active')?.dataset.tab||''}
function semanticTarget(el){let n=el?.closest?.('[data-tab],[data-floor],[data-cabinet],[data-node],[data-edge],button,input,select,textarea,[role="button"]')||el;if(!n)return{};let o={tag:String(n.tagName||'').toLowerCase()};if(n.id)o.id=n.id;if(n.dataset){for(const k of ['tab','floor','cabinet','node','edge','i18n'])if(n.dataset[k])o[k]=String(n.dataset[k]).slice(0,120)}if(n.getAttribute){let a=n.getAttribute('aria-label');if(a)o.aria=String(a).slice(0,100);let role=n.getAttribute('role');if(role)o.role=String(role).slice(0,40)}if(o.tag==='button'||o.role==='button'){let tx=String(n.textContent||'').trim().replace(/\s+/g,' ');if(tx)o.text=tx.slice(0,80)}return o}
function targetKey(tg){return tg.tab?'tab:'+tg.tab:tg.floor?'floor:'+tg.floor:tg.cabinet?'cabinet:'+tg.cabinet:tg.node?'node:'+tg.node:tg.edge?'edge:'+tg.edge:tg.id?'id:'+tg.id:(tg.text?'text:'+tg.text:'')}
function tracePush(type,e,extra={}){if(!traceRecording)return;let now=performance.now(),tg=e?semanticTarget(e.target):{};let item={t:Math.round(now-traceStart),type,tab:activeTabKey(),...extra};if(e&&'clientX'in e){item.pointerId=e.pointerId||0;item.pointerType=e.pointerType||'unknown';item.x=Math.round(e.clientX);item.y=Math.round(e.clientY);item.nx=+(e.clientX/Math.max(1,innerWidth)).toFixed(5);item.ny=+(e.clientY/Math.max(1,innerHeight)).toFixed(5);item.target=tg}let center=$('.center');item.scroll={x:Math.round(center?.scrollLeft||0),y:Math.round(center?.scrollTop||0)};traceEvents.push(item);if(traceEvents.length>12000)stopTrace('limit')}
function liveLine(e,type){if(!e||!('clientX'in e))return;let id=e.pointerId||0,p=traceLiveLast.get(id);traceCtx.lineWidth=2;traceCtx.strokeStyle='rgba(255,255,255,.72)';traceCtx.fillStyle='rgba(255,255,255,.9)';if(type==='pointerdown'){traceLiveLast.set(id,{x:e.clientX,y:e.clientY});traceCtx.beginPath();traceCtx.arc(e.clientX,e.clientY,4,0,Math.PI*2);traceCtx.fill()}else if(type==='pointermove'&&p){traceCtx.beginPath();traceCtx.moveTo(p.x,p.y);traceCtx.lineTo(e.clientX,e.clientY);traceCtx.stroke();traceLiveLast.set(id,{x:e.clientX,y:e.clientY})}else if(type==='pointerup'||type==='pointercancel'){if(p){traceCtx.beginPath();traceCtx.moveTo(p.x,p.y);traceCtx.lineTo(e.clientX,e.clientY);traceCtx.stroke()}traceCtx.beginPath();traceCtx.arc(e.clientX,e.clientY,6,0,Math.PI*2);traceCtx.stroke();traceLiveLast.delete(id)}}
function onTracePointer(e){if(!traceRecording||e.target?.closest?.('[data-trace-control]'))return;if(e.type==='pointermove'){let last=traceLastMove.get(e.pointerId)||{t:0,x:-999,y:-999},now=performance.now();if(now-last.t<28&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<3)return;traceLastMove.set(e.pointerId,{t:now,x:e.clientX,y:e.clientY})}tracePush(e.type,e);liveLine(e,e.type)}
function onTraceScroll(){if(traceRecording)tracePush('scroll',null,{tab:activeTabKey()})}
['pointerdown','pointermove','pointerup','pointercancel'].forEach(k=>addEventListener(k,onTracePointer,true));$('.center')?.addEventListener('scroll',onTraceScroll,{passive:true});addEventListener('resize',traceResize);
function recClock(){let ms=Math.max(0,performance.now()-traceStart),s=Math.floor(ms/1000),m=Math.floor(s/60);$('#recClock').textContent='REC '+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTrace(){if(tracePlaying)return;traceRecording=true;traceStart=performance.now();traceEvents=[];traceLastMove.clear();traceLiveLast.clear();traceClear();tracePush('start',null,{tab:activeTabKey()});$('#pencilBtn').classList.add('recording','tracePulse');$('#pencilBtn').setAttribute('aria-label','Stop pencil recording');$('#recClock').classList.remove('hidden');recClock();traceTimer=setInterval(recClock,250)}
async function stopTrace(reason='manual'){if(!traceRecording)return;tracePush('stop',null,{reason,tab:activeTabKey()});traceRecording=false;clearInterval(traceTimer);$('#pencilBtn').classList.remove('recording','tracePulse');$('#pencilBtn').setAttribute('aria-label','Start pencil recording');$('#recClock').textContent='SAVING…';let duration=Math.round(performance.now()-traceStart),targets=[...new Set(traceEvents.map(x=>targetKey(x.target||{})).filter(Boolean))].slice(0,120),pointerTypes=[...new Set(traceEvents.map(x=>x.pointerType).filter(Boolean))];try{let d=await call('trace_save',{frontVersion:'diamond-president-v0.7.3',durationMs:duration,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1,orientation:innerWidth>=innerHeight?'landscape':'portrait'},summary:{startTab:traceEvents[0]?.tab||'',endTab:activeTabKey(),uniqueTargets:targets,pointerTypes,reason},events:traceEvents});$('#recClock').textContent=d.traceCode;await loadTraces();setTimeout(()=>$('#recClock').classList.add('hidden'),5000)}catch(e){$('#recClock').textContent='SAVE ERROR';console.error(e);setTimeout(()=>$('#recClock').classList.add('hidden'),5000)}traceEvents=[];traceLiveLast.clear()}
$('#pencilBtn').onclick=()=>traceRecording?stopTrace():startTrace();
function traceDuration(ms){let s=Math.round((Number(ms)||0)/1000);return s<60?s+'s':Math.floor(s/60)+'m '+s%60+'s'}
function renderTraceList(){let el=$('#traceList');if(!el)return;el.innerHTML=traceRows.length?traceRows.map(r=>`<div class="traceRow"><div class="row" style="justify-content:space-between"><span class="traceCode">${esc(r.traceCode)}</span><span class="tag">${esc(traceDuration(r.durationMs))}</span></div><div class="mini">${esc(r.summary?.startTab||'—')} → ${esc(r.summary?.endTab||'—')} · ${esc(r.eventCount)} events</div><div class="traceActions"><button class="secondary" data-trace-play="${esc(r.traceCode)}" data-trace-control="1">${esc(t('trace.play'))}</button><button class="ghost" data-trace-copy="${esc(r.traceCode)}" data-trace-control="1">${esc(t('trace.copy'))}</button></div></div>`).join(''):`<div class="empty">${esc(t('trace.empty'))}</div>`;document.querySelectorAll('[data-trace-play]').forEach(b=>b.onclick=()=>playTrace(b.dataset.tracePlay));document.querySelectorAll('[data-trace-copy]').forEach(b=>b.onclick=()=>copyTraceId(b.dataset.traceCopy))}
async function loadTraces(){if(!token)return;let d=await call('trace_list',{limit:30});traceRows=d.traces||[];renderTraceList()}
async function copyTraceId(code){let msg='Посмотри запись '+code;try{await navigator.clipboard.writeText(msg);$('#recClock').classList.remove('hidden');$('#recClock').textContent=code+' COPIED';setTimeout(()=>$('#recClock').classList.add('hidden'),2200)}catch{prompt('Trace ID',code)}}
function playPoint(ev,lastByPointer){let x=(Number(ev.nx)||0)*innerWidth,y=(Number(ev.ny)||0)*innerHeight,id=ev.pointerId||0,p=lastByPointer.get(id);traceCtx.strokeStyle='rgba(255,255,255,.8)';traceCtx.fillStyle='#fff';traceCtx.lineWidth=2;if(ev.type==='pointerdown'){lastByPointer.set(id,{x,y});traceCtx.beginPath();traceCtx.arc(x,y,4,0,Math.PI*2);traceCtx.fill()}else if(ev.type==='pointermove'&&p){traceCtx.beginPath();traceCtx.moveTo(p.x,p.y);traceCtx.lineTo(x,y);traceCtx.stroke();lastByPointer.set(id,{x,y})}else if(ev.type==='pointerup'||ev.type==='pointercancel'){if(p){traceCtx.beginPath();traceCtx.moveTo(p.x,p.y);traceCtx.lineTo(x,y);traceCtx.stroke()}traceCtx.beginPath();traceCtx.arc(x,y,7,0,Math.PI*2);traceCtx.stroke();lastByPointer.delete(id)}}
async function playTrace(code){if(traceRecording)return;let d=await call('trace_get',{traceCode:code}),events=d.trace?.events||[];if(!events.length)return;tracePlaying=true;traceClear();$('#recClock').classList.remove('hidden');$('#recClock').textContent='PLAY '+code;let start=performance.now(),i=0,last=new Map();function frame(now){let elapsed=now-start;while(i<events.length&&Number(events[i].t||0)<=elapsed){let ev=events[i++];if(ev.type.startsWith('pointer'))playPoint(ev,last);if(ev.type==='scroll'&&$('.center'))$('.center').scrollTop=Number(ev.scroll?.y||0)}if(i<events.length){requestAnimationFrame(frame)}else{tracePlaying=false;$('#recClock').textContent=code;setTimeout(()=>{$('#recClock').classList.add('hidden');traceClear()},2500)}}requestAnimationFrame(frame)}
$('#traceRefresh').onclick=()=>loadTraces().catch(console.error);

}
