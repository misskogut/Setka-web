<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000" />
<title>SETKA Research Admin</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#0d0d0d;--panel2:#121212;--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.46);--soft:rgba(255,255,255,.72)}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}body{min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}.shell{max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 18px 60px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.brand{font-size:17px;font-weight:680;letter-spacing:.08em}.sub{font-size:11px;color:var(--muted);letter-spacing:.08em}.spacer{flex:1}.btn{min-height:42px;border:1px solid rgba(255,255,255,.28);border-radius:22px;background:#090909;color:#fff;padding:0 16px}.btn.primary{background:#fff;color:#000;border-color:#fff;font-weight:650}.btn.danger{border-color:rgba(255,120,120,.4)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:16px}.tab{white-space:nowrap;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#070707;color:var(--muted)}.tab.active{background:#fff;color:#000;border-color:#fff}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}.kpi .v{font-size:25px;font-weight:680;margin-bottom:4px}.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.section-title{font-size:13px;font-weight:650;margin:4px 0 11px}.muted{color:var(--muted)}.small{font-size:11px}.participants{grid-template-columns:repeat(3,minmax(0,1fr))}.participant{cursor:pointer;transition:.15s}.participant:active{transform:scale(.99)}.participant .code{font-size:15px;font-weight:650}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{font-size:10px;padding:4px 8px;border-radius:12px;background:#171717;color:var(--soft);border:1px solid rgba(255,255,255,.07)}.pill.good{background:#162018}.pill.warn{background:#211b12}.split{display:grid;grid-template-columns:360px 1fr;gap:14px}.list{display:grid;gap:8px}.session-row{border:1px solid var(--line);border-radius:15px;background:#090909;padding:12px;cursor:pointer}.session-row.active{border-color:rgba(255,255,255,.55)}.session-row .rowtop{display:flex;justify-content:space-between;gap:8px}.replay-wrap{display:grid;grid-template-columns:minmax(280px,430px) 1fr;gap:16px;align-items:start}.phone{position:relative;aspect-ratio:9/16;max-height:640px;background:#000;border:1px solid rgba(255,255,255,.2);border-radius:26px;overflow:hidden;margin:0 auto;width:100%}.phone canvas{width:100%;height:100%;display:block}.replay-label{position:absolute;left:12px;right:12px;top:12px;text-align:center;font-size:10px;color:rgba(255,255,255,.55);pointer-events:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.controls .btn{min-height:38px;padding:0 13px}.range{width:100%;accent-color:#fff}.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--soft)}.markers{position:relative;height:22px;margin-top:-4px}.marker{position:absolute;top:3px;width:5px;height:12px;border-radius:3px;background:rgba(255,255,255,.65);transform:translateX(-50%)}.event-list{max-height:370px;overflow:auto;display:grid;gap:6px}.event{font-size:11px;border-bottom:1px solid rgba(255,255,255,.06);padding:7px 0;color:var(--soft)}.event b{color:#fff}.intent-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.intent-card .rate{font-size:21px;font-weight:680}.bar{height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:#fff}.community-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.community-item{position:relative;aspect-ratio:1;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}.community-item canvas{width:100%;height:100%}.community-badge{position:absolute;left:7px;top:7px;font-size:9px;background:rgba(0,0,0,.72);padding:3px 6px;border-radius:9px}.community-note{position:absolute;left:7px;right:7px;bottom:7px;font-size:9px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.6);padding:4px 6px;border-radius:8px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid rgba(255,255,255,.07)}.table th{color:var(--muted);font-weight:500}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(100%,390px);text-align:center}.loginbox input{width:100%;height:52px;border:1px solid rgba(255,255,255,.35);border-radius:26px;background:#080808;color:#fff;padding:0 18px;text-align:center;font-size:16px;margin:18px 0 2px}.empty{padding:42px 16px;text-align:center;color:var(--muted)}@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.participants{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.replay-wrap{grid-template-columns:1fr}.phone{max-width:420px}.community-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.shell{padding-left:12px;padding-right:12px}.kpis{grid-template-columns:repeat(2,1fr)}.participants{grid-template-columns:1fr}.intent-grid{grid-template-columns:repeat(2,1fr)}.community-grid{grid-template-columns:repeat(3,1fr)}.top .sub{width:100%}.card{border-radius:16px;padding:13px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">SETKA RESEARCH</div><div class="muted small" style="margin-top:8px">Административная исследовательская панель</div><input id="keyInput" type="password" placeholder="Admin key" autocomplete="current-password"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:10px">Войти</button><div id="loginError" class="muted small" style="margin-top:12px"></div></div></div>
<div id="dashboard" class="shell hidden">
  <div class="top"><div><div class="brand">SETKA RESEARCH</div><div class="sub">СЕССИИ · REPLAY · ЭФФЕКТ · СООБЩЕСТВО</div></div><div class="spacer"></div><button id="createCodeBtn" class="btn primary">+ ID</button><button id="refreshBtn" class="btn">Обновить</button><button id="logoutBtn" class="btn">Выйти</button></div>
  <div class="tabs"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="participants">Участники</button><button class="tab" data-tab="insights">Запросы / эффект</button><button class="tab" data-tab="community">Сообщество</button></div>
  <section id="tab-overview" class="tab-page"></section>
  <section id="tab-participants" class="tab-page hidden"></section>
  <section id="tab-insights" class="tab-page hidden"></section>
  <section id="tab-community" class="tab-page hidden"></section>
  <section id="detail" class="hidden" style="margin-top:16px"></section>
</div>
<script>
(() => {
"use strict";
const API_URL="https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-research-api";
const API_KEY="sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv";
const ADMIN_STORAGE="setka-research:admin-key:v1";
const INTENT={sleep:"Уснуть",relax:"Расслабиться",tension:"Снизить напряжение",focus:"Сконцентрироваться",energy:"Взбодриться",switch:"Переключиться",explore:"Просто исследую",none:"Без запроса"};
const $=id=>document.getElementById(id),login=$("login"),dashboard=$("dashboard"),keyInput=$("keyInput"),loginBtn=$("loginBtn"),loginError=$("loginError"),detail=$("detail");
let adminKey=localStorage.getItem(ADMIN_STORAGE)||"";let overview=null,participants=[],sessions=[],insights=[],community=[];let activeParticipant=null,activeSession=null,replay=null;
function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function fmtMs(ms){ms=Math.max(0,Number(ms)||0);const s=Math.round(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);if(h)return `${h}ч ${m%60}м`;if(m)return `${m}м ${s%60}с`;return `${s}с`}
function fmtDate(v){if(!v)return"—";try{return new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch(_){return String(v)}}
function face(v){return({1:"😣",2:"😕",3:"😐",4:"🙂",5:"😄"})[Number(v)]||"—"}
async function api(action,payload={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},body:JSON.stringify({action,adminKey,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"request_failed");return d}
async function loginNow(){loginBtn.disabled=true;loginError.textContent="";try{adminKey=keyInput.value.trim()||adminKey;await api("admin-check");localStorage.setItem(ADMIN_STORAGE,adminKey);login.classList.add("hidden");dashboard.classList.remove("hidden");await loadAll()}catch(_){loginError.textContent="Неверный ключ или нет соединения.";loginBtn.disabled=false}}
loginBtn.addEventListener("click",loginNow);keyInput.addEventListener("keydown",e=>{if(e.key==="Enter")loginNow()});
$("logoutBtn").addEventListener("click",()=>{localStorage.removeItem(ADMIN_STORAGE);location.reload()});
$("refreshBtn").addEventListener("click",loadAll);
$("createCodeBtn").addEventListener("click",async()=>{const label=prompt("Метка участника (необязательно):","");if(label===null)return;try{const d=await api("admin-create-code",{label});await navigator.clipboard?.writeText?.(d.participant.access_code).catch(()=>{});alert(`Новый ID: ${d.participant.access_code}`);await loadAll()}catch(_){alert("Не удалось создать ID")}});

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tab-page").forEach(x=>x.classList.add("hidden"));$(`tab-${b.dataset.tab}`).classList.remove("hidden");detail.classList.add("hidden")}));

async function loadAll(){try{const [o,p,s,i,c]=await Promise.all([api("admin-overview"),api("admin-list-participants"),api("admin-list-sessions"),api("admin-insights"),api("admin-community")]);overview=o.overview||{};participants=p.participants||[];sessions=s.sessions||[];insights=i.insights||[];community=c.items||[];renderOverview();renderParticipants();renderInsights();renderCommunity()}catch(e){console.error(e)}}

function renderOverview(){const o=overview||{},retRate=o.participants?Math.round((o.returners||0)/o.participants*100):0,feedbackRate=o.sessions?Math.round((o.completed||0)/o.sessions*100):0;const el=$("tab-overview");el.innerHTML=`<div class="grid kpis">
${kpi(o.participants||0,"участников")}${kpi(o.sessions||0,"сессий")}${kpi(`${retRate}%`,"вернулись 2+ раза")}${kpi(`${feedbackRate}%`,"с оценкой после")}${kpi(fmtMs(o.activeMs||0),"активное время")}${kpi(`${Number(o.avgDelta||0)>=0?"+":""}${Number(o.avgDelta||0).toFixed(2)}`,"среднее Δ состояния")}
</div><div class="card"><div class="section-title">Запросы сессий</div><div id="overviewIntents" class="grid intent-grid"></div></div><div class="card" style="margin-top:12px"><div class="section-title">Что уже можно читать из данных</div><div class="small muted">Возврат показывает добровольное повторное использование. Δ состояния — разница смайлика после и до. «Положительно» ниже учитывает либо улучшение смайлика, либо прямой ответ «Да, помогло».</div></div>`;const wrap=$("overviewIntents");const entries=Object.entries(o.intents||{}).filter(([k])=>k!=="none");if(!entries.length)wrap.innerHTML=`<div class="empty" style="grid-column:1/-1">Пока нет завершённых исследовательских сессий.</div>`;else for(const[k,v]of entries){const rate=v.completed?Math.round(v.improved/v.completed*100):0;const d=v.completed?v.deltaSum/v.completed:0;wrap.insertAdjacentHTML("beforeend",`<div class="card intent-card"><div class="small muted">${esc(INTENT[k]||k)}</div><div class="rate">${rate}%</div><div class="small">положительный исход</div><div class="small muted" style="margin-top:5px">${v.sessions} сесс. · Δ ${d>=0?"+":""}${d.toFixed(2)}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,rate))}%"></span></div></div>`)}}
function kpi(v,l){return `<div class="card kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`}

function renderParticipants(){const el=$("tab-participants");el.innerHTML=`<div class="section-title">Участники</div><div class="grid participants" id="participantGrid"></div>`;const grid=$("participantGrid");if(!participants.length){grid.innerHTML='<div class="empty">Нет участников</div>';return}participants.forEach(p=>{const pr=p.profile||{};const card=document.createElement("div");card.className="card participant";card.innerHTML=`<div class="code">${esc(p.access_code)}</div><div class="small muted">${esc(p.label||"Без метки")}</div><div class="meta"><span class="pill ${p.bound?"good":"warn"}">${p.bound?"устройство закреплено":"не активирован"}</span><span class="pill">${p.sessionCount||0} сесс.</span><span class="pill">${p.activeDays||0} дней</span><span class="pill">${fmtMs(p.activeMs||0)} активно</span></div><div class="small muted" style="margin-top:10px">${pr.age_band?`Возраст ${esc(pr.age_band)} · `:""}${pr.practice_experience?esc(pr.practice_experience):"профиль не заполнен"}</div>`;card.addEventListener("click",()=>openParticipant(p));grid.appendChild(card)})}

function openParticipant(p){activeParticipant=p;detail.classList.remove("hidden");const own=sessions.filter(s=>s.participant_id===p.id);const pr=p.profile||{};detail.innerHTML=`<div class="split"><div><div class="card"><div class="section-title">${esc(p.access_code)}</div><div class="small muted">${esc(p.label||"Без метки")}</div><div class="meta"><span class="pill">возраст ${esc(pr.age_band||"—")}</span><span class="pill">практики ${esc(pr.practice_experience||"—")}</span><span class="pill">визуальная чувствительность ${esc(pr.visual_sensitivity||"—")}</span></div><div class="controls"><button id="resetDevice" class="btn">Сбросить устройство</button><button id="toggleParticipant" class="btn ${p.active?"danger":""}">${p.active?"Отключить ID":"Включить ID"}</button></div></div><div class="section-title" style="margin-top:16px">Сессии</div><div id="sessionList" class="list"></div></div><div id="sessionDetail"><div class="card empty">Выбери сессию слева</div></div></div>`;$("resetDevice").addEventListener("click",async()=>{if(!confirm("Сбросить привязку браузера?"))return;await api("admin-reset-device",{participantId:p.id});await loadAll();detail.classList.add("hidden")});$("toggleParticipant").addEventListener("click",async()=>{await api("admin-toggle-active",{participantId:p.id,active:!p.active});await loadAll();detail.classList.add("hidden")});const list=$("sessionList");own.forEach((s,idx)=>{const r=document.createElement("div");r.className="session-row";r.innerHTML=`<div class="rowtop"><b>Сессия ${own.length-idx}</b><span class="small muted">${fmtDate(s.started_at)}</span></div><div class="meta"><span class="pill">${esc(INTENT[s.request_key]||s.request_key||"без запроса")}</span><span class="pill">${face(s.pre_state)} → ${face(s.post_state)}</span><span class="pill">${fmtMs(s.active_ms||0)} активно</span>${s.completed?'<span class="pill good">оценена</span>':'<span class="pill warn">без финала</span>'}</div>`;r.addEventListener("click",()=>openSession(s,r));list.appendChild(r)})}

async function openSession(s,row){document.querySelectorAll(".session-row").forEach(x=>x.classList.remove("active"));row?.classList.add("active");const box=$("sessionDetail");box.innerHTML='<div class="card empty">Загружаем replay…</div>';try{const d=await api("admin-session",{sessionId:s.id});activeSession=d;renderSession(box,d)}catch(_){box.innerHTML='<div class="card empty">Не удалось загрузить сессию</div>'}}

function renderSession(box,d){if(replay)replay.stop();const events=d.events||[],states=events.filter(e=>e.event_type==="app_state"),duration=Math.max(1000,...events.map(e=>Number(e.t_ms)||0),...((d.snapshots||[]).map(x=>Number(x.t_ms)||0)));const useful=events.filter(e=>["pattern_open","favorite_save","favorite_remove","color_change","instructions_open","session_feedback","library_page"].includes(e.event_type));box.innerHTML=`<div class="card"><div class="section-title">Replay · ${esc(INTENT[d.session.request_key]||d.session.request_key||"Без запроса")}</div><div class="small muted" style="margin-bottom:12px">${face(d.session.pre_state)} → ${face(d.session.post_state)} · эффект: ${d.session.helped===2?"Да":d.session.helped===1?"Немного":d.session.helped===0?"Нет":"—"} · ${fmtMs(d.session.active_ms||0)} активного времени</div><div class="replay-wrap"><div><div class="phone"><canvas id="replayCanvas" width="540" height="960"></canvas><div id="replayLabel" class="replay-label"></div></div><div class="controls"><button id="playBtn" class="btn primary">▶</button><span id="timeLabel" class="time">0:00 / ${fmtClock(duration)}</span><select id="speedSelect" class="btn"><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="2">×2</option><option value="4">×4</option><option value="8">×8</option></select></div><input id="timeline" class="range" type="range" min="0" max="${duration}" step="10" value="0"><div id="markers" class="markers"></div></div><div><div class="section-title">События</div><div class="event-list">${useful.map(e=>`<div class="event"><b>${fmtClock(e.t_ms)}</b> · ${eventName(e)}</div>`).join("")||'<div class="muted small">Нет событий</div>'}</div>${renderUsage(d.usage||[])}</div></div></div>`;
const markerWrap=$("markers");useful.forEach(e=>{const m=document.createElement("span");m.className="marker";m.style.left=`${Math.min(100,Math.max(0,e.t_ms/duration*100))}%`;m.title=eventName(e);markerWrap.appendChild(m)});replay=createReplay($("replayCanvas"),$("replayLabel"),$("timeline"),$("timeLabel"),$("playBtn"),$("speedSelect"),states,duration);replay.draw(0)}
function renderUsage(list){if(!list.length)return'<div class="section-title" style="margin-top:16px">Паттерны</div><div class="muted small">Нет агрегированной экспозиции.</div>';return `<div class="section-title" style="margin-top:16px">Паттерны в сессии</div><table class="table"><thead><tr><th>Источник</th><th>Время</th><th>♥</th></tr></thead><tbody>${list.map(u=>`<tr><td>${u.community_config_id?`community ${esc(String(u.community_config_id).slice(0,6))}`:esc(u.pattern_id)}</td><td>${fmtMs(u.duration_ms)}</td><td>${u.saved?"да":"—"}</td></tr>`).join("")}</tbody></table>`}
function eventName(e){const p=e.payload||{};return({pattern_open:`открыт паттерн ${p.sourceType||""}`,favorite_save:"♥ сохранено",favorite_remove:"♡ удалено",color_change:`цвет ${Number(p.from)+1} → ${Number(p.to)+1}`,instructions_open:"открыта инструкция",session_feedback:"оценка после сессии",library_page:`панель ${p.page||""}`})[e.event_type]||e.event_type}
function fmtClock(ms){const s=Math.max(0,Math.floor((Number(ms)||0)/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

function createReplay(canvas,label,range,timeLabel,playBtn,speedSelect,states,duration){const ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;let t=0,playing=false,raf=0,last=0;function stateAt(ms){let best=null;for(const e of states){if(e.t_ms<=ms)best=e;else break}return best?best.payload:null}function draw(ms){t=Math.max(0,Math.min(duration,ms));range.value=String(t);timeLabel.textContent=`${fmtClock(t)} / ${fmtClock(duration)}`;const s=stateAt(t);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);if(!s){label.textContent="Начало сессии";return}if(s.view!=="game"){label.textContent=`Библиотека · ${s.libraryPage||"all"}`;drawLibrary(ctx,W,H,s.libraryPage);return}label.textContent=s.communityId?`Паттерн · community ${String(s.communityId).slice(0,6)}`:"Паттерн";const baseEvent=states.filter(e=>e.t_ms<=t).pop();const frame=(Number(s.frame)||0)+(baseEvent?Math.max(0,t-baseEvent.t_ms)/16.6667:0);renderPattern(ctx,W,H,s.config||{},frame)}function tick(ts){if(!playing)return;if(!last)last=ts;const speed=Number(speedSelect.value)||1;draw(t+(ts-last)*speed);last=ts;if(t>=duration){playing=false;playBtn.textContent="▶";return}raf=requestAnimationFrame(tick)}playBtn.addEventListener("click",()=>{playing=!playing;playBtn.textContent=playing?"❚❚":"▶";last=0;if(playing)raf=requestAnimationFrame(tick);else cancelAnimationFrame(raf)});range.addEventListener("input",()=>{draw(Number(range.value));last=0});return{draw,stop(){playing=false;cancelAnimationFrame(raf)}}}
function drawLibrary(ctx,w,h,page){ctx.fillStyle="#080808";for(let i=0;i<12;i++){const x=w*.14+(i%4)*w*.24,y=h*.23+Math.floor(i/4)*w*.24;ctx.strokeStyle=i===0?"rgba(255,255,255,.7)":"rgba(255,255,255,.12)";ctx.beginPath();ctx.arc(x,y,w*.06,0,Math.PI*2);ctx.stroke()}ctx.fillStyle="rgba(255,255,255,.5)";ctx.font="22px -apple-system";ctx.textAlign="center";ctx.fillText(page==="community"?"СООБЩЕСТВО":page==="favorites"?"СОХРАНЕННЫЕ":"ПАТТЕРНЫ",w/2,h*.12)}
function renderPattern(ctx,w,h,c,frame){const cfg={numTentacles:Number(c.numTentacles)||24,tentacleLength:Number(c.tentacleLength)||100,baseRadius:Number(c.baseRadius)||10,movementSpeed:Number(c.movementSpeed)||1,colorSpeed:Number(c.colorSpeed)||1,circleSize:Number(c.circleSize)||1,lineWeight:Number(c.lineWeight)||1,segmentStep:Number(c.segmentStep)||2,colorModeIndex:Number(c.colorModeIndex)||0};ctx.save();ctx.translate(w/2,h/2);const scale=w/390;ctx.scale(scale,scale);const shift=frame*cfg.colorSpeed*.5;for(let i=0;i<360;i+=360/cfg.numTentacles){const x0=Math.sin(rad(i))*cfg.baseRadius,y0=Math.cos(rad(i))*cfg.baseRadius;for(let q=0;q<cfg.tentacleLength;q+=cfg.segmentStep){const a=Math.cos(rad(cfg.tentacleLength-q+frame*cfg.movementSpeed))*q,x=Math.sin(rad(i-a))*q*3,y=Math.cos(rad(i-a))*q*3,d=(cfg.tentacleLength-q)*cfg.circleSize/10;ctx.strokeStyle=color(cfg.colorModeIndex,i,q,x,y,shift,frame);ctx.lineWidth=cfg.lineWeight;ctx.beginPath();ctx.arc(x0+x,y0+y,Math.max(.075,d/2),0,Math.PI*2);ctx.stroke()}}ctx.restore()}
function rad(d){return d*Math.PI/180}function mod(n,m){return((n%m)+m)%m}function color(mode,i,q,x,y,shift,frame){switch(mode){case 0:return"#fff";case 1:return`hsl(${mod(i+q*2+shift,360)} 100% 50%)`;case 2:return`hsl(${mod(frame+q*2,360)} 100% 50%)`;case 3:return"hsl(200 100% 50%)";case 4:return"hsl(330 100% 50%)";case 5:return`hsl(${mod(Math.atan2(y,x)*180/Math.PI+180+shift,360)} 100% 50%)`;case 6:return`hsl(${mod(i+shift,360)} 100% 50%)`;case 7:return`hsl(${mod(q*5+shift,360)} 100% 50%)`;case 8:return`hsl(${mod(x+y+shift,360)} 100% 50%)`;default:return"#fff"}}

function renderInsights(){const el=$("tab-insights");const byIntent={};for(const r of insights){(byIntent[r.requestKey]||(byIntent[r.requestKey]=[])).push(r)}el.innerHTML=`<div class="card"><div class="section-title">Как читать этот экран</div><div class="small muted">Здесь связь, а не доказанная причинность: какие паттерны и пользовательские конфигурации чаще присутствуют в сессиях, после которых состояние улучшилось. Чем больше сессий, тем надёжнее сигнал.</div></div><div id="insightBlocks" style="margin-top:12px"></div>`;const wrap=$("insightBlocks");const keys=Object.keys(byIntent);if(!keys.length){wrap.innerHTML='<div class="card empty">Пока мало завершённых сессий для закономерностей.</div>';return}keys.forEach(k=>{const rows=byIntent[k].slice().sort((a,b)=>b.avgDelta-a.avgDelta||b.sessions-a.sessions).slice(0,12);wrap.insertAdjacentHTML("beforeend",`<div class="card" style="margin-bottom:12px"><div class="section-title">${esc(INTENT[k]||k)}</div><table class="table"><thead><tr><th>Паттерн / конфигурация</th><th>Сессии</th><th>Время</th><th>Среднее Δ</th><th>Сохранения</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.communityConfigId?`Community ${esc(String(r.communityConfigId).slice(0,8))}`:esc(r.patternId)}</td><td>${r.sessions}</td><td>${fmtMs(r.durationMs)}</td><td>${r.avgDelta>=0?"+":""}${Number(r.avgDelta).toFixed(2)}</td><td>${r.saves}</td></tr>`).join("")}</tbody></table></div>`)})}

function renderCommunity(){const el=$("tab-community");el.innerHTML=`<div class="card"><div class="section-title">Коллективная библиотека</div><div class="small muted">Одна карточка = уникальная конфигурация. ♥ — число уникальных участников, которые сохранили её себе. Одинаковые состояния объединяются, поэтому счётчик не раздувается дублями.</div></div><div id="communityGrid" class="grid community-grid" style="margin-top:12px"></div>`;const grid=$("communityGrid");if(!community.length){grid.innerHTML='<div class="card empty" style="grid-column:1/-1">Пока никто не сохранил конфигурации в новой версии.</div>';return}const insightMap=new Map();for(const r of insights){if(!r.communityConfigId)continue;const prev=insightMap.get(r.communityConfigId);if(!prev||r.avgDelta>prev.avgDelta)insightMap.set(r.communityConfigId,r)}community.forEach(c=>{const wrap=document.createElement("div");wrap.className="community-item";const cv=document.createElement("canvas");cv.width=220;cv.height=220;wrap.appendChild(cv);const badge=document.createElement("span");badge.className="community-badge";badge.textContent=`♥ ${c.saveCount||0}`;wrap.appendChild(badge);const best=insightMap.get(c.id);if(best){const note=document.createElement("span");note.className="community-note";note.textContent=`${INTENT[best.requestKey]||best.requestKey}: Δ ${best.avgDelta>=0?"+":""}${Number(best.avgDelta).toFixed(1)} · ${best.sessions} сесс.`;wrap.appendChild(note)}grid.appendChild(wrap);drawCommunityThumb(cv,c.config,c.preview_frame)})}
function drawCommunityThumb(canvas,c,frame){const ctx=canvas.getContext("2d");ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);const cfg={...c};ctx.save();ctx.translate(canvas.width/2,canvas.height/2);const extent=Math.max(40,(Number(cfg.tentacleLength)||100)*3+(Number(cfg.baseRadius)||10));const sc=(canvas.width/2-6)/extent;ctx.scale(sc,sc);renderPatternAtOrigin(ctx,cfg,Number(frame)||44);ctx.restore()}
function renderPatternAtOrigin(ctx,c,frame){const n=Number(c.numTentacles)||24,len=Number(c.tentacleLength)||100,base=Number(c.baseRadius)||10,mov=Number(c.movementSpeed)||1,cs=Number(c.colorSpeed)||1,size=Number(c.circleSize)||1,lw=Number(c.lineWeight)||1,step=Number(c.segmentStep)||2,mode=Number(c.colorModeIndex)||0,shift=frame*cs*.5;for(let i=0;i<360;i+=360/n){const x0=Math.sin(rad(i))*base,y0=Math.cos(rad(i))*base;for(let q=0;q<len;q+=step){const a=Math.cos(rad(len-q+frame*mov))*q,x=Math.sin(rad(i-a))*q*3,y=Math.cos(rad(i-a))*q*3,d=(len-q)*size/10;ctx.strokeStyle=color(mode,i,q,x,y,shift,frame);ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x0+x,y0+y,Math.max(.075,d/2),0,Math.PI*2);ctx.stroke()}}}

if(adminKey){keyInput.value=adminKey;loginNow()}
})();
