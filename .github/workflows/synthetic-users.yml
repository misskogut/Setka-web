name: SETKA Synthetic User Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'synthetic-browser-runner.mjs'
      - '.github/workflows/synthetic-users.yml'
      - 'ops/SETKA_CRYOSLEEP.yml'

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: External cryosleep gate
        run: |
          if grep -Eq '^state:[[:space:]]*ON[[:space:]]*$' ops/SETKA_CRYOSLEEP.yml; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'SETKA EMERGENCY CRYOSLEEP: simulation blocked before any Supabase call.'
          else
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
  run-synthetic-users:
    needs: safety-gate
    if: needs.safety-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Run synthetic users against current front
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node synthetic-browser-runner.mjs
