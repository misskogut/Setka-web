name: TMP Trace Admission Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch exact admitted SHA and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('foundation-architecture-gate-v018.json')
          s=p.read_text()
          old='302fe4cc0998ecdf3a5d9a0283bc05ae9340df53fb33b486a90e7e484ea22bad'
          new='03989b28803c95e2bbcacbc163957349d1ba4c5d36accb3eda40bac1301555a1'
          if old not in s:
              raise SystemExit('old admitted SHA not found exactly')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/tmp-trace-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation-architecture-gate-v018.json .github/workflows/tmp-trace-hash.yml
          git commit -m "test(foundation): admit current trace browser smoke"
          git push
