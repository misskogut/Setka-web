name: SETKA Foundation 0.2.0 Pair Smoke
on:
  push:
    branches: [main]
    paths:
      - 'foundation-user-v020.html'
      - 'foundation-user-v020.css'
      - 'foundation-user-v020.js'
      - 'foundation-admin-v020.html'
      - 'foundation-admin-v020.css'
      - 'foundation-admin-v020.js'
      - 'foundation-v020-smoke.mjs'
      - '.github/workflows/foundation-v020-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check user runtime syntax
        run: node --check foundation-user-v020.js
      - name: Check admin runtime syntax
        run: node --check foundation-admin-v020.js
      - name: Check smoke syntax
        run: node --check foundation-v020-smoke.mjs
      - run: npm install --no-save playwright-core@1.55.0
      - name: Wait for Pages
        run: sleep 40
      - name: Pattern library pair E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node foundation-v020-smoke.mjs