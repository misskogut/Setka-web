name: Temporary Freeze Hash Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SHA256
        run: |
          sha256sum \
            foundation-admin-transcript-v018.js \
            foundation-control-zoom-v018.js \
            foundation-control-build-v018.js \
            foundation-admin-v018.html \
            foundation-president.html
