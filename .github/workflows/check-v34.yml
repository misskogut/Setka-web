      - run: node --check standalone-analysis-v34.js
      - run: node --check standalone-user-ui-v34.js
      - run: node --check standalone-session-patterns-v34.js
      - run: node --check standalone-states-v34.js
      - run: node --check standalone-state-timeline-v34.js
      - run: node --check standalone-session-states-v34.js
      - run: node --check standalone-explore-v34.js
      - run: node --check standalone-bootstrap-v34.js
      - run: node --check standalone-config-links-v34.js
      - run: node --check standalone-controls-v34.js
      - run: node --check standalone-visual-cache-v40.js
      - run: node --check standalone-privacy-egress-v40.js
      - run: node --check standalone-privacy-contract-v40.js
      - run: node --check standalone-public-visual-capsules-v40.js
      - run: node --check standalone-sync-v34.js
      - run: node --check standalone-navigation-v34.js
      - run: node --check standalone-note-snapshot-fix-v34.js
      - run: node --check standalone-tester-community-v34.js
      - run: node --check standalone-tester-cabinet-v40.js
      - run: node --check standalone-private-corpus-v40.js
      - run: node --check standalone-research-bridge-v40.js
      - run: node --check standalone-community-cloud-v38.js
      - run: node --check standalone-admin-bridge-v34b.js
      - run: node --check standalone-admin-public-v34.js
      - run: node --check standalone-admin-private-corpus-v40.js
      - run: node --check standalone-admin-participants-v34.js
      - run: node --check standalone-admin-activity-v34.js
      - run: node --check standalone-admin-retention-v34.js
      - run: node --check standalone-admin-participant-modal-v34.js
      - run: node --check standalone-admin-note-snapshot-fix-v34.js
      - run: node --check standalone-admin-tester-ids-v37.js
      - run: node --check standalone-admin-community-v38.js
      - run: node --check standalone-admin-pattern-knowledge-v40.js
      - run: node --check standalone-admin-visual-assets-v40.js
      - run: node --check standalone-admin-mother-snapshots-v40.js
      - run: node --check standalone-admin-privacy-v40.js
      - run: node --check standalone-admin-evolution-login-v35.js
      - run: node --check standalone-admin-evolution-v35.js
      - run: node --check standalone-admin-evolution-pattern-lab-v35.js
      - run: node --check admin-replay-first-v34.js
      - run: node --test tests/standalone-v34-integrity.test.mjs
      - run: node --test tests/standalone-v34-note-merge-integrity.test.mjs
      - run: node --test tests/setka-tester-account-ownership.test.mjs
      - run: node --test tests/standalone-v34-admin-integrity.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright esbuild
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/standalone-v34-browser-smoke.mjs
      - run: node tests/standalone-v34-admin-browser-smoke.mjs
      - run: node tests/standalone-v34-open-admin-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-admin-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-open-admin-browser-smoke.mjs
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-pattern-knowledge-v40/index.ts --outfile=/tmp/setka-admin-backend-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-tester-archive-v37/index.ts --outfile=/tmp/setka-tester-archive-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-tester-account-v40/index.ts --outfile=/tmp/setka-tester-account-check.js --format=esm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-browser-smoke
          path: tests/visual-smoke/
          if-no-files-found: ignore
