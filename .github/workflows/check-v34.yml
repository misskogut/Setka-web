jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app-v3-multipattern.js
      - run: node --check app-v7-multipattern.js
      - run: node --check standalone-multipattern-bridge-v34.js
      - run: node --check standalone-core-v34.js
      - run: node --check standalone-runtime-v34.js
      - run: node --check standalone-favorites-repair-v34.js
      - run: node --check standalone-favorite-native-guard-v34.js
      - run: node --check standalone-methodology-v34.js
