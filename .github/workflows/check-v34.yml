name: Check SETKA Standalone v34
# Manual diagnostic only during Supabase HTTP 402 / read-only demo mode.
# Prevent redundant push / PR failures and notification spam.
# GitHub Pages publishing and its independent release gates stay automatic.
on:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app-v3-multipattern.js
      - run: node --check app-v7-multipattern.js
      - run: node --check standalone-audio-reactive-v1.js
      - run: node --check standalone-audio-reactive-v2.js
      - run: node --check standalone-audio-reactive-v3.js
      - run: node --check standalone-audio-reactive-v4.js
      - run: node --check standalone-pattern-key-v1.js
      - run: node --check standalone-pattern-registry-v1.js
      - run: node --check standalone-pattern-plugins-v1.js
      - run: node scripts/build-pattern-manifest.mjs
      - run: node --check standalone-live-previews-v1.js
      - run: node --check standalone-auto-optimizer-v1.js
      - run: node --test tests/autonomous-render-optimizer-v1.test.mjs
      - run: node --check scripts/build-standalone-release.mjs
      - run: node --test tests/standalone-one-link-release.test.mjs
      - run: node --check standalone-multipattern-bridge-v34.js
      - run: node --check standalone-pulse-v1.mjs
      - run: node --check standalone-catalog-v1.js
      - run: node --check standalone-activity-v1.js
      - run: node --test tests/research-management-v1.test.mjs tests/state-persistence-v1.test.mjs
      - run: node --test tests/standalone-pulse-v1.test.mjs
      - run: node --check standalone-sheets-v1.js
      - run: node --check standalone-core-v34.js
      - run: node --check standalone-storage-v1.js
      - run: node --check standalone-inline-actions-v1.js
      - run: node --check standalone-runtime-v34.js
      - run: node --check standalone-replay-capture-v1.js
      - run: node --check standalone-favorites-repair-v34.js
      - run: node --check standalone-favorite-native-guard-v34.js
      - run: node --check standalone-methodology-v34.js
      - run: node --check standalone-advanced-v34.js
      - run: node --check standalone-analysis-v34.js
      - run: node --check standalone-user-ui-v34.js
      - run: node --check standalone-session-patterns-v34.js
      - run: node --check standalone-states-v34.js
      - run: node --check standalone-state-timeline-v34.js
      - run: node --check standalone-session-states-v34.js
      - run: node --check standalone-explore-v34.js
      - run: node --check standalone-bootstrap-v34.js
      - run: node --check standalone-config-links-v34.js
      - run: node --check standalone-controls-v34.js
      - run: node --check standalone-visual-cache-v40.js
      - run: node --check standalone-privacy-egress-v40.js
      - run: node --check standalone-privacy-contract-v40.js
      - run: node --check standalone-public-visual-capsules-v40.js
      - run: node --check standalone-sync-v34.js
      - run: node --check standalone-navigation-v34.js
      - run: node --check standalone-note-snapshot-fix-v34.js
      - run: node --check standalone-tester-community-v34.js
      - run: node --check standalone-tester-cabinet-v40.js
      - run: node --check standalone-private-corpus-v40.js
      - run: node --check standalone-research-bridge-v40.js
      - run: node --check standalone-community-cloud-v38.js
      - run: node --check standalone-admin-bridge-v34b.js
      - run: node --check standalone-admin-public-v34.js
      - run: node --check standalone-admin-private-corpus-v40.js
      - run: node --check standalone-admin-participants-v34.js
      - run: node --check standalone-admin-activity-v34.js
      - run: node --check standalone-admin-retention-v34.js
      - run: node --check standalone-admin-participant-modal-v34.js
      - run: node --check standalone-admin-note-snapshot-fix-v34.js
      - run: node --check standalone-admin-tester-ids-v37.js
      - run: node --check standalone-admin-community-v38.js
      - run: node --check standalone-admin-pattern-knowledge-v40.js
      - run: node --check standalone-admin-visual-assets-v40.js
      - run: node --check standalone-admin-mother-snapshots-v40.js
      - run: node --check standalone-admin-privacy-v40.js
      - run: node --check standalone-admin-evolution-login-v35.js
      - run: node --check standalone-admin-evolution-v35.js
      - run: node --check standalone-admin-evolution-pattern-lab-v35.js
      - run: node --check admin-replay-first-v34.js
      - run: node --test tests/front-cloud-integrity-v1.test.mjs tests/standalone-v34-integrity.test.mjs
      - run: node --test tests/setka-gameplay-touch-write-gate.test.mjs
      - run: node --test tests/standalone-v34-community-aggregate.test.mjs
      - run: node --test tests/standalone-v34-note-merge-integrity.test.mjs
      - run: node --test tests/setka-tester-account-ownership.test.mjs
      # Required metadata-only account ingestion, verified linking, dashboard and
      # coordinate/HRTF math checks. Real authenticated traffic and headphones
      # remain separate acceptance gates; no synthetic production events.
      - run: node --test tests/setka-account-journey-v1.test.mjs tests/setka-account-exposure-v2.test.mjs tests/setka-identity-link-v1.test.mjs tests/setka-v6-journey-summary.test.mjs tests/setka-v6-copy-integration.test.mjs tests/setka-orbit-acoustics-gate.test.mjs tests/setka-wav-stream-v1.test.mjs
      - run: node --test tests/setka-telemetry-automated-production.test.mjs
      - run: node --test tests/standalone-v34-admin-integrity.test.mjs
      - run: node --test tests/standalone-v34-admin-restoration.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.64.1 esbuild
      # Verify real Playwright WebKit/Chromium do not count as people on the public hostname.
      # All requests are intercepted and cannot hit production APIs.
      - run: node tests/setka-webdriver-production-telemetry-browser.mjs
      - run: SETKA_BROWSER=webkit node tests/setka-webdriver-production-telemetry-browser.mjs
      - run: node scripts/build-pattern-manifest.mjs
      # A gameplay WebContent crash must fail fast before expensive analytics/UI suites.
      - run: node tests/setka-ios-rapid-gesture-smoke.mjs
      - run: node tests/setka-safari-lossless-wav-browser.mjs
      - run: SETKA_BROWSER=webkit node tests/setka-ios-rapid-gesture-smoke.mjs
      - run: node tests/setka-v6-lab-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/setka-v6-lab-browser-smoke.mjs
      - run: node tests/research-management-v1-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/research-management-v1-browser-smoke.mjs
      # Fail fast on cross-surface contract issues before slower visual suites.
      - run: node tests/setka-front-research-audit-browser.mjs
      - run: SETKA_BROWSER=webkit node tests/setka-front-research-audit-browser.mjs
      # Audio has an independent safety regression; run it before the full UI
      # suite so a flaky unrelated preview does not obscure mic test results.
      - run: node tests/standalone-breathing-grid-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-breathing-grid-browser-smoke.mjs
      - run: node tests/standalone-audio-reactive-v1-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-audio-reactive-v1-browser-smoke.mjs
      - run: node tests/standalone-v34-browser-smoke.mjs
      - run: node tests/standalone-sheets-v1-browser-smoke.mjs
      - run: node tests/standalone-live-previews-v1-browser-smoke.mjs
      - run: node tests/standalone-invites-autosync-browser-smoke.mjs
      - run: node tests/standalone-pulse-v1-browser-smoke.mjs
      - run: node tests/research-admin-v1-access-browser-smoke.mjs
      - run: node tests/standalone-v34-admin-browser-smoke.mjs
      - run: node tests/standalone-v34-open-admin-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-sheets-v1-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-live-previews-v1-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-invites-autosync-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-pulse-v1-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/research-admin-v1-access-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-admin-browser-smoke.mjs
      - run: SETKA_BROWSER=webkit node tests/standalone-v34-open-admin-browser-smoke.mjs
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-pattern-knowledge-v40/index.ts --outfile=/tmp/setka-admin-backend-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-community-patterns-v38/index.ts --outfile=/tmp/setka-community-feed-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-tester-archive-v37/index.ts --outfile=/tmp/setka-tester-archive-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-tester-account-v40/index.ts --outfile=/tmp/setka-tester-account-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-public-notes-v37/index.ts --outfile=/tmp/setka-public-note-check.js --format=esm
      - run: ./node_modules/.bin/esbuild supabase/functions/setka-standalone-v34/index.ts --outfile=/tmp/setka-standalone-runtime-check.js --format=esm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-browser-smoke
          path: tests/visual-smoke/
          if-no-files-found: ignore
