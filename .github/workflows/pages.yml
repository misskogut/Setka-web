name: Deploy SETKA Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The stable per-file content digests are computed from the FINAL
      # generated registry, not its unbuilt source.
      - name: Generate canonical SETKA pattern catalog
        run: node scripts/build-pattern-manifest.mjs
      - name: Audit pattern integration and explain missing requirements
        run: node scripts/audit-pattern-integration.mjs
      - name: Upload pattern integration diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setka-pattern-integration-report
          path: artifacts/pattern-integration-report.*
          if-no-files-found: ignore
      - name: Audit front-admin architecture and suspicious placeholders
        run: node scripts/audit-setka-architecture.mjs
      - name: Upload architecture audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setka-architecture-audit
          path: artifacts/setka-architecture-audit.*
          if-no-files-found: ignore
      - name: Stamp one stable SETKA URL with deployment revision
        run: node scripts/build-standalone-release.mjs
      - name: Verify anonymous device presence and private unpublished note backups
        run: node --test tests/setka-anonymous-presence-private-notes.test.mjs
      - name: Verify stamped frontend and admin release assets
        run: node --test tests/setka-release-assets.test.mjs
      - name: Reject manual SETKA App pattern wiring before publishing
        run: node --test tests/setka-app-platform-guard.test.mjs tests/account-cohorts.test.mjs tests/setka-tester-account-ownership.test.mjs
      - name: Verify automatic SETKA pattern registration before publishing
        run: node --test tests/pattern-autodiscovery.test.mjs tests/pattern-platform-v2.test.mjs tests/pattern-settings-compact.test.mjs tests/pattern-publication.test.mjs tests/pattern-medusa.test.mjs tests/standalone-star-flight.test.mjs tests/standalone-radial-wave.test.mjs tests/standalone-hemispheric-spirals.test.mjs tests/standalone-interlaced-spirals.test.mjs tests/pattern-camera-proximity.test.mjs tests/standalone-matrix-trampoline.test.mjs tests/standalone-branching-impulse.test.mjs tests/standalone-genuary-16x16.test.mjs tests/standalone-hexwave.test.mjs
      - name: Verify all pattern sliders, start-view patches and pointer lifecycle
        run: node --test tests/pattern-integration-gate.test.mjs
      - name: Verify frontend, admin and server catalog parity
        run: node --test tests/setka-front-admin-parity.test.mjs
      - name: Verify warm-start caching and per-renderer asset invalidation
        run: node --test tests/setka-startup-cache-v1.test.mjs
      - name: Reject Safari gesture crashes and synchronous archive rewrite storms
        run: node --test tests/setka-gameplay-touch-write-gate.test.mjs
      - name: Verify music icon vector geometry before publishing
        run: node --test tests/setka-music-icons-v2.test.mjs tests/setka-music-trace-smoothing-v1.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm deployed frontend, admin and pattern manifest
        run: node scripts/verify-live-release.mjs
      - name: Upload live-release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setka-live-release-report
          path: artifacts/setka-live-smoke.*
          if-no-files-found: ignore
