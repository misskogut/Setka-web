name: Deploy SETKA Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp one stable SETKA URL with deployment revision
        run: node scripts/build-standalone-release.mjs
      - name: Generate canonical SETKA pattern catalog
        run: node scripts/build-pattern-manifest.mjs
      - name: Verify automatic SETKA pattern registration before publishing
        run: node --test tests/pattern-autodiscovery.test.mjs tests/pattern-platform-v2.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
