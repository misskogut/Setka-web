name: Deploy SETKA Private Lockdown to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'private-lockdown/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-lockdown:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload lockdown artifact only
        uses: actions/upload-pages-artifact@v4
        with:
          path: "private-lockdown"
      - name: Deploy lockdown
        id: deployment
        uses: actions/deploy-pages@v4
