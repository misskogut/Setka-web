name: TMP Trace Open Verify
on:
  push:
    branches: [main]
    paths:
      - 'trace-open-verify-trigger.txt'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - name: Trace card open browser smoke
        env:
          CHROME_PATH: /usr/bin/chromium
        run: node foundation-trace-open-smoke-v018.mjs
