name: TMP v018 Admission Refresh 2
on:
  push:
    branches: [main]
    paths:
      - 'tmp-v018-admission-refresh2-trigger.txt'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh exact SHA256
        run: |
          python - <<'PY'
          import hashlib,json
          gate='foundation-architecture-gate-v018.json'; target='foundation-v018-smoke.mjs'
          sha=hashlib.sha256(open(target,'rb').read()).hexdigest()
          d=json.load(open(gate,encoding='utf-8'))
          found=False
          for a in d.get('admissions',[]):
            if a.get('key')=='version-smoke-pointer-separation-v018':
              for item in a.get('files',[]):
                if item.get('path')==target: item['sha256']=sha; found=True
          if not found: raise SystemExit('admission target not found')
          with open(gate,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          print('SHA256='+sha)
          PY
      - name: Remove helper and commit
        run: |
          git config user.name misskogut
          git config user.email misskogutwork@gmail.com
          git rm .github/workflows/tmp-v018-admission-refresh2.yml tmp-v018-admission-refresh2-trigger.txt
          git add foundation-architecture-gate-v018.json
          git commit -m "test(foundation): admit deterministic v018 readiness"
          git push
