name: SETKA Workflow Safety Self-Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*synthetic*.yml'
      - '.github/workflows/*simulation*.yml'
      - '.github/actions/setka-cryo-gate/**'
      - 'ops/setka-workflow-safety-audit.mjs'
      - '.github/workflows/setka-workflow-safety-selftest.yml'

permissions:
  contents: read

jobs:
  offline-safety-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit external synthetic workflow gates
        run: node ops/setka-workflow-safety-audit.mjs

      # Offline only: this audit must not contact Supabase.
