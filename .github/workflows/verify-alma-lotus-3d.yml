name: Verify ALMA native lotus on mobile
# Temporary targeted mobile Chromium/WebKit real DOM identity check. Restore
# dispatch-only after diagnosis so regular pushes don't produce extra alerts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/standalone-cycle-lotus-direct-v1.js"
      - "tests/setka-cycle-lotus-browser-smoke.mjs"

permissions:
  contents: read

jobs:
  mobile-render:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright diagnostic tools
        run: npm install --no-save --ignore-scripts playwright@1.64.1 pngjs
      - name: Verify original SVG moved into CSS 3D under mobile Chromium
        run: node tests/setka-cycle-lotus-browser-smoke.mjs
      - name: Verify original SVG and original interaction under mobile WebKit (iPhone engine)
        run: SETKA_BROWSER=webkit node tests/setka-cycle-lotus-browser-smoke.mjs
      - name: Save rendered lotus frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alma-lotus-3d-mobile-frame
          path: tests/visual-smoke/lotus-native-3d-*.png
          if-no-files-found: ignore
