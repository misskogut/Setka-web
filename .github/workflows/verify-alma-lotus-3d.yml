name: Verify original ALMA lotus on card flips
# Heavy real-browser visual diagnostics remain manual-only after the
# Chromium + iPhone WebKit original-SVG and click checks passed.
# Ordinary source pushes do not trigger extra test emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-render:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright diagnostic tools
        run: npm install --no-save --ignore-scripts playwright@1.64.1 pngjs
      - name: Verify original lotus remains in ALMA calendar on mobile Chromium
        run: node tests/setka-cycle-lotus-browser-smoke.mjs
      - name: Verify original lotus stays in ALMA on mobile WebKit (iPhone engine)
        run: SETKA_BROWSER=webkit node tests/setka-cycle-lotus-browser-smoke.mjs
      - name: Save rendered lotus frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alma-lotus-3d-mobile-frame
          path: tests/visual-smoke/lotus-native-3d-*.png
          if-no-files-found: ignore
