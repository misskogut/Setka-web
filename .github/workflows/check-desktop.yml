name: Check SETKA desktop layout
on:
  push:
    paths: ['standalone-desktop-v1.css', 'standalone-panel-resize-v1.js', 'tests/standalone-panel-resize-v1-browser-smoke.mjs', 'standalone-v34.html', 'styles.css', 'experience-v2.css', 'standalone-sheets-v1.css', 'tests/standalone-desktop-v1-browser-smoke.mjs', '.github/workflows/check-desktop.yml']
  pull_request:
    paths: ['standalone-desktop-v1.css', 'standalone-panel-resize-v1.js', 'tests/standalone-panel-resize-v1-browser-smoke.mjs', 'standalone-v34.html', 'styles.css', 'experience-v2.css', 'standalone-sheets-v1.css', 'tests/standalone-desktop-v1-browser-smoke.mjs', '.github/workflows/check-desktop.yml']
jobs:
  responsive:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: node scripts/build-pattern-manifest.mjs
      - run: node tests/standalone-panel-resize-v1-browser-smoke.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      - run: node tests/standalone-desktop-v1-browser-smoke.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      - run: node tests/standalone-v34-browser-smoke.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
