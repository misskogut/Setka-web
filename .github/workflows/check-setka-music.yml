name: Check SETKA Music and Spatial Orbits
# Run on music-engine releases only, not on a timer or a background computer.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'standalone-music-audio-v1.mjs'
      - 'supabase/functions/setka-music-v1/index.ts'
      - 'tests/setka-music-origin-retries.test.mjs'
      - 'standalone-music-wav-stream-v1.mjs'
      - 'standalone-music-v1.mjs'
      - 'tests/setka-music-v1.test.mjs'
      - 'tests/setka-music-big-webkit-probe.mjs'
      - 'tests/setka-music-live-playback-probe.mjs'
      - '.github/workflows/check-setka-music.yml'
  push:
    branches: [main]
    paths:
      - 'standalone-music-audio-v1.mjs'
      - 'supabase/functions/setka-music-v1/index.ts'
      - 'tests/setka-music-origin-retries.test.mjs'
      - 'standalone-music-wav-stream-v1.mjs'
      - 'standalone-music-v1.mjs'
      - 'tests/setka-music-big-webkit-probe.mjs'
      - 'tests/setka-music-live-playback-probe.mjs'
      - '.github/workflows/check-setka-music.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check standalone-music-icons-v1.mjs
          node --check standalone-music-trace-smoothing-v1.mjs
          node --check standalone-music-legacy-icons-v1.mjs
          node --check standalone-music-vintage-icons-v2.mjs
          node --check standalone-music-audio-v1.mjs
          node --check standalone-music-orbits-v1.mjs
          node --check standalone-music-v1.mjs
          node --check research-v1/music-admin.mjs
          node --check research-v1/app.mjs
      - name: Audio and admin contracts
        run: node --test tests/setka-music-v1.test.mjs tests/setka-music-icons-v2.test.mjs tests/setka-music-trace-smoothing-v1.test.mjs tests/setka-music-yandex-stream-v1.test.mjs tests/setka-music-origin-retries.test.mjs
      - name: Verify public catalog API without credentials
        run: |
          curl --fail --silent --show-error --max-time 15 https://gfchgaphzhxufwdhrcis.supabase.co/functions/v1/setka-music-v1 -o /tmp/setka-music-catalog.json
          node -e "const d=require('/tmp/setka-music-catalog.json'); if (!d.ok || !Array.isArray(d.categories) || !Array.isArray(d.tracks)) process.exit(1)"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/build-pattern-manifest.mjs
      - run: node scripts/build-pattern-manifest.mjs
      - run: node tests/setka-music-restored-sheet-browser.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      # Exercise the deterministic orbit DOM/touch geometry before opening
      # enormous real WAV files: WebKit's native 500 MB decoder can crash the
      # browser independently of orbit positioning, hiding geometry regressions.
      - run: node tests/setka-music-browser-smoke.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      - name: Require original full-length 8D WAV playback (lossless Safari HRTF or explicit fallback)
        run: node tests/setka-music-big-webkit-probe.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      - name: Require real Yandex WAV, MP3 and Storage playback (no fake media events)
        run: node tests/setka-music-live-playback-probe.mjs
        env:
          SETKA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setka-music-${{ matrix.browser }}
          path: tests/visual-smoke/music-*.png
          if-no-files-found: ignore
