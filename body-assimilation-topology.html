<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SETKA · TEMPORAL × TOPOLOGY</title><style>:root{color-scheme:dark;--bg:#030814;--panel:rgba(4,12,24,.90);--line:#304965;--text:#eef6ff;--muted:#9bb0c8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px;align-items:center}.pill,.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);backdrop-filter:blur(9px)}.pill{padding:8px 10px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:12px}.pill small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.btn{padding:9px;font:10px inherit}.btn.active{border-color:#91c4ff;background:rgba(24,48,75,.95)}#hud{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:35;background:rgba(4,12,24,.93);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}#row{display:flex;justify-content:space-between;gap:8px;font-size:10px}#name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}#time{color:#bfe5ff}.meta{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.35}.track{height:5px;background:#0c1a2a;border-radius:99px;margin-top:9px;position:relative;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#fff2a8)}input[type=range]{width:100%;margin:8px 0 0;accent-color:#ffd36b}.legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:7px;font-size:8px;color:#b8c9dd}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.gold{background:#ffd36b}.cyan{background:#62e8ff}.violet{background:#9b79bd}.loader{position:fixed;inset:0;z-index:100;background:#030814;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#cfe0f5;font-size:11px}.spin{width:26px;height:26px;border-radius:50%;border:2px solid #263d58;border-top-color:#a6c8ee;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.pill small{display:none}.btn{padding:8px;font-size:9px}}</style></head><body><div id="app"></div><div class="bar"><div class="pill"><b>SETKA · TEMPORAL × TOPOLOGY</b><small>тот же frozen body · временной луч vs реальные кратчайшие пути</small></div><button class="btn active" id="play">PAUSE</button><button class="btn active" id="traceBtn">TRACE</button><button class="btn active" id="routeBtn">ROUTE</button><button class="btn" id="graphBtn">GRAPH</button></div><div id="hud"><div id="row"><div id="name">загрузка…</div><div id="time">0.000 ms</div></div><div class="meta" id="meta">ожидание данных</div><div class="track"><div class="fill" id="fill"></div></div><input id="scrub" type="range" min="0" max="1000" value="0"><div class="legend"><span><i class="dot gold"></i>временной луч: следующий event</span><span><i class="dot cyan"></i>реальный shortest path по графу</span><span><i class="dot violet"></i>frozen body / graph</span></div></div><div class="loader" id="loader"><div class="spin"></div><div>SETKA сопоставляет временной импульс с реальной топологией тела…</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S='https://gfchgaphzhxufwdhrcis.supabase.co',K='sb_publishable_1jL-x9_kp6rpfGghpSp_OA_OiXDnvsv',SN='BODY-GROWN-SNAPSHOT-927501A0353C4CE6',TR='ASSIM-TRACE-B814F1FB94A45622',AN='TOPO-PATH-2F89BAC84B1A4DC9';const app=document.getElementById('app'),loader=document.getElementById('loader'),nameEl=document.getElementById('name'),timeEl=document.getElementById('time'),metaEl=document.getElementById('meta'),fill=document.getElementById('fill'),scrub=document.getElementById('scrub');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030814,1);app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030814,.015);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.03,300),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.autoRotate=true;controls.autoRotateSpeed=.16;controls.minDistance=.6;controls.maxDistance=140;scene.add(new THREE.AmbientLight(0xffffff,1.1));let nodes=new Map(),points,graphEdges,traceLine,routeLines=[],routeCurrent,head,traceData,pathData,duration=807.85,current=0,playing=true,last=performance.now(),visualDuration=18000,showTrace=true,showRoute=true;async function rpc(fn,arg){const r=await fetch(`${S}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify(arg)});if(!r.ok)throw Error(`${fn} ${r.status}`);return r.json()}function addLine(pos,color,opacity,width=1){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));const m=new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending,linewidth:width});const l=new THREE.Line(g,m);scene.add(l);return l}async function load(){const [d,t,p]=await Promise.all([rpc('setka_body_as_grown_frozen_snapshot_v1',{p_snapshot_ref:SN}),rpc('setka_body_update_assimilation_trace_v1',{p_trace_ref:TR}),rpc('setka_body_update_topology_paths_v1',{p_analysis_ref:AN})]);traceData=t;pathData=p;duration=+t.durationMs||807.85;const a=d.nodes||d.payload?.nodes||[],e=d.edges||d.payload?.edges||[];const pos=new Float32Array(a.length*3),col=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){const v=a[i],o={id:v[0],type:v[2],gen:+v[3],deg:+v[5],name:v[6],x:+v[9],y:+v[10],z:+v[11]};nodes.set(o.id,o);pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;const c=new THREE.Color();c.setHSL((.76+o.gen*.035)%1,.42,.39);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(pg,new THREE.PointsMaterial({size:.043,vertexColors:true,transparent:true,opacity:.46,depthWrite:false}));scene.add(points);const ep=[];for(const z of e){const A=nodes.get(z[0]),B=nodes.get(z[1]);if(A&&B)ep.push(A.x,A.y,A.z,B.x,B.y,B.z)}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));graphEdges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x8e6bb4,transparent:true,opacity:.025,depthWrite:false}));graphEdges.visible=false;scene.add(graphEdges);traceLine=addLine([],0xffd36b,.92);const hg=new THREE.SphereGeometry(.16,16,10);head=new THREE.Mesh(hg,new THREE.MeshBasicMaterial({color:0xfff0a2,transparent:true,opacity:.98,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(head);for(const pr of p.pairs){const path=pr[9]||[],rp=[];for(const id of path){const o=nodes.get(id);if(o)rp.push(o.x,o.y,o.z)}const l=addLine(rp,0x62e8ff,.11);routeLines.push({line:l,toMs:+pr[4],hops:+pr[7],fromEvent:+pr[1],toEvent:+pr[2],path});}fit();loader.style.display='none';update(0)}function fit(){const b=new THREE.Box3().setFromObject(points),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*1.12;controls.target.copy(c);camera.position.set(c.x+d*.55,c.y+d*.32,c.z+d);controls.update()}function update(ms){current=Math.max(0,Math.min(duration,ms));scrub.value=Math.round(current/duration*1000);fill.style.width=`${current/duration*100}%`;const tr=traceData.trace||[];const tp=[];let latest=0;for(let i=0;i<tr.length;i++){if(+tr[i][1]<=current)latest=i;else break}for(let i=0;i<=latest;i++){const o=nodes.get(tr[i][2]);if(o)tp.push(o.x,o.y,o.z)}traceLine.geometry.dispose();traceLine.geometry=new THREE.BufferGeometry();traceLine.geometry.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));traceLine.visible=showTrace;if(tp.length>=3)head.position.set(tp[tp.length-3],tp[tp.length-2],tp[tp.length-1]);head.visible=showTrace;let activePair=null;for(const r of routeLines){const reached=current>=r.toMs;r.line.visible=showRoute&&reached;r.line.material.opacity=reached?.13:0;if(reached)activePair=r}if(activePair&&showRoute){activePair.line.material.opacity=.95;const pr=pathData.pairs.find(x=>+x[2]===activePair.toEvent);if(pr){nameEl.textContent=`#${pr[1]} → #${pr[2]} · ${pr[7]} graph hops`;metaEl.textContent=`временной jump: ${(pr[4]-pr[3]).toFixed(3)} ms · direct edge: ${pr[8]?'YES':'NO'} · shortest real path: ${pr[7]} hops · TEMPORAL LINE ≠ GRAPH EDGE`;}}else{nameEl.textContent='ожидание первого топологического перехода';metaEl.textContent=`114 temporal pairs · 1 direct · avg 4.0789 hops · max 8 hops`;}timeEl.textContent=`${current.toFixed(3)} ms`;}function animate(t){requestAnimationFrame(animate);const dt=t-last;last=t;if(playing){current+=dt*(duration/visualDuration);if(current>duration)current=0;update(current)}controls.update();renderer.render(scene,camera)}document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'PAUSE':'PLAY';e.currentTarget.classList.toggle('active',playing)};document.getElementById('traceBtn').onclick=e=>{showTrace=!showTrace;e.currentTarget.classList.toggle('active',showTrace);update(current)};document.getElementById('routeBtn').onclick=e=>{showRoute=!showRoute;e.currentTarget.classList.toggle('active',showRoute);update(current)};document.getElementById('graphBtn').onclick=e=>{graphEdges.visible=!graphEdges.visible;e.currentTarget.classList.toggle('active',graphEdges.visible)};scrub.addEventListener('input',()=>{playing=false;document.getElementById('play').textContent='PLAY';document.getElementById('play').classList.remove('active');update(+scrub.value/1000*duration)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load().then(()=>animate(performance.now())).catch(e=>{loader.innerHTML='Ошибка: '+e.message});</script></body></html>
