<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020105">
<title>SETKA · Двусторонний интерфейс</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020105}
.scene{position:fixed;inset:0;overflow:hidden;perspective:1650px;background:#020105}
.card{position:absolute;inset:0;transform:rotateY(0deg);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.83,.17,1);will-change:transform}
.card.dragging{transition:none}
.face{position:absolute;inset:0;background:#020105;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:translateZ(.2px)}
.back{transform:rotateY(180deg) translateZ(.2px)}
.face iframe{display:block;width:100%;height:100%;height:100dvh;border:0;background:#020105}
.scene:not(.is-back) .back,.scene.is-back .front{pointer-events:none}
/* Discreet cue only. The sensor is transparent, full-height and wide enough
   to catch a real edge swipe, even when the content is inside an iframe. */
.edge-sensor{position:absolute;z-index:20;top:0;bottom:0;width:27px;border:0;background:none;box-shadow:none;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:ew-resize}
.edge-sensor.from-right{right:0}
.edge-sensor.from-left{left:0}
.scene:not(.is-back) .edge-sensor.from-left,.scene.is-back .edge-sensor.from-right{visibility:hidden;pointer-events:none}
.edge-cue{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;min-height:108px;width:100%;opacity:.56;transition:opacity .3s ease;pointer-events:none}
.edge-cue::before{content:"";width:1px;height:44px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,transparent,#a179c4,#d5b2ed,#a179c4,transparent);box-shadow:0 0 5px #a26bce83}
.edge-cue span{font:300 15px/1 sans-serif;position:relative;color:#d6b3f0;background:#08050e;padding:3px 0;text-shadow:0 0 8px #af7de0}
.edge-cue small{position:relative;writing-mode:vertical-rl;font-size:7px;line-height:1;color:#ae96be;letter-spacing:.13em;padding:3px 0;background:#08050e;text-transform:uppercase}
.from-right .edge-cue{right:0}.from-left .edge-cue{left:0}
.scene.swiped-once .edge-cue{opacity:.33}
.edge-sensor:focus-visible .edge-cue{opacity:1;outline:1px solid #b99bc9;border-radius:5px}
@media(prefers-reduced-motion:reduce){.card{transition-duration:.13s}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="card" id="card">
    <section class="face front" id="front" aria-label="SETKA Web">
      <iframe title="Основная SETKA Web без изменений" id="setkaFront" src="./standalone-v34.html" loading="eager" allow="autoplay; microphone"></iframe>
    </section>
    <section class="face back" id="back" aria-label="Цикл ALMA">
      <iframe title="Оригинальный календарь-лотос ALMA" id="almaBack" src="./experiments/alma-cycle-source/index.html?v=alma-no-header-20261120-3" loading="eager"></iframe>
    </section>
  </div>
  <div class="edge-sensor from-right" role="button" tabindex="0" id="turnToCycle" aria-label="Потяните от правого края влево, чтобы перевернуть экран к календарю">
    <div class="edge-cue" aria-hidden="true"><span>‹</span><small>свайп</small></div>
  </div>
  <div class="edge-sensor from-left" role="button" tabindex="0" id="turnToSetka" aria-label="Потяните от левого края вправо, чтобы вернуться к SETKA">
    <div class="edge-cue" aria-hidden="true"><span>›</span><small>свайп</small></div>
  </div>
</div>
<script>
(function(){
"use strict";
const scene=document.getElementById("scene");
const card=document.getElementById("card");
const front=document.getElementById("front");
const back=document.getElementById("back");
let isCycle=false;
function turn(value){
  isCycle=!!value;
  scene.classList.toggle("is-back",isCycle);
  card.classList.remove("dragging");
  card.style.transform="rotateY("+(isCycle?-180:0)+"deg)";
  front.setAttribute("aria-hidden",String(isCycle));
  back.setAttribute("aria-hidden",String(!isCycle));
  scene.classList.add("swiped-once");
  try{history.replaceState(null,"",location.pathname+location.search+(isCycle?"#cycle":""))}catch(_){}
}
function gesture(elementId,toCycle){
  const el=document.getElementById(elementId);
  let active=null;
  function cancel(){
    if(!active)return;
    active=null;
    turn(!toCycle);
  }
  el.addEventListener("pointerdown",event=>{
    if(event.pointerType==="mouse"&&event.button!==0)return;
    active={id:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,time:event.timeStamp};
    try{el.setPointerCapture(event.pointerId)}catch(_){}
  });
  el.addEventListener("pointermove",event=>{
    if(!active||event.pointerId!==active.id)return;
    active.x=event.clientX;active.y=event.clientY;
    const dx=event.clientX-active.startX,dy=event.clientY-active.startY;
    if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>25)return;
    const travel=(toCycle?-dx:dx);
    if(Math.abs(dx)>5)card.classList.add("dragging");
    const progress=Math.max(0,Math.min(1,travel/Math.max(130,innerWidth*.42)));
    card.style.transform="rotateY("+(-180*(toCycle?progress:1-progress))+"deg)";
  });
  el.addEventListener("pointerup",event=>{
    if(!active||event.pointerId!==active.id)return;
    const dx=event.clientX-active.startX,dy=event.clientY-active.startY;
    const travel=(toCycle?-dx:dx);
    const duration=Math.max(1,event.timeStamp-active.time);
    active=null;
    const horizontal=Math.abs(dx)>Math.abs(dy)*1.15;
    const completed=horizontal&&(travel>Math.max(48,innerWidth*.13)||(travel>30&&travel/duration>.4));
    turn(completed?toCycle:!toCycle);
  });
  el.addEventListener("pointercancel",cancel);
  el.addEventListener("lostpointercapture",cancel);
  el.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){event.preventDefault();turn(toCycle);}
  });
}
gesture("turnToCycle",true);
gesture("turnToSetka",false);
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&isCycle)turn(false)});
turn(location.hash==="#cycle");
window.SETKA_CYCLE_LAB={flip:turn};
})();
</script>
</body>
</html>
