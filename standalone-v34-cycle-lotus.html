<style>

.overlay{display:none;position:fixed;inset:0;z-index:50;background:#000c;align-items:flex-end;justify-content:center;padding:12px}.overlay.open{display:flex}.sheet{width:min(100%,470px);max-height:90dvh;overflow-y:auto;background:linear-gradient(145deg,#26152e,#0b0710);border:1px solid #755087;border-radius:23px;padding:20px;box-shadow:0 0 70px #793e8650}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{font:normal 21px Georgia,serif;margin:0}.x{border:0;color:#c6a9d1;background:transparent;font-size:25px}

<style>

.cycle-dial:focus { outline: none; }

</style></head>
<body>
<div class="scene" id="scene"><div class="card" id="card">
<section class="face front" id="front" aria-label="Основная SETKA"><iframe title="Действующий интерфейс SETKA Web" src="./standalone-v34.html" allow="autoplay; microphone" loading="eager"></iframe></section>
<section class="face back" id="back" aria-label="Оригинальный ALMA цикл на обороте">
<iframe class="alma-cycle-original-frame" src="./experiments/alma-cycle-source/index.html" loading="eager" title="Оригинальный календарь ALMA: лотос, дуга дат, быстрые отметки, календарь менструации"></iframe>
</section></div>
<button class="grip front-grip" id="open" aria-label="Свайп влево или нажатие — перевернуть к календарю"><b>‹</b><small>ЦИКЛ</small></button>
<button class="grip back-grip" id="close" aria-label="Свайп вправо или нажатие — вернуть SETKA"><b>›</b><small>SETKA</small></button>
</div>
<script>
(function(){
'use strict';
const scene=document.getElementById("scene"),card=document.getElementById("card"),front=document.getElementById("front"),back=document.getElementById("back");
let isBack=false,gesture=null;
function turn(on){
 isBack=!!on;scene.classList.toggle("is-back",isBack);
 card.classList.remove("dragging");card.style.transform="rotateY("+(isBack?-180:0)+"deg)";
 front.inert=isBack;back.inert=!isBack;
 front.setAttribute("aria-hidden",String(isBack));back.setAttribute("aria-hidden",String(!isBack));
 try{history.replaceState(null,"",location.pathname+location.search+(isBack?"#cycle":""))}catch(_){}
}
function grip(id,fromBack){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;gesture={id:e.pointerId,x:e.clientX,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}card.classList.add("dragging")});
 el.addEventListener("pointermove",e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x;if(Math.abs(dx)>5)gesture.moved=true;const t=Math.max(0,Math.min(1,(fromBack?dx:-dx)/Math.max(150,innerWidth*.42)));card.style.transform="rotateY("+(-180*(fromBack?1-t:t))+"deg)"});
 el.addEventListener("pointerup",e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,move=fromBack?dx:-dx,changed=!gesture.moved||move>Math.max(55,innerWidth*.15);gesture=null;turn(changed?!fromBack:fromBack)});
 el.addEventListener("pointercancel",()=>{gesture=null;turn(fromBack)});
 el.addEventListener("lostpointercapture",()=>{if(gesture){gesture=null;turn(fromBack)}});
}
grip("open",false);grip("close",true);
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&isBack)turn(false)});
turn(location.hash==="#cycle");
window.SETKA_CYCLE_LAB={flip:turn};
})();
</script>
</body></html>
