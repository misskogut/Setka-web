<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020105">
<title>SETKA · Цикл на обороте</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020105}
.scene{position:fixed;inset:0;perspective:1550px;overflow:hidden;background:#020105}
.card{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transition:transform .78s cubic-bezier(.19,.82,.17,1);transform:rotateY(0deg)}
.card.is-dragging{transition:none}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#020105}
.face iframe{display:block;width:100%;height:100%;height:100dvh;border:0;background:#020105}
.back{transform:rotateY(180deg)}
/* No second card outline: the original ALMA .cycle-hero owns the ONLY border. */
.edge-swipe{position:absolute;z-index:10;top:50%;width:31px;height:146px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;transform:translateY(-50%);color:rgba(197,163,217,.65);background:transparent;border:0;box-shadow:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;opacity:.74;transition:opacity .23s ease;cursor:ew-resize}
.edge-swipe::before{content:"";position:absolute;top:24px;bottom:24px;width:1px;background:linear-gradient(transparent,rgba(188,136,222,.5),rgba(232,195,251,.78),rgba(188,136,222,.5),transparent);box-shadow:0 0 8px rgba(177,113,215,.33)}
.edge-open{right:0}
.edge-return{left:0}
.edge-mark{position:relative;display:block;color:#d9b6ee;font-size:17px;font-weight:200;line-height:1;text-shadow:0 0 9px rgba(213,167,243,.52);background:#07050b;padding:4px 0;animation:edgeNudge 3.8s ease-in-out infinite}
.edge-word{position:relative;writing-mode:vertical-rl;color:#bba8c8;font-size:7px;line-height:1;letter-spacing:.17em;text-transform:uppercase;background:#07050b;padding:6px 0}
.edge-return .edge-mark{animation-direction:reverse}
.scene.is-back .edge-open,.scene:not(.is-back) .edge-return{opacity:0;pointer-events:none;visibility:hidden}
.scene.has-flipped .edge-swipe{opacity:.52}
.edge-swipe:focus-visible{outline:1px solid rgba(213,172,241,.5);outline-offset:-3px;border-radius:7px}
@keyframes edgeNudge{0%,78%,100%{translate:0 0}85%{translate:-3px 0}92%{translate:0 0}}
@media(prefers-reduced-motion:reduce){.card{transition-duration:.15s}.edge-mark{animation:none}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="card" id="card">
    <section class="face front" id="front" aria-label="Основной интерфейс SETKA">
      <iframe title="Действующая SETKA Web без изменений" src="./standalone-v34.html" allow="autoplay; microphone" loading="eager"></iframe>
    </section>
    <section class="face back" id="back" aria-label="Женский календарь, оригинальный модуль ALMA">
      <iframe title="ALMA: календарь-лотос, дуга дат и отметки" src="./experiments/alma-cycle-source/index.html?rev=framing2" loading="eager"></iframe>
    </section>
  </div>
  <div class="edge-swipe edge-open" id="edgeOpen" role="button" tabindex="0" aria-label="Свайпните влево от правого края, чтобы открыть календарь. Клавиатура: Enter.">
    <span class="edge-mark" aria-hidden="true">‹</span><span class="edge-word" aria-hidden="true">свайп</span>
  </div>
  <div class="edge-swipe edge-return" id="edgeReturn" role="button" tabindex="0" aria-label="Свайпните вправо от левого края, чтобы вернуться к SETKA. Клавиатура: Enter.">
    <span class="edge-mark" aria-hidden="true">›</span><span class="edge-word" aria-hidden="true">свайп</span>
  </div>
</div>
<script>
(function(){
"use strict";
const scene=document.getElementById("scene");
const card=document.getElementById("card");
const front=document.getElementById("front");
const back=document.getElementById("back");
let reversed=false;
let pointer=null;
function turn(toBack){
  reversed=!!toBack;
  scene.classList.toggle("is-back",reversed);
  card.classList.remove("is-dragging");
  card.style.transform="rotateY("+(reversed?-180:0)+"deg)";
  front.inert=reversed;back.inert=!reversed;
  front.setAttribute("aria-hidden",String(reversed));
  back.setAttribute("aria-hidden",String(!reversed));
  if(reversed)scene.classList.add("has-flipped");
  try{
    const suffix=reversed?"#cycle":"";
    history.replaceState(null,"",location.pathname+location.search+suffix);
  }catch(_){}
}
function bindEdge(elementId,fromBack){
  const element=document.getElementById(elementId);
  element.addEventListener("pointerdown",event=>{
    if(event.pointerType==="mouse"&&event.button!==0)return;
    pointer={id:event.pointerId,x:event.clientX,y:event.clientY,time:event.timeStamp};
    try{element.setPointerCapture(event.pointerId)}catch(_){}
  });
  element.addEventListener("pointermove",event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const dx=event.clientX-pointer.x;
    const dy=event.clientY-pointer.y;
    if(Math.abs(dy)>Math.abs(dx)*1.45&&Math.abs(dy)>18)return;
    const distance=(fromBack?dx:-dx);
    const fraction=Math.max(0,Math.min(1,distance/Math.max(150,innerWidth*.42)));
    if(Math.abs(dx)>5)card.classList.add("is-dragging");
    card.style.transform="rotateY("+(-180*(fromBack?1-fraction:fraction))+"deg)";
  });
  element.addEventListener("pointerup",event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const dx=event.clientX-pointer.x;
    const dy=event.clientY-pointer.y;
    const distance=fromBack?dx:-dx;
    const duration=Math.max(1,event.timeStamp-pointer.time);
    const strongSwipe=distance>Math.max(57,innerWidth*.16)||
      distance>37&&distance/duration>.5;
    pointer=null;
    turn(strongSwipe&&Math.abs(dx)>Math.abs(dy)*1.25?!fromBack:fromBack);
  });
  element.addEventListener("pointercancel",()=>{
    if(pointer){pointer=null;turn(fromBack)}
  });
  element.addEventListener("lostpointercapture",()=>{
    if(pointer){pointer=null;turn(fromBack)}
  });
  element.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){
      event.preventDefault();
      turn(!fromBack);
    }
  });
}
bindEdge("edgeOpen",false);
bindEdge("edgeReturn",true);
window.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&reversed)turn(false);
});
turn(location.hash==="#cycle");
window.SETKA_CYCLE_LAB={flip:turn};
})();
</script>
</body>
</html>
