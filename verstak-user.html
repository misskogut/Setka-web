<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERSTAK</title><style>html,body{margin:0;background:#f5f3ee;color:#20201d;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot span{letter-spacing:.16em;font-weight:700}</style></head><body><div class="boot"><span>VERSTAK</span></div><script>fetch('verstak-user-v1.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('front '+r.status);return r.text()}).then(h=>{h=h.replace('grid-template-columns:1fr auto 1fr','grid-template-columns:auto 1fr auto 1fr auto');document.open();document.write(h);document.close()}).catch(e=>{document.body.innerHTML='<div class="boot"><div><b>VERSTAK</b><p>Не удалось открыть пользовательский слой.</p></div></div>';console.error(e)})</script></body></html>
